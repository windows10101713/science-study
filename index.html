 것을 알 수 있습니다.",curriculum:"별은 표면 온도에 따라 O, B, A, F, G, K, M형으로 분광 분류되며, 온도가 높을수록 파란색, 낮을수록 붉은색을 띱니다. H-R도는 별의 온도(또는 색)와 광도를 그린 그래프로 별의 진화 단계를 보여줍니다.",university:"흡수선의 파장은 별을 이루는 원소의 종류를 알려주며, 흡수선의 도플러 편이(적색편이/청색편이)로 별의 시선 방향 운동 속도를 계산할 수 있습니다. 스펙트럼 분석은 외계행성의 대기 성분 탐사에도 활용됩니다."},deepDive:['별은 표면 온도에 따라 실제로 다른 색을 띱니다. 매우 뜨거운 별은 푸르스름하게, 태양처럼 중간 온도의 별은 노랗게, 차가운 별은 붉게 보입니다. "모든 별은 흰색"이라는 생각은 정확하지 않습니다.','별빛의 스펙트럼에 나타나는 흡수선의 위치와 패턴은 그 별의 대기를 이루는 원소들의 고유한 "지문"과 같아서, 멀리 떨어진 별의 화학 성분을 직접 가지 않고도 알아낼 수 있습니다.'],examples:["태양은 G형 별로 표면온도 약 5800K","리겔(청백색 별)은 베텔게우스(붉은색 별)보다 표면온도가 높다","외계행성 대기의 스펙트럼 분석으로 물이나 산소의 존재 추정"],observationActivity:{title:"CD로 간이 분광기 만들어 빛 관찰하기",description:"CD의 반사를 이용한 간이 분광기로 여러 광원의 스펙트럼을 관찰합니다.",prediction:"광원의 종류에 따라 스펙트럼의 색 분포가 다르게 나타날 것이다",materials:["CD 또는 DVD","두꺼운 종이 상자","다양한 광원(백열등, 형광등, 태양광 – 직접 보지 않기)"],steps:["1. 상자에 슬릿(좁은 틈)을 만들고 CD를 비스듬히 설치합니다","2. 슬릿을 광원 쪽으로 향하게 합니다(태양은 직접 보지 않고 창을 통한 간접광 이용)","3. CD에 반사된 스펙트럼을 관찰합니다","4. 광원별 스펙트럼의 차이를 기록하고 비교합니다"],safetyWarning:"태양을 직접 쳐다보지 말고, 간접적인 빛만 이용하세요"},questions:["high-astro-02-q01","high-astro-02-q02","high-astro-02-q03","high-astro-02-q04","high-astro-02-q05","high-astro-02-q06"]},{id:"high-astro-03",subject:"astronomy",grade:12,level:"advanced",unit:"블랙홀과 중력",title:"블랙홀과 강한 중력",summary:"블랙홀은 빛조차 빠져나올 수 없을 만큼 강한 중력을 가진 천체로, 일반상대성이론으로 설명된다.",keywords:["블랙홀","사건의 지평선","중력","일반상대성이론","중력파"],misconceptions:["블랙홀은 우주의 모든 것을 진공청소기처럼 빨아들인다","블랙홀 근처에 가면 반드시 빨려 들어간다"],explanation:{basic:"블랙홀은 매우 무거운 별이 초신성 폭발 후 극도로 압축되어 만들어지는 천체로, 중력이 너무 강해서 빛조차 빠져나올 수 없습니다.",curriculum:"사건의 지평선은 그 안에서는 어떤 정보나 빛도 빠져나올 수 없는 경계입니다. 블랙홀의 중력은 거리가 충분히 멀면 보통의 별과 다르지 않게 작용하며, 무조건 모든 것을 빨아들이는 것은 아닙니다.",university:"일반상대성이론에 따르면 블랙홀은 시공간을 극단적으로 휘게 하는 천체로, 슈바르츠실트 반지름(사건의 지평선)은 rs=2GM/c²로 계산됩니다. 블랙홀 병합 시 발생하는 중력파는 2015년 LIGO에 의해 최초로 직접 검출되었습니다."},deepDive:["블랙홀은 진공청소기처럼 우주의 모든 것을 빨아들이지 않습니다. 충분히 멀리서 보면 블랙홀의 중력은 같은 질량을 가진 별의 중력과 다르지 않으며, 궤도를 도는 천체는 그냥 계속 궤도를 돕니다.","사건의 지평선보다 충분히 먼 거리에서는 블랙홀 주위를 안전하게 공전할 수 있습니다. 위험한 것은 사건의 지평선에 매우 가깝게 접근했을 때뿐입니다."],examples:["우리은하 중심에는 초대질량 블랙홀(궁수자리 A*)이 있다","2019년 사건지평선망원경(EHT)이 블랙홀의 실제 이미지를 최초로 촬영","블랙홀 병합으로 발생한 중력파가 LIGO에서 검출됨"],observationActivity:{title:"휘어진 시공간 모형 체험(고무막 실험)",description:"팽팽한 고무막 위에 무거운 공을 놓아 시공간이 휘어지는 것을 시각적으로 체험합니다.",prediction:"무거운 공 근처에서 막이 깊게 휘어지고, 작은 구슬은 그 주위를 돌게 될 것이다",materials:["탄력 있는 천 또는 고무막","무거운 공(볼링공 등)","작은 구슬"],steps:["1. 천이나 고무막을 팽팽하게 고정합니다","2. 중앙에 무거운 공을 놓아 막이 휘어지는 것을 관찰합니다","3. 작은 구슬을 굴려 궤도를 그리는 모습을 관찰합니다","4. 이 모형과 실제 중력에 의한 시공간의 휘어짐을 비교해 설명합니다"],safetyWarning:"무거운 공을 다룰 때 발등에 떨어지지 않도록 주의하세요"},questions:["high-astro-03-q01","high-astro-03-q02","high-astro-03-q03","high-astro-03-q04","high-astro-03-q05","high-astro-03-q06"]},{id:"high-med-02",subject:"medicine",grade:10,level:"advanced",unit:"약물과 신체",title:"약물과 신체 반응",summary:"약물은 몸속 특정 표적에 작용해 효과를 나타내며, 용량과 개인차에 따라 반응이 달라진다.",keywords:["약물","수용체","용량-반응","부작용","내성"],misconceptions:["약은 많이 먹을수록 더 빨리, 더 잘 낫는다","모든 사람에게 같은 약이 똑같이 효과가 있다"],explanation:{basic:"약은 몸속에서 특정 부분에 작용해 병을 낫게 하거나 증상을 줄여줍니다. 정해진 양보다 많이 먹으면 오히려 위험할 수 있습니다.",curriculum:"약물은 대개 세포의 특정 수용체에 결합해 효과를 나타냅니다. 용량-반응 관계에 따라 일정 용량까지는 효과가 커지지만, 특정 용량을 넘으면 부작용이나 독성이 나타날 수 있습니다.",university:"약동학(흡수-분포-대사-배설)과 약력학(용량과 효과의 관계)은 약물의 작용을 결정하는 두 축입니다. 개인의 유전적 차이(약물대사효소의 다형성)에 따라 같은 약이라도 효과와 부작용의 정도가 크게 달라질 수 있습니다(약물유전체학)."},deepDive:["약물의 효과는 용량에 비례해 무한정 커지지 않습니다. 적정 용량 구간을 넘어서면 오히려 독성이나 심각한 부작용이 나타날 수 있어, 정해진 용법과 용량을 지키는 것이 중요합니다.","사람마다 약물을 분해하는 효소의 유전적 차이가 있어 같은 약이라도 효과나 부작용이 다르게 나타날 수 있습니다. 이 때문에 의사와 약사는 개인의 상태에 맞게 약물을 처방하고 조정합니다."],examples:["진통제는 정해진 용량을 초과하면 간에 부담을 줄 수 있다","항생제를 끝까지 복용하지 않으면 내성균이 생길 수 있다","카페인에 대한 민감도는 사람마다 다르다"],observationActivity:{title:"카페인 섭취와 반응 시간의 관계 조사(설문 기반)",description:"카페인 섭취 여부와 각성도·반응 시간의 관계를 설문과 간단한 반응 시간 측정으로 조사합니다.",prediction:"카페인을 섭취한 경우 반응 시간이 더 짧아질 수 있다(개인차 존재)",materials:["설문지","반응시간 측정 도구(자 또는 앱)"],steps:["1. 카페인 섭취 여부를 설문으로 조사합니다","2. 참여자의 반응 시간을 자 낙하 실험 등으로 측정합니다","3. 카페인 섭취 그룹과 비섭취 그룹의 평균을 비교합니다","4. 개인차가 큰 이유를 약물 반응의 개인차 관점에서 논의합니다"],safetyWarning:"카페인 섭취를 실험 목적으로 권장하거나 강요하지 않습니다"},questions:["high-med-02-q01","high-med-02-q02","high-med-02-q03","high-med-02-q04","high-med-02-q05","high-med-02-q06"]},{id:"high-med-03",subject:"medicine",grade:11,level:"advanced",unit:"유전과 질병",title:"유전질환과 예방의학",summary:"유전질환의 원리를 이해하고, 조기 발견과 생활습관 관리로 질병을 예방하는 방법을 배운다.",keywords:["유전질환","다인자 유전","유전 상담","예방의학","선별검사"],misconceptions:["유전질환은 반드시 부모가 걸렸어야만 자녀에게 나타난다","유전적 소인이 있으면 반드시 병에 걸린다"],explanation:{basic:"어떤 병은 부모에게서 물려받은 유전자와 관련이 있습니다. 하지만 유전자만으로 모든 것이 결정되는 것은 아니며, 생활습관도 중요한 역할을 합니다.",curriculum:"단일유전자 질환은 특정 유전자 하나의 이상으로 발생하지만, 당뇨병·고혈압 같은 다인자 질환은 여러 유전자와 환경 요인이 함께 작용합니다. 열성 유전병은 부모가 보인자(증상 없이 유전자만 가짐)일 때도 자녀에게 나타날 수 있습니다.",university:"유전 상담은 가계도 분석과 유전자 검사를 통해 질환의 재발 위험을 평가합니다. 다인자 질환의 위험도는 유전적 소인(polygenic risk score)과 환경적 요인의 상호작용으로 결정되며, 예방의학은 조기 선별검사와 생활습관 중재로 발병률과 중증도를 낮추는 것을 목표로 합니다."},deepDive:["열성 유전병은 부모 둘 다 증상이 없더라도(보인자) 자녀에게 나타날 수 있습니다. 두 부모가 각각 열성 대립유전자를 하나씩 자녀에게 물려주면 자녀는 두 개의 열성 유전자(동형접합)를 가져 증상이 나타날 수 있습니다.","유전적 소인이 있다고 해서 반드시 병에 걸리는 것은 아닙니다. 많은 질환(특히 다인자 질환)은 유전자와 환경(식습관, 운동, 스트레스 등)이 함께 작용하므로, 생활습관 관리를 통해 발병 위험을 낮출 수 있습니다."],examples:["낭포성 섬유증은 열성 유전 질환의 대표적 예","제2형 당뇨병은 유전적 소인과 생활습관이 함께 작용","가족력이 있는 경우 정기적인 선별검사가 권장됨"],observationActivity:{title:"가상의 가계도로 유전 질환 패턴 분석하기",description:"가상의 가계도 자료를 보고 우성·열성, 상염색체·성염색체 유전 패턴을 추론합니다.",prediction:"질환이 나타나는 패턴을 통해 유전 방식을 추론할 수 있을 것이다",materials:["가상 가계도 자료(교사 제공)","색연필"],steps:["1. 가계도에서 질환을 가진 사람을 표시합니다","2. 세대별로 질환이 나타나는 패턴을 분석합니다","3. 우성/열성, 상염색체/성염색체 유전 여부를 추론합니다","4. 추론 근거를 정리해 발표합니다"],safetyWarning:"실제 개인의 유전 정보를 다루는 활동이 아님을 명확히 합니다"},questions:["high-med-03-q01","high-med-03-q02","high-med-03-q03","high-med-03-q04","high-med-03-q05","high-med-03-q06"]}],Ty=[{id:"middle-phys-01",subject:"physics",grade:7,level:"curriculum",unit:"힘과 운동",title:"힘과 운동의 관계",summary:"물체에 작용하는 힘은 운동 상태(속력과 방향)를 변화시킨다.",keywords:["힘","운동","속력","관성","뉴턴의 법칙"],misconceptions:["힘이 없으면 물체는 멈춘다","무거운 물체가 항상 더 빨리 떨어진다"],explanation:{basic:"가만히 있는 공을 발로 차면 움직입니다. 힘은 물체를 움직이게 하거나, 움직이는 방향과 속력을 바꿉니다.",curriculum:"관성의 법칙(뉴턴 제1법칙): 힘이 작용하지 않으면 물체는 현재의 운동 상태를 유지합니다. 가속도의 법칙(제2법칙): F=ma. 작용-반작용의 법칙(제3법칙).",university:"뉴턴 역학의 벡터적 형식화: ΣF = ma (벡터 방정식). 관성기준계와 비관성기준계에서의 겉보기 힘(원심력, 코리올리 힘). 운동량 보존과 뉴턴 제3법칙의 연결."},deepDive:['뉴턴의 제1법칙(관성의 법칙)은 "힘이 없으면 멈춘다"는 일상적 직관과 반대로, 외부 힘이 없으면 물체는 등속 직선 운동(또는 정지)을 계속한다고 말합니다. 우리가 흔히 보는 "멈추는" 현상은 마찰력이라는 힘이 작용하기 때문입니다.',"같은 힘이라도 질량이 클수록 가속도는 작아집니다(a=F/m). 이것이 무거운 트럭을 밀기 어려운 이유이며, 무게와 가속도를 혼동하지 않는 것이 중요합니다."],examples:["정지한 버스가 갑자기 출발하면 몸이 뒤로 쏠린다(관성)","같은 힘으로 밀어도 무거운 카트는 천천히 가속된다","로켓이 가스를 분출하며 반대 방향으로 나아간다(작용-반작용)"],observationActivity:{title:"수레의 질량과 가속도 관계 실험",description:"같은 힘으로 질량이 다른 수레를 밀어 가속도 차이를 비교합니다.",prediction:"무거운 수레일수록 가속도가 작을 것이다",materials:["장난감 수레","추(무게 추)","고무줄 또는 용수철저울","자"],steps:["1. 수레에 일정한 힘(고무줄의 늘어난 길이 동일)을 가합니다","2. 수레의 질량을 바꿔가며 이동 거리와 시간을 측정합니다","3. 가속도를 계산합니다(a = 2s/t²)","4. 질량과 가속도의 관계를 그래프로 그립니다"],safetyWarning:"수레가 튀어나가지 않도록 주변을 정리하세요"},questions:["middle-phys-01-q01","middle-phys-01-q02","middle-phys-01-q03","middle-phys-01-q04","middle-phys-01-q05","middle-phys-01-q06"]},{id:"middle-phys-02",subject:"physics",grade:8,level:"curriculum",unit:"일과 에너지",title:"일과 에너지 보존",summary:"에너지는 형태를 바꿀 수 있지만 새로 생기거나 없어지지 않고 총량이 보존된다.",keywords:["일","에너지","위치에너지","운동에너지","에너지 보존 법칙"],misconceptions:["에너지는 사용하면 사라진다","높이 있는 물체는 항상 에너지가 크다"],explanation:{basic:"높은 곳에 있는 공을 떨어뜨리면 점점 빨라집니다. 위치에너지가 운동에너지로 바뀌는 것이며, 에너지는 형태만 바뀔 뿐 없어지지 않습니다.",curriculum:"일 W = F·d(힘 방향 이동거리). 운동에너지 KE = ½mv². 위치에너지 PE = mgh. 역학적 에너지 보존 법칙: 마찰이 없으면 KE+PE는 일정합니다.",university:"일-에너지 정리: W_net = ΔKE. 보존력과 비보존력의 구분, 퍼텐셜 에너지 함수 U(x)와 F=-dU/dx. 에너지 소산(마찰, 공기저항)과 열역학 제1법칙과의 연결."},deepDive:['에너지가 "사라진다"고 느끼는 경우 대부분은 열이나 소리 등 눈에 보이지 않는 형태로 전환된 것입니다. 마찰이 있는 계에서도 에너지 총량(역학적 에너지+열에너지 등)은 보존됩니다.','위치에너지는 높이만으로 결정되지 않고 기준점 설정에 따라 달라지는 상대적인 양입니다. 중요한 것은 에너지의 "차이"이지 절대적인 값 자체가 아닙니다.'],examples:["롤러코스터가 내려갈 때 속도가 빨라진다","진자가 흔들리며 운동에너지와 위치에너지가 서로 바뀐다","수력발전은 물의 위치에너지를 전기에너지로 바꾼다"],observationActivity:{title:"경사면에서 구슬의 에너지 전환 관찰",description:"높이가 다른 경사면에서 구슬을 굴려 바닥에서의 속력을 비교합니다.",prediction:"경사면 높이가 높을수록 바닥에서의 속력이 빠를 것이다",materials:["경사로(책이나 널빤지)","구슬","자","스톱워치"],steps:["1. 경사면의 높이를 다르게 설정합니다","2. 각 높이에서 구슬을 굴려 바닥 통과 시간을 측정합니다","3. 평균 속력을 계산합니다","4. 높이와 속력의 관계를 정리하고 에너지 보존과 연결합니다"],safetyWarning:"구슬이 튀어나가지 않도록 벽이나 상자로 막아두세요"},questions:["middle-phys-02-q01","middle-phys-02-q02","middle-phys-02-q03","middle-phys-02-q04","middle-phys-02-q05","middle-phys-02-q06"]},{id:"middle-chem-01",subject:"chemistry",grade:7,level:"curriculum",unit:"물질의 구성",title:"원소와 원자",summary:"모든 물질은 더 이상 쪼갤 수 없는 기본 입자인 원자로 이루어져 있으며, 원소는 한 종류의 원자로 된 물질이다.",keywords:["원소","원자","주기율표","원자핵","전자"],misconceptions:["원자는 눈에 보이지 않으니 존재하지 않는 것과 같다","원소와 화합물은 같은 개념이다"],explanation:{basic:"모든 물질은 아주 작은 알갱이인 원자로 이루어져 있습니다. 한 가지 원자로만 이루어진 물질을 원소라고 하고, 여러 원소가 결합한 것을 화합물이라고 합니다.",curriculum:"원자는 원자핵(양성자+중성자)과 그 주위를 도는 전자로 구성됩니다. 원소는 양성자 수(원자번호)로 구분되며 주기율표에 정리되어 있습니다.",university:"보어 모형에서 현대 양자역학적 원자 모형(오비탈, 전자구름)으로의 발전. 동위원소와 질량수. 유효 핵전하와 주기적 성질(이온화 에너지, 전기음성도)의 경향성."},deepDive:['원자는 매우 작아서 눈에 보이지 않지만, 전자현미경이나 원자간력현미경(AFM) 같은 도구로 실제로 관찰되고 조작할 수 있습니다. "보이지 않는다"는 것이 "존재하지 않는다"를 의미하지 않습니다.',"원소는 순물질 중에서도 한 종류의 원자로만 구성된 것(예: 산소 O₂, 철 Fe)이고, 화합물은 두 종류 이상의 원소가 일정한 비율로 결합한 것(예: 물 H₂O)입니다."],examples:["산소 기체(O₂)는 산소 원소로만 이루어진 원소","물(H₂O)은 수소와 산소가 결합한 화합물","주기율표에서 같은 세로줄(족)의 원소는 비슷한 성질을 가진다"],observationActivity:{title:"주기율표에서 원소 성질 패턴 찾기",description:"주기율표를 보고 같은 족 원소들의 공통점을 찾아봅니다.",prediction:"같은 족(세로줄) 원소들은 반응성이 비슷할 것이다",materials:["주기율표 인쇄물","색연필"],steps:["1. 1족(알칼리 금속)과 17족(할로젠) 원소들을 표시합니다","2. 각 족 원소의 이름과 기호를 정리합니다","3. 자료를 참고해 반응성 패턴을 조사합니다","4. 같은 족 원소들의 공통점을 정리해 발표합니다"],safetyWarning:"실제 알칼리 금속은 물과 격렬히 반응하므로 직접 다루지 않습니다"},questions:["middle-chem-01-q01","middle-chem-01-q02","middle-chem-01-q03","middle-chem-01-q04","middle-chem-01-q05","middle-chem-01-q06"]},{id:"middle-math-01",subject:"math",grade:7,level:"curriculum",unit:"문자와 식",title:"일차방정식",summary:"미지수가 하나이고 차수가 1인 방정식을 세우고 풀어 문제를 해결한다.",keywords:["방정식","미지수","등식의 성질","일차방정식","해"],misconceptions:["등식의 양변에 다른 수를 더해도 등식이 유지된다","방정식의 해는 항상 하나뿐이다"],explanation:{basic:"어떤 수를 모를 때 x로 놓고 식을 세워 그 값을 구하는 것이 방정식입니다. 저울처럼 양쪽이 같아지도록 맞춰야 합니다.",curriculum:"등식의 성질: 양변에 같은 수를 더하거나 빼거나 곱하거나(0이 아닌 수로) 나누어도 등식은 성립합니다. 이항을 이용해 ax+b=0 꼴로 정리하여 해를 구합니다.",university:"체(field) 위에서의 선형방정식 이론으로의 일반화. 선형방정식 시스템과 행렬을 이용한 해법(가우스 소거법)으로 연결되는 개념적 기초."},deepDive:['방정식을 푸는 과정은 저울의 평형을 유지하는 것과 같습니다. 양변에 항상 "같은 연산"을 적용해야 등식이 유지되며, 한쪽에만 연산을 하면 평형이 깨집니다.',"일차방정식은 일반적으로 해가 하나이지만, 특수한 경우(양변이 항등식이 되거나 모순이 되는 경우) 해가 무수히 많거나 없을 수도 있습니다."],examples:["어떤 수에 5를 더하면 12가 될 때 그 수 구하기: x+5=12","나이 문제: 올해 나이의 2배에서 3을 빼면 15일 때 나이 구하기","거리=속력×시간 공식을 이용한 방정식 세우기"],observationActivity:{title:"저울 모형으로 방정식 원리 체험하기",description:"양팔 저울과 물건을 이용해 등식의 성질을 직접 체험합니다.",prediction:"양쪽에 같은 무게를 더하거나 빼면 저울은 계속 평형을 유지할 것이다",materials:["양팔 저울(또는 옷걸이로 만든 모형)","같은 무게의 추 여러 개"],steps:["1. 저울 양쪽에 추를 놓아 평형을 맞춥니다","2. 한쪽에 추를 추가하고 다른 쪽에도 같은 만큼 추가해봅니다","3. 양쪽에서 같은 만큼 덜어내 봅니다","4. 평형이 유지되는 규칙을 등식의 성질과 연결해 정리합니다"],safetyWarning:"무거운 추를 다룰 때 발등에 떨어지지 않도록 주의하세요"},questions:["middle-math-01-q01","middle-math-01-q02","middle-math-01-q03","middle-math-01-q04","middle-math-01-q05","middle-math-01-q06"]},{id:"middle-bio-01",subject:"biology",grade:8,level:"curriculum",unit:"생명의 구성",title:"세포와 물질대사",summary:"생물의 몸은 세포로 이루어져 있으며, 세포는 물질대사를 통해 생명활동에 필요한 에너지를 얻는다.",keywords:["세포","세포막","미토콘드리아","물질대사","핵"],misconceptions:["식물세포에는 세포벽만 있고 세포막은 없다","작은 생물일수록 세포도 작다"],explanation:{basic:"우리 몸은 아주 작은 세포들이 모여 이루어져 있습니다. 세포 안의 미토콘드리아는 음식으로부터 에너지를 만들어내는 발전소 역할을 합니다.",curriculum:"동물세포와 식물세포의 공통점(세포막, 핵, 미토콘드리아)과 차이점(세포벽, 엽록체, 큰 액포는 식물세포에만 있음). 세포호흡: 포도당+산소 → 이산화탄소+물+에너지(ATP).",university:"세포소기관의 미세구조와 기능(소포체, 골지체, 리보솜). 세포호흡의 단계: 해당과정, TCA회로, 전자전달계. ATP 합성의 화학삼투 이론(chemiosmosis)."},deepDive:["세포의 크기는 생물 전체 크기와 직접적인 관련이 없습니다. 코끼리와 생쥐의 세포 크기는 비슷하며, 코끼리가 더 큰 이유는 세포의 수가 훨씬 많기 때문입니다.","식물세포에는 세포벽과 함께 세포막도 반드시 존재합니다. 세포벽은 세포막 바깥을 감싸는 단단한 구조물이며, 물질 출입을 조절하는 것은 여전히 세포막입니다."],examples:["운동을 하면 근육세포의 미토콘드리아가 더 많은 에너지를 생산한다","양파 표피세포를 현미경으로 관찰하면 세포벽과 핵이 보인다","효모는 산소가 없을 때 발효를 통해 에너지를 얻는다"],observationActivity:{title:"양파 표피세포 현미경 관찰",description:"양파의 얇은 표피를 벗겨 현미경으로 세포의 구조를 관찰합니다.",prediction:"세포벽과 핵이 뚜렷하게 보일 것이다",materials:["양파","핀셋","슬라이드글라스","현미경","아이오딘 용액"],steps:["1. 양파의 얇은 속껍질을 핀셋으로 벗겨냅니다","2. 슬라이드글라스에 놓고 아이오딘 용액을 한 방울 떨어뜨립니다","3. 덮개유리를 덮고 현미경으로 관찰합니다","4. 관찰한 세포 구조를 그림으로 기록합니다"],safetyWarning:"현미경 조명과 유리 기구 사용 시 깨지지 않도록 조심하세요"},questions:["middle-bio-01-q01","middle-bio-01-q02","middle-bio-01-q03","middle-bio-01-q04","middle-bio-01-q05","middle-bio-01-q06"]},{id:"middle-earth-01",subject:"earthscience",grade:8,level:"curriculum",unit:"지구의 구조",title:"지층과 판구조론",summary:"지구의 겉껍질은 여러 개의 판으로 나뉘어 있으며, 판의 움직임이 지진과 화산, 지층 형성을 일으킨다.",keywords:["판구조론","지층","지진","화산","대륙이동설"],misconceptions:["대륙은 절대 움직이지 않는다","지진은 예고 없이 아무 이유 없이 발생한다"],explanation:{basic:"지구의 겉면은 여러 조각(판)으로 나뉘어 있고, 이 판들은 아주 천천히 움직입니다. 판이 부딪히거나 갈라지는 경계에서 지진과 화산이 자주 일어납니다.",curriculum:"판의 경계 종류: 발산 경계(판이 갈라짐, 해령), 수렴 경계(판이 부딪힘, 섭입대·습곡산맥), 보존 경계(판이 어긋남, 변환단층). 지층은 퇴적물이 쌓여 만들어지며 아래층이 더 오래된 것이 원칙(지층누중의 법칙).",university:"맨틀대류설과 판을 움직이는 힘(mantle convection, ridge push, slab pull). 고지자기(paleomagnetism) 자료로 확인된 해저확장설의 증거. 지진파(P파, S파) 분석을 통한 지구 내부 구조 규명."},deepDive:["대륙이동설은 처음 제안됐을 때 이동시키는 힘을 설명하지 못해 받아들여지지 않았지만, 이후 맨틀대류와 해저확장 증거가 발견되며 판구조론으로 발전해 현재는 지구과학의 핵심 이론으로 확립되었습니다.","지진은 오랫동안 축적된 판 경계의 변형 에너지가 갑자기 방출되는 현상으로, 원인 없이 무작위로 일어나는 것이 아니라 판의 상대적 움직임이라는 명확한 물리적 원인이 있습니다."],examples:["히말라야 산맥은 인도판과 유라시아판의 충돌로 형성됨","태평양 주변의 불의 고리(Ring of Fire)에서 화산과 지진이 잦음","대서양 중앙 해령에서 새로운 해양지각이 생성됨"],observationActivity:{title:"퇴적물 층 쌓기 실험으로 지층 형성 이해",description:"다른 색의 모래와 흙을 순서대로 쌓아 지층 생성 원리를 재현합니다.",prediction:"나중에 넣은 물질일수록 위쪽 층에 위치할 것이다",materials:["색이 다른 모래·흙 여러 종류","투명한 병","물"],steps:["1. 투명한 병에 색이 다른 모래를 순서대로 넣습니다","2. 층이 쌓이는 순서를 기록합니다","3. 물을 약간 부어 층이 어떻게 정렬되는지 관찰합니다","4. 지층누중의 법칙과 연결지어 설명합니다"],safetyWarning:"모래가 눈에 들어가지 않도록 주의하세요"},questions:["middle-earth-01-q01","middle-earth-01-q02","middle-earth-01-q03","middle-earth-01-q04","middle-earth-01-q05","middle-earth-01-q06"]},{id:"middle-astro-01",subject:"astronomy",grade:8,level:"curriculum",unit:"별과 은하",title:"별의 일생과 은하",summary:"별은 탄생부터 소멸까지 일생을 거치며, 수많은 별들이 모여 은하를 이룬다.",keywords:["별","은하","주계열성","초신성","성운"],misconceptions:["모든 별은 영원히 빛난다","태양계 전체가 우주의 중심이다"],explanation:{basic:"별은 가스와 먼지로 이루어진 성운에서 태어나 오랫동안 빛나다가 결국 일생을 마칩니다. 태양처럼 수많은 별들이 모여 은하를 이룹니다.",curriculum:"별의 진화: 성운 → 원시별 → 주계열성 → (질량에 따라) 적색거성/초거성 → 백색왜성 또는 초신성 폭발 → 중성자별/블랙홀. 우리은하는 약 수천억 개의 별로 이루어진 나선은하입니다.",university:"H-R도(Hertzsprung-Russell diagram)로 본 별의 분류와 진화 경로. 항성 내부의 핵융합 반응(수소 연소, 헬륨 연소 등)과 찬드라세카르 한계. 은하의 분류(나선, 타원, 불규칙)와 은하 회전곡선으로 추정하는 암흑물질."},deepDive:["별의 최후는 질량에 따라 크게 달라집니다. 태양 정도 질량의 별은 적색거성을 거쳐 백색왜성으로 조용히 생을 마치지만, 훨씬 무거운 별은 초신성으로 폭발한 뒤 중성자별이나 블랙홀이 됩니다.","태양계는 우리은하 안에 있는 수천억 개의 별 중 하나의 항성계에 불과하며, 우리은하 역시 우주에 존재하는 수천억 개의 은하 중 하나입니다."],examples:["오리온 대성운은 별이 활발히 탄생하는 지역","초신성 폭발의 잔해인 게성운","안드로메다 은하는 우리은하에서 가장 가까운 대형 은하"],observationActivity:{title:"별의 밝기와 거리의 관계 이해하기",description:"손전등과의 거리를 다르게 하여 겉보기 밝기가 어떻게 변하는지 관찰합니다.",prediction:"거리가 멀어질수록 밝기는 거리의 제곱에 반비례해 어두워질 것이다",materials:["손전등","조도계 또는 스마트폰 조도앱","줄자"],steps:["1. 손전등을 일정한 밝기로 켭니다","2. 1m, 2m, 4m 거리에서 밝기를 측정합니다","3. 거리와 밝기의 관계를 표와 그래프로 나타냅니다","4. 역제곱 법칙과 별의 겉보기 밝기 개념을 연결짓습니다"],safetyWarning:"어두운 곳에서 이동할 때 넘어지지 않도록 주의하세요"},questions:["middle-astro-01-q01","middle-astro-01-q02","middle-astro-01-q03","middle-astro-01-q04","middle-astro-01-q05","middle-astro-01-q06"]},{id:"middle-phys-03",subject:"physics",grade:9,level:"curriculum",unit:"전기와 자기",title:"전기 회로의 기초",summary:"전류, 전압, 저항의 관계를 이해하고 직렬·병렬 회로의 특징을 배운다.",keywords:["전류","전압","저항","옴의 법칙","직렬·병렬"],misconceptions:["전류는 회로를 따라 흐르면서 소모되어 없어진다","전구를 병렬로 연결하면 하나가 꺼지면 모두 꺼진다"],explanation:{basic:"전기 회로에서 전류는 물의 흐름처럼 전선을 따라 흐릅니다. 전지는 물을 끌어올리는 펌프처럼 전류를 흐르게 하는 힘(전압)을 제공합니다.",curriculum:"옴의 법칙 V=IR은 전압, 전류, 저항의 관계를 나타냅니다. 직렬 연결은 저항이 더해지고 전류가 일정하며, 병렬 연결은 각 저항에 걸리는 전압이 같고 전류가 나뉩니다.",university:"키르히호프의 전류 법칙(마디에서 들어오고 나가는 전류의 합은 0)과 전압 법칙(닫힌 루프에서 전압 강하의 합은 0)을 이용해 복잡한 회로망을 계통적으로 해석할 수 있습니다."},deepDive:["전류는 회로를 따라 흐르며 전하가 소모되는 것이 아니라, 전기 에너지가 저항을 지나며 열이나 빛 등 다른 에너지로 전환되는 것입니다. 전하량 자체는 회로 어디서나 보존됩니다.","병렬로 연결된 전구는 각각 독립된 경로를 가지므로 하나가 꺼져도 나머지는 계속 켜져 있습니다. 반면 직렬 연결에서는 하나가 끊어지면 전체 회로가 끊어져 모두 꺼집니다."],examples:["건전지와 전구를 연결한 손전등 회로","크리스마스 트리 전구가 병렬로 연결되어 하나가 나가도 나머지는 켜짐","가정용 콘센트는 병렬 회로로 구성되어 있음"],observationActivity:{title:"직렬·병렬 회로 밝기 비교 실험",description:"전구 두 개를 직렬과 병렬로 각각 연결해 밝기와 하나를 뺐을 때의 변화를 비교합니다.",prediction:"병렬 연결일 때 전구가 더 밝고, 하나를 빼도 나머지는 켜져 있을 것이다",materials:["건전지","전구 2개","전선","스위치"],steps:["1. 전구 두 개를 직렬로 연결하고 밝기를 관찰합니다","2. 전구 하나를 빼서 회로가 어떻게 되는지 확인합니다","3. 전구 두 개를 병렬로 연결하고 밝기를 관찰합니다","4. 병렬에서 전구 하나를 빼고 나머지 전구의 상태를 확인합니다"],safetyWarning:"전선이 뜨거워지지 않는지 확인하며 짧은 시간만 회로를 연결하세요"},questions:["middle-phys-03-q01","middle-phys-03-q02","middle-phys-03-q03","middle-phys-03-q04","middle-phys-03-q05","middle-phys-03-q06"]},{id:"middle-chem-02",subject:"chemistry",grade:8,level:"curriculum",unit:"화학 변화",title:"화학 반응과 질량 보존",summary:"화학 반응이 일어나도 반응 전후 물질의 총 질량은 변하지 않는다.",keywords:["질량 보존 법칙","화학 반응식","앙금 생성","기체 발생","연소"],misconceptions:["기체가 발생하면 질량이 줄어드는 것처럼 보이므로 질량은 보존되지 않는다","연소 후 재는 원래 물질보다 가벼우니 질량이 사라진 것이다"],explanation:{basic:"두 물질이 반응해 새로운 물질이 생겨도, 그 안의 원자들은 없어지지 않고 재배열될 뿐입니다. 그래서 반응 전과 후의 총 질량은 같습니다.",curriculum:"질량 보존 법칙(라부아지에)에 따르면 닫힌계에서 화학 반응 전후 물질의 총 질량은 변하지 않습니다. 기체가 발생하는 반응은 열린 용기에서 측정하면 질량이 줄어든 것처럼 보이지만, 발생한 기체까지 포함하면 질량은 보존됩니다.",university:"질량 보존은 반응 전후 원자의 종류와 개수가 화학 반응식에서 균형을 이루어야 한다는 화학량론적 요구와 직결됩니다. 상대론적으로는 질량-에너지가 함께 보존되지만 일반적인 화학반응의 에너지 변화는 질량 변화로 측정하기에는 무시할 수준입니다."},deepDive:["연소나 기체 발생 반응에서 열린 용기로 질량을 측정하면 발생한 기체가 공기 중으로 빠져나가 질량이 줄어든 것처럼 보입니다. 하지만 밀폐된 용기에서 측정하면 반응 전후 질량이 정확히 같다는 것을 확인할 수 있습니다.","화학 반응식의 계수를 맞추는 것(화학반응식의 균형)은 바로 이 질량 보존 법칙, 더 근본적으로는 원자가 반응 중에 새로 생기거나 없어지지 않는다는 원자설을 반영한 것입니다."],examples:["탄산칼슘과 염산 반응에서 밀폐 용기의 질량은 변하지 않는다","철이 녹슬면(산소와 결합) 오히려 질량이 늘어난다","나무가 타서 재가 되면 가벼워 보이지만 연기와 기체를 포함하면 질량 보존"],observationActivity:{title:"밀폐 용기에서 화학 반응 질량 측정",description:"식초와 베이킹소다를 밀폐 용기와 열린 용기에서 각각 반응시켜 질량 변화를 비교합니다.",prediction:"밀폐 용기에서는 질량이 변하지 않고, 열린 용기에서는 질량이 줄어들 것이다",materials:["식초","베이킹소다","밀폐 가능한 병","열린 비커","전자저울"],steps:["1. 밀폐 용기에 식초와 베이킹소다를 담아 반응 전 질량을 측정합니다","2. 반응시킨 후 다시 질량을 측정합니다","3. 같은 반응을 열린 비커에서도 진행하며 질량을 측정합니다","4. 두 결과를 비교하고 이유를 설명합니다"],safetyWarning:"밀폐 용기 내 압력이 커질 수 있으니 뚜껑을 완전히 밀봉하지 마세요"},questions:["middle-chem-02-q01","middle-chem-02-q02","middle-chem-02-q03","middle-chem-02-q04","middle-chem-02-q05","middle-chem-02-q06"]},{id:"middle-chem-03",subject:"chemistry",grade:9,level:"curriculum",unit:"물질의 변화",title:"중학교 산과 염기",summary:"산과 염기의 성질을 이해하고 지시약과 pH를 이용해 물질을 분류한다.",keywords:["산","염기","지시약","pH","중화 반응"],misconceptions:["pH가 낮을수록 항상 더 위험하다","중화 반응이 일어나면 항상 중성(pH 7)이 된다"],explanation:{basic:"산성 물질은 신맛이 나고 파란 리트머스 종이를 빨갛게 만들며, 염기성 물질은 미끈거리고 빨간 리트머스 종이를 파랗게 만듭니다.",curriculum:"pH는 0~14 범위로 수소이온 농도를 나타내는 척도이며 7이 중성, 낮을수록 산성, 높을수록 염기성입니다. 산과 염기가 반응하면 물과 염이 생성되는 중화 반응이 일어납니다.",university:"pH = -log[H⁺]로 정의되며, 강산·강염기는 완전히 이온화되고 약산·약염기는 부분적으로만 이온화됩니다. 중화점의 pH는 생성되는 염의 종류(강산-강염기는 7, 약산-강염기는 7보다 큼)에 따라 달라질 수 있습니다."},deepDive:["pH가 낮다고 항상 위험한 것은 아닙니다. 예를 들어 위산(pH 약 1.5~3.5)은 우리 몸에 자연적으로 존재하며 소화에 필수적입니다. 위험성은 pH뿐 아니라 농도와 종류에 따라 달라집니다.","중화 반응 후 생성되는 염의 종류에 따라 최종 pH는 정확히 7이 아닐 수 있습니다. 예를 들어 약산과 강염기가 반응하면 생성된 염이 염기성을 띠어 최종 용액의 pH가 7보다 높아질 수 있습니다."],examples:["위산과다일 때 제산제(염기성)를 먹어 중화시킨다","산성 토양에 석회(염기성)를 뿌려 중화한다","BTB 용액은 산성에서 노랑, 중성에서 초록, 염기성에서 파랑으로 변한다"],observationActivity:{title:"여러 용액의 pH 측정하고 분류하기",description:"pH 시험지나 BTB 용액으로 다양한 생활 속 용액의 산성도를 측정합니다.",prediction:"식초와 레몬즙은 낮은 pH, 비눗물과 표백제는 높은 pH를 보일 것이다",materials:["pH 시험지 또는 BTB 용액","식초","레몬즙","비눗물","수돗물"],steps:["1. 여러 용액을 준비합니다","2. 각 용액에 pH 시험지를 담그거나 BTB 용액을 떨어뜨립니다","3. 색 변화를 비교해 pH 값을 추정합니다","4. 산성-중성-염기성 순으로 용액을 분류합니다"],safetyWarning:"표백제 등 자극적인 물질은 소량만 사용하고 환기하며 실험하세요"},questions:["middle-chem-03-q01","middle-chem-03-q02","middle-chem-03-q03","middle-chem-03-q04","middle-chem-03-q05","middle-chem-03-q06"]},{id:"middle-math-02",subject:"math",grade:8,level:"curriculum",unit:"방정식",title:"연립방정식",summary:"두 개 이상의 미지수를 포함한 여러 방정식을 동시에 만족하는 해를 구한다.",keywords:["연립방정식","대입법","가감법","해","미지수"],misconceptions:["연립방정식은 항상 하나의 해만 가진다","두 식을 각각 따로 풀어도 같은 답이 나온다"],explanation:{basic:"사과와 배를 합쳐 10개를 사고 가격이 12000원일 때처럼, 조건이 두 개인 문제는 미지수도 두 개(x, y)로 놓고 두 개의 식을 세워 풀어야 합니다.",curriculum:"연립방정식은 대입법(한 식을 다른 식에 대입)이나 가감법(두 식을 더하거나 빼서 미지수를 소거)으로 풉니다. 두 직선의 교점을 구하는 것과 같은 의미를 가집니다.",university:"연립일차방정식은 행렬 형태 Ax=b로 표현되며, 가우스 소거법으로 일반화됩니다. 해의 개수(유일해, 무수히 많은 해, 해 없음)는 계수행렬의 계수(rank)와 관련됩니다."},deepDive:["연립방정식은 항상 하나의 해만 가지는 것은 아닙니다. 두 식이 나타내는 직선이 평행하면 해가 없고, 두 식이 사실상 같은 직선이면 해가 무수히 많습니다.",'두 식을 각각 따로 풀면 미지수가 하나 남아 특정 값을 구할 수 없습니다. 연립방정식은 두 조건을 "동시에" 만족하는 값을 찾는 것이므로 두 식을 함께 고려해야 합니다.'],examples:["사과 x개, 배 y개를 합쳐 10개, 가격 12000원일 때 x,y 구하기","두 사람의 나이 차와 합이 주어졌을 때 각각의 나이 구하기","두 직선의 교점 좌표 구하기"],observationActivity:{title:"그래프로 연립방정식의 해 확인하기",description:"두 일차방정식을 그래프로 그려 교점을 찾아 대수적으로 구한 해와 비교합니다.",prediction:"그래프의 교점 좌표가 대수적으로 구한 해와 일치할 것이다",materials:["모눈종이","자","연필"],steps:["1. 두 일차방정식을 각각 그래프로 그립니다","2. 두 직선의 교점을 찾습니다","3. 대입법이나 가감법으로 연립방정식을 대수적으로 풉니다","4. 그래프의 교점과 대수적 해를 비교합니다"],safetyWarning:"자를 다룰 때 손을 다치지 않도록 주의하세요"},questions:["middle-math-02-q01","middle-math-02-q02","middle-math-02-q03","middle-math-02-q04","middle-math-02-q05","middle-math-02-q06"]},{id:"middle-math-03",subject:"math",grade:9,level:"curriculum",unit:"도형",title:"도형의 합동과 닮음",summary:"모양은 같지만 크기가 다를 수 있는 도형들의 관계를 합동과 닮음으로 설명한다.",keywords:["합동","닮음","대응변","닮음비","피타고라스 정리"],misconceptions:["닮은 도형은 항상 합동이다","닮음비가 2배이면 넓이도 2배가 된다"],explanation:{basic:"모양과 크기가 완전히 같은 두 도형은 합동이고, 모양은 같지만 크기가 다른 두 도형은 닮음입니다. 사진을 확대하거나 축소해도 모양은 그대로인 것과 같습니다.",curriculum:"합동 조건(SSS, SAS, ASA)과 닮음 조건(AA, SAS, SSS)으로 두 삼각형이 합동인지 닮음인지 판별합니다. 닮음비가 k이면 넓이의 비는 k², 부피의 비는 k³이 됩니다.",university:"닮음 변환은 유클리드 기하학에서 등거리변환(합동)에 스케일링을 추가한 것으로 볼 수 있으며, 프랙탈 기하학에서는 자기닮음성(self-similarity)이라는 개념으로 확장됩니다."},deepDive:["닮음은 모양이 같다는 것이지 크기가 같다는 뜻이 아니므로, 닮은 두 도형이 항상 합동인 것은 아닙니다. 합동은 닮음비가 1인 특별한 경우로 볼 수 있습니다.","닮음비가 k배이면 길이는 k배가 되지만, 넓이는 길이의 제곱(k²배), 부피는 길이의 세제곱(k³배)으로 늘어납니다. 이는 길이·넓이·부피가 서로 다른 차원의 양이기 때문입니다."],examples:["사진을 확대·축소해도 비율은 같은 닮음 관계","지도의 축척은 실제 거리와의 닮음비","삼각형 두 개의 대응각이 각각 같으면 닮음(AA 닮음)"],observationActivity:{title:"그림자를 이용해 나무의 높이 측정하기",description:"막대와 나무의 그림자 길이 비율(닮음)을 이용해 나무의 높이를 추정합니다.",prediction:"막대의 높이와 그림자 길이의 비율이 나무에도 똑같이 적용될 것이다",materials:["막대(길이를 아는 것)","줄자","햇빛이 있는 날"],steps:["1. 막대를 수직으로 세우고 높이와 그림자 길이를 측정합니다","2. 같은 시각 나무의 그림자 길이를 측정합니다","3. 막대의 높이:그림자 = 나무의 높이:그림자 비례식을 세웁니다","4. 나무의 높이를 계산합니다"],safetyWarning:"야외 활동 시 햇빛을 직접 보지 않도록 주의하세요"},questions:["middle-math-03-q01","middle-math-03-q02","middle-math-03-q03","middle-math-03-q04","middle-math-03-q05","middle-math-03-q06"]},{id:"middle-bio-02",subject:"biology",grade:7,level:"curriculum",unit:"생명 현상",title:"광합성과 호흡",summary:"식물은 광합성으로 양분을 만들고, 모든 생물은 호흡으로 에너지를 얻는다.",keywords:["광합성","엽록체","세포호흡","이산화탄소","산소"],misconceptions:["식물은 낮에만 호흡하고 밤에는 하지 않는다","광합성과 호흡은 같은 과정이다"],explanation:{basic:"식물은 잎에서 햇빛, 물, 이산화탄소를 이용해 양분(포도당)과 산소를 만듭니다(광합성). 모든 생물은 이 양분을 산소와 함께 이용해 에너지를 얻습니다(호흡).",curriculum:"광합성: 6CO₂+6H₂O+빛에너지 → C₆H₁₂O₆+6O₂ (엽록체에서 일어남). 세포호흡: C₆H₁₂O₆+6O₂ → 6CO₂+6H₂O+에너지 (미토콘드리아에서 일어남). 식물은 낮에는 광합성과 호흡을 동시에, 밤에는 호흡만 합니다.",university:"광합성은 명반응(틸라코이드, ATP·NADPH 생성)과 캘빈 회로(스트로마, CO₂ 고정)로 나뉩니다. 세포호흡은 해당과정-TCA회로-전자전달계 단계를 거치며 포도당 1분자당 최대 약 30~32 ATP를 생성합니다."},deepDive:["식물은 낮과 밤 구분 없이 항상 호흡을 합니다. 다만 낮에는 광합성이 호흡보다 훨씬 활발하게 일어나 순수하게 산소를 방출하는 것처럼 보일 뿐입니다.","광합성과 호흡은 반응물과 생성물이 서로 반대인 별개의 과정입니다. 광합성은 에너지를 저장하는 과정이고, 호흡은 저장된 에너지를 꺼내 쓰는 과정입니다."],examples:["식물 잎이 초록색인 이유는 엽록소가 빛을 흡수하기 때문","어두운 곳에 둔 화분은 시들어간다(광합성 부족)","운동 후 숨이 가빠지는 것은 세포호흡이 활발해졌기 때문"],observationActivity:{title:"검정말의 광합성으로 발생하는 기포 관찰",description:"물속 식물(검정말)에 빛을 비추어 광합성으로 발생하는 산소 기포를 관찰합니다.",prediction:"빛이 강할수록 기포가 더 많이 발생할 것이다",materials:["검정말(수초)","비커","물","탄산수소나트륨(선택)","전등"],steps:["1. 물이 담긴 비커에 검정말을 넣습니다","2. 전등을 비추고 기포 발생을 관찰합니다","3. 전등과의 거리를 조절해 밝기를 바꿔봅니다","4. 밝기에 따른 기포 발생 속도를 비교합니다"],safetyWarning:"전등이 뜨거울 수 있으니 직접 만지지 않도록 주의하세요"},questions:["middle-bio-02-q01","middle-bio-02-q02","middle-bio-02-q03","middle-bio-02-q04","middle-bio-02-q05","middle-bio-02-q06"]},{id:"middle-bio-03",subject:"biology",grade:9,level:"curriculum",unit:"항상성과 몸의 조절",title:"소화와 순환",summary:"소화계는 음식을 분해해 영양분을 흡수하고, 순환계는 그 영양분과 산소를 온몸에 전달한다.",keywords:["소화효소","소장","혈액","심장","순환계"],misconceptions:["음식은 위에서 대부분 소화·흡수된다","혈액은 산소만 운반한다"],explanation:{basic:"입에서 잘게 씹은 음식은 위와 소장을 거치며 잘게 분해되고, 소장 벽에서 영양분이 흡수되어 혈액을 통해 온몸으로 운반됩니다.",curriculum:"소화효소(아밀레이스, 펩신, 라이페이스 등)는 탄수화물, 단백질, 지방을 각각 분해합니다. 대부분의 영양분 흡수는 소장의 융털에서 일어납니다. 순환계는 심장-동맥-모세혈관-정맥을 거치며 혈액을 순환시켜 산소, 영양분, 노폐물을 운반합니다.",university:"소화효소는 특정 기질에만 작용하는 특이성을 가지며 최적 pH와 온도가 있습니다. 혈액은 산소·이산화탄소 외에도 호르몬, 영양분, 노폐물, 면역세포, 열을 운반하는 다기능 매체입니다."},deepDive:["많은 사람들이 소화가 위에서 대부분 끝난다고 생각하지만, 실제로 영양분의 대부분은 소장에서 흡수됩니다. 위는 음식을 잘게 분해하고 살균하는 예비 단계 역할을 합니다.","혈액은 산소 운반 외에도 영양분, 호르몬, 노폐물, 면역세포, 심지어 체온 조절을 위한 열까지 운반하는 다기능적인 순환 매체입니다."],examples:["밥을 오래 씹으면 침의 아밀레이스가 탄수화물을 분해해 단맛이 난다","소장의 융털은 표면적을 넓혀 흡수를 돕는다","운동 시 근육으로 가는 혈류량이 증가한다"],observationActivity:{title:"침의 소화 작용 실험",description:"밥알을 오래 씹을 때 단맛이 나는 것을 통해 침 속 소화효소의 작용을 확인합니다.",prediction:"오래 씹을수록 단맛이 강해질 것이다",materials:["쌀밥","요오드 용액(선택)"],steps:["1. 밥을 한 숟갈 입에 넣고 10초, 30초, 1분간 씹어봅니다","2. 각 시간대별로 느껴지는 맛의 변화를 기록합니다","3. (선택) 요오드 용액으로 전분 반응을 확인합니다","4. 침 속 아밀레이스의 작용과 결과를 연결지어 설명합니다"],safetyWarning:"요오드 용액은 먹지 않도록 주의하세요"},questions:["middle-bio-03-q01","middle-bio-03-q02","middle-bio-03-q03","middle-bio-03-q04","middle-bio-03-q05","middle-bio-03-q06"]},{id:"middle-earth-02",subject:"earthscience",grade:7,level:"curriculum",unit:"대기와 해양",title:"대기와 해양의 순환",summary:"대기와 해양은 태양 에너지를 받아 끊임없이 순환하며 지구의 열을 재분배한다.",keywords:["대기 대순환","해류","기압","무역풍","편서풍"],misconceptions:["바람은 그냥 무작위로 분다","해류는 바람과 전혀 관계가 없다"],explanation:{basic:"적도는 태양열을 많이 받아 따뜻하고 극지방은 적게 받아 차갑습니다. 이 온도 차이 때문에 공기와 바닷물이 움직이며 지구 전체의 열을 고르게 나눕니다.",curriculum:"대기 대순환은 적도의 상승기류와 극지방의 하강기류를 중심으로 무역풍, 편서풍, 극동풍 등의 바람 띠를 형성합니다. 표층 해류는 주로 바람의 영향을 받아 이동하며, 심층 해류는 밀도차(온도·염분)로 순환합니다.",university:"대기 대순환은 해들리 순환, 페렐 순환, 극순환의 세 개의 순환 세포로 설명되며, 지구 자전에 의한 코리올리 효과가 바람의 방향을 휘게 합니다. 해양의 열염순환(thermohaline circulation)은 전 지구적 기후 조절에 중요한 역할을 합니다."},deepDive:["바람은 무작위가 아니라 기압 차이와 지구 자전의 영향(코리올리 효과)으로 일정한 패턴을 이루며 붑니다. 무역풍과 편서풍 같은 이름이 붙은 것도 이 때문입니다.","표층 해류는 지속적으로 부는 바람의 마찰력에 의해 형성되므로 바람과 밀접한 관계가 있습니다. 대표적으로 무역풍이 적도 부근의 해류를 서쪽으로 흐르게 합니다."],examples:["멕시코 만류는 따뜻한 해류로 유럽의 기후를 온화하게 한다","무역풍을 이용해 콜럼버스가 대서양을 건넜다","엘니뇨는 태평양 해류와 대기 순환의 변화로 발생한다"],observationActivity:{title:"온도 차이로 인한 공기 순환 모형실험",description:"뜨거운 물과 찬물 위의 공기 흐름을 향에서 나는 연기로 관찰합니다.",prediction:"뜨거운 쪽의 공기는 위로, 찬 쪽의 공기는 아래로 흐르는 순환이 생길 것이다",materials:["투명한 상자","뜨거운 물이 담긴 그릇","얼음물이 담긴 그릇","향"],steps:["1. 투명 상자 안에 뜨거운 물과 얼음물을 양쪽에 놓습니다","2. 향을 피워 연기의 흐름을 관찰합니다","3. 연기가 어느 방향으로 움직이는지 기록합니다","4. 대기 대순환의 원리와 연결지어 설명합니다"],safetyWarning:"향과 뜨거운 물 사용 시 화상에 주의하고 환기하세요"},questions:["middle-earth-02-q01","middle-earth-02-q02","middle-earth-02-q03","middle-earth-02-q04","middle-earth-02-q05","middle-earth-02-q06"]},{id:"middle-earth-03",subject:"earthscience",grade:9,level:"curriculum",unit:"물의 순환",title:"물의 순환과 수자원",summary:"물은 증발, 응결, 강수 과정을 거치며 바다-대기-육지 사이를 끊임없이 순환한다.",keywords:["물의 순환","증발","응결","강수","지하수"],misconceptions:["지구의 물은 계속 새로 생겨난다","비가 내리면 물이 사라진다"],explanation:{basic:"바닷물이 증발해 구름이 되고, 구름에서 비나 눈이 내려 강과 땅속으로 흘러 다시 바다로 돌아갑니다. 이 과정이 계속 반복됩니다.",curriculum:"물의 순환은 증발(액체→기체), 응결(기체→액체), 강수(비·눈), 지표수·지하수 유출의 과정을 거칩니다. 태양 에너지가 이 순환을 일으키는 근본 동력입니다.",university:"전 지구적 물수지(global water budget)는 증발산량과 강수량의 균형으로 유지되며, 기후변화는 강수 패턴과 증발산량의 지역적 불균형을 심화시켜 가뭄과 홍수의 빈도에 영향을 미칩니다."},deepDive:["지구의 물은 새로 생기거나 사라지지 않고, 형태만 바꾸며 순환합니다. 공룡이 살던 시대의 물 분자가 오늘날 우리가 마시는 물 속에 있을 수도 있다는 것이 물 순환의 특징입니다.","비가 내려도 물은 사라지지 않고 강, 지하수, 다시 바다로 흘러가며 순환을 계속합니다. 우리가 사용하는 물도 결국 이 순환계의 일부입니다."],examples:["바닷물이 증발해 구름이 되고 비가 되어 내린다","빗물이 땅속으로 스며들어 지하수가 된다","강물이 흘러 다시 바다로 돌아간다"],observationActivity:{title:"미니 물 순환 모형 만들기",description:"투명한 용기 안에서 증발과 응결이 일어나는 과정을 관찰해 물의 순환을 재현합니다.",prediction:"따뜻한 곳에 두면 물이 증발해 뚜껑 안쪽에 물방울이 맺힐 것이다",materials:["투명한 밀폐 용기","물","작은 컵","비닐랩"],steps:["1. 용기 안에 물이 담긴 작은 컵을 놓습니다","2. 용기를 비닐랩으로 밀봉하고 햇빛이 드는 곳에 둡니다","3. 몇 시간 후 뚜껑 안쪽의 물방울을 관찰합니다","4. 증발과 응결 과정을 물의 순환과 연결지어 설명합니다"],safetyWarning:"직사광선에 장시간 노출된 용기를 만질 때 뜨거울 수 있으니 주의하세요"},questions:["middle-earth-03-q01","middle-earth-03-q02","middle-earth-03-q03","middle-earth-03-q04","middle-earth-03-q05","middle-earth-03-q06"]},{id:"middle-astro-02",subject:"astronomy",grade:7,level:"curriculum",unit:"태양계",title:"태양의 구조와 활동",summary:"태양은 핵융합 반응으로 에너지를 만드는 거대한 항성으로, 흑점 등 다양한 활동을 보인다.",keywords:["태양","핵융합","흑점","태양풍","코로나"],misconceptions:["태양은 불타고 있는 거대한 공이다","태양의 표면은 매끄럽고 변화가 없다"],explanation:{basic:"태양은 매우 뜨거운 가스로 이루어진 거대한 별로, 중심부에서 수소가 헬륨으로 바뀌며 엄청난 에너지를 만들어냅니다.",curriculum:"태양은 핵-복사층-대류층-광구-채층-코로나의 구조를 가집니다. 흑점은 강한 자기장으로 주변보다 온도가 낮아 어둡게 보이는 영역이며, 태양풍은 태양에서 방출되는 하전 입자의 흐름입니다.",university:"태양 중심부의 핵융합은 양성자-양성자 연쇄반응(p-p chain)으로 수소 4개가 헬륨 1개로 융합되며 질량 결손이 에너지로 전환됩니다(E=mc²). 흑점 수는 약 11년 주기로 증감하며 이는 태양 자기장의 다이나모 작용과 관련됩니다."},deepDive:['태양은 일반적인 의미의 "불타는" 연소가 아니라 핵융합이라는 전혀 다른 과정으로 에너지를 만듭니다. 일반적인 연소(산소와의 화학반응)로는 태양이 그렇게 오래, 강하게 빛날 수 없습니다.',"태양 표면은 매끄럽지 않으며 흑점, 홍염, 플레어 등 다양한 활동이 끊임없이 일어납니다. 이러한 활동은 지구의 오로라나 통신 장애에도 영향을 줄 수 있습니다."],examples:["태양의 흑점 수는 태양 활동 주기에 따라 변한다","태양풍은 지구 자기장과 상호작용해 오로라를 만든다","개기일식 때 코로나를 육안으로 볼 수 있다"],observationActivity:{title:"태양 흑점 안전하게 관찰하기(투영법)",description:"망원경이나 쌍안경으로 태양상을 종이에 투영해 흑점을 안전하게 관찰합니다.",prediction:"태양 표면에 어두운 점(흑점)이 보일 수 있다",materials:["망원경 또는 쌍안경","흰 종이","삼각대"],steps:["1. 망원경을 태양 방향으로 향하게 하되 직접 들여다보지 않습니다","2. 접안렌즈 뒤에 흰 종이를 대어 태양상을 투영합니다","3. 투영된 상에서 어두운 흑점을 찾아봅니다","4. 관찰한 모습을 그림으로 기록합니다"],safetyWarning:"태양을 절대 직접 눈으로 보거나 망원경으로 들여다보지 마세요. 반드시 투영법을 사용하세요"},questions:["middle-astro-02-q01","middle-astro-02-q02","middle-astro-02-q03","middle-astro-02-q04","middle-astro-02-q05","middle-astro-02-q06"]},{id:"middle-astro-03",subject:"astronomy",grade:9,level:"curriculum",unit:"우주 탐사",title:"우주 탐사의 역사와 기술",summary:"인류는 로켓과 인공위성, 우주선을 이용해 지구 밖 우주를 탐사해왔다.",keywords:["인공위성","로켓","우주정거장","탐사선","중력"],misconceptions:["우주에는 중력이 전혀 없다","인공위성은 동력 없이도 영원히 떠 있을 수 있다"],explanation:{basic:"로켓은 강한 힘으로 연료를 뒤로 뿜어내며 그 반작용으로 우주로 날아갑니다. 인공위성은 지구 주위를 빠르게 돌면서 떨어지지 않고 궤도를 유지합니다.",curriculum:"인공위성이 궤도를 유지하는 것은 중력이 없어서가 아니라, 지구로 떨어지는 만큼 옆으로도 빠르게 이동해 계속 지구를 도는 것입니다(자유낙하와 비슷한 원리). 로켓은 작용-반작용의 법칙으로 추진력을 얻습니다.",university:"위성이 원 궤도를 유지하려면 구심력(중력)과 필요한 궤도속도가 균형을 이루어야 하며, v=√(GM/r) 식으로 계산됩니다. 다단 로켓은 치올코프스키 로켓 방정식(Δv=v_e ln(m₀/m_f))에 따라 효율을 높입니다."},deepDive:['우주에서도 중력은 여전히 작용합니다. 우주비행사가 무중력처럼 보이는 것은 중력이 없어서가 아니라, 우주선과 함께 계속 "떨어지고 있는" 자유낙하 상태이기 때문입니다.',"인공위성은 별도의 추진 없이도 궤도를 유지할 수 있지만, 대기 저항이나 다른 천체의 중력 등의 영향으로 서서히 궤도가 변하기 때문에 실제로는 주기적으로 궤도 수정이 필요합니다."],examples:["국제우주정거장(ISS)은 약 90분에 한 번 지구를 공전한다","기상위성은 실시간으로 지구의 날씨를 관측한다","보이저 탐사선은 태양계 밖으로 나아가고 있다"],observationActivity:{title:"풍선 로켓으로 작용-반작용 원리 체험",description:"풍선에서 빠져나가는 공기의 반작용으로 풍선이 앞으로 나아가는 것을 관찰합니다.",prediction:"공기가 빠르게 빠져나갈수록 풍선이 더 빠르게 날아갈 것이다",materials:["풍선","빨대","실","테이프"],steps:["1. 실을 방 양쪽에 팽팽하게 고정합니다","2. 빨대를 실에 끼우고 풍선을 빨대에 테이프로 고정합니다","3. 풍선을 불고 입구를 놓아 날아가는 모습을 관찰합니다","4. 로켓의 추진 원리와 비교해 설명합니다"],safetyWarning:"풍선이 터질 수 있으니 눈 가까이에서 불지 마세요"},questions:["middle-astro-03-q01","middle-astro-03-q02","middle-astro-03-q03","middle-astro-03-q04","middle-astro-03-q05","middle-astro-03-q06"]},{id:"middle-med-01",subject:"medicine",grade:7,level:"curriculum",unit:"건강과 영양",title:"영양소와 소화",summary:"음식 속 영양소는 소화 과정을 거쳐 우리 몸이 사용할 수 있는 형태로 분해된다.",keywords:["영양소","3대 영양소","소화효소","균형 잡힌 식단","기초대사량"],misconceptions:["지방은 무조건 몸에 나쁘다","탄수화물을 끊으면 건강에 항상 좋다"],explanation:{basic:"우리 몸에 필요한 영양소는 탄수화물, 단백질, 지방(3대 영양소)과 비타민, 무기질입니다. 탄수화물은 에너지원, 단백질은 몸을 구성, 지방은 에너지 저장과 체온 유지 역할을 합니다.",curriculum:"각 영양소는 소화효소에 의해 분해됩니다: 탄수화물은 아밀레이스 등으로 포도당으로, 단백질은 펩신·트립신 등으로 아미노산으로, 지방은 라이페이스로 지방산과 글리세롤로 분해되어 흡수됩니다.",university:"기초대사량은 생명 유지에 필요한 최소 에너지량으로, 체성분(근육량 등)과 나이, 성별에 영향을 받습니다. 영양소의 과잉 또는 결핍은 각각 비만·대사질환, 영양실조·결핍증으로 이어질 수 있어 균형이 중요합니다."},deepDive:['지방은 무조건 나쁜 것이 아니라 우리 몸에 필수적인 영양소입니다. 세포막 구성, 지용성 비타민 흡수, 에너지 저장 등 중요한 역할을 하며, 문제는 지방의 "종류"와 "과다 섭취"입니다.',"탄수화물은 뇌와 근육의 주요 에너지원입니다. 무조건 끊기보다는 정제된 탄수화물(설탕 등)을 줄이고 통곡물 같은 복합 탄수화물을 적절히 섭취하는 것이 더 건강한 접근입니다."],examples:["밥과 빵은 주요 탄수화물 공급원","고기, 콩, 계란은 주요 단백질 공급원","견과류와 식물성 기름은 건강한 지방 공급원"],observationActivity:{title:"하루 식단 영양소 분석하기",description:"하루 동안 먹은 음식을 기록하고 3대 영양소가 골고루 포함되었는지 분석합니다.",prediction:"탄수화물 위주의 식단일 가능성이 높을 것이다",materials:["식단 기록지","영양성분표(식품 포장 참고)"],steps:["1. 하루 동안 먹은 음식을 모두 기록합니다","2. 각 음식이 어떤 영양소를 주로 포함하는지 분류합니다","3. 3대 영양소의 비율을 대략 계산합니다","4. 균형 잡힌 식단을 위한 개선점을 제안합니다"],safetyWarning:"무리한 식단 제한이나 극단적 다이어트는 시도하지 마세요"},questions:["middle-med-01-q01","middle-med-01-q02","middle-med-01-q03","middle-med-01-q04","middle-med-01-q05","middle-med-01-q06"]},{id:"middle-med-02",subject:"medicine",grade:8,level:"curriculum",unit:"건강과 질병",title:"감염병의 예방과 관리",summary:"감염병은 병원체가 사람 사이에 전파되어 퍼지며, 위생·백신·격리로 예방할 수 있다.",keywords:["감염병","병원체","전파 경로","백신","집단면역"],misconceptions:["항생제는 모든 감염병(바이러스 포함)에 효과가 있다","한 사람만 조심하면 감염병 확산을 막을 수 있다"],explanation:{basic:"감염병은 세균이나 바이러스 같은 병원체가 몸에 들어와 퍼지는 병입니다. 손 씻기, 마스크 착용, 예방접종으로 감염병을 예방할 수 있습니다.",curriculum:"감염병은 비말, 접촉, 매개체(모기 등)를 통해 전파됩니다. 백신은 약화되거나 비활성화된 병원체(또는 그 일부)로 면역계를 미리 훈련시켜 감염을 예방합니다. 항생제는 세균에는 효과가 있지만 바이러스에는 효과가 없습니다.",university:"집단면역은 인구 집단의 일정 비율 이상이 면역을 가지면 감염병의 전파가 억제되는 현상으로, 기초감염재생산수(R₀)와 관련된 임계 면역 비율(1-1/R₀)로 추정됩니다. 항바이러스제는 항생제와 다른 기전(바이러스 복제 억제 등)으로 작동합니다."},deepDive:["항생제는 세균의 세포벽이나 단백질 합성 등을 표적으로 하기 때문에 세균 감염에는 효과적이지만, 세포 구조가 다른 바이러스에는 작용하지 않습니다. 감기 같은 바이러스성 질환에 항생제를 남용하면 오히려 항생제 내성균만 늘어날 수 있습니다.","감염병 확산 방지는 개인의 노력만으로는 한계가 있으며, 지역사회 전체의 예방접종률과 방역 수칙 준수(집단면역)가 함께 이루어져야 효과적으로 억제됩니다."],examples:["독감 예방접종으로 매년 유행하는 인플루엔자를 예방","결핵은 공기를 통한 비말로 전파되는 세균성 감염병","모기가 매개하는 말라리아, 뎅기열"],observationActivity:{title:"손 씻기 전파 시뮬레이션(반짝이 가루 실험)",description:"반짝이 가루를 세균에 비유해 접촉을 통한 전파 경로와 손 씻기의 효과를 확인합니다.",prediction:"손을 씻지 않으면 반짝이 가루가 여러 물건과 사람에게 옮겨갈 것이다",materials:["반짝이 가루(글리터) 또는 로션","비누","물"],steps:["1. 한 사람의 손에 반짝이 가루를 살짝 묻힙니다","2. 여러 물건을 만지거나 다른 사람과 악수를 해봅니다","3. 얼마나 많은 곳에 가루가 옮겨졌는지 확인합니다","4. 비누로 손을 씻고 가루가 얼마나 제거되는지 비교합니다"],safetyWarning:"가루가 눈에 들어가지 않도록 주의하세요"},questions:["middle-med-02-q01","middle-med-02-q02","middle-med-02-q03","middle-med-02-q04","middle-med-02-q05","middle-med-02-q06"]},{id:"middle-med-03",subject:"medicine",grade:9,level:"curriculum",unit:"건강과 운동",title:"운동과 근골격계 건강",summary:"규칙적인 운동은 뼈와 근육을 튼튼하게 하고 성장기 신체 발달에 중요한 역할을 한다.",keywords:["근골격계","근력운동","유산소운동","골밀도","성장판"],misconceptions:["근력운동을 하면 성장이 멈춘다","운동은 근육에만 영향을 준다"],explanation:{basic:"적절한 운동은 뼈와 근육을 튼튼하게 하고 키가 자라는 데도 도움이 됩니다. 운동 부족은 오히려 뼈와 근육을 약하게 만들 수 있습니다.",curriculum:"유산소운동(달리기, 수영)은 심폐지구력을, 근력운동은 근력과 근지구력을 키웁니다. 적절한 하중을 받는 운동은 뼈의 골밀도를 높이는 데 도움이 되며, 성장판에 과도한 충격이 가지 않는 한 성장을 방해하지 않습니다.",university:"골 형성은 역학적 부하에 반응하는 골재형성(bone remodeling) 과정으로 조절되며(Wolff의 법칙), 적절한 저항 운동은 조골세포 활성을 높여 골밀도를 증가시킵니다. 성장판(골단연골) 손상은 과도하고 반복적인 충격이나 부적절한 자세에서 발생할 수 있어 적절한 강도 조절이 중요합니다."},deepDive:["적절한 강도의 근력운동은 성장을 멈추게 하지 않습니다. 오히려 뼈에 적당한 자극을 주어 골밀도를 높이는 데 도움이 됩니다. 문제가 되는 것은 무리한 중량이나 잘못된 자세로 성장판에 과도한 충격을 주는 경우입니다.","운동은 근육뿐 아니라 뼈, 관절, 심장, 폐, 심지어 뇌 기능(집중력, 기분)에도 긍정적인 영향을 미치는 전신적인 효과를 가집니다."],examples:["줄넘기는 뼈에 적당한 자극을 주는 대표적 운동","수영은 관절에 부담이 적은 유산소 운동","올바른 자세로 하는 스쿼트는 하체 근력을 키운다"],observationActivity:{title:"운동 강도별 근육 피로도 비교",description:"가벼운 운동과 중간 강도 운동 후 느껴지는 근육 피로도를 비교해봅니다.",prediction:"강도가 높을수록 근육 피로감이 더 클 것이다",materials:["스톱워치","기록지"],steps:["1. 가벼운 강도로 스쿼트를 10회 실시합니다","2. 잠시 휴식 후 중간 강도로 20회 실시합니다","3. 각각 운동 후 느껴지는 피로도를 1~5점으로 기록합니다","4. 강도와 피로도의 관계를 정리합니다"],safetyWarning:"무리하지 않는 범위에서 올바른 자세로 실시하세요"},questions:["middle-med-03-q01","middle-med-03-q02","middle-med-03-q03","middle-med-03-q04","middle-med-03-q05","middle-med-03-q06"]}],Ay=[{id:"master-phys-01",subject:"physics",grade:16,level:"expert",unit:"양자역학",title:"Schrödinger 방정식과 파동함수",summary:"양자계의 상태를 파동함수로 표현하고 시간 진화를 Schrödinger 방정식으로 기술한다.",keywords:["파동함수","Schrödinger","고유값","기저","확률 진폭"],misconceptions:["파동함수가 입자의 실제 경로이다","측정하지 않으면 입자의 위치가 정해지지 않는다"],explanation:{basic:"양자 입자의 상태는 ψ(r,t)로 표현되며, |ψ|²이 위치 확률 밀도입니다. 입자의 운동은 Schrödinger 방정식 iℏ∂ψ/∂t = Ĥψ로 결정됩니다.",curriculum:"Time-dependent Schrödinger equation. 정상 상태 해: Ĥψ_n = E_n ψ_n. 무한 정사각형 우물, 조화 진동자, 수소 원자의 정확한 해. 각운동량 연산자 L̂.",university:"함수해석학 기초: Hilbert 공간, 선형 연산자, 고유값 문제. 힐버트 공간에서의 내적 ⟨ψ₁|ψ₂⟩ = ∫ψ₁*ψ₂ dr. Dirac 표기법. 표현 변환(position, momentum, energy basis). 시간 진화 연산자 U(t) = exp(-iĤt/ℏ)."},examples:["입자의 상태가 중첩(superposition)될 수 있다","측정은 파동함수를 붕괴시킨다(collapse)","불확정성 원리 Δx·Δp ≥ ℏ/2"],observationActivity:{title:"수치 해법으로 Schrödinger 방정식 풀이",description:"간단한 퍼텐셜에서 정상 상태를 수치적으로 구하고 가시화합니다.",prediction:"에너지 준위가 양자화될 것이다",materials:["컴퓨터","Python/NumPy"],steps:["1. 무한 정사각형 우물 문제를 행렬 형식으로 이산화","2. 고유값 해석(eigenvalue decomposition)으로 에너지 준위 구함","3. 고유함수(파동함수) 계산","4. 결과를 시각화하고 이론값과 비교"],safetyWarning:"계산 정확도 주의"},questions:["master-phys-01-q01","master-phys-01-q02","master-phys-01-q03","master-phys-01-q04","master-phys-01-q05","master-phys-01-q06"]},{id:"master-phys-02",subject:"physics",grade:16,level:"expert",unit:"통계역학",title:"분배함수와 열역학 함수",summary:"미시 상태의 확률 분포로부터 거시 열역학 성질을 유도한다.",keywords:["분배함수","열역학","엔트로피","자유 에너지","앙상블"],misconceptions:["온도는 평균 운동 에너지이다","엔트로피는 항상 증가한다"],explanation:{basic:"많은 입자의 미시 상태를 모르지만, 통계적으로 분석할 수 있습니다. 분배함수 Z로부터 내부 에너지, 엔트로피, 자유 에너지 등을 구할 수 있습니다.",curriculum:"정준 앙상블(canonical ensemble): Z = Σ_n exp(-E_n/k_B T). 자유 에너지 F = -k_B T ln Z. 내부 에너지 U = -∂ln Z/∂β. 엔트로피 S = k_B(∂ln Z/∂T)_N.",university:"미시정준 앙상블(microcanonical), 정준 앙상블(canonical), 그랜드 캐노니컬 앙상블(grand canonical)의 동등성. Boltzmann 분포 P(E_n) = exp(-E_n/k_B T)/Z. Gibbs entropy S = -k_B Σ P_n ln P_n. 응답 이론과 상관 함수."},examples:["이상 기체의 상태 방정식 PV = Nk_B T 유도","이성분 혼합물의 화학 포텐셜","상 전이: 1차, 2차 전이와 특이점"],observationActivity:{title:"Monte Carlo 시뮬레이션으로 상(phase) 관찰",description:"2D Ising 모델을 시뮬레이션하여 온도에 따른 상 변화를 관찰합니다.",prediction:"임계 온도 이상에서 무질서 상으로 전이될 것이다",materials:["컴퓨터","Python"],steps:["1. 2D 격자의 스핀 배열을 초기화","2. Metropolis 알고리즘으로 thermal 평형 달성","3. 다양한 온도에서 자화(magnetization) 계산","4. 상 다이어그램 그리기"],safetyWarning:"컴퓨터 자원 사용에 주의"},questions:["master-phys-02-q01","master-phys-02-q02","master-phys-02-q03","master-phys-02-q04","master-phys-02-q05","master-phys-02-q06"]},{id:"master-phys-03",subject:"physics",grade:17,level:"expert",unit:"고체물리학",title:"고체물리학 개론: 에너지띠 이론",summary:"결정 속 전자는 연속적인 에너지가 아니라 띠(band) 구조를 이루며, 이는 도체·부도체·반도체를 구분하는 근거가 된다.",keywords:["에너지띠","전도띠","원자가띠","띠간격","반도체"],misconceptions:["모든 고체는 전기를 잘 통한다","반도체는 절연체와 완전히 다른 원리로 작동한다"],explanation:{basic:'원자가 규칙적으로 배열된 결정 속에서 전자는 특정 에너지 "구역(띠)" 안에서만 존재할 수 있습니다. 이 띠 사이에 전자가 존재할 수 없는 틈(띠간격)이 있는지 없는지가 전기전도성을 결정합니다.',curriculum:"전자로 가득 찬 원자가띠와 비어있는 전도띠 사이의 띠간격(band gap) 크기로 도체(띠간격 없음), 반도체(작은 띠간격), 절연체(큰 띠간격)를 구분합니다.",university:"블로흐 정리에 따르면 주기적 퍼텐셜 안의 전자 파동함수는 평면파와 주기함수의 곱으로 나타나며, 이로부터 에너지띠 구조가 유도됩니다. 반도체의 도핑은 불순물 준위를 띠간격 안에 도입해 전도성을 조절합니다."},deepDive:["모든 고체가 전기를 잘 통하는 것은 아닙니다. 띠간격의 크기에 따라 도체, 반도체, 절연체로 뚜렷이 구분되며 이는 물질의 전자 구조(띠 구조)의 근본적인 차이에서 비롯됩니다.","반도체는 절연체와 전혀 다른 원리가 아니라, 절연체보다 띠간격이 작아 열이나 빛 에너지로 전자가 전도띠로 여기될 수 있는 정도의 차이입니다. 도핑을 통해 이 성질을 정밀하게 조절할 수 있어 트랜지스터 같은 전자소자의 기반이 됩니다."],examples:["실리콘(Si)은 대표적인 반도체 물질","p형·n형 반도체를 접합해 다이오드를 만든다","온도가 높아지면 반도체의 전도성이 증가한다"],observationActivity:{title:"온도에 따른 반도체 저항 변화 측정",description:"서미스터(반도체 소자)의 저항이 온도에 따라 어떻게 변하는지 측정합니다.",prediction:"온도가 올라갈수록 반도체의 저항은 감소할 것이다(금속과 반대 경향)",materials:["서미스터","멀티미터","온수와 냉수","온도계"],steps:["1. 실온에서 서미스터의 저항을 측정합니다","2. 따뜻한 물 근처에서 저항을 다시 측정합니다","3. 차가운 물 근처에서도 측정합니다","4. 온도-저항 그래프를 그려 띠 구조 이론과 연결짓습니다"],safetyWarning:"전기 소자와 물을 다룰 때 감전에 주의하세요"},questions:["master-phys-03-q01","master-phys-03-q02","master-phys-03-q03","master-phys-03-q04","master-phys-03-q05","master-phys-03-q06"]},{id:"master-chem-01",subject:"chemistry",grade:16,level:"expert",unit:"물리화학",title:"화학열역학: 자유에너지와 자발성",summary:"깁스 자유에너지의 변화로 화학 반응이 자발적으로 일어날지를 예측할 수 있다.",keywords:["깁스 자유에너지","엔탈피","엔트로피","자발성","평형상수"],misconceptions:["발열 반응은 항상 자발적으로 일어난다","엔트로피가 감소하는 반응은 절대 자발적으로 일어날 수 없다"],explanation:{basic:"화학 반응이 저절로 일어나는지는 열을 내는지(엔탈피)뿐 아니라 무질서도가 증가하는지(엔트로피)도 함께 고려해야 합니다.",curriculum:"깁스 자유에너지 변화 ΔG=ΔH-TΔS가 음수이면 반응은 자발적입니다. 발열(ΔH<0)이면서 엔트로피가 증가(ΔS>0)하면 항상 자발적이고, 그 반대는 항상 비자발적입니다. 나머지 경우는 온도에 따라 달라집니다.",university:"ΔG°=-RT ln K로 표준 자유에너지 변화와 평형상수가 연결됩니다. 반트호프 식은 온도에 따른 K의 변화를 ΔH와 연결지어 설명하며, 이는 화학 공정의 최적 온도 설계에 활용됩니다."},deepDive:["발열 반응(ΔH<0)이라고 항상 자발적인 것은 아닙니다. 만약 그 반응에서 엔트로피가 크게 감소한다면(ΔS가 매우 음수), 높은 온도에서는 TΔS 항이 커져 ΔG가 양수가 되어 비자발적이 될 수 있습니다.","엔트로피가 감소하는 반응(ΔS<0)도 충분히 발열량이 크고(ΔH가 매우 음수) 온도가 낮으면 ΔG가 음수가 되어 자발적으로 일어날 수 있습니다. 자발성은 ΔH와 ΔS, 온도가 함께 결정합니다."],examples:["물이 얼음이 되는 반응은 낮은 온도에서만 자발적(ΔS<0이지만 ΔH<0이 더 크게 작용)","암모니아 합성 반응의 자발성은 온도와 압력에 따라 달라짐","용해 과정의 자발성은 엔탈피와 엔트로피 변화의 균형으로 결정"],observationActivity:{title:"용해 과정의 흡열·발열과 엔트로피 관찰",description:"여러 물질을 물에 녹이며 온도 변화(엔탈피)를 측정하고 자발성을 논의합니다.",prediction:"일부 물질은 용해 시 온도가 내려가지만(흡열) 그래도 자발적으로 용해될 것이다",materials:["질산암모늄","수산화나트륨","물","온도계","비커"],steps:["1. 각 물질을 물에 녹이며 온도 변화를 측정합니다","2. 흡열/발열 여부를 기록합니다","3. 두 용해 과정 모두 자발적으로 일어나는지 관찰합니다","4. 엔탈피와 엔트로피 변화의 관점에서 자발성을 논의합니다"],safetyWarning:"수산화나트륨은 피부에 자극적이므로 장갑을 착용하세요"},questions:["master-chem-01-q01","master-chem-01-q02","master-chem-01-q03","master-chem-01-q04","master-chem-01-q05","master-chem-01-q06"]},{id:"master-chem-02",subject:"chemistry",grade:17,level:"expert",unit:"반응속도론",title:"화학 반응속도론",summary:"반응 속도는 농도, 온도, 촉매에 영향을 받으며, 그 관계를 속도식과 활성화에너지로 정량화한다.",keywords:["반응속도","속도식","활성화에너지","아레니우스 식","촉매"],misconceptions:["반응속도는 항상 반응물 농도에 정비례한다","촉매는 반응의 평형 위치를 바꾼다"],explanation:{basic:"반응이 얼마나 빨리 일어나는지는 반응물의 농도, 온도, 촉매 사용 여부에 따라 달라집니다.",curriculum:"속도식 rate=k[A]ᵐ[B]ⁿ에서 반응차수 m, n은 실험으로 결정되며 반응식의 계수와 항상 같지는 않습니다. 아레니우스 식 k=Ae^(-Ea/RT)은 온도가 높을수록, 활성화에너지가 낮을수록 반응이 빨라짐을 보여줍니다.",university:"반응 메커니즘은 여러 소반응(elementary step)으로 이루어지며, 가장 느린 단계(율속 단계)가 전체 반응 속도를 결정합니다. 촉매는 다른 반응경로(더 낮은 활성화에너지)를 제공해 속도를 높이지만 평형상수나 평형 위치 자체는 변화시키지 않습니다."},deepDive:["반응차수는 반응식의 계수와 일치한다고 가정하기 쉽지만, 실제로는 실험을 통해서만 결정할 수 있는 값입니다. 여러 단계를 거치는 복잡한 반응일수록 계수와 반응차수가 다른 경우가 흔합니다.","촉매는 반응 속도를 높이지만 반응의 평형 위치(평형상수, 생성물의 최종 비율)에는 영향을 주지 않습니다. 촉매는 정반응과 역반응의 활성화에너지를 동일한 정도로 낮춰 평형에 더 빨리 도달하게 할 뿐입니다."],examples:["효소는 생체 내 반응의 활성화에너지를 낮추는 생체 촉매","냉장 보관은 반응(부패) 속도를 늦추는 원리","촉매 변환기는 자동차 배기가스의 유해물질 반응 속도를 높임"],observationActivity:{title:"온도와 촉매에 따른 반응속도 비교 실험",description:"과산화수소 분해 반응의 속도를 촉매(이산화망간) 유무와 온도에 따라 비교합니다.",prediction:"촉매를 넣거나 온도를 높이면 기체(산소) 발생 속도가 빨라질 것이다",materials:["과산화수소수","이산화망간(또는 감자즙)","시험관","온도계","초시계"],steps:["1. 과산화수소수만 넣고 기포 발생 속도를 관찰합니다","2. 이산화망간을 추가해 기포 발생 속도를 비교합니다","3. 온도를 높인 과산화수소수로 반응 속도를 비교합니다","4. 결과를 속도식과 활성화에너지 개념으로 설명합니다"],safetyWarning:"과산화수소수는 피부와 눈에 자극적이니 보안경과 장갑을 착용하세요"},questions:["master-chem-02-q01","master-chem-02-q02","master-chem-02-q03","master-chem-02-q04","master-chem-02-q05","master-chem-02-q06"]},{id:"master-chem-03",subject:"chemistry",grade:16,level:"expert",unit:"분광학",title:"분광학 기초: 분자의 구조 분석",summary:"분자는 특정 파장의 빛을 흡수하거나 방출하며, 이를 분석해 분자 구조를 알아낼 수 있다.",keywords:["IR 분광법","NMR","자외선-가시광선 분광법","진동","화학적 이동"],misconceptions:["분광학은 물질의 색깔만 알려준다","모든 분광법은 같은 원리로 작동한다"],explanation:{basic:"분자에 빛을 쬐면 특정 파장의 빛만 흡수하는데, 이 패턴을 분석하면 분자 안에 어떤 결합과 원자들이 있는지 알아낼 수 있습니다.",curriculum:"IR(적외선) 분광법은 결합의 진동을 이용해 작용기를 확인하고, UV-Vis 분광법은 전자전이를 이용해 공액계나 색을 분석하며, NMR(핵자기공명)은 원자핵 주위 화학적 환경을 분석해 분자 골격을 밝힙니다.",university:"IR 스펙트럼의 흡수 봉우리 위치는 결합의 힘상수와 환산질량에 관련되며(훅의 법칙 근사), NMR의 화학적 이동은 핵 주위 전자의 가림 효과(shielding)를 반영합니다. 이 여러 분광법을 종합해 미지 화합물의 구조를 결정합니다(구조결정론)."},deepDive:["분광학은 단순히 물질의 색깔을 알려주는 것을 훨씬 넘어섭니다. 어떤 화학결합이 있는지(IR), 어떤 화학적 환경의 수소나 탄소가 몇 개 있는지(NMR), 전자가 어떻게 배치되어 있는지(UV-Vis) 등 분자의 상세한 구조 정보를 제공합니다.","각 분광법은 서로 다른 물리적 원리(결합의 진동, 핵의 자기적 성질, 전자의 전이)를 이용하므로, 하나의 분광법만으로는 분자 구조를 완전히 결정하기 어렵고 여러 분광법을 종합적으로 사용해야 합니다."],examples:["IR 분광법으로 카복실산의 C=O 결합 확인","NMR로 에탄올 분자의 서로 다른 수소 위치 구별","UV-Vis 분광법으로 용액의 농도 정량 분석(베르-람베르트 법칙)"],observationActivity:{title:"UV-Vis 분광법 원리 시뮬레이션(색과 흡수의 관계)",description:"여러 색의 용액에 빛을 통과시켜 흡수되는 색과 우리 눈에 보이는 색의 관계(보색 관계)를 탐구합니다.",prediction:"용액이 흡수하는 색의 보색이 우리 눈에 보이는 색일 것이다",materials:["색이 있는 용액(식용색소 등)","흰색 손전등","분광기(또는 CD 간이 분광기)"],steps:["1. 여러 색의 용액을 준비합니다","2. 손전등 빛을 용액에 통과시켜 간이 분광기로 관찰합니다","3. 어떤 파장(색)이 흡수되어 사라지는지 확인합니다","4. 흡수된 색과 우리 눈에 보이는 용액의 색 사이의 보색 관계를 정리합니다"],safetyWarning:"색소 용액이 옷에 묻지 않도록 주의하세요"},questions:["master-chem-03-q01","master-chem-03-q02","master-chem-03-q03","master-chem-03-q04","master-chem-03-q05","master-chem-03-q06"]},{id:"master-math-01",subject:"math",grade:17,level:"expert",unit:"선형대수학",title:"선형대수학: 벡터공간과 고유값",summary:"벡터공간, 선형변환, 고유값과 고유벡터의 개념으로 다차원적 구조를 체계적으로 다룬다.",keywords:["벡터공간","선형독립","고유값","고유벡터","대각화"],misconceptions:["벡터공간은 항상 3차원 이하의 공간만을 의미한다","모든 정사각행렬은 대각화가 가능하다"],explanation:{basic:"벡터공간은 벡터의 덧셈과 상수배가 잘 정의된 집합으로, 화살표뿐 아니라 함수나 다항식의 모임도 벡터공간이 될 수 있습니다.",curriculum:"선형독립인 벡터들의 모임(기저)으로 벡터공간의 모든 원소를 표현할 수 있습니다. 고유값 λ와 고유벡터 v는 Av=λv를 만족하며, 이는 선형변환이 특정 방향으로는 단순히 크기만 바꾼다는 것을 의미합니다.",university:"대각화 가능한 행렬은 A=PDP⁻¹로 표현되어 거듭제곱이나 지수함수 계산이 크게 단순화됩니다. 대칭행렬은 항상 실수 고유값을 가지며 직교대각화가 가능하다는 스펙트럼 정리는 양자역학, 데이터 분석(주성분분석) 등에 광범위하게 응용됩니다."},deepDive:["벡터공간은 화살표로 그릴 수 있는 2차원, 3차원 공간에 국한되지 않습니다. 다항식의 집합, 연속함수의 집합처럼 추상적인 대상들도 덧셈과 상수배의 성질만 만족하면 벡터공간이 될 수 있습니다.","모든 정사각행렬이 대각화 가능한 것은 아닙니다. 고유값의 중복도와 고유벡터의 개수가 일치하지 않는 경우(결함행렬)는 대각화할 수 없으며, 이런 경우 조르당 표준형이라는 대안적 형태를 사용합니다."],examples:["주성분분석(PCA)은 공분산 행렬의 고유벡터를 이용한 데이터 차원 축소","구글의 페이지랭크 알고리즘은 고유벡터를 이용해 웹페이지 중요도를 계산","양자역학의 관측가능량은 에르미트 연산자의 고유값으로 나타남"],observationActivity:{title:"2×2 행렬의 고유벡터 방향 시각화",description:"간단한 2×2 행렬을 여러 벡터에 적용해 방향이 바뀌지 않는 고유벡터를 찾아봅니다.",prediction:"특정 방향의 벡터는 행렬을 적용해도 방향이 바뀌지 않고 크기만 변할 것이다",materials:["모눈종이","계산기 또는 컴�터"],steps:["1. 행렬 A=[[2,1],[1,2]]를 여러 벡터에 곱해봅니다","2. 결과 벡터의 방향을 원래 벡터와 비교합니다","3. 방향이 바뀌지 않는 특별한 벡터(고유벡터)를 찾아봅니다","4. 그때의 배율(고유값)을 계산해 확인합니다"],safetyWarning:"계산 과정의 오차에 유의하세요"},questions:["master-math-01-q01","master-math-01-q02","master-math-01-q03","master-math-01-q04","master-math-01-q05","master-math-01-q06"]},{id:"master-math-02",subject:"math",grade:16,level:"expert",unit:"해석학",title:"해석학 기초: 극한의 엄밀한 정의",summary:"ε-δ 논법으로 극한과 연속성을 엄밀하게 정의하여 미적분학의 논리적 기초를 다진다.",keywords:["ε-δ 논법","극한","연속함수","완비성","균등수렴"],misconceptions:["직관적으로 이해되면 엄밀한 증명은 필요 없다","수렴하는 함수열의 극한은 항상 연속함수이다"],explanation:{basic:'고등학교에서는 극한을 "한없이 가까워진다"는 직관으로 배우지만, 대학 수학에서는 이를 정확한 수식으로 정의합니다.',curriculum:"lim(x→a) f(x)=L의 엄밀한 정의: 임의의 ε>0에 대해 어떤 δ>0가 존재하여 0<|x-a|<δ이면 |f(x)-L|<ε이 성립합니다. 이 정의로 직관적으로 애매했던 극한 개념을 논리적으로 명확히 합니다.",university:"실수의 완비성(모든 코시수열이 수렴)은 해석학의 근본 공리로, 중간값 정리·최댓값 정리 등 여러 정리의 증명에 필수적입니다. 균등수렴은 각 점에서의 수렴(점별수렴)보다 강한 조건으로, 극한함수의 연속성·적분가능성을 보장합니다."},deepDive:['직관적 이해는 학습에 중요하지만, 엄밀한 증명 없이는 미묘하게 틀린 결론에 도달할 수 있습니다. 예를 들어 "무한히 많은 연속함수를 더하면 항상 연속함수가 된다"는 직관은 균등수렴이 아닌 경우 성립하지 않을 수 있습니다.',"함수열이 각 점에서 수렴(점별수렴)하더라도 그 극한함수가 항상 연속인 것은 아닙니다. 예를 들어 fₙ(x)=xⁿ은 [0,1]에서 각 점마다 수렴하지만 그 극한함수는 x=1에서 불연속입니다. 균등수렴이라는 더 강한 조건이 필요합니다."],examples:["fₙ(x)=xⁿ의 점별극한은 x=1에서 불연속함수가 된다","중간값 정리는 실수의 완비성에 기반해 증명된다","균등수렴하는 연속함수열의 극한은 항상 연속이다"],observationActivity:{title:"ε-δ 정의로 간단한 극한 직접 증명해보기",description:"lim(x→2) 3x=6임을 ε-δ 정의를 이용해 직접 증명해봅니다.",prediction:"δ=ε/3으로 두면 정의를 만족시킬 수 있을 것이다",materials:["노트","필기도구"],steps:["1. |3x-6|<ε 부등식을 |x-2|에 대해 정리합니다","2. |3x-6|=3|x-2|<ε이 되려면 |x-2|<ε/3이어야 함을 확인합니다","3. δ=ε/3으로 두면 정의가 만족됨을 보입니다","4. 이 과정을 통해 ε-δ 정의의 논리 구조를 정리합니다"],safetyWarning:"해당 없음(이론 활동)"},questions:["master-math-02-q01","master-math-02-q02","master-math-02-q03","master-math-02-q04","master-math-02-q05","master-math-02-q06"]},{id:"master-math-03",subject:"math",grade:17,level:"expert",unit:"위상수학",title:"위상수학 입문: 연속성과 열린집합",summary:"거리 개념 없이도 열린집합만으로 연속성과 근접성을 정의하는 위상수학의 기초를 배운다.",keywords:["위상공간","열린집합","연속함수","컴팩트성","연결성"],misconceptions:["위상수학은 거리와 각도를 다루는 기하학과 같다","컴팩트성은 단순히 유계(bounded)라는 뜻이다"],explanation:{basic:"위상수학은 도형을 늘리거나 구부려도 변하지 않는 성질(연결되어 있는지, 구멍이 있는지 등)을 연구하는 수학 분야로, 정확한 거리나 각도는 다루지 않습니다.",curriculum:'위상공간은 "열린집합"이라는 개념만으로 정의되며, 이를 통해 거리 없이도 연속성을 정의할 수 있습니다(f가 연속이려면 열린집합의 원상이 열린집합이어야 함). 컴팩트 공간은 유한 부분덮개를 가지는 공간으로, 유계와는 다른 개념입니다.',university:'위상수학에서 두 공간이 위상동형(homeomorphic)이면 연속적인 변형으로 서로 옮겨질 수 있다는 것을 의미하며, 이는 "도넛과 커피잔은 위상적으로 같다"는 유명한 비유로 설명됩니다. 대수적 위상수학은 이러한 위상적 성질을 군, 호몰로지 등 대수적 불변량으로 분류합니다.'},deepDive:['위상수학은 유클리드 기하학처럼 정확한 거리나 각도를 다루지 않습니다. 대신 "가깝다", "연결되어 있다", "구멍이 있다" 같은 훨씬 더 유연한 성질을 다루며, 이 때문에 "고무판 기하학"이라고도 불립니다.','컴팩트성은 단순히 "유계(경계가 있다)"는 것과 다른 개념입니다. 유클리드 공간에서는 유계이면서 닫힌집합일 때 컴팩트가 되지만(하이네-보렐 정리), 일반적인 위상공간에서는 이 둘이 항상 같지 않습니다.'],examples:["도넛(원환면)과 커피잔은 위상적으로 동형이다(구멍이 하나)","실수 전체 집합 ℝ은 컴팩트하지 않다(무한히 뻗어있음)","닫힌 구간 [0,1]은 컴팩트 공간의 대표적인 예"],observationActivity:{title:"점토로 위상동형 관계 체험하기",description:"점토로 도넛 모양과 컵 모양을 만들며 연속적인 변형으로 서로 바뀔 수 있음을 체험합니다.",prediction:"구멍의 개수가 같으면 점토를 자르지 않고도 한 모양에서 다른 모양으로 변형할 수 있을 것이다",materials:["점토 또는 찰흙"],steps:["1. 점토로 도넛(원환면) 모양을 만듭니다","2. 자르지 않고 뭉치고 늘려서 컵 모양(손잡이가 구멍)으로 변형해봅니다","3. 반대로 공 모양을 만들어 큐브 모양으로 변형해봅니다(구멍 없음)","4. 구멍의 개수가 위상적으로 보존되는 성질임을 정리합니다"],safetyWarning:"점토를 입에 넣지 않도록 주의하세요"},questions:["master-math-03-q01","master-math-03-q02","master-math-03-q03","master-math-03-q04","master-math-03-q05","master-math-03-q06"]},{id:"master-bio-01",subject:"biology",grade:16,level:"expert",unit:"분자생물학",title:"분자생물학: 유전자 발현의 조절",summary:"유전자가 단백질로 발현되는 과정은 전사와 번역 단계에서 정교하게 조절된다.",keywords:["전사","번역","오페론","전사인자","RNA 가공"],misconceptions:["모든 유전자는 항상 발현되어 단백질을 만든다","DNA에서 단백질까지 정보는 한 방향으로만 흐른다(예외 없음)"],explanation:{basic:"세포는 필요한 유전자만 골라서 단백질로 만들어냅니다. 이는 마치 요리책에서 필요한 레시피만 골라 요리하는 것과 비슷합니다.",curriculum:"유전자 발현은 전사(DNA→mRNA)와 번역(mRNA→단백질) 두 단계로 이루어집니다. 원핵생물의 오페론은 여러 유전자를 하나의 프로모터로 함께 조절하며, 진핵생물은 전사인자와 인핸서 등을 통해 정교하게 조절됩니다.",university:"RNA 중합효소와 전사인자의 결합, 크로마틴 리모델링(히스톤 아세틸화 등 후성유전학적 조절), mRNA 가공(스플라이싱, 캡핑, 폴리아데닐화) 등 다층적 조절이 유전자 발현의 정밀도와 다양성을 만듭니다. 레트로바이러스처럼 RNA에서 DNA로 정보가 역전사되는 예외도 존재합니다."},deepDive:["세포 안의 모든 유전자가 항상 발현되는 것은 아닙니다. 간세포와 신경세포는 같은 DNA를 가지고 있지만, 서로 다른 유전자 발현 패턴으로 완전히 다른 기능을 수행합니다. 이것이 세포 분화의 핵심 원리입니다.","분자생물학의 중심원리(DNA→RNA→단백질)는 일반적인 흐름이지만 절대적이지 않습니다. 레트로바이러스(HIV 등)는 역전사효소를 이용해 RNA를 DNA로 역전사하는 예외적인 경로를 사용합니다."],examples:["대장균의 젖당 오페론은 젖당이 있을 때만 관련 유전자를 발현","같은 유전체를 가진 세포가 분화되어 근육세포, 신경세포가 됨","HIV 바이러스는 역전사효소로 RNA를 DNA로 바꾼다"],observationActivity:{title:"온도에 따른 열충격 단백질 유전자 발현 시뮬레이션 논의",description:"온도 스트레스에 따라 특정 유전자(열충격 단백질)의 발현이 증가하는 사례를 조사하고 논의합니다.",prediction:"고온 스트레스를 받으면 열충격 단백질 유전자의 발현이 증가할 것이다",materials:["관련 논문 또는 자료(인터넷 조사)","토의 자료"],steps:["1. 열충격 단백질(HSP)의 기능을 조사합니다","2. 고온 스트레스 시 HSP 유전자 발현 변화에 대한 자료를 찾습니다","3. 전사 조절 관점에서 이 현상을 설명합니다","4. 다른 스트레스 반응 유전자 발현 사례와 비교합니다"],safetyWarning:"해당 없음(조사 및 토의 활동)"},questions:["master-bio-01-q01","master-bio-01-q02","master-bio-01-q03","master-bio-01-q04","master-bio-01-q05","master-bio-01-q06"]},{id:"master-bio-02",subject:"biology",grade:17,level:"expert",unit:"발생생물학",title:"발생생물학: 세포 분화와 형태 형성",summary:"하나의 수정란이 분열하며 서로 다른 세포로 분화하고 정교한 몸의 형태를 만들어가는 과정을 탐구한다.",keywords:["배아 발생","세포 분화","형태형성물질","혹스 유전자","줄기세포"],misconceptions:["세포 분화 과정에서 유전자 자체가 사라지거나 변형된다","몸의 각 부분은 무작위로 결정된다"],explanation:{basic:"수정란은 세포분열을 반복하며 눈, 손, 심장 등 서로 다른 부위로 자라납니다. 이 과정은 정해진 순서와 신호에 따라 정교하게 조절됩니다.",curriculum:"배아 발생 동안 형태형성물질(morphogen)의 농도 기울기가 세포의 위치 정보를 제공하며, 혹스(Hox) 유전자는 몸의 앞뒤 축을 따라 신체 부위의 정체성을 결정합니다. 줄기세포는 여러 종류의 세포로 분화할 수 있는 잠재력을 가집니다.",university:"형태형성물질의 농도 기울기는 프렌치 플래그 모델(French flag model)로 설명되며, 세포는 특정 역치 농도에 따라 서로 다른 유전자 발현 프로그램을 활성화합니다. 유도만능줄기세포(iPSC) 기술은 분화된 체세포를 역분화시켜 다시 여러 세포로 분화할 수 있게 만드는 기술입니다."},deepDive:["세포 분화 과정에서 DNA 서열 자체는 거의 변하지 않습니다(면역세포의 일부 예외 제외). 분화는 유전자가 사라지거나 변형되는 것이 아니라, 어떤 유전자를 켜고 끌지 조절하는 후성유전학적 변화로 일어납니다.","몸의 각 부위가 형성되는 위치는 무작위가 아니라, 형태형성물질의 농도 기울기와 혹스 유전자 발현 패턴에 의해 매우 정밀하게 결정됩니다. 이 조절이 조금만 어긋나도 심각한 발생 이상이 나타날 수 있습니다."],examples:["초파리의 혹스 유전자 돌연변이는 다리가 머리에서 자라는 기형을 만든다","야마나카 인자로 체세포를 역분화시켜 만든 유도만능줄기세포","척추동물의 사지 발생에서 형태형성물질의 농도 기울기"],observationActivity:{title:"병아리 또는 초파리 배아 발생 영상 관찰 및 분석",description:"공개된 배아 발생 시간경과 영상을 관찰하며 각 단계별 형태 변화를 분석합니다.",prediction:"초기 배아는 대칭적이다가 시간이 지나며 점차 비대칭적인 신체 구조가 나타날 것이다",materials:["배아 발생 시간경과 영상 자료","기록지"],steps:["1. 배아 발생의 각 단계(난할, 낭배형성, 기관형성)를 조사합니다","2. 영상에서 각 단계별 형태 변화를 관찰합니다","3. 형태형성물질이나 조절 유전자의 역할을 자료에서 찾아봅니다","4. 관찰 내용을 발생 단계별로 정리해 보고서를 작성합니다"],safetyWarning:"해당 없음(영상 관찰 및 조사 활동)"},questions:["master-bio-02-q01","master-bio-02-q02","master-bio-02-q03","master-bio-02-q04","master-bio-02-q05","master-bio-02-q06"]},{id:"master-bio-03",subject:"biology",grade:16,level:"expert",unit:"신경과학",title:"신경과학 개론: 뇌의 정보 처리",summary:"뇌는 수많은 뉴런들의 시냅스 연결을 통해 정보를 처리하고 학습과 기억을 형성한다.",keywords:["뉴런","시냅스 가소성","장기강화","신경전달물질","신경회로"],misconceptions:["사람은 뇌의 10%만 사용한다","기억은 뇌의 한 곳에 고정된 파일처럼 저장된다"],explanation:{basic:"뇌는 수백억 개의 뉴런이 서로 연결된 거대한 네트워크입니다. 이 연결(시냅스)이 강해지거나 약해지면서 우리는 배우고 기억합니다.",curriculum:"시냅스 가소성은 시냅스 연결의 강도가 경험에 따라 변하는 성질로, 학습과 기억의 세포적 기반입니다. 장기강화(LTP)는 반복 자극으로 시냅스 전달 효율이 오래 지속적으로 증가하는 현상입니다.",university:"LTP는 NMDA 수용체를 통한 칼슘 유입과 이에 따른 AMPA 수용체 증가로 설명됩니다. 기억은 뇌의 특정 한 부위가 아니라 여러 뇌 영역에 걸친 신경회로의 패턴으로 분산 저장되는 것으로 여겨집니다(분산 표상 이론)."},deepDive:['"뇌의 10%만 사용한다"는 것은 신경과학적으로 근거 없는 통념입니다. 뇌 영상 연구에 따르면 특정 과제 수행 시 활성화되는 영역은 다르지만, 하루 동안 뇌의 거의 모든 부위가 어떤 형태로든 활성화됩니다.',"기억은 컴퓨터 파일처럼 한 곳에 고정되어 저장되지 않습니다. 하나의 기억은 여러 뇌 영역에 걸친 신경세포들의 연결 패턴(분산 표상)으로 저장되며, 회상할 때마다 이 패턴이 재구성됩니다."],examples:["피아노를 연습할수록 관련 신경회로의 시냅스가 강화된다","해마는 새로운 기억을 형성하는 데 중요한 역할을 한다","알츠하이머병은 시냅스와 뉴런의 손실과 관련이 있다"],observationActivity:{title:"반복 학습에 따른 기억 형성 실험",description:"무작위 단어 목록을 반복 학습하며 회상률의 변화를 측정해 시냅스 강화 개념과 연결짓습니다.",prediction:"반복 횟수가 늘수록 회상할 수 있는 단어 수가 증가할 것이다",materials:["무작위 단어 목록(20개)","타이머","기록지"],steps:["1. 단어 목록을 1분간 암기합니다","2. 즉시 기억나는 단어를 적어봅니다(1차 회상)","3. 같은 목록을 다시 암기하고 회상을 반복합니다(3회 반복)","4. 반복 횟수에 따른 회상률 변화를 그래프로 나타냅니다"],safetyWarning:"해당 없음(인지 실험 활동)"},questions:["master-bio-03-q01","master-bio-03-q02","master-bio-03-q03","master-bio-03-q04","master-bio-03-q05","master-bio-03-q06"]},{id:"master-earth-01",subject:"earthscience",grade:17,level:"expert",unit:"지구화학",title:"지구화학: 원소의 순환과 동위원소",summary:"지구를 이루는 원소들은 암석권-수권-대기권-생물권 사이를 순환하며, 동위원소는 이 과정을 추적하는 도구가 된다.",keywords:["지구화학적 순환","동위원소","방사성 연대측정","탄소 순환","풍화작용"],misconceptions:["원소는 지구 안에서 새로 생성되거나 사라진다","방사성 동위원소 연대측정은 항상 100% 정확하다"],explanation:{basic:"탄소, 질소 같은 원소들은 암석, 물, 공기, 생물 사이를 오가며 끊임없이 순환합니다. 방사성 동위원소를 이용하면 암석이나 화석의 나이를 추정할 수 있습니다.",curriculum:"탄소 순환은 광합성, 호흡, 화석연료 연소, 풍화작용 등을 통해 대기-생물권-암석권 사이에서 일어납니다. 방사성 연대측정은 반감기가 알려진 동위원소(¹⁴C, U-Pb 등)의 붕괴 비율을 이용해 시료의 나이를 추정합니다.",university:"동위원소 분별(isotope fractionation)은 물리·화학적 과정에서 무거운 동위원소와 가벼운 동위원소가 다르게 거동하는 현상으로, 고기후 복원(산소동위원소비 등)에 활용됩니다. 방사성 연대측정의 정확도는 초기 조건 가정, 개방계 여부, 오염 등에 따라 오차가 발생할 수 있어 여러 방법을 교차 검증합니다."},deepDive:["원소 자체(탄소, 산소 등)는 핵반응이 아닌 한 새로 생성되거나 사라지지 않습니다. 지구화학적 순환은 원소가 여러 저장고(암석, 대기, 바다, 생물) 사이를 형태를 바꾸며 이동하는 과정입니다.","방사성 연대측정은 매우 유용하지만 절대적으로 완벽하지는 않습니다. 시료의 오염, 초기 동위원소 비율 가정의 불확실성 등으로 오차가 발생할 수 있어, 신뢰도를 높이기 위해 여러 독립적인 방법으로 교차 검증하는 것이 중요합니다."],examples:["화석연료 연소는 오랫동안 암석권에 저장된 탄소를 대기로 빠르게 방출","¹⁴C 연대측정으로 고고학 유물의 나이 추정","빙하 코어의 산소동위원소비로 과거 기온 복원"],observationActivity:{title:"반감기 개념 시뮬레이션(동전 던지기)",description:"동전 던지기로 방사성 붕괴의 반감기 개념을 통계적으로 시뮬레이션합니다.",prediction:"매 회차마다 남은 동전(핵)의 수가 대략 절반으로 줄어들 것이다",materials:["동전 100개(또는 다른 대체물)","기록지"],steps:['1. 동전 100개를 던져 앞면이 나온 것을 "붕괴"로 간주해 제거합니다',"2. 남은 동전 수를 기록합니다","3. 남은 동전으로 같은 과정을 반복합니다(5~6회)","4. 회차별 남은 동전 수를 그래프로 그려 반감기 곡선과 비교합니다"],safetyWarning:"해당 없음(통계 시뮬레이션 활동)"},questions:["master-earth-01-q01","master-earth-01-q02","master-earth-01-q03","master-earth-01-q04","master-earth-01-q05","master-earth-01-q06"]},{id:"master-earth-02",subject:"earthscience",grade:16,level:"expert",unit:"고기후학",title:"고기후학: 과거 기후를 읽는 방법",summary:"나이테, 빙하 코어, 해양 퇴적물 등의 대체 자료(proxy)를 이용해 관측 기록 이전의 기후를 복원한다.",keywords:["고기후 대체자료","빙하 코어","나이테","산소동위원소","기후 복원"],misconceptions:["과거 기후는 온도계 기록이 없어 전혀 알 수 없다","고기후 자료는 하나의 대체자료만으로 충분히 신뢰할 수 있다"],explanation:{basic:'온도계가 없던 먼 과거의 기후는 나이테, 빙하 속 공기 방울, 산호, 퇴적물 등 자연이 남긴 "기록"을 분석해 추정할 수 있습니다.',curriculum:"나이테의 두께는 그 해의 기후 조건을 반영하고, 빙하 코어 속 공기 방울은 과거 대기 조성을(CO₂ 농도 등) 직접 보존하고 있습니다. 해양 퇴적물 속 유공충 화석의 산소동위원소비는 과거 해수 온도와 빙하량을 알려줍니다.",university:"고기후 복원은 여러 독립적인 대체자료(다중 프록시)를 통합해 신뢰도를 높이는 것이 표준적인 방법입니다. 고기후 자료는 기후모델의 검증에도 사용되어, 과거의 기후 변화 패턴이 현재 모델로 얼마나 잘 재현되는지 평가하는 데 활용됩니다."},deepDive:["온도계로 직접 측정한 기록이 없다고 해서 과거 기후를 전혀 알 수 없는 것은 아닙니다. 나무, 얼음, 산호, 퇴적물 등 자연물에는 당시의 환경 조건이 화학적·물리적 흔적으로 남아있어, 이를 정교하게 해독하면 과거 기후를 복원할 수 있습니다.","하나의 대체자료만으로는 불확실성이 클 수 있어, 신뢰할 수 있는 고기후 복원을 위해서는 여러 독립적인 대체자료(나이테, 빙하 코어, 퇴적물 등)를 교차 비교하는 다중 프록시 접근이 중요합니다."],examples:["남극 빙하 코어는 80만 년 전까지의 대기 CO₂ 농도를 보여준다","나이테의 폭으로 가뭄이나 풍년의 해를 추정","산호의 성장띠로 과거 해수온을 추정"],observationActivity:{title:"나이테 폭 측정으로 과거 기후 추정하기(자료 기반)",description:"제공된 나무 원반(또는 사진 자료)의 나이테 폭을 측정해 연도별 성장 조건을 추정합니다.",prediction:"나이테 폭이 넓은 해는 강수량이 풍부했거나 기후가 좋았을 것이다",materials:["나무 원반 사진 자료 또는 실물","자","기록지"],steps:["1. 나이테를 중심에서부터 바깥쪽으로 순서대로 측정합니다","2. 나이테 폭을 연도별로 기록합니다","3. 폭이 넓은 해와 좁은 해를 비교합니다","4. 과거 기후 조건과 연결지어 해석해봅니다"],safetyWarning:"나무 원반의 거친 표면에 다치지 않도록 주의하세요"},questions:["master-earth-02-q01","master-earth-02-q02","master-earth-02-q03","master-earth-02-q04","master-earth-02-q05","master-earth-02-q06"]},{id:"master-earth-03",subject:"earthscience",grade:17,level:"expert",unit:"지진학",title:"지진학: 지진파와 지구 내부 구조",summary:"지진파의 속도와 경로 변화를 분석하면 직접 갈 수 없는 지구 내부의 구조를 알아낼 수 있다.",keywords:["P파","S파","지진파 그림자대","모호면","지구 내부 구조"],misconceptions:["지진파는 지구 내부 어디든 똑같은 속도로 전달된다","S파는 액체 속에서도 고체와 같이 전달된다"],explanation:{basic:'지진이 나면 두 종류의 파동(P파, S파)이 지구 속을 지나갑니다. 이 파동이 얼마나 빨리, 어떤 경로로 도달하는지를 분석해 지구 속을 "들여다볼" 수 있습니다.',curriculum:"P파(종파)는 고체와 액체 모두를 통과할 수 있지만 S파(횡파)는 액체를 통과하지 못합니다. S파가 외핵을 통과하지 못하는 지진파 그림자대의 존재는 외핵이 액체 상태임을 알려주는 핵심 증거입니다.",university:"지진파의 속도는 매질의 밀도와 탄성계수에 따라 달라지며, 이 속도 변화의 불연속면(모호면, 구텐베르크 불연속면 등)의 위치를 분석해 지각-맨틀-외핵-내핵의 경계와 물성을 정밀하게 규명합니다. 지진파 토모그래피는 이를 3차원적으로 확장해 맨틀 대류의 구조까지 추정합니다."},deepDive:["지진파는 지구 내부를 통과하며 매질의 밀도와 탄성이 바뀔 때마다 속도가 변하고 굴절·반사됩니다. 이 때문에 지구 내부는 결코 균일한 매질이 아니며, 이 속도 변화 패턴 자체가 내부 구조를 알아내는 핵심 단서입니다.",'S파(횡파)는 액체에서 전단력을 전달할 수 없어 통과하지 못합니다. 지진 관측소에서 S파가 도달하지 않는 "그림자 지역"이 관측된다는 사실이야말로 외핵이 액체 상태라는 결정적인 증거입니다.'],examples:["지진파 그림자대의 발견으로 외핵이 액체임을 알아냄","모호면(모호로비치치 불연속면)은 지각과 맨틀의 경계","지진파 토모그래피로 맨틀 대류의 상승·하강 지역을 추정"],observationActivity:{title:"용수철과 슬링키로 P파·S파 모형 실험",description:"슬링키(스프링 장난감)를 이용해 종파(P파)와 횡파(S파)의 전달 방식 차이를 시각화합니다.",prediction:"P파는 압축과 팽창으로, S파는 위아래 흔들림으로 전달되는 것이 다르게 보일 것이다",materials:["슬링키(스프링 장난감)","평평한 바닥"],steps:["1. 슬링키를 바닥에 길게 늘어뜨립니다","2. 한쪽 끝을 앞뒤로 밀고 당겨 압축파(P파)를 만들어 관찰합니다","3. 한쪽 끝을 위아래로 흔들어 횡파(S파)를 만들어 관찰합니다","4. 두 파동의 전달 속도와 모양의 차이를 비교합니다"],safetyWarning:"슬링키가 엉키지 않도록 주의하고 다른 사람에게 튕기지 않게 하세요"},questions:["master-earth-03-q01","master-earth-03-q02","master-earth-03-q03","master-earth-03-q04","master-earth-03-q05","master-earth-03-q06"]},{id:"master-astro-01",subject:"astronomy",grade:16,level:"expert",unit:"항성천문학",title:"항성천문학: 별의 내부 구조와 진화",summary:"별의 질량은 그 내부 구조, 핵융합 방식, 진화 경로와 최후를 결정하는 가장 중요한 요인이다.",keywords:["항성 진화","핵융합","찬드라세카르 한계","주계열","항성 구조 방정식"],misconceptions:["모든 별은 같은 방식으로 핵융합을 한다","별의 밝기는 크기에만 비례한다"],explanation:{basic:"별은 질량에 따라 일생이 크게 달라집니다. 무거운 별일수록 더 뜨겁고 밝지만 수명은 오히려 짧습니다.",curriculum:"태양과 비슷한 별은 양성자-양성자 연쇄반응으로, 더 무거운 별은 CNO 순환으로 수소를 헬륨으로 융합합니다. 항성의 질량-광도 관계(L∝M^3.5 근사)에 따라 무거운 별일수록 훨씬 밝지만 연료를 빠르게 소진해 수명이 짧습니다.",university:"항성 구조는 정역학적 평형, 질량 보존, 에너지 수송(복사 또는 대류), 에너지 생성의 네 가지 항성구조 방정식으로 기술됩니다. 찬드라세카르 한계(약 1.4 태양질량)를 넘는 축퇴 잔해는 전자축퇴압으로 자체 중력을 지탱할 수 없어 초신성 폭발이나 중성자별로 붕괴합니다."},deepDive:["모든 별이 같은 핵융합 과정을 거치는 것은 아닙니다. 태양처럼 상대적으로 가벼운 별은 양성자-양성자 연쇄반응이 지배적이지만, 훨씬 무거운 별은 탄소, 질소, 산소를 촉매로 이용하는 CNO 순환이 주된 에너지원이 됩니다.","별의 밝기는 크기뿐 아니라 표면온도에도 크게 의존합니다(광도 L∝R²T⁴). 그래서 크기는 작지만 매우 뜨거운 백색왜성이 크기는 크지만 상대적으로 차가운 적색거성보다 단위 면적당 훨씬 밝게 빛날 수 있습니다."],examples:["태양보다 10배 무거운 별은 태양보다 수천 배 더 밝지만 수명은 훨씬 짧다","찬드라세카르 한계를 넘는 백색왜성은 Ia형 초신성으로 폭발할 수 있다","무거운 별의 중심부는 철까지 핵융합이 진행된 후 중력붕괴를 겪는다"],observationActivity:{title:"H-R도에서 다양한 별의 위치 분석하기",description:"공개된 항성 데이터를 이용해 H-R도를 그리고 질량과 진화 단계를 추론합니다.",prediction:"무거운 별일수록 H-R도의 왼쪽 위(고온·고광도)에 위치할 것이다",materials:["항성 데이터 자료(온도, 광도)","그래프 용지 또는 스프레드시트"],steps:["1. 여러 별의 표면온도와 광도 자료를 수집합니다","2. 온도(x축, 역순)와 광도(y축)로 H-R도를 그립니다","3. 주계열, 거성, 백색왜성 영역을 구분해봅니다","4. 각 영역에 해당하는 별들의 특징을 정리합니다"],safetyWarning:"해당 없음(자료 분석 활동)"},questions:["master-astro-01-q01","master-astro-01-q02","master-astro-01-q03","master-astro-01-q04","master-astro-01-q05","master-astro-01-q06"]},{id:"master-astro-02",subject:"astronomy",grade:17,level:"expert",unit:"은하천문학",title:"은하천문학: 은하의 구조와 암흑물질",summary:"은하의 회전 속도 관측은 눈에 보이지 않는 암흑물질의 존재를 강하게 시사한다.",keywords:["은하 회전곡선","암흑물질","나선은하","은하단","중력렌즈"],misconceptions:["은하의 질량은 보이는 별의 질량만으로 설명된다","암흑물질은 이미 직접 관측되어 그 정체가 밝혀졌다"],explanation:{basic:"은하 바깥쪽의 별들은 보이는 물질만으로 예상되는 것보다 훨씬 빠르게 돌고 있습니다. 이는 눈에 보이지 않는 무언가가 추가로 은하를 붙잡고 있다는 것을 암시합니다.",curriculum:"은하 회전곡선(거리에 따른 회전속도)은 보이는 물질만 고려하면 바깥쪽으로 갈수록 느려져야 하지만, 실제 관측에서는 평탄하게 유지됩니다. 이 차이를 설명하기 위해 보이지 않는 암흑물질의 존재가 제안되었습니다.",university:"암흑물질의 존재는 은하 회전곡선뿐 아니라 은하단의 중력렌즈 효과, 우주배경복사의 비등방성, 우주 거대구조 형성 시뮬레이션 등 여러 독립적인 관측으로 뒷받침됩니다. 그러나 암흑물질을 이루는 입자의 정체는 아직 직접 검출되지 않아 여러 후보(WIMP, 액시온 등)가 연구되고 있습니다."},deepDive:["은하의 회전 속도를 관측된 별과 가스의 질량만으로 계산하면 실제 관측값과 크게 어긋납니다. 이 불일치를 설명하려면 보이지 않는 추가적인 질량(암흑물질)이 훨씬 더 많이 존재해야 합니다.",'암흑물질의 존재는 여러 독립적인 관측 증거로 강하게 뒷받침되지만, 그것을 이루는 입자 자체는 아직 실험실에서 직접 검출되지 않았습니다. "존재의 증거"와 "정체 규명"은 서로 다른 문제이며, 후자는 여전히 활발한 연구 대상입니다.'],examples:["나선은하의 회전곡선은 바깥쪽에서도 평탄하게 유지된다","은하단의 중력렌즈 효과는 보이는 질량보다 훨씬 큰 총질량을 시사한다","총알 은하단 관측은 암흑물질과 일반물질이 분리될 수 있음을 보여준다"],observationActivity:{title:"은하 회전곡선 자료 분석하기",description:"공개된 은하 회전속도 자료를 분석해 암흑물질 없이 예측한 곡선과 실제 관측 곡선을 비교합니다.",prediction:"실제 관측된 회전속도가 예측치보다 바깥쪽에서 더 높게 나타날 것이다",materials:["은하 회전곡선 공개 자료","그래프 용지 또는 스프레드시트"],steps:["1. 은하 중심으로부터 거리별 별의 회전속도 자료를 수집합니다","2. 보이는 질량만으로 예측되는 이론적 회전곡선을 계산합니다","3. 실제 관측된 회전곡선과 겹쳐 그립니다","4. 두 곡선의 차이를 암흑물질 개념으로 설명합니다"],safetyWarning:"해당 없음(자료 분석 활동)"},questions:["master-astro-02-q01","master-astro-02-q02","master-astro-02-q03","master-astro-02-q04","master-astro-02-q05","master-astro-02-q06"]},{id:"master-astro-03",subject:"astronomy",grade:16,level:"expert",unit:"관측천문학",title:"관측천문학 기법: 망원경과 관측 오차",summary:"망원경의 원리와 해상도의 한계를 이해하고, 관측 데이터에 포함된 오차와 보정 방법을 배운다.",keywords:["망원경","해상도","회절 한계","대기 요동","자료 보정"],misconceptions:["망원경은 배율만 높이면 무조건 더 잘 보인다","천체 관측 데이터는 보정 없이 바로 사용할 수 있다"],explanation:{basic:"망원경은 배율보다 빛을 모으는 능력(구경)과 상을 얼마나 세밀하게 구분하는 능력(해상도)이 더 중요합니다.",curriculum:"망원경의 이론적 해상도는 회절 한계로 제한되며, 구경이 클수록 더 세밀하게 구분할 수 있습니다. 지상 망원경은 대기의 흔들림(시상, seeing)으로 실제 해상도가 저하되며, 이를 보정하기 위해 적응광학 기술이 사용됩니다.",university:"회절 한계 각분해능은 θ≈1.22λ/D(λ: 파장, D: 구경)로 주어집니다. 관측 데이터는 다크 프레임, 플랫 프레임 보정 등을 통해 검출기 잡음과 불균일한 감도를 제거하는 정밀한 후처리 과정을 거쳐야 신뢰할 수 있는 과학적 자료가 됩니다."},deepDive:["배율을 아무리 높여도 망원경의 구경이 작으면 상이 흐릿하고 어두워 오히려 관측이 어려워집니다. 천체 관측에서는 배율보다 빛을 모으는 구경과 회절 한계로 결정되는 해상도가 훨씬 중요합니다.","망원경으로 얻은 원자료(raw data)에는 검출기 자체의 잡음, 불균일한 감도, 대기의 영향 등 여러 오차 요인이 섞여 있습니다. 다크 프레임과 플랫 프레임 보정 같은 정밀한 후처리 과정을 거치지 않으면 신뢰할 수 있는 과학적 결론을 내리기 어렵습니다."],examples:["허블우주망원경은 대기의 영향을 받지 않아 매우 선명한 상을 얻는다","적응광학은 대기 요동을 실시간으로 보정해 지상 망원경의 해상도를 높인다","대형 전파망원경 배열(간섭계)로 매우 높은 해상도를 얻는다"],observationActivity:{title:"두 개의 작은 빛 구분하기(해상도 체험 실험)",description:"서로 다른 크기의 구멍을 통해 멀리 있는 두 광원을 보며 구경과 해상도의 관계를 체험합니다.",prediction:"구멍이 클수록 두 광원을 더 뚜렷하게 구분할 수 있을 것이다",materials:["다양한 크기의 구멍이 뚫린 종이","멀리 떨어진 두 개의 작은 불빛(LED 등)"],steps:["1. 어두운 곳에서 일정 거리를 두고 두 개의 작은 불빛을 켭니다","2. 작은 구멍이 뚫린 종이를 눈에 대고 불빛을 관찰합니다","3. 구멍 크기를 다르게 하며 두 불빛이 구분되는지 확인합니다","4. 구멍 크기(구경)와 해상도의 관계를 정리합니다"],safetyWarning:"눈을 향한 밝은 빛을 직접 보지 않도록 주의하세요"},questions:["master-astro-03-q01","master-astro-03-q02","master-astro-03-q03","master-astro-03-q04","master-astro-03-q05","master-astro-03-q06"]},{id:"master-med-01",subject:"medicine",grade:17,level:"expert",unit:"병태생리학",title:"병태생리학: 질병의 발생 기전",summary:"질병은 정상적인 생리 기능이 어떤 원인으로 어긋나면서 나타나는 결과로, 그 기전을 이해하면 치료 전략을 세울 수 있다.",keywords:["염증반응","허혈","세포손상","보상기전","병리생리"],misconceptions:["염증은 항상 나쁜 것이므로 무조건 억제해야 한다","증상이 없으면 질병이 진행되고 있지 않은 것이다"],explanation:{basic:"병태생리학은 병이 왜, 어떻게 생기는지 몸속에서 일어나는 과정을 연구하는 학문입니다. 염증은 몸이 손상이나 감염에 대응하는 정상적인 방어 반응입니다.",curriculum:"염증반응은 혈관 확장, 백혈구 유입 등을 통해 손상 부위를 방어하고 치유를 돕는 과정이지만, 과도하거나 만성화되면 조직 손상을 일으킬 수 있습니다. 허혈(혈류 부족)은 세포에 산소와 영양 공급을 차단해 세포 손상과 괴사로 이어질 수 있습니다.",university:"급성 염증은 히스타민, 프로스타글란딘 등 매개체를 통해 혈관 투과성을 높이고 호중구를 동원하며, 만성 염증은 대식세포와 림프구가 지속적으로 관여해 섬유화나 조직 재구성을 유발할 수 있습니다. 보상기전(대상성 반응)은 질병 초기에 증상을 가려 발견을 늦출 수 있어 정기 검진의 중요성이 강조됩니다."},deepDive:["염증은 무조건 나쁜 것이 아니라 손상과 감염으로부터 몸을 보호하고 치유를 돕는 필수적인 방어 반응입니다. 문제가 되는 것은 염증이 과도하거나 만성적으로 지속되어 오히려 조직을 손상시키는 경우입니다.","많은 질병은 초기에 몸의 보상기전(대상성 반응)에 의해 증상 없이 진행될 수 있습니다. 예를 들어 만성 신장질환은 신장 기능이 상당히 저하될 때까지 증상이 뚜렷하지 않을 수 있어, 증상이 없다고 안심할 수는 없습니다."],examples:["상처 부위가 붉게 붓고 열이 나는 것은 정상적인 염증 반응","심근경색은 관상동맥의 혈류 차단(허혈)으로 심장 근육이 손상되는 질환",'고혈압은 오랫동안 증상 없이 진행되어 "침묵의 살인자"로 불린다'],observationActivity:{title:"염증의 4대 징후 사례 조사 및 정리",description:"발적, 발열, 부종, 통증이라는 염증의 4대 징후가 나타나는 실제 사례를 조사하고 기전을 정리합니다.",prediction:"각 징후는 혈관 확장, 투과성 증가 등 특정 생리적 변화와 연결될 것이다",materials:["참고 자료(교재 또는 신뢰할 수 있는 의학 정보)","정리 노트"],steps:["1. 염증의 4대 징후(발적, 발열, 부종, 통증)를 조사합니다","2. 각 징후를 유발하는 생리적 변화(혈관 확장 등)를 찾아봅니다","3. 실제 사례(상처, 감염 등)와 연결지어 정리합니다","4. 급성 염증과 만성 염증의 차이를 비교합니다"],safetyWarning:"해당 없음(조사 및 정리 활동)"},questions:["master-med-01-q01","master-med-01-q02","master-med-01-q03","master-med-01-q04","master-med-01-q05","master-med-01-q06"]},{id:"master-med-02",subject:"medicine",grade:16,level:"expert",unit:"약리학",title:"약리학 심화: 약물 상호작용과 개인차",summary:"여러 약물을 함께 복용하면 서로의 효과를 강화하거나 약화시킬 수 있으며, 개인의 유전적 차이도 약물 반응에 영향을 준다.",keywords:["약물 상호작용","약물대사효소","CYP450","약물유전체학","치료지수"],misconceptions:["천연 성분이라면 약물과 함께 먹어도 항상 안전하다","모든 사람에게 같은 용량이 같은 효과를 낸다"],explanation:{basic:"어떤 약과 음식, 다른 약을 함께 먹으면 약효가 세지거나 약해질 수 있습니다. 또한 사람마다 몸에서 약을 처리하는 방식이 달라 같은 약도 다르게 반응할 수 있습니다.",curriculum:"약물 상호작용은 흡수, 분포, 대사, 배설 단계에서 일어날 수 있으며, 특히 간의 CYP450 효소는 여러 약물의 대사에 관여해 병용 시 약물 농도에 큰 영향을 줍니다. 치료지수는 치료 효과가 나타나는 용량과 독성이 나타나는 용량의 비율로, 좁을수록 세심한 용량 조절이 필요합니다.",university:"CYP450 효소의 유전적 다형성(느린 대사자, 빠른 대사자)은 동일 용량에서도 약물 혈중농도에 큰 차이를 만들어 약물유전체학 연구의 핵심 주제가 됩니다. 약물 상호작용은 효소 유도(대사 촉진)나 억제(대사 저하) 기전으로 설명되며, 이는 병용약물 처방 시 반드시 고려해야 할 임상적 요소입니다."},deepDive:["천연 성분이라고 해서 항상 안전한 것은 아닙니다. 예를 들어 자몽주스는 특정 약물을 대사하는 CYP450 효소를 억제해 약물 혈중농도를 위험할 정도로 높일 수 있어, 특정 약물 복용 시 자몽 섭취를 피하도록 권고됩니다.","같은 용량의 약이라도 사람마다 약물대사효소의 유전적 차이로 인해 혈중 농도와 효과가 크게 다를 수 있습니다. 이 때문에 현대 의학에서는 개인의 유전적 특성을 고려한 맞춤형 처방(약물유전체학 기반 정밀의학)이 중요해지고 있습니다."],examples:["자몽주스는 일부 고지혈증약, 혈압약의 대사를 억제해 부작용 위험을 높인다","와파린(항응고제)은 다른 약물과의 상호작용에 특히 민감하다","CYP2D6 효소의 유전형에 따라 일부 진통제의 효과가 사람마다 다르다"],observationActivity:{title:"약물-음식 상호작용 사례 조사",description:"알려진 약물-음식 상호작용 사례를 조사하고 그 기전을 대사 효소 관점에서 정리합니다.",prediction:"특정 음식이 약물 대사효소를 억제하거나 촉진하는 사례를 찾을 수 있을 것이다",materials:["신뢰할 수 있는 의약정보 자료","정리 노트"],steps:["1. 대표적인 약물-음식 상호작용 사례(자몽, 비타민K가 풍부한 채소 등)를 조사합니다","2. 각 사례의 작용 기전을 찾아봅니다","3. CYP450 효소나 흡수 방해 등으로 기전을 분류합니다","4. 조사 내용을 표로 정리해 발표합니다"],safetyWarning:"조사 내용을 실제 복약 지도에 임의로 사용하지 않도록 유의합니다"},questions:["master-med-02-q01","master-med-02-q02","master-med-02-q03","master-med-02-q04","master-med-02-q05","master-med-02-q06"]},{id:"master-med-03",subject:"medicine",grade:17,level:"expert",unit:"임상역학",title:"임상역학: 근거 기반 의학의 기초",summary:"임상역학은 질병의 분포와 원인을 통계적으로 분석하여 치료와 예방의 근거를 마련하는 학문이다.",keywords:["근거 기반 의학","무작위 대조시험","코호트 연구","상대위험도","교란변수"],misconceptions:["한 건의 성공 사례만으로도 치료법의 효과를 증명할 수 있다","상관관계가 있으면 곧 인과관계가 있는 것이다"],explanation:{basic:"새로운 치료법이 정말 효과가 있는지 확인하려면 몇몇 사례가 아니라 많은 사람을 대상으로 한 체계적인 연구가 필요합니다.",curriculum:"무작위 대조시험(RCT)은 참가자를 무작위로 치료군과 대조군에 배정해 치료 효과를 편향 없이 평가하는 가장 신뢰도 높은 연구 방법입니다. 코호트 연구는 특정 집단을 장기간 추적해 위험요인과 질병 발생의 관계를 분석합니다.",university:"교란변수(confounder)는 노출과 결과 모두에 영향을 미쳐 인과관계를 왜곡할 수 있는 제3의 변수로, 무작위 배정이나 통계적 보정으로 통제합니다. 근거 수준 피라미드에서 체계적 문헌고찰과 메타분석은 개별 RCT보다도 더 높은 수준의 근거로 평가됩니다."},deepDive:["한두 건의 성공 사례(일화적 증거)는 우연이나 다른 요인의 영향일 수 있어 치료법의 효과를 증명하는 충분한 근거가 되지 못합니다. 신뢰할 수 있는 결론을 위해서는 충분한 표본 크기와 대조군을 갖춘 체계적인 임상시험이 필요합니다.","두 변수가 함께 변하는 상관관계가 관찰되었다고 해서 하나가 다른 하나의 원인이라고 단정할 수 없습니다. 교란변수가 둘 다에 영향을 미치는 경우가 흔하며, 인과관계를 확인하려면 무작위 대조시험 같은 엄격한 연구 설계가 필요합니다."],examples:["신약 승인 전에는 대규모 무작위 대조시험을 거쳐야 한다","흡연과 폐암의 인과관계는 다수의 코호트 연구로 뒷받침됨","아이스크림 판매량과 익사 사고는 상관관계가 있지만 원인은 여름철 더위(교란변수)"],observationActivity:{title:"가상의 임상시험 설계해보기",description:"새로운 가상의 건강보조제 효과를 검증하기 위한 임상시험을 직접 설계해봅니다.",prediction:"무작위 배정과 대조군이 있는 설계가 더 신뢰할 수 있는 결과를 줄 것이다",materials:["설계 워크시트","필기도구"],steps:["1. 검증하고 싶은 가상의 가설을 세웁니다(예: 특정 보조제가 수면의 질을 개선한다)","2. 실험군과 대조군을 어떻게 나눌지 설계합니다","3. 무작위 배정과 맹검법을 어떻게 적용할지 계획합니다","4. 교란변수를 어떻게 통제할지 논의하고 정리합니다"],safetyWarning:"해당 없음(연구 설계 활동)"},questions:["master-med-03-q01","master-med-03-q02","master-med-03-q03","master-med-03-q04","master-med-03-q05","master-med-03-q06"]}],Py=[{id:"phd-phys-01",subject:"physics",grade:19,level:"research",unit:"장 이론",title:"양자장론의 기초",summary:"양자역학과 장론을 결합하여 상대론적 입자 이론을 구성한다.",keywords:["양자장론","라그랑주","게이지 대칭","재규격화"],misconceptions:["입자는 실체이고 장은 추상적이다","진공은 텅 비어있다"],explanation:{basic:"양자장론은 공간의 각 점에서 장이 진동하며, 그 양자는 입자입니다. 입자 생성과 소멸, 상호작용을 자연스럽게 기술합니다.",curriculum:"Real scalar field φ(x): L = ½(∂_μφ)² - ½m²φ². 정규 양자화(canonical quantization). 교환 관계 [φ(x), π(y)] = iδ(x-y). 입자 해석: 생성/소멸 연산자 a†, a.",university:"경로 적분(path integral) 정식화. Green 함수와 propagator. Feynman 다이어그램. 상호작용 그림(interaction picture). Dyson 급수. 1-loop, 2-loop 계산. Dimensional regularization과 재규격화."},examples:["λφ⁴ 상호작용의 산란 단면적 계산","전자-광자 상호작용 (QED)","표준 모형의 약한 상호작용 (W, Z 보손)"],observationActivity:{title:"Feynman 다이어그램 분석과 계산",description:"구체적인 산란 과정의 Feynman 다이어그램을 그리고 진폭을 계산합니다.",prediction:"루프 적분의 발산이 counterterm으로 상쇄될 것이다",materials:["논문","수치 계산 소프트웨어"],steps:["1. 2→2 산란의 tree-level 다이어그램 확인","2. 1-loop 보정 다이어그램 분류","3. 발산하는 항 확인","4. 재규격화 과정 수행"],safetyWarning:"계산의 정확성과 물리적 의미 검토 중요"},questions:["phd-phys-01-q01","phd-phys-01-q02","phd-phys-01-q03","phd-phys-01-q04","phd-phys-01-q05","phd-phys-01-q06"]},{id:"phd-phys-02",subject:"physics",grade:20,level:"research",unit:"끈이론",title:"끈이론 개론: 통일이론을 향한 시도",summary:"끈이론은 입자를 점이 아닌 진동하는 끈으로 모델링해 중력을 포함한 모든 힘을 통일하려는 이론적 시도이다.",keywords:["끈이론","초대칭","여분차원","M이론","양자중력"],misconceptions:["끈이론은 이미 실험적으로 완전히 검증된 이론이다","끈이론은 오직 하나의 유일한 버전만 존재한다"],explanation:{basic:'끈이론은 전자나 쿼크 같은 기본 입자들이 사실은 아주 작은 "끈"이 진동하는 다른 방식이라고 제안하는 이론입니다.',curriculum:"끈의 서로 다른 진동 모드가 서로 다른 입자(전자, 광자, 중력자 등)로 나타납니다. 일관성 있는 끈이론은 보통 10차원(또는 M이론의 11차원) 시공간을 요구하며, 여분의 차원은 매우 작게 말려있다고(compactification) 가정됩니다.",university:"초끈이론은 초대칭을 도입해 페르미온과 보손을 통합하며, 다섯 가지 서로 다른 초끈이론(Type I, IIA, IIB, 두 가지 heterotic)이 존재하다가 이들이 모두 M이론의 서로 다른 극한으로 통합될 수 있음이 듀얼리티를 통해 밝혀졌습니다."},deepDive:["끈이론은 매우 정교하고 수학적으로 아름다운 이론이지만, 현재까지 직접적인 실험적 검증은 이루어지지 않았습니다. 예측하는 에너지 규모(플랑크 규모)가 현재 가속기로 도달할 수 있는 범위를 훨씬 넘어서기 때문입니다.","끈이론은 하나의 이론이 아니라 초기에는 다섯 가지 서로 다른 버전이 있었습니다. 이후 이들이 모두 더 근본적인 M이론의 서로 다른 극한(듀얼리티 관계)으로 연결되어 있다는 것이 밝혀졌지만, M이론 자체의 완전한 정식화는 아직 미완성입니다."],examples:["끈의 가장 낮은 진동 모드 중 하나가 중력자(graviton)에 대응한다고 예측됨","AdS/CFT 대응성은 끈이론과 양자장론을 연결하는 중요한 도구","여분차원의 콤팩트화 방식(칼라비-야우 다양체)에 따라 다른 물리 법칙이 예측됨"],observationActivity:{title:"끈이론의 검증 가능성에 대한 문헌 조사와 토론",description:"끈이론의 실험적 검증 시도(초대칭 입자 탐색 등)에 대한 최신 자료를 조사하고 토론합니다.",prediction:"현재까지 초대칭 입자나 여분차원의 직접적 증거는 발견되지 않았을 것이다",materials:["최신 입자물리 실험 자료(LHC 등)","토론 노트"],steps:["1. LHC 등에서의 초대칭 입자 탐색 결과를 조사합니다","2. 끈이론이 예측하는 관측 가능한 효과들을 정리합니다","3. 현재 검증의 한계와 향후 가능성을 논의합니다","4. 대안 이론(고리양자중력 등)과 비교해봅니다"],safetyWarning:"해당 없음(문헌 조사 및 토론 활동)"},questions:["phd-phys-02-q01","phd-phys-02-q02","phd-phys-02-q03","phd-phys-02-q04","phd-phys-02-q05","phd-phys-02-q06"]},{id:"phd-phys-03",subject:"physics",grade:19,level:"research",unit:"응집물질물리학",title:"응집물질물리학 개론: 위상적 물질상",summary:"물질의 위상적 성질에 따라 나타나는 새로운 상(위상절연체 등)은 전통적인 상전이 이론을 넘어서는 물리를 보여준다.",keywords:["위상절연체","양자홀효과","베리 위상","대칭성 깨짐","위상불변량"],misconceptions:["모든 상전이는 대칭성 깨짐으로만 설명된다","위상절연체의 표면은 일반 도체 표면과 다르지 않다"],explanation:{basic:"어떤 물질은 내부는 전기가 안 통하는 절연체이지만 표면(가장자리)에서는 전기가 아주 잘 통하는 특이한 성질을 가집니다. 이런 물질을 위상절연체라고 합니다.",curriculum:"전통적인 상전이(예: 물-얼음)는 대칭성이 깨지는 것으로 설명되지만, 양자홀효과나 위상절연체 같은 위상적 상은 대칭성이 아니라 파동함수의 위상적 성질(위상불변량)로 구분됩니다.",university:"위상불변량(천 수, ℤ₂ 불변량 등)은 연속적인 변형에도 바뀌지 않는 양으로, 서로 다른 위상불변량을 가진 물질 사이의 경계에는 반드시 갭이 없는 표면(또는 경계) 상태가 존재해야 합니다(벌크-경계 대응). 이는 베리 위상과 밴드구조의 위상수학적 분류에 기반합니다."},deepDive:["란다우의 전통적 상전이 이론은 대칭성 깨짐(예: 액체에서 결정으로 변할 때 병진대칭이 깨짐)으로 상을 분류했지만, 위상적 상은 대칭성의 변화 없이도 위상불변량이라는 전혀 다른 방식으로 구분되는 새로운 부류의 물질 상입니다.",'위상절연체의 표면 상태는 일반적인 금속 표면과 근본적으로 다릅니다. 이 표면 상태는 불순물이나 결함에 의해 쉽게 파괴되지 않는 "위상적으로 보호된" 성질을 가지고 있어, 스핀트로닉스나 양자컴퓨팅 응용에 큰 관심을 받고 있습니다.'],examples:["양자홀효과에서 홀전도도는 매우 정밀하게 양자화된 값만 갖는다","위상절연체(Bi2Se3 등)의 표면 전자는 스핀-운동량 결합을 가진다","위상적으로 보호된 표면 상태는 불순물에 강건하다"],observationActivity:{title:"위상불변량 개념을 고무줄 매듭으로 시각화하기",description:"고무줄이나 끈의 매듭 상태(연속 변형으로 풀 수 있는지)로 위상불변량의 개념을 체험합니다.",prediction:"매듭이 있는 고리와 없는 고리는 자르지 않고서는 서로 변형할 수 없을 것이다",materials:["긴 끈 또는 고무줄 여러 개"],steps:["1. 매듭이 없는 고리를 만듭니다","2. 매듭이 있는 고리를 만듭니다(예: 삼엽매듭)","3. 자르지 않고 두 고리를 서로 변형할 수 있는지 시도합니다",'4. 매듭의 유무가 "연속 변형에 불변인 성질"이라는 것을 위상불변량 개념과 연결짓습니다'],safetyWarning:"해당 없음(간단한 조작 활동)"},questions:["phd-phys-03-q01","phd-phys-03-q02","phd-phys-03-q03","phd-phys-03-q04","phd-phys-03-q05","phd-phys-03-q06"]},{id:"phd-chem-01",subject:"chemistry",grade:20,level:"research",unit:"양자화학",title:"양자화학: 분자 오비탈 이론",summary:"분자 오비탈 이론은 슈뢰딩거 방정식을 이용해 분자 내 전자의 분포와 화학결합을 정량적으로 기술한다.",keywords:["분자오비탈","LCAO","결합성·반결합성 오비탈","Hartree-Fock","밀도범함수이론"],misconceptions:["모든 화학결합은 두 원자 사이에 전자가 고정되어 존재하는 단순한 선으로 설명된다","계산화학은 실험 없이는 전혀 신뢰할 수 없다"],explanation:{basic:"분자 오비탈 이론은 전자가 특정 두 원자 사이에만 있는 것이 아니라 분자 전체에 걸쳐 퍼져있는 파동함수로 존재한다고 봅니다.",curriculum:"원자오비탈의 선형결합(LCAO)으로 분자오비탈을 근사하며, 결합성 오비탈(에너지가 낮아짐)과 반결합성 오비탈(에너지가 높아짐)이 형성됩니다. 분자오비탈 이론은 상자성(홀전자 존재) 같은 원자가결합 이론으로 설명하기 어려운 현상을 잘 설명합니다.",university:"Hartree-Fock 방법은 전자 간 상호작용을 평균장 근사로 다루며, 이후 전자상관을 포함하는 후Hartree-Fock 방법(MP2, CCSD 등)이나 밀도범함수이론(DFT)으로 정확도를 높입니다. 이러한 양자화학 계산은 신약 개발, 촉매 설계 등에 실제로 활용됩니다."},deepDive:["화학결합은 단순히 두 원자 사이에 전자가 고정된 막대로 표현되기보다, 분자 전체에 걸쳐 퍼진 확률적 파동함수(분자오비탈)로 더 정확하게 기술됩니다. 이 관점은 산소 분자(O₂)가 상자성을 띠는 이유처럼 단순한 원자가결합 이론으로 설명하기 어려운 현상을 잘 설명합니다.","계산화학은 실험을 대체하는 것이 아니라 보완하는 도구입니다. 정확도가 검증된 계산 방법(DFT, 고급 후Hartree-Fock 방법 등)은 실험이 어렵거나 비용이 큰 경우에 유용한 예측을 제공하며, 실험 결과와의 지속적인 비교·검증을 통해 신뢰도를 높여갑니다."],examples:["산소 분자(O₂)의 상자성은 분자오비탈 이론으로만 정확히 설명됨","DFT 계산으로 신약 후보물질의 결합 에너지를 미리 예측","촉매 표면에서의 반응 경로를 양자화학 계산으로 탐색"],observationActivity:{title:"간단한 분자의 분자오비탈 다이어그램 그려보기",description:"H₂, O₂ 등 간단한 이원자 분자의 분자오비탈 에너지 준위 다이어그램을 그리고 결합차수를 계산합니다.",prediction:"O₂는 반결합성 오비탈에 홀전자를 가져 상자성을 띨 것이다",materials:["분자오비탈 에너지 준위 참고자료","노트"],steps:["1. H₂의 분자오비탈 다이어그램을 그리고 결합차수를 계산합니다","2. O₂의 분자오비탈 다이어그램을 그립니다","3. 반결합성 오비탈에 있는 홀전자 수를 확인합니다","4. 결합차수와 자기적 성질(상자성/반자성)을 예측하고 실제 값과 비교합니다"],safetyWarning:"해당 없음(이론 활동)"},questions:["phd-chem-01-q01","phd-chem-01-q02","phd-chem-01-q03","phd-chem-01-q04","phd-chem-01-q05","phd-chem-01-q06"]},{id:"phd-chem-02",subject:"chemistry",grade:19,level:"research",unit:"촉매화학",title:"촉매화학: 반응 경로의 설계",summary:"촉매는 반응 메커니즘을 바꾸어 더 낮은 활성화에너지의 경로를 제공함으로써 원하는 생성물을 효율적으로 얻게 한다.",keywords:["불균일 촉매","균일 촉매","효소 촉매","전이상태","선택성"],misconceptions:["촉매는 반응에 소모되어 없어진다","더 강한 촉매일수록 항상 더 좋다"],explanation:{basic:"촉매는 반응이 더 쉬운 길로 갈 수 있도록 도와주는 물질로, 반응이 끝난 후에도 그대로 남아있습니다.",curriculum:"균일 촉매는 반응물과 같은 상(예: 용액)에 있고, 불균일 촉매는 다른 상(예: 고체 표면)에 존재합니다. 효소는 매우 높은 선택성과 효율을 가진 생체 촉매입니다. 촉매는 반응의 활성화에너지를 낮추지만 평형 자체는 바꾸지 않습니다.",university:"촉매 설계는 전이상태 이론에 기반해 전이상태의 에너지를 안정화하는 방향으로 이루어집니다. 산업 촉매는 활성뿐 아니라 선택성(원하는 생성물만 만드는 능력)과 안정성(재사용 가능 여부)이 함께 최적화되어야 하며, 전산화학을 이용한 촉매 스크리닝이 활발히 연구됩니다."},deepDive:["촉매는 반응 과정에 참여하지만 반응이 끝나면 원래 형태로 돌아와 소모되지 않습니다. 이 때문에 적은 양의 촉매로도 지속적으로 많은 반응물을 생성물로 바꿀 수 있습니다.",'단순히 "강한" 촉매(활성이 매우 높은 촉매)가 항상 좋은 것은 아닙니다. 원하지 않는 부반응까지 촉진하면 선택성이 떨어져 순도 낮은 생성물이 만들어질 수 있으므로, 활성과 선택성의 균형이 촉매 설계에서 매우 중요합니다.'],examples:["자동차 촉매 변환기의 백금 촉매는 배기가스를 무해한 물질로 전환","하버-보슈법의 철 촉매는 질소와 수소로부터 암모니아 합성을 돕는다","효소는 상온·상압에서도 매우 높은 반응 속도와 선택성을 보인다"],observationActivity:{title:"감자(카탈레이스)를 이용한 효소 촉매 실험",description:"감자 속 효소(카탈레이스)가 과산화수소 분해를 촉진하는 것을 관찰하고 촉매의 재사용성을 확인합니다.",prediction:"감자즙을 넣으면 과산화수소가 빠르게 분해되어 기포(산소)가 많이 발생할 것이다",materials:["과산화수소수","감자(또는 간 감자즙)","시험관"],steps:["1. 과산화수소수만 담은 시험관의 반응을 관찰합니다","2. 간 감자즙을 추가한 시험관의 반응 속도를 비교합니다","3. 기포 발생량과 속도를 기록합니다","4. 효소 촉매의 작용과 재사용 가능성을 논의합니다"],safetyWarning:"과산화수소수는 피부에 자극적이므로 장갑을 착용하세요"},questions:["phd-chem-02-q01","phd-chem-02-q02","phd-chem-02-q03","phd-chem-02-q04","phd-chem-02-q05","phd-chem-02-q06"]},{id:"phd-chem-03",subject:"chemistry",grade:20,level:"research",unit:"초분자화학",title:"초분자화학: 분자의 자기조립",summary:"초분자화학은 공유결합이 아닌 약한 비공유 상호작용으로 분자들이 스스로 정교한 구조를 만드는 현상을 연구한다.",keywords:["비공유 상호작용","자기조립","분자인식","수소결합","호스트-게스트 화학"],misconceptions:["분자 사이의 약한 결합은 화학적으로 중요하지 않다","자기조립은 무작위 과정이라 예측할 수 없다"],explanation:{basic:"분자들은 강한 공유결합 없이도 수소결합이나 반데르발스 힘 같은 약한 힘으로 서로 끌어당겨 스스로 정교한 구조를 만들 수 있습니다.",curriculum:"초분자화학은 수소결합, 반데르발스 힘, π-π 상호작용, 소수성 상호작용 등 비공유 상호작용을 이용해 호스트-게스트 착물이나 자기조립 구조를 설계합니다. DNA 이중나선도 수소결합에 기반한 대표적인 초분자 구조입니다.",university:"분자인식은 상보적인 형태와 상호작용 부위를 가진 분자들이 선택적으로 결합하는 현상으로, 이를 이용해 분자기계, 약물전달체, 자기조립 나노구조 등이 설계됩니다. 자기조립 과정은 열역학적으로 가장 안정한 구조로 자발적으로 수렴하는 특성을 가져, 정교한 설계를 통해 원하는 구조를 예측하고 유도할 수 있습니다."},deepDive:["개별 비공유 상호작용은 공유결합보다 훨씬 약하지만, 여러 개가 동시에 협력적으로 작용하면 매우 안정적이고 정교한 구조를 만들 수 있습니다. DNA 이중나선의 안정성은 수많은 수소결합과 염기쌓임 상호작용이 함께 작용한 결과입니다.","자기조립은 무작위가 아니라 열역학적으로 가장 안정한 구조를 향해 자발적으로 진행되는 과정입니다. 분자의 구조를 정교하게 설계하면 원하는 최종 자기조립 구조를 상당히 예측 가능하게 유도할 수 있습니다."],examples:["DNA 이중나선은 수소결합에 기반한 자기조립 구조","크라운 에테르는 특정 크기의 이온만 선택적으로 포획하는 호스트 분자","바이러스 캡시드 단백질은 스스로 조립되어 정교한 껍질 구조를 형성"],observationActivity:{title:"자석 구슬로 자기조립 시뮬레이션",description:"자석이 붙어있는 구슬들을 흔들어 스스로 특정 패턴으로 조립되는 과정을 관찰합니다.",prediction:"자석 구슬들은 흔들리면서 에너지가 가장 낮은 안정적인 배열로 스스로 모일 것이다",materials:["자석 구슬(네오디뮴 자석 구슬 세트)","평평한 쟁반"],steps:["1. 자석 구슬들을 쟁반에 무작위로 흩어놓습니다","2. 쟁반을 가볍게 흔들어 구슬들이 움직이게 합니다","3. 구슬들이 어떤 패턴으로 스스로 모이는지 관찰합니다","4. 이 과정을 분자의 자기조립 현상과 비교해 설명합니다"],safetyWarning:"작은 자석 구슬을 삼키지 않도록 주의하고 어린이 손이 닿지 않게 보관하세요"},questions:["phd-chem-03-q01","phd-chem-03-q02","phd-chem-03-q03","phd-chem-03-q04","phd-chem-03-q05","phd-chem-03-q06"]},{id:"phd-math-01",subject:"math",grade:19,level:"research",unit:"미분기하학",title:"미분기하학: 곡률과 휘어진 공간",summary:"미분기하학은 곡면이나 다양체의 휘어진 정도(곡률)를 미적분을 이용해 정밀하게 다루는 분야이다.",keywords:["곡률","리만 다양체","측지선","가우스 곡률","리치 곡률"],misconceptions:["곡률은 우리가 3차원 공간 밖에서 봐야만 알 수 있다","평평해 보이는 표면은 곡률이 항상 0이다"],explanation:{basic:"곡률은 어떤 공간이 얼마나 휘어져 있는지를 나타내는 수치입니다. 놀랍게도 그 공간 안에 살면서도(밖에서 보지 않고도) 곡률을 계산할 수 있습니다.",curriculum:"가우스 곡률은 표면이 내재적으로(embedding 없이) 가지는 곡률로, 가우스의 놀라운 정리(Theorema Egregium)에 따르면 이는 표면을 구부리거나 늘이지 않는 한 보존되는 양입니다. 구면은 양의 곡률, 평면은 0, 쌍곡면은 음의 곡률을 가집니다.",university:"리만 다양체는 각 점에서 정의된 계량 텐서를 통해 거리와 각도, 곡률을 일반화한 공간입니다. 리치 곡률과 스칼라 곡률은 아인슈타인의 일반상대성이론에서 시공간의 곡률과 물질-에너지 분포를 연결하는 아인슈타인 방정식의 핵심 요소입니다."},deepDive:['가우스의 놀라운 정리(Theorema Egregium)에 따르면 곡률은 표면을 3차원 공간 밖에서 내려다보지 않고도, 그 표면 위에서 직접 측정한 거리 정보만으로 계산할 수 있는 "내재적" 성질입니다.',"평평해 보이는 표면이라도 항상 곡률이 0인 것은 아닙니다. 예를 들어 원기둥은 겉보기에 휘어져 보이지만 실제로는 가우스 곡률이 0(펼치면 평면이 됨)이며, 반대로 안장 모양의 표면은 평평해 보일 수 있지만 음의 곡률을 가집니다."],examples:["지구본(구면)의 위도-경도선은 평면 지도로 완벽히 펼칠 수 없다(양의 곡률)","말안장 모양의 표면은 음의 곡률을 가진다","일반상대성이론에서 태양 주변 시공간의 곡률이 빛을 휘게 한다"],observationActivity:{title:"구면 위 삼각형의 내각의 합 확인하기",description:"지구본 위에 그린 삼각형의 내각의 합이 180도를 넘는 것을 확인해 양의 곡률을 체감합니다.",prediction:"구면 위 삼각형의 내각의 합은 평면 삼각형(180도)보다 클 것이다",materials:["지구본 또는 공","실 또는 마커","각도기"],steps:["1. 지구본 위에 북극점과 적도 위 두 점을 이어 큰 삼각형을 그립니다","2. 세 꼭짓점의 내각을 최대한 정확히 측정합니다","3. 세 내각의 합을 계산합니다","4. 180도를 초과하는 정도(구면과잉)와 곡률의 관계를 설명합니다"],safetyWarning:"해당 없음(측정 활동)"},questions:["phd-math-01-q01","phd-math-01-q02","phd-math-01-q03","phd-math-01-q04","phd-math-01-q05","phd-math-01-q06"]},{id:"phd-math-02",subject:"math",grade:20,level:"research",unit:"확률과정론",title:"확률과정론: 무작위성의 수학",summary:"확률과정은 시간에 따라 확률적으로 변화하는 현상을 수학적으로 모델링하는 이론이다.",keywords:["마르코프 연쇄","브라운 운동","확률미분방정식","정상상태","확률과정"],misconceptions:["무작위 현상은 수학적으로 정밀하게 다룰 수 없다","마르코프 성질은 과거 전체를 기억하지 않는다는 뜻이 아니라 아무것도 기억하지 않는다는 뜻이다"],explanation:{basic:"주가 변동이나 꽃가루의 무작위한 움직임처럼 예측하기 어려운 현상도, 확률의 언어로 정교하게 모델링할 수 있습니다.",curriculum:"마르코프 연쇄는 다음 상태가 오직 현재 상태에만 의존하고 그 이전 과거에는 의존하지 않는(마르코프 성질) 확률과정입니다. 브라운 운동은 액체 속 입자의 무작위한 움직임을 모델링하는 대표적인 연속시간 확률과정입니다.",university:"확률미분방정식(SDE)은 dXt=μ(Xt,t)dt+σ(Xt,t)dWt 형태로 결정론적 변화(드리프트)와 확률적 변동(확산)을 함께 기술하며, 이토 적분을 이용해 엄밀하게 정의됩니다. 이는 금융공학(옵션 가격결정), 통계물리학, 신경과학 등 광범위한 분야에 응용됩니다."},deepDive:["무작위 현상이라고 해서 수학적으로 다룰 수 없는 것이 아닙니다. 확률과정론은 개별 결과는 예측할 수 없어도, 확률분포나 평균적 거동, 장기적 패턴은 매우 정밀하게 예측하고 분석할 수 있는 강력한 수학적 도구를 제공합니다.",'마르코프 성질은 "아무것도 기억하지 않는다"는 뜻이 아니라 "현재 상태 하나만 알면 과거 전체 이력은 더 이상 필요 없다"는 뜻입니다. 현재 상태 자체는 과거의 영향을 이미 압축해서 담고 있습니다.'],examples:["주가의 무작위 행보(random walk)는 브라운 운동으로 근사되곤 한다","블랙-숄즈 옵션가격 모형은 확률미분방정식에 기반한다","보드게임에서 다음 칸의 확률이 현재 위치에만 의존하는 마르코프 연쇄"],observationActivity:{title:"동전 던지기로 랜덤워크 시뮬레이션하기",description:"동전을 여러 번 던져 앞뒤 결과에 따라 위치를 옮기는 랜덤워크를 직접 만들어봅니다.",prediction:"충분히 많이 반복하면 이동 경로가 브라운 운동과 비슷한 무작위한 패턴을 보일 것이다",materials:["동전","모눈종이","연필"],steps:["1. 시작 위치를 모눈종이 중앙에 표시합니다","2. 동전을 던져 앞면이면 오른쪽, 뒷면이면 왼쪽으로 한 칸 이동합니다","3. 이 과정을 30회 이상 반복하며 경로를 그립니다","4. 여러 번 반복한 경로들을 비교해 랜덤워크의 특징을 정리합니다"],safetyWarning:"해당 없음(시뮬레이션 활동)"},questions:["phd-math-02-q01","phd-math-02-q02","phd-math-02-q03","phd-math-02-q04","phd-math-02-q05","phd-math-02-q06"]},{id:"phd-math-03",subject:"math",grade:19,level:"research",unit:"대수적 위상수
