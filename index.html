진 물질 사이의 경계에는 반드시 갭이 없는 상태가 존재해야 한다",explanation:"벌크-경계 대응은 위상불변량이 다른 두 물질의 경계에서 갭이 없는 도체 상태가 나타남을 설명합니다.",difficulty:"hard"},{id:"phd-chem-01-q01",type:"short_answer",question:"원자오비탈의 선형결합으로 분자오비탈을 근사하는 방법의 약자는?",options:[],answer:"LCAO",explanation:"LCAO(Linear Combination of Atomic Orbitals)는 분자오비탈을 원자오비탈의 선형결합으로 근사하는 방법입니다.",difficulty:"medium"},{id:"phd-chem-01-q02",type:"multiple_choice",question:"산소 분자(O₂)가 상자성을 띠는 현상을 잘 설명하는 이론은?",options:["분자오비탈 이론","원자가결합 이론만","옥텟 규칙만","이온결합 이론"],answer:"분자오비탈 이론",explanation:"분자오비탈 이론은 O₂의 반결합성 오비탈에 있는 홀전자로 상자성을 정확히 설명합니다.",difficulty:"hard"},{id:"phd-chem-01-q03",type:"short_answer",question:'"화학결합은 두 원자 사이에 전자가 고정된 단순한 선으로 설명된다"는 생각의 한계는?',options:[],answer:"분자오비탈 관점에서는 전자가 분자 전체에 퍼진 확률적 파동함수로 더 정확히 기술되기 때문",explanation:"단순한 결합선 표현으로는 O₂의 상자성 같은 현상을 설명하기 어렵습니다.",difficulty:"hard"},{id:"phd-chem-01-q04",type:"multiple_choice",question:"전자 간 상호작용을 평균장 근사로 다루는 계산화학 방법은?",options:["Hartree-Fock 방법","뉴턴 역학","고전열역학","통계역학만"],answer:"Hartree-Fock 방법",explanation:"Hartree-Fock 방법은 전자 간 상호작용을 평균장으로 근사하는 대표적인 계산화학 방법입니다.",difficulty:"hard"},{id:"phd-chem-01-q05",type:"short_answer",question:"Hartree-Fock 이후 전자상관을 포함해 정확도를 높이는 방법의 예를 하나 쓰시오.",options:[],answer:"MP2 또는 CCSD (또는 밀도범함수이론 DFT)",explanation:"후Hartree-Fock 방법(MP2, CCSD 등)이나 DFT는 전자상관을 포함해 계산 정확도를 높입니다.",difficulty:"hard"},{id:"phd-chem-01-q06",type:"multiple_choice",question:'"계산화학은 실험 없이는 전혀 신뢰할 수 없다"는 생각에 대한 올바른 평가는?',options:["계산화학은 실험을 대체하는 것이 아니라 보완하며, 검증된 방법은 유용한 예측을 제공한다","계산화학은 실험과 완전히 무관하게 절대적으로 정확하다","계산화학은 실험 결과와 항상 일치하지 않아 쓸모없다","계산화학은 화학 연구에 전혀 사용되지 않는다"],answer:"계산화학은 실험을 대체하는 것이 아니라 보완하며, 검증된 방법은 유용한 예측을 제공한다",explanation:"계산화학은 실험과 지속적으로 비교·검증되며 신약 개발, 촉매 설계 등에 실질적으로 활용됩니다.",difficulty:"hard"},{id:"phd-chem-02-q01",type:"short_answer",question:"반응물과 같은 상에 존재하는 촉매를 무엇이라 하는가?",options:[],answer:"균일 촉매",explanation:"균일 촉매는 반응물과 같은 상(예: 용액)에 존재하는 촉매입니다.",difficulty:"medium"},{id:"phd-chem-02-q02",type:"multiple_choice",question:'"촉매는 반응에 소모되어 없어진다"는 생각이 틀린 이유는?',options:["촉매는 반응 후 원래 형태로 돌아와 소모되지 않기 때문","촉매는 항상 완전히 소모되기 때문","촉매는 반응에 전혀 참여하지 않기 때문","촉매는 한 번만 사용할 수 있기 때문"],answer:"촉매는 반응 후 원래 형태로 돌아와 소모되지 않기 때문",explanation:"촉매는 반응 과정에 참여하지만 끝나면 원래 형태로 돌아와 반복적으로 사용될 수 있습니다.",difficulty:"medium"},{id:"phd-chem-02-q03",type:"short_answer",question:"촉매 설계가 이론적으로 기반하는 것은?",options:[],answer:"전이상태 이론(전이상태 에너지를 안정화)",explanation:"촉매는 전이상태의 에너지를 낮춰 반응이 더 쉬운 경로로 가도록 설계됩니다.",difficulty:"hard"},{id:"phd-chem-02-q04",type:"multiple_choice",question:'"더 강한 촉매일수록 항상 더 좋다"는 생각이 틀린 이유는?',options:["원하지 않는 부반응까지 촉진해 선택성이 떨어질 수 있기 때문","강한 촉매는 항상 완벽한 선택성을 보장하기 때문","촉매의 활성은 선택성과 무관하기 때문","촉매는 활성이 강할수록 항상 안전하기 때문"],answer:"원하지 않는 부반응까지 촉진해 선택성이 떨어질 수 있기 때문",explanation:"활성과 선택성의 균형이 촉매 설계에서 매우 중요합니다.",difficulty:"hard"},{id:"phd-chem-02-q05",type:"short_answer",question:"하버-보슈법에서 암모니아 합성을 돕는 촉매는?",options:[],answer:"철 촉매",explanation:"하버-보슈법은 철 촉매를 이용해 질소와 수소로부터 암모니아를 합성합니다.",difficulty:"medium"},{id:"phd-chem-02-q06",type:"multiple_choice",question:"효소가 산업 촉매와 비교했을 때 가지는 특징은?",options:["상온·상압에서도 매우 높은 반응 속도와 선택성을 보인다","항상 매우 높은 온도에서만 작동한다","선택성이 전혀 없다","반응 속도를 오히려 늦춘다"],answer:"상온·상압에서도 매우 높은 반응 속도와 선택성을 보인다",explanation:"효소는 생체 조건(상온·상압)에서도 매우 효율적이고 선택적인 촉매 작용을 합니다.",difficulty:"medium"},{id:"phd-chem-03-q01",type:"short_answer",question:"초분자화학이 다루는 결합의 종류는?",options:[],answer:"비공유 상호작용(수소결합, 반데르발스 힘 등)",explanation:"초분자화학은 공유결합이 아닌 약한 비공유 상호작용을 이용한 분자 조립을 연구합니다.",difficulty:"medium"},{id:"phd-chem-03-q02",type:"multiple_choice",question:'"분자 사이의 약한 결합은 화학적으로 중요하지 않다"는 생각이 틀린 이유는?',options:["여러 개가 협력적으로 작용하면 매우 안정적이고 정교한 구조를 만들 수 있기 때문","약한 결합은 실제로 아무 역할도 하지 않기 때문","공유결합만이 화학적으로 의미가 있기 때문","약한 결합은 항상 무시할 수 있는 크기이기 때문"],answer:"여러 개가 협력적으로 작용하면 매우 안정적이고 정교한 구조를 만들 수 있기 때문",explanation:"DNA 이중나선의 안정성처럼 수많은 약한 상호작용이 협력해 매우 안정적인 구조를 만듭니다.",difficulty:"hard"},{id:"phd-chem-03-q03",type:"short_answer",question:"특정 크기의 이온만 선택적으로 포획하는 호스트 분자의 예는?",options:[],answer:"크라운 에테르",explanation:"크라운 에테르는 특정 크기의 이온과 선택적으로 결합하는 대표적인 호스트 분자입니다.",difficulty:"medium"},{id:"phd-chem-03-q04",type:"multiple_choice",question:'"자기조립은 무작위 과정이라 예측할 수 없다"는 생각이 틀린 이유는?',options:["자기조립은 열역학적으로 가장 안정한 구조를 향해 자발적으로 진행되기 때문","자기조립은 실제로 완전히 무작위이기 때문","자기조립은 예측이 불가능한 카오스 현상이기 때문","분자 설계는 자기조립 결과와 무관하기 때문"],answer:"자기조립은 열역학적으로 가장 안정한 구조를 향해 자발적으로 진행되기 때문",explanation:"분자 구조를 정교하게 설계하면 원하는 자기조립 결과를 상당히 예측 가능하게 유도할 수 있습니다.",difficulty:"hard"},{id:"phd-chem-03-q05",type:"short_answer",question:"DNA 이중나선의 안정성에 기여하는 초분자적 상호작용을 2가지 쓰시오.",options:[],answer:"수소결합과 염기쌓임 상호작용",explanation:"DNA 이중나선은 염기쌍 사이의 수소결합과 염기들 사이의 쌓임 상호작용으로 안정화됩니다.",difficulty:"hard"},{id:"phd-chem-03-q06",type:"multiple_choice",question:"분자인식이 활용되는 응용 분야가 아닌 것은?",options:["일반 연소 엔진 설계","분자기계","약물전달체","자기조립 나노구조"],answer:"일반 연소 엔진 설계",explanation:"분자인식은 분자기계, 약물전달체, 자기조립 나노구조 설계 등에 활용되며 연소 엔진과는 직접적 관련이 적습니다.",difficulty:"medium"},{id:"phd-math-01-q01",type:"short_answer",question:"표면이 내재적으로 가지는 곡률로, 표면을 구부려도 보존되는 양은?",options:[],answer:"가우스 곡률",explanation:"가우스의 놀라운 정리에 따르면 가우스 곡률은 표면을 구부리거나 늘이지 않는 한 보존됩니다.",difficulty:"medium"},{id:"phd-math-01-q02",type:"multiple_choice",question:'"곡률은 우리가 3차원 공간 밖에서 봐야만 알 수 있다"는 생각이 틀린 이유는?',options:["가우스의 놀라운 정리에 따르면 곡률은 표면 위에서 직접 측정한 정보만으로 계산할 수 있기 때문","곡률은 항상 외부에서만 관측 가능하기 때문","곡률은 실제로 계산할 수 없는 양이기 때문","곡률은 3차원 공간과 무관한 개념이기 때문"],answer:"가우스의 놀라운 정리에 따르면 곡률은 표면 위에서 직접 측정한 정보만으로 계산할 수 있기 때문",explanation:"곡률은 표면 내에서 직접 측정한 거리 정보만으로 계산 가능한 내재적 성질입니다.",difficulty:"hard"},{id:"phd-math-01-q03",type:"short_answer",question:"구면의 가우스 곡률의 부호는?",options:[],answer:"양수(양의 곡률)",explanation:"구면은 양의 곡률을, 평면은 0, 쌍곡면은 음의 곡률을 가집니다.",difficulty:"medium"},{id:"phd-math-01-q04",type:"multiple_choice",question:'"평평해 보이는 표면은 곡률이 항상 0이다"는 생각이 틀린 이유는?',options:["안장 모양의 표면처럼 평평해 보여도 음의 곡률을 가질 수 있기 때문","모든 평평한 표면은 곡률이 항상 0이기 때문","곡률은 겉모습만으로 결정되기 때문","곡률은 표면의 색깔에 의해 결정되기 때문"],answer:"안장 모양의 표면처럼 평평해 보여도 음의 곡률을 가질 수 있기 때문",explanation:"겉보기와 실제 곡률은 다를 수 있어, 정확한 계산이 필요합니다.",difficulty:"hard"},{id:"phd-math-01-q05",type:"short_answer",question:"리치 곡률과 스칼라 곡률이 핵심적으로 사용되는 물리 이론은?",options:[],answer:"일반상대성이론",explanation:"아인슈타인 방정식은 리치 곡률과 스칼라 곡률을 이용해 시공간의 곡률과 물질-에너지 분포를 연결합니다.",difficulty:"hard"},{id:"phd-math-01-q06",type:"multiple_choice",question:"원기둥의 가우스 곡률은?",options:["0","양수","음수","무한대"],answer:"0",explanation:"원기둥은 겉보기에 휘어져 보이지만 펼치면 평면이 되므로 가우스 곡률은 0입니다.",difficulty:"hard"},{id:"phd-math-02-q01",type:"short_answer",question:"다음 상태가 오직 현재 상태에만 의존하는 확률과정의 성질은?",options:[],answer:"마르코프 성질",explanation:"마르코프 성질은 다음 상태가 과거 전체가 아닌 현재 상태에만 의존한다는 성질입니다.",difficulty:"medium"},{id:"phd-math-02-q02",type:"multiple_choice",question:"액체 속 입자의 무작위한 움직임을 모델링하는 대표적인 확률과정은?",options:["브라운 운동","마르코프 연쇄만","이항분포","정규분포만"],answer:"브라운 운동",explanation:"브라운 운동은 액체 속 입자의 무작위한 움직임을 모델링하는 연속시간 확률과정입니다.",difficulty:"medium"},{id:"phd-math-02-q03",type:"short_answer",question:"확률미분방정식(SDE)의 일반적인 형태는?",options:[],answer:"dXt=μ(Xt,t)dt+σ(Xt,t)dWt",explanation:"SDE는 결정론적 변화(드리프트)와 확률적 변동(확산)을 함께 기술합니다.",difficulty:"hard"},{id:"phd-math-02-q04",type:"multiple_choice",question:'"마르코프 성질은 아무것도 기억하지 않는다는 뜻이다"는 생각이 부정확한 이유는?',options:["현재 상태 자체가 과거의 영향을 이미 압축해서 담고 있기 때문","마르코프 성질은 미래를 전혀 예측하지 못하게 하기 때문","마르코프 과정은 확률과 전혀 무관하기 때문","마르코프 성질은 현재 상태조차 고려하지 않기 때문"],answer:"현재 상태 자체가 과거의 영향을 이미 압축해서 담고 있기 때문",explanation:'마르코프 성질은 "현재 상태만 알면 과거 전체 이력이 더 이상 필요 없다"는 의미입니다.',difficulty:"hard"},{id:"phd-math-02-q05",type:"short_answer",question:"금융공학에서 옵션 가격결정에 사용되는 확률과정 기반 모형은?",options:[],answer:"블랙-숄즈 모형",explanation:"블랙-숄즈 옵션가격 모형은 확률미분방정식에 기반한 금융공학의 대표적인 모형입니다.",difficulty:"hard"},{id:"phd-math-02-q06",type:"multiple_choice",question:'"무작위 현상은 수학적으로 정밀하게 다룰 수 없다"는 생각이 틀린 이유는?',options:["확률과정론이 확률분포와 장기적 패턴을 정밀하게 분석하는 도구를 제공하기 때문","무작위 현상은 실제로 아무 규칙이 없기 때문","수학은 확률적 현상을 다룰 수 없기 때문","무작위성은 예측이 전혀 불가능한 개념이기 때문"],answer:"확률과정론이 확률분포와 장기적 패턴을 정밀하게 분석하는 도구를 제공하기 때문",explanation:"개별 결과는 예측 불가능해도 확률적 패턴은 매우 정밀하게 분석 가능합니다.",difficulty:"hard"},{id:"phd-math-03-q01",type:"short_answer",question:"공간 위의 폐곡선들을 변형 가능성에 따라 분류한 대수적 구조는?",options:[],answer:"기본군",explanation:"기본군은 공간 위의 고리들이 서로 연속적으로 변형 가능한지에 따라 분류하는 군입니다.",difficulty:"medium"},{id:"phd-math-03-q02",type:"multiple_choice",question:"원의 기본군은 무엇과 같은가?",options:["정수의 덧셈군(ℤ)","자명군","실수 전체 집합","자연수 집합"],answer:"정수의 덧셈군(ℤ)",explanation:"원의 기본군은 고리가 원을 몇 바퀴 감았는지로 분류되어 정수의 덧셈군과 같습니다.",difficulty:"hard"},{id:"phd-math-03-q03",type:"short_answer",question:"기본군보다 계산하기 쉬우면서도 공간의 위상적 정보를 담는 대수적 불변량은?",options:[],answer:"호몰로지군",explanation:"호몰로지군은 기본군보다 계산이 쉬우면서도 유용한 위상적 정보를 제공합니다.",difficulty:"hard"},{id:"phd-math-03-q04",type:"multiple_choice",question:'"두 공간의 오일러 지표가 같으면 두 공간은 반드시 위상동형이다"는 생각이 틀린 이유는?',options:["오일러 지표는 하나의 불변량일 뿐이며 완전한 분류에는 여러 불변량이 필요하기 때문","오일러 지표가 같으면 항상 완전히 같은 공간이기 때문","오일러 지표는 위상수학과 무관하기 때문","위상동형은 오일러 지표만으로 정의되기 때문"],answer:"오일러 지표는 하나의 불변량일 뿐이며 완전한 분류에는 여러 불변량이 필요하기 때문",explanation:"완전한 위상적 분류를 위해서는 기본군, 호몰로지군 등 여러 불변량을 함께 고려해야 합니다.",difficulty:"hard"},{id:"phd-math-03-q05",type:"short_answer",question:"호몰로지를 이용해 데이터의 형태적 특징을 추출하는 현대적 응용 분야는?",options:[],answer:"위상 데이터 분석(TDA)",explanation:"위상 데이터 분석(TDA)은 호몰로지 개념을 이용해 복잡한 데이터의 형태적 특징을 추출하는 현대적 응용 분야입니다.",difficulty:"hard"},{id:"phd-math-03-q06",type:"multiple_choice",question:"구의 기본군은?",options:["자명군(모든 고리가 한 점으로 수축 가능)","정수의 덧셈군","실수군","무한군"],answer:"자명군(모든 고리가 한 점으로 수축 가능)",explanation:"구 표면 위의 모든 고리는 한 점으로 수축될 수 있어 구의 기본군은 자명군입니다.",difficulty:"hard"},{id:"phd-bio-01-q01",type:"short_answer",question:"DNA 서열의 변화 없이 유전자 발현을 조절하는 화학적 표지의 예를 하나 쓰시오.",options:[],answer:"DNA 메틸화(또는 히스톤 변형)",explanation:"DNA 메틸화와 히스톤 변형은 서열 변화 없이 유전자 발현을 조절하는 대표적인 후성유전학적 표지입니다.",difficulty:"medium"},{id:"phd-bio-01-q02",type:"multiple_choice",question:'"생물의 형질은 오직 DNA 염기서열만으로 완전히 결정된다"는 생각이 틀린 이유는?',options:["후성유전학적 표지에 따라 같은 유전자라도 발현 정도와 시기가 달라질 수 있기 때문","DNA 서열은 형질 결정과 전혀 관련이 없기 때문","후성유전학적 조절은 실제로 존재하지 않기 때문","모든 형질은 환경에만 의존하기 때문"],answer:"후성유전학적 표지에 따라 같은 유전자라도 발현 정도와 시기가 달라질 수 있기 때문",explanation:"일란성 쌍둥이도 후성유전학적 차이로 서로 다른 표현형을 보일 수 있습니다.",difficulty:"hard"},{id:"phd-bio-01-q03",type:"short_answer",question:"부모 중 한쪽에서 유래한 대립유전자만 발현되도록 표지되는 현상은?",options:[],answer:"게놈 각인",explanation:"게놈 각인은 부모 유래에 따라 대립유전자의 발현 여부가 달라지는 후성유전학적 현상입니다.",difficulty:"hard"},{id:"phd-bio-01-q04",type:"multiple_choice",question:'"후천적으로 얻은 형질은 절대 자손에게 전달될 수 없다"는 전통적 견해에 대한 최근 연구 결과는?',options:["제한적이지만 경세대 후성유전학적 전달의 증거가 일부 제시되고 있다","완전히 확정적으로 증명되어 반박의 여지가 없다","전혀 재검토되지 않고 있다","라마르크의 용불용설이 완전히 옳았음을 증명했다"],answer:"제한적이지만 경세대 후성유전학적 전달의 증거가 일부 제시되고 있다",explanation:"경세대 전달은 제한적이고 복잡한 현상으로, 라마르크의 이론과 동일시하는 것은 지나친 단순화입니다.",difficulty:"hard"},{id:"phd-bio-01-q05",type:"short_answer",question:"암세포에서 흔히 관찰되는 후성유전학적 이상의 예는?",options:[],answer:"종양억제유전자의 비정상적 메틸화",explanation:"종양억제유전자가 비정상적으로 메틸화되어 발현이 억제되는 것은 암세포에서 흔히 관찰되는 후성유전학적 변화입니다.",difficulty:"hard"},{id:"phd-bio-01-q06",type:"multiple_choice",question:"프래더-윌리 증후군과 안젤만 증후군이 보여주는 것은?",options:["같은 부위의 결실이라도 부모의 유래에 따라 다른 질환을 일으키는 각인 효과","두 증후군은 완전히 같은 질환이다","유전자 결실은 항상 같은 결과를 낳는다","부모의 유래는 질환 발생과 무관하다"],answer:"같은 부위의 결실이라도 부모의 유래에 따라 다른 질환을 일으키는 각인 효과",explanation:"이 두 증후군은 게놈 각인 현상을 보여주는 대표적인 임상 사례입니다.",difficulty:"hard"},{id:"phd-bio-02-q01",type:"short_answer",question:"생물들이 공통 조상으로부터 어떻게 갈라져 나왔는지 나타내는 그림은?",options:[],answer:"계통수",explanation:"계통수는 생물종 사이의 진화적 관계를 나뭇가지 모양으로 나타낸 그림입니다.",difficulty:"easy"},{id:"phd-bio-02-q02",type:"multiple_choice",question:'"진화는 하등생물에서 고등생물로 일직선으로 발전하는 사다리 같은 과정이다"는 생각이 틀린 이유는?',options:["진화는 공통조상에서 여러 방향으로 가지를 뻗어나가는 나무에 가깝기 때문","진화는 실제로 사다리처럼 일직선으로 진행되기 때문","오늘날 생물은 진화가 덜 된 상태이기 때문","모든 생물은 같은 방향으로 진화하기 때문"],answer:"진화는 공통조상에서 여러 방향으로 가지를 뻗어나가는 나무에 가깝기 때문",explanation:"오늘날 존재하는 모든 생물은 각자의 환경에 적응해온 동등하게 진화한 결과물입니다.",difficulty:"hard"},{id:"phd-bio-02-q03",type:"short_answer",question:"특정 유전자의 돌연변이가 비교적 일정한 속도로 축적된다고 가정해 종분화 시기를 추정하는 방법은?",options:[],answer:"분자시계",explanation:"분자시계는 유전자 서열의 변화 속도를 이용해 종분화 시기를 추정하는 방법입니다.",difficulty:"medium"},{id:"phd-bio-02-q04",type:"multiple_choice",question:"돌고래(포유류)와 상어(어류)가 비슷한 유선형 몸을 가지는 현상은?",options:["수렴진화","공통조상으로부터의 직접 유전","동일한 계통","우연한 형태적 일치"],answer:"수렴진화",explanation:"수렴진화는 비슷한 환경 압력에 대해 계통적으로 먼 생물들이 독립적으로 비슷한 형태로 적응하는 현상입니다.",difficulty:"medium"},{id:"phd-bio-02-q05",type:"short_answer",question:'"겉모습이 비슷하면 반드시 가까운 친척이다"는 생각이 틀린 이유는?',options:[],answer:"수렴진화로 인해 계통적으로 먼 생물도 비슷한 형태를 가질 수 있기 때문",explanation:"돌고래와 상어처럼 형태적 유사성이 항상 가까운 계통 관계를 의미하지는 않습니다.",difficulty:"hard"},{id:"phd-bio-02-q06",type:"multiple_choice",question:"고래의 계통적 위치에 대한 올바른 설명은?",options:["형태는 물고기와 비슷하지만 유전적으로는 육상 포유류에 가깝다","고래는 어류에 속한다","고래는 물고기와 계통적으로 가장 가깝다","고래의 계통적 위치는 밝혀지지 않았다"],answer:"형태는 물고기와 비슷하지만 유전적으로는 육상 포유류에 가깝다",explanation:"고래는 형태적으로 물고기와 유사하지만 계통적으로는 육상 포유류에서 진화했습니다.",difficulty:"medium"},{id:"phd-bio-03-q01",type:"short_answer",question:"특정 DNA 서열을 정밀하게 자르고 편집할 수 있는 유전자 편집 도구는?",options:[],answer:"CRISPR-Cas9",explanation:"CRISPR-Cas9은 특정 DNA 서열을 정밀하게 표적해 편집할 수 있는 강력한 도구입니다.",difficulty:"medium"},{id:"phd-bio-03-q02",type:"multiple_choice",question:'"합성생물학은 유전공학과 완전히 동일한 것이다"는 생각이 부정확한 이유는?',options:["합성생물학은 여러 표준화된 부품을 조합해 예측 가능한 복잡한 시스템을 설계하는 공학적 철학을 강조하기 때문","합성생물학은 유전자 조작을 전혀 사용하지 않기 때문","유전공학은 합성생물학보다 훨씬 최근에 등장했기 때문","둘은 서로 완전히 무관한 분야이기 때문"],answer:"합성생물학은 여러 표준화된 부품을 조합해 예측 가능한 복잡한 시스템을 설계하는 공학적 철학을 강조하기 때문",explanation:"합성생물학은 유전공학의 도구를 사용하지만 모듈화와 표준화라는 공학적 접근을 강조합니다.",difficulty:"hard"},{id:"phd-bio-03-q03",type:"short_answer",question:"CRISPR-Cas9의 정밀도와 관련한 중요한 연구 과제는?",options:[],answer:"오프타겟 효과(의도하지 않은 부위 편집)를 최소화하는 것",explanation:"CRISPR-Cas9은 강력하지만 완벽하지 않아 오프타겟 효과를 줄이는 것이 중요한 과제입니다.",difficulty:"hard"},{id:"phd-bio-03-q04",type:"multiple_choice",question:'"CRISPR는 어떤 유전자든 완벽하게 오류 없이 편집할 수 있다"는 생각이 틀린 이유는?',options:["의도한 위치가 아닌 유사한 서열을 잘못 편집하는 오프타겟 효과가 발생할 수 있기 때문","CRISPR는 편집 오류가 절대 발생하지 않기 때문","CRISPR는 유전자 편집에 전혀 사용되지 않기 때문","오프타겟 효과는 실제로 존재하지 않기 때문"],answer:"의도한 위치가 아닌 유사한 서열을 잘못 편집하는 오프타겟 효과가 발생할 수 있기 때문",explanation:"CRISPR-Cas9의 표적 특이성에는 한계가 있어 오프타겟 효과가 여전히 중요한 연구 과제입니다.",difficulty:"hard"},{id:"phd-bio-03-q05",type:"short_answer",question:"유전 회로 설계에 사용되는 표준화된 유전 부품의 예를 2가지 쓰시오.",options:[],answer:"프로모터, 리보솜결합부위 등",explanation:"프로모터와 리보솜결합부위 같은 표준화된 부품을 조합해 유전 회로를 설계합니다.",difficulty:"medium"},{id:"phd-bio-03-q06",type:"multiple_choice",question:"합성생물학으로 인슐린을 대량 생산하는 방법은?",options:["미생물 균주에 유전 회로를 삽입해 인슐린을 생산하게 한다","동물의 인슐린을 직접 추출만 한다","화학적으로만 합성한다","식물에서만 얻는다"],answer:"미생물 균주에 유전 회로를 삽입해 인슐린을 생산하게 한다",explanation:"합성생물학 기술로 미생물을 조작해 인슐린 같은 유용 물질을 대량 생산할 수 있습니다.",difficulty:"medium"},{id:"phd-earth-01-q01",type:"short_answer",question:"변화를 완화하는 방향으로 작용하는 되먹임을 무엇이라 하는가?",options:[],answer:"음의 되먹임",explanation:"음의 되먹임은 변화가 일어나면 그것을 상쇄하는 방향으로 작용하는 되먹임입니다.",difficulty:"medium"},{id:"phd-earth-01-q02",type:"multiple_choice",question:"빙하-알베도 되먹임은 어떤 종류의 되먹임인가?",options:["양의 되먹임(온난화 가속)","음의 되먹임(온난화 완화)","되먹임이 아니다","무작위 되먹임"],answer:"양의 되먹임(온난화 가속)",explanation:"빙하가 녹으면 반사율이 줄어 태양복사를 더 흡수해 온난화가 가속되는 양의 되먹임입니다.",difficulty:"medium"},{id:"phd-earth-01-q03",type:"short_answer",question:'"지구의 각 권역은 서로 독립적으로 작동한다"는 생각이 틀린 이유는?',options:[],answer:"해양의 CO₂ 흡수, 식물의 증산작용 등 여러 권역이 서로 밀접하게 상호작용하기 때문",explanation:"대기, 바다, 육지, 생물권은 서로 긴밀하게 연결되어 영향을 주고받습니다.",difficulty:"medium"},{id:"phd-earth-01-q04",type:"multiple_choice",question:"식물의 광합성 증가가 대기 중 CO₂를 더 흡수하는 것은 어떤 되먹임의 예인가?",options:["음의 되먹임","양의 되먹임","되먹임이 아니다","무작위 되먹임"],answer:"음의 되먹임",explanation:"이는 온난화를 완화하는 방향으로 작용하는 음의 되먹임의 예입니다.",difficulty:"hard"},{id:"phd-earth-01-q05",type:"short_answer",question:"지구시스템 모델이 통합적으로 다루는 4가지 권역은?",options:[],answer:"대기권, 해양(수권), 빙권, 생물권",explanation:"지구시스템 모델은 대기-해양-빙권-생물권의 상호작용을 수치적으로 결합해 시뮬레이션합니다.",difficulty:"hard"},{id:"phd-earth-01-q06",type:"multiple_choice",question:"아마존 열대우림 파괴가 지구시스템에 미치는 영향은?",options:["지역 강수 패턴과 전 지구적 탄소 순환에 영향을 준다","아무 영향도 없다","오직 그 지역에만 국한된 영향을 미친다","대기와는 전혀 무관하다"],answer:"지역 강수 패턴과 전 지구적 탄소 순환에 영향을 준다",explanation:"열대우림은 지역 기후뿐 아니라 전 지구적 탄소 순환에도 중요한 역할을 합니다.",difficulty:"medium"},{id:"phd-earth-02-q01",type:"short_answer",question:"단위 면적당 충돌구의 개수로 표면의 상대적 나이를 추정하는 방법은?",options:[],answer:"크레이터(충돌구) 계수법",explanation:"크레이터 계수법은 충돌구 밀도를 이용해 행성 표면의 상대적 나이를 추정하는 방법입니다.",difficulty:"medium"},{id:"phd-earth-02-q02",type:"multiple_choice",question:"화성 표면의 마른 하천 지형이 시사하는 것은?",options:["과거 화성에 액체 물이 흘렀을 가능성","화성에는 물이 전혀 존재한 적이 없다는 것","화성 표면이 매우 최근에 형성되었다는 것","화성에 판구조론이 활발히 일어난다는 것"],answer:"과거 화성에 액체 물이 흘렀을 가능성",explanation:"마른 하천 지형은 과거 화성 표면에 액체 물이 흘렀음을 시사하는 중요한 증거입니다.",difficulty:"medium"},{id:"phd-earth-02-q03",type:"short_answer",question:'"충돌구가 많으면 그 표면은 항상 매우 젊다"는 생각이 틀린 이유는?',options:[],answer:"충돌구가 많다는 것은 오히려 오랫동안 침식되지 않은 오래된 표면임을 시사하기 때문",explanation:"충돌구 밀도가 높을수록 지질활동 없이 오랫동안 보존된 오래된 표면임을 나타내며, 반대로 충돌구가 적으면 최근 지질활동(화산, 침식 등)으로 지워졌을 가능성이 있어 젊은 표면일 수 있습니다.",difficulty:"hard"},{id:"phd-earth-02-q04",type:"multiple_choice",question:"유로파(목성의 위성)에서 추정되는 것은?",options:["얼음 지각 아래 액체 바다가 있을 가능성","표면 전체가 용암으로 덮여 있다는 것","대기가 지구보다 두껍다는 것","판구조론이 활발하다는 것"],answer:"얼음 지각 아래 액체 바다가 있을 가능성",explanation:"유로파는 얼음 지각 아래에 액체 상태의 바다가 존재할 것으로 추정되는 목성의 위성입니다.",difficulty:"medium"},{id:"phd-earth-02-q05",type:"short_answer",question:"행성지질학에서 표면 광물 조성을 추정하는 데 사용하는 방법은?",options:[],answer:"스펙트럼 원격탐사",explanation:"스펙트럼 원격탐사는 반사된 빛의 스펙트럼을 분석해 표면 광물 조성을 추정하는 방법입니다.",difficulty:"hard"},{id:"phd-earth-02-q06",type:"multiple_choice",question:'"다른 행성의 지질학적 원리는 지구와 완전히 다르다"는 생각이 부정확한 이유는?',options:["화산활동, 침식, 충돌구 형성 같은 기본 과정은 여러 천체에 공통된 물리·화학 법칙을 따르기 때문","지질학적 원리는 지구에서만 적용되기 때문","다른 행성에는 지질학적 과정이 전혀 없기 때문","판구조론은 모든 행성에서 동일하게 일어나기 때문"],answer:"화산활동, 침식, 충돌구 형성 같은 기본 과정은 여러 천체에 공통된 물리·화학 법칙을 따르기 때문",explanation:"판구조론처럼 지구에 특화된 현상도 있지만 기본적인 지질 과정은 여러 천체에 공통적으로 적용됩니다.",difficulty:"hard"},{id:"phd-earth-03-q01",type:"short_answer",question:"암석이 형성될 때 기록된 당시 지구 자기장의 방향과 세기를 무엇이라 하는가?",options:[],answer:"잔류자기",explanation:'잔류자기는 암석 형성 시점의 지구 자기장이 자성 광물에 "동결"된 것입니다.',difficulty:"medium"},{id:"phd-earth-03-q02",type:"multiple_choice",question:"해양저의 고지자기 줄무늬가 뒷받침하는 것은?",options:["해저확장과 지자기 역전","대륙은 절대 움직이지 않는다는 것","지구 자기장은 변하지 않는다는 것","판구조론이 틀렸다는 것"],answer:"해저확장과 지자기 역전",explanation:"해양저의 대칭적인 고지자기 줄무늬는 해저확장설과 지자기 역전의 결정적 증거입니다.",difficulty:"hard"},{id:"phd-earth-03-q03",type:"short_answer",question:'"암석의 자기 기록은 시간이 지나면 계속 변한다"는 생각이 틀린 이유는?',options:[],answer:"암석이 크게 재가열되지 않는 한 형성 당시의 잔류자기는 거의 변하지 않기 때문",explanation:"잔류자기의 안정성 덕분에 수백만 년 전의 자기장 기록을 오늘날에도 읽어낼 수 있습니다.",difficulty:"hard"},{id:"phd-earth-03-q04",type:"multiple_choice",question:"겉보기 극이동 곡선이 실제로 반영하는 것은?",options:["대륙 자체의 이동","지자기극의 실제 이동","지구 자전축의 변화만","태양의 이동"],answer:"대륙 자체의 이동",explanation:"겉보기 극이동 곡선은 실제로는 지자기극이 아니라 대륙 자체가 이동했음을 반영합니다.",difficulty:"hard"},{id:"phd-earth-03-q05",type:"short_answer",question:"가장 최근의 지자기 역전의 이름과 대략적인 시기는?",options:[],answer:"브런즈-마츠야마 역전, 약 78만 년 전",explanation:"가장 최근의 지자기 역전은 브런즈-마츠야마 역전으로 약 78만 년 전에 일어났습니다.",difficulty:"hard"},{id:"phd-earth-03-q06",type:"multiple_choice",question:'"지자기 역전은 매우 규칙적인 주기로 일어난다"는 생각이 틀린 이유는?',options:["역전 시기는 매우 불규칙하며 외핵의 유체 운동이 비선형적이고 카오스적이기 때문","지자기 역전은 정확히 100만 년마다 일어나기 때문","지자기 역전은 실제로 일어난 적이 없기 때문","역전 주기는 태양 활동으로만 결정되기 때문"],answer:"역전 시기는 매우 불규칙하며 외핵의 유체 운동이 비선형적이고 카오스적이기 때문",explanation:"지자기 역전의 시기는 매우 불규칙하며 외핵의 복잡한 유체 운동과 관련이 있습니다.",difficulty:"hard"},{id:"phd-astro-01-q01",type:"short_answer",question:"우주의 가속 팽창을 일으키는 정체불명의 에너지는?",options:[],answer:"암흑에너지",explanation:"암흑에너지는 우주의 가속 팽창을 일으키는 것으로 추정되는 정체불명의 에너지입니다.",difficulty:"medium"},{id:"phd-astro-01-q02",type:"multiple_choice",question:"우주 가속 팽창을 발견하는 데 결정적인 역할을 한 관측 대상은?",options:["Ia형 초신성","우리은하의 별들","태양계 행성","지구의 대기"],answer:"Ia형 초신성",explanation:"Ia형 초신성은 항상 비슷한 밝기를 가지는 표준촛불로 사용되어 우주 가속 팽창 발견에 핵심적인 역할을 했습니다.",difficulty:"hard"},{id:"phd-astro-01-q03",type:"short_answer",question:'"우주의 팽창은 시간이 지나며 항상 느려지고 있다"는 생각이 틀린 이유는?',options:[],answer:"약 50억 년 전부터는 암흑에너지의 영향으로 오히려 가속 팽창하고 있기 때문",explanation:"과거에는 물질의 중력으로 감속되었지만 최근에는 암흑에너지로 가속되고 있습니다.",difficulty:"hard"},{id:"phd-astro-01-q04",type:"multiple_choice",question:'"암흑에너지와 암흑물질은 같은 것이다"는 생각이 틀린 이유는?',options:["암흑물질은 중력으로 끌어당기고, 암흑에너지는 공간을 밀어내며 팽창을 가속하기 때문","둘은 실제로 완전히 같은 개념이기 때문","암흑물질은 존재하지 않기 때문","암흑에너지는 물질의 일종이기 때문"],answer:"암흑물질은 중력으로 끌어당기고, 암흑에너지는 공간을 밀어내며 팽창을 가속하기 때문",explanation:"암흑물질과 암흑에너지는 이름은 비슷하지만 우주에 미치는 영향이 정반대에 가깝습니다.",difficulty:"hard"},{id:"phd-astro-01-q05",type:"short_answer",question:"가장 단순한 암흑에너지 모델은 무엇으로 표현되는가?",options:[],answer:"아인슈타인의 우주상수 Λ",explanation:"가장 단순한 암흑에너지 모델은 아인슈타인이 도입한 우주상수 Λ로 표현됩니다.",difficulty:"hard"},{id:"phd-astro-01-q06",type:"multiple_choice",question:"우주의 에너지 구성에서 암흑에너지가 차지하는 비율은 대략 얼마로 추정되는가?",options:["약 68%","약 5%","약 27%","약 100%"],answer:"약 68%",explanation:"우주는 약 68% 암흑에너지, 27% 암흑물질, 5% 일반물질로 구성된 것으로 추정됩니다.",difficulty:"medium"},{id:"phd-astro-02-q01",type:"short_answer",question:"외계행성이 항성 앞을 지날 때 별빛 스펙트럼을 분석해 대기 성분을 알아내는 방법은?",options:[],answer:"통과 분광법",explanation:"통과 분광법은 행성이 별 앞을 지날 때 대기를 통과한 별빛의 흡수선을 분석하는 방법입니다.",difficulty:"medium"},{id:"phd-astro-02-q02",type:"multiple_choice",question:'"외계행성의 대기는 직접 가지 않고는 절대 알 수 없다"는 생각이 틀린 이유는?',options:["통과 분광법으로 별빛에 남은 스펙트럼 흔적을 분석해 원격으로 대기 성분을 알 수 있기 때문","외계행성의 대기는 어떤 방법으로도 알 수 없기 때문","통과 분광법은 대기 성분과 무관하기 때문","외계행성은 대기를 가지지 않기 때문"],answer:"통과 분광법으로 별빛에 남은 스펙트럼 흔적을 분석해 원격으로 대기 성분을 알 수 있기 때문",explanation:"현대 천문학은 직접 방문하지 않고도 원격 분광 관측으로 외계행성 대기를 분석할 수 있습니다.",difficulty:"hard"},{id:"phd-astro-02-q03",type:"short_answer",question:"생명체 존재를 암시할 수 있는 대기 성분 조합을 무엇이라 하는가?",options:[],answer:"바이오시그니처",explanation:"바이오시그니처는 생명체 존재를 암시할 수 있는 대기 성분(예: 산소와 메탄의 동시 존재)을 말합니다.",difficulty:"medium"},{id:"phd-astro-02-q04",type:"multiple_choice",question:'"산소가 발견되면 그 자체로 생명체의 확실한 증거이다"는 생각이 틀린 이유는?',options:["산소는 비생물학적 광화학 반응으로도 생성될 수 있기 때문","산소는 생명체 없이는 절대 만들어질 수 없기 때문","산소는 대기에서 발견될 수 없는 물질이기 때문","바이오시그니처는 산소만으로 정의되기 때문"],answer:"산소는 비생물학적 광화학 반응으로도 생성될 수 있기 때문",explanation:"산소만으로는 생명체 존재를 확신할 수 없으며 다른 분자와의 조합, 환경을 종합적으로 고려해야 합니다.",difficulty:"hard"},{id:"phd-astro-02-q05",type:"short_answer",question:"여러 지구형 행성을 가진 것으로 유명한 외계 행성계는?",options:[],answer:"TRAPPIST-1",explanation:"TRAPPIST-1은 여러 개의 지구형 행성을 가진 대표적인 연구 대상 행성계입니다.",difficulty:"medium"},{id:"phd-astro-02-q06",type:"multiple_choice",question:"외계행성 대기 관측에서 최근 활약하고 있는 최신 관측 장비는?",options:["제임스웹우주망원경","허블우주망원경만","갈릴레오 망원경","전파망원경만"],answer:"제임스웹우주망원경",explanation:"제임스웹우주망원경은 이전보다 훨씬 정밀한 외계행성 대기 스펙트럼을 제공하고 있습니다.",difficulty:"medium"},{id:"phd-astro-03-q01",type:"short_answer",question:"2015년 최초로 중력파를 직접 검출한 관측소는?",options:[],answer:"LIGO",explanation:"LIGO는 2015년 두 블랙홀 병합에서 발생한 중력파를 최초로 직접 검출했습니다.",difficulty:"medium"},{id:"phd-astro-03-q02",type:"multiple_choice",question:'"중력파는 이론적으로만 존재하며 직접 관측된 적이 없다"는 생각이 틀린 이유는?',options:["2015년 LIGO가 실제로 중력파를 직접 검출했기 때문","중력파는 실제로 존재하지 않는 개념이기 때문","중력파는 관측이 원천적으로 불가능하기 때문","중력파는 전자기파와 동일하기 때문"],answer:"2015년 LIGO가 실제로 중력파를 직접 검출했기 때문",explanation:"중력파는 더 이상 이론적 예측에 머물지 않고 여러 차례 직접 검출되었습니다.",difficulty:"medium"},{id:"phd-astro-03-q03",type:"short_answer",question:"중력파와 전자기파가 동시에 관측된 대표적인 사건은?",options:[],answer:"GW170817(중성자별 병합)",explanation:"GW170817은 중력파와 감마선 폭발이 동시에 관측된 중성자별 병합 사건입니다.",difficulty:"hard"},{id:"phd-astro-03-q04",type:"multiple_choice",question:'"중력파와 전자기파는 본질적으로 같은 것이다"는 생각이 틀린 이유는?',options:["전자기파는 전하의 가속으로, 중력파는 질량의 비대칭적 가속으로 발생하는 전혀 다른 현상이기 때문","둘은 완전히 동일한 물리적 현상이기 때문","중력파는 실제로 전자기파의 일종이기 때문","전자기파는 질량과 무관하게 발생하지 않기 때문"],answer:"전자기파는 전하의 가속으로, 중력파는 질량의 비대칭적 가속으로 발생하는 전혀 다른 현상이기 때문",explanation:"중력파는 시공간 자체의 기하학적 요동으로, 전자기장의 파동인 전자기파와는 근본적으로 다릅니다.",difficulty:"hard"},{id:"phd-astro-03-q05",type:"short_answer",question:"중력파 검출 방법으로 팔 길이의 극도로 미세한 변화를 측정하는 장비는?",options:[],answer:"레이저 간섭계",explanation:"레이저 간섭계는 중력파가 지나갈 때 생기는 극도로 미세한 길이 변화를 측정합니다.",difficulty:"hard"},{id:"phd-astro-03-q06",type:"multiple_choice",question:"다중신호천문학이 의미하는 것은?",options:["중력파와 전자기파를 함께 관측해 하나의 천체 사건을 다각도로 분석하는 것","오직 중력파만 사용하는 관측 방법","오직 전자기파만 사용하는 관측 방법","천체를 관측하지 않는 이론적 방법"],answer:"중력파와 전자기파를 함께 관측해 하나의 천체 사건을 다각도로 분석하는 것",explanation:"다중신호천문학은 여러 종류의 신호를 결합해 천체 현상을 더 풍부하게 이해하는 새로운 관측 패러다임입니다.",difficulty:"hard"},{id:"phd-med-01-q01",type:"short_answer",question:"세포·동물실험으로 안전성과 효능의 기초 자료를 얻는 단계는?",options:[],answer:"전임상시험",explanation:"전임상시험은 사람에게 적용하기 전 세포와 동물실험으로 기초 자료를 얻는 단계입니다.",difficulty:"medium"},{id:"phd-med-01-q02",type:"multiple_choice",question:'"실험실에서 효과가 있으면 곧바로 환자에게 사용해도 된다"는 생각이 틀린 이유는?',options:["종간 차이, 용량 차이 등으로 전임상 결과가 임상시험에서 재현되지 않는 경우가 흔하기 때문","전임상 결과는 항상 임상시험 결과와 완전히 일치하기 때문","임상시험 단계는 불필요한 절차이기 때문","동물실험과 인체 실험은 완전히 동일하기 때문"],answer:"종간 차이, 용량 차이 등으로 전임상 결과가 임상시험에서 재현되지 않는 경우가 흔하기 때문",explanation:"탈리도마이드 사건처럼 종간 차이로 인해 단계적 검증이 필수적입니다.",difficulty:"hard"},{id:"phd-med-01-q03",type:"short_answer",question:"임상시험 1상의 주된 목적은?",options:[],answer:"안전성과 적정 용량 확인",explanation:"1상 임상시험은 주로 소수의 참가자를 대상으로 안전성과 적정 용량을 확인합니다.",difficulty:"medium"},{id:"phd-med-01-q04",type:"multiple_choice",question:'"임상시험의 모든 단계는 같은 목적을 가진다"는 생각이 틀린 이유는?',options:["1상은 안전성, 2상은 효능 신호, 3상은 대규모 비교검증, 4상은 시판 후 감시로 목적이 다르기 때문","모든 단계는 완전히 동일한 목적으로 설계되기 때문","임상시험은 하나의 단계만 존재하기 때문","단계별 목적 구분은 실제로 무의미하기 때문"],answer:"1상은 안전성, 2상은 효능 신호, 3상은 대규모 비교검증, 4상은 시판 후 감시로 목적이 다르기 때문",explanation:"각 임상시험 단계는 서로 다른 구체적인 목적을 가지고 설계됩니다.",difficulty:"hard"},{id:"phd-med-01-q05",type:"short_answer",question:"신약 개발에서 환자를 효율적으로 층화하는 데 핵심적인 역할을 하는 것은?",options:[],answer:"바이오마커",explanation:"바이오마커는 특정 치료에 잘 반응할 환자군을 미리 예측하는 데 활용됩니다.",difficulty:"hard"},{id:"phd-med-01-q06",type:"multiple_choice",question:"중개연구(translational research)가 강조하는 다리 역할은?",options:["기초연구에서 임상으로, 그리고 임상에서 실제 진료 현장으로의 양방향 연결","오직 기초연구만을 위한 것","오직 임상시험만을 위한 것","연구와 진료는 완전히 분리되어야 한다는 것"],answer:"기초연구에서 임상으로, 그리고 임상에서 실제 진료 현장으로의 양방향 연결",explanation:"중개연구는 T1(기초→임상)뿐 아니라 T2(임상→진료 현장)의 양방향 다리 역할을 강조합니다.",difficulty:"hard"},{id:"phd-med-02-q01",type:"short_answer",question:"특정 유전자 변이가 있는 환자군에게만 효과적인 항암제를 미리 선별하는 검사는?",options:[],answer:"동반진단",explanation:"동반진단은 특정 치료에 잘 반응할 환자를 미리 예측하는 검사입니다.",difficulty:"medium"},{id:"phd-med-02-q02",type:"multiple_choice",question:'"정밀의학은 모든 사람에게 완전히 다른 치료법을 새로 만드는 것이다"는 생각이 부정확한 이유는?',options:["기존 치료법과 약물 중에서 개별 환자에게 가장 적합한 것을 선택하고 최적화하는 접근에 가깝기 때문","정밀의학은 매번 완전히 새로운 약을 발명하는 것이기 때문","정밀의학은 기존 치료법을 전혀 사용하지 않기 때문","정밀의학은 개인차를 고려하지 않기 때문"],answer:"기존 치료법과 약물 중에서 개별 환자에게 가장 적합한 것을 선택하고 최적화하는 접근에 가깝기 때문",explanation:"정밀의학은 완전히 새로운 발명이 아니라 최적의 선택과 용량 조정에 가깝습니다.",difficulty:"hard"},{id:"phd-med-02-q03",type:"short_answer",question:"HER2 양성 유방암 환자에게 효과적인 표적치료제는?",options:[],answer:"트라스투주맙",explanation:"트라스투주맙은 HER2 양성 유방암 환자에게 효과적인 대표적인 표적치료제입니다.",difficulty:"hard"},{id:"phd-med-02-q04",type:"multiple_choice",question:'"유전체 정보만 있으면 모든 질병을 완벽하게 예측할 수 있다"는 생각이 틀린 이유는?',options:["대부분의 질병은 유전자와 환경적 요인이 복잡하게 상호작용한 결과이기 때문","유전체 정보는 질병 예측과 전혀 무관하기 때문","환경적 요인은 질병에 영향을 주지 않기 때문","모든 질병은 순수하게 유전자로만 결정되기 때문"],answer:"대부분의 질병은 유전자와 환경적 요인이 복잡하게 상호작용한 결과이기 때문",explanation:"유전체 정보는 매우 유용하지만 환경 요인과의 상호작용도 함께 고려해야 정확한 예측이 가능합니다.",difficulty:"hard"},{id:"phd-med-02-q05",type:"short_answer",question:"정밀의학이 활용하는 다양한 오믹스(omics) 데이터의 예를 2가지 쓰시오.",options:[],answer:"유전체, 단백체(또는 대사체)",explanation:"정밀의학은 유전체, 단백체, 대사체 등 다양한 오믹스 데이터를 통합 분석합니다.",difficulty:"medium"},{id:"phd-med-02-q06",type:"multiple_choice",question:"약물유전체 검사를 통해 확인할 수 있는 것은?",options:["특정 항응고제의 적정 용량 예측","환자의 키와 몸무게","환자의 취미","병원의 위치"],answer:"특정 항응고제의 적정 용량 예측",explanation:"약물유전체 검사는 개인의 유전형에 따라 적정 약물 용량을 예측하는 데 활용됩니다.",difficulty:"medium"},{id:"phd-med-03-q01",type:"short_answer",question:"귀무가설이 참일 때 관찰된 결과가 나올 확률을 나타내는 통계량은?",options:[],answer:"p값",explanation:"p값은 귀무가설 하에서 관찰된(또는 더 극단적인) 결과가 나올 확률을 나타냅니다.",difficulty:"medium"},{id:"phd-med-03-q02",type:"multiple_choice",question:'"p값이 0.05보다 작으면 그 결과는 의학적으로도 매우 중요한 효과이다"는 생각이 틀린 이유는?',options:["매우 큰 표본에서는 임상적으로 무의미한 작은 차이도 통계적으로 유의하게 나타날 수 있기 때문","p값은 항상 임상적 중요성과 정확히 일치하기 때문","p값이 작으면 효과 크기도 항상 크기 때문","통계적 유의성과 임상적 중요성은 같은 개념이기 때문"],answer:"매우 큰 표본에서는 임상적으로 무의미한 작은 차이도 통계적으로 유의하게 나타날 수 있기 때문",explanation:"p값이 작다는 것은 우연이 아니라는 의미이지 효과 크기가 크다는 의미는 아닙니다.",difficulty:"hard"},{id:"phd-med-03-q03",type:"short_answer",question:"여러 하위그룹을 동시에 분석할 때 필요한 통계적 보정은?",options:[],answer:"다중비교 보정(예: 본페로니 보정)",explanation:"다중비교는 우연히 유의한 결과가 나올 확률을 높이므로 보정이 필요합니다.",difficulty:"hard"},{id:"phd-med-03-q04",type:"multiple_choice",question:'"통계적으로 유의하지 않으면 효과가 전혀 없다는 것이 증명된 것이다"는 생각이 틀린 이유는?',options:["현재 자료로 효과가 있다는 증거를 찾지 못했다는 의미일 뿐, 검정력 부족일 수도 있기
