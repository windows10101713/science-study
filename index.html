ax:9,conceptLevel:"curriculum"},{id:"high",label:"고등학교 (10-12학년)",min:10,max:12,conceptLevel:"advanced"},{id:"master",label:"석사 (대학원)",min:16,max:17,conceptLevel:"expert"},{id:"phd",label:"박사 (연구)",min:19,max:20,conceptLevel:"research"}];function cn(e){return e===os.id?os:mt.find(t=>t.id===e)}const qy=[{id:"book-optics-and-photonics",title:"광학과 포토닉스",subject:"physics",author:"Science Study 편집부",description:"기하광학에서 레이저, 광섬유, 양자광학까지 빛을 다루는 핵심 원리를 연결합니다.",chapters:[{title:"1장. 빛의 직진과 반사",content:"빛은 균일한 매질에서 직진하며 반사의 법칙은 입사각과 반사각이 같다는 관계로 표현됩니다. 거울의 곡률은 상의 위치와 크기를 결정합니다."},{title:"2장. 렌즈와 상의 형성",content:"얇은 렌즈 방정식 1/f=1/u+1/v는 물체 거리와 상 거리의 관계를 설명합니다. 볼록렌즈는 수렴, 오목렌즈는 발산 작용을 합니다."},{title:"3장. 편광과 간섭",content:"편광은 빛의 전기장 진동 방향을 제한합니다. 편광판과 위상판은 LCD와 광학 측정 장치의 기본 부품입니다."},{title:"4장. 레이저의 원리",content:"유도방출, 인구 역전, 공진기가 결합되면 위상과 방향이 정렬된 레이저 빛이 만들어집니다."},{title:"5장. 광섬유와 통신",content:"전반사를 이용하는 광섬유는 낮은 손실로 정보를 전달합니다. 단일모드와 다중모드 섬유는 대역폭과 거리 특성이 다릅니다."}]},{id:"book-electrochemistry",title:"전기화학과 배터리",subject:"chemistry",author:"Science Study 편집부",description:"산화환원, 전지 전위, 전해, 리튬이온 배터리와 연료전지의 작동을 탐구합니다.",chapters:[{title:"1장. 산화와 환원",content:"산화는 전자를 잃는 과정이고 환원은 전자를 얻는 과정입니다. 두 과정은 항상 함께 일어나며 전자의 이동이 전류를 만듭니다."},{title:"2장. 갈바니 전지",content:"자발적인 산화환원 반응은 화학에너지를 전기에너지로 바꿉니다. 전극의 표준 환원 전위 차이가 전지 전위를 결정합니다."},{title:"3장. 네른스트 방정식",content:"실제 농도와 압력 조건에서 전극 전위는 네른스트 방정식으로 보정할 수 있습니다. 이 식은 농도전지와 센서 해석에도 쓰입니다."},{title:"4장. 리튬이온 배터리",content:"충전 시 리튬 이온이 양극과 음극 사이를 이동하고 전자는 외부 회로를 흐릅니다. 전극 재료와 전해질 안정성이 수명과 안전을 결정합니다."},{title:"5장. 수소 연료전지",content:"수소 산화와 산소 환원을 분리해 전기화학적으로 진행하면 물과 전기를 얻을 수 있습니다. 촉매와 수소 저장이 상용화의 핵심 과제입니다."}]},{id:"book-microbiology",title:"미생물학과 감염의 과학",subject:"biology",author:"Science Study 편집부",description:"세균, 바이러스, 면역 반응, 항생제 내성 및 감염병 역학의 기초를 정리합니다.",chapters:[{title:"1장. 세균 세포의 구조",content:"세균은 핵막이 없는 원핵세포입니다. 세포벽, 세포막, 리보솜, 플라스미드는 생존과 증식에 중요한 역할을 합니다."},{title:"2장. 바이러스의 증식",content:"바이러스는 숙주세포의 장치를 이용해 유전물질을 복제합니다. 용균 주기와 잠복 감염은 감염 양상을 다르게 만듭니다."},{title:"3장. 선천면역과 후천면역",content:"선천면역은 빠르고 넓게 반응하며 후천면역은 항원 특이성과 기억을 가집니다. 두 체계의 협력이 병원체를 제거합니다."},{title:"4장. 항생제와 내성",content:"항생제는 세포벽 합성, 단백질 합성, DNA 복제 등을 표적으로 합니다. 불필요한 사용은 선택압을 높여 내성 균주의 확산을 촉진합니다."},{title:"5장. 감염병 역학",content:"기초재생산수, 잠복기, 감염 기간은 유행의 속도와 규모를 설명하는 변수입니다. 예방접종과 환기 같은 개입은 전파 사슬을 끊습니다."}]},{id:"book-geology-minerals",title:"광물과 지질 기록",subject:"earthscience",author:"Science Study 편집부",description:"광물의 결정 구조, 암석 순환, 지층과 화석, 지질시대의 기록을 탐구합니다.",chapters:[{title:"1장. 광물의 조건",content:"광물은 자연적으로 생성되고 무기물이며 일정한 화학 조성과 결정 구조를 가진 고체입니다. 경도와 쪼개짐은 식별에 활용됩니다."},{title:"2장. 화성암과 마그마",content:"마그마가 식는 속도와 화학 조성에 따라 화성암의 결정 크기와 종류가 달라집니다. 화산암과 심성암은 냉각 환경이 다릅니다."},{title:"3장. 풍화와 퇴적암",content:"암석은 물리·화학적 풍화를 거쳐 퇴적물이 되고 압밀과 교결을 거쳐 퇴적암이 됩니다. 지층은 과거 환경의 기록입니다."},{title:"4장. 변성 작용",content:"열과 압력은 암석을 녹이지 않고도 광물 배열과 조직을 바꿀 수 있습니다. 변성암은 지하 깊은 곳의 조건을 기록합니다."},{title:"5장. 화석과 지질시대",content:"화석은 과거 생물과 환경을 복원하는 단서입니다. 방사성 동위원소 연대 측정은 지층의 절대 연대를 추정하는 데 이용됩니다."}]},{id:"book-stellar-evolution",title:"별의 탄생과 진화",subject:"astronomy",author:"Science Study 편집부",description:"성간물질, 핵융합, 헤르츠스프룽-러셀 도표와 별의 최종 운명을 연결합니다.",chapters:[{title:"1장. 성간 구름의 붕괴",content:"차갑고 밀도 높은 분자운은 중력 불안정으로 붕괴하며 원시별을 만듭니다. 각운동량 보존은 회전 원반을 형성합니다."},{title:"2장. 주계열성과 핵융합",content:"주계열성은 중심부 수소 핵융합으로 중력을 지탱합니다. 질량이 클수록 중심 온도와 광도가 높고 수명은 짧습니다."},{title:"3장. H-R 도표",content:"헤르츠스프룽-러셀 도표는 별의 광도와 표면 온도를 나타냅니다. 주계열, 적색거성, 백색왜성 영역은 별의 진화 단계를 보여줍니다."},{title:"4장. 초신성과 원소 합성",content:"무거운 별의 붕괴와 폭발은 철보다 무거운 원소가 만들어지는 환경을 제공합니다. 초신성 잔해는 새로운 별의 재료가 됩니다."},{title:"5장. 백색왜성·중성자별·블랙홀",content:"별의 최종 운명은 초기 질량에 따라 달라집니다. 전자 축퇴압, 중성자 축퇴압, 사건의 지평선은 서로 다른 잔해를 설명합니다."}]},{id:"book-control-engineering",title:"제어공학과 피드백",subject:"engineering",author:"Science Study 편집부",description:"센서, 시스템 모델, 피드백, 안정도와 PID 제어를 실제 시스템 관점에서 이해합니다.",chapters:[{title:"1장. 시스템과 센서",content:"제어 시스템은 목표값과 측정값을 비교해 작동을 조정합니다. 센서의 정확도와 지연은 제어 품질에 직접 영향을 줍니다."},{title:"2장. 개방루프와 폐루프",content:"개방루프는 결과를 측정하지 않지만 폐루프는 오차를 이용해 입력을 수정합니다. 온도조절기와 자동차 크루즈컨트롤이 대표 사례입니다."},{title:"3장. 전달함수",content:"선형 시스템의 입력과 출력 관계는 라플라스 변환을 이용한 전달함수로 표현할 수 있습니다. 극점과 영점은 시간 응답의 모양을 결정합니다."},{title:"4장. PID 제어",content:"비례항은 현재 오차, 적분항은 누적 오차, 미분항은 오차 변화율에 반응합니다. 세 항의 조합이 빠른 응답과 안정성을 조절합니다."},{title:"5장. 안정도와 실제 적용",content:"안정한 시스템은 작은 교란 후 정상 상태로 돌아옵니다. 과도한 이득과 지연은 진동이나 발산을 일으킬 수 있어 시뮬레이션과 시험이 필요합니다."}]}],tt=[{id:"book-general-science-history",title:"과학 혁명과 현대 학문의 탄생",subject:"general",author:"Science Study 편집부",description:"갈릴레오, 뉴턴, 다윈, 아인슈타인으로 이어지는 과학사적 대전환과 현대 과학 방법론의 뿌리를 다룹니다.",chapters:[{title:"1장. 천동설에서 지동설로: 코페르니쿠스 혁명",content:`천동설이 우주의 유일한 진리로 여겨지던 시절, 코페르니쿠스는 태양을 중심에 두는 지동설을 제안했습니다. 갈릴레오는 망원경 관측으로 목성의 위성과 금성의 위성 변화를 발견해 지동설의 강력한 관측적 증거를 제시했습니다.

이 전환은 단순한 천문학적 모델의 변경이 아니라, 인간 중심의 우주관에서 자연을 객관적 관측과 수학적 언어로 이해하는 현대 과학의 출발점이었습니다.`},{title:"2장. 기하학에서 정량적 물리학으로: 뉴턴의 거대한 통합",content:`뉴턴은 운동의 세 법칙과 만유인력의 법칙을 통해 사과가 떨어지는 현상과 달이 지구를 도는 현상을 하나의 통합된 수학적 법칙으로 설명했습니다.

그는 미적분학을 직접 창안하여 물리학의 법칙들을 엄밀한 수식으로 표현했으며, 이는 이후 모든 현대 자연과학이 정량적 분석을 채택하게 만든 계기가 되었습니다.`},{title:"3장. 화학의 근대화: 연소와 원자론",content:`라부아지에는 플로지스톤 설을 반박하고 정밀한 저울을 이용해 연소가 산소와의 결합 반응임을 밝혔습니다. 이로써 질량 보존 법칙이 확립되었습니다.

뒤이어 돌턴은 원자설을 제안하여 화학반응을 원자들의 재배열로 설명했으며, 화학은 연금술의 유산에서 벗어나 엄밀한 정량 과학으로 자리 잡았습니다.`},{title:"4장. 생명 종의 변화: 다윈의 자연선택",content:`다윈은 갈라파고스 제도 등의 관측 자료를 바탕으로 생물종이 고정된 것이 아니라 세대를 거치며 환경에 적응하여 변화한다는 자연선택 이론을 발표했습니다.

이는 생명 현상을 초자연적 목적이 아닌 물질적·생물학적 원인과 결과로 설명하게 한 생물학 최대의 대전환이었습니다.`},{title:"5장. 현대 물리학의 두 기둥: 상대성과 양자",content:`20세기 초 아인슈타인의 상대성이론은 시공간과 중력에 대한 인식을 완전히 바꿨고, 플랑크·보어·하이젠베르크·슈뢰딩거 등의 양자역학은 미시 세계의 확률적 본질을 밝혀냈습니다.

이 두 기둥은 현대 반도체, 레이저, GPS, 우주론의 이론적 기반이 되어 오늘날 기술 문명을 가능하게 만들었습니다.`}]},{id:"book-physics-thermodynamics-deep",title:"열역학 심화: 통계역학적 연결",subject:"physics",author:"Science Study 편집부",description:"거시적 열역학 법칙과 미시적 통계역학을 앙상블 이론과 에르코드 가설을 통해 깊이 있게 탐구합니다.",chapters:[{title:"1장. 열역학 상태변수와 르장드르 변환",content:`내부에너지 U(S,V,N)로부터 헬름홀츠 자유에너지 F(T,V,N), 엔탈피 H(S,P,N), 깁스 자유에너지 G(T,P,N)를 도출하는 과정은 르장드르 변환에 기초합니다.

각 열역학 포텐셜은 특정 실험 조건(등온, 등압, 등적 등)에서 계의 자발적 변화 방향과 최대 할 수 있는 일을 예측하는 데 최적화되어 있습니다.`},{title:"2장. 정준 및 그랜드 캐노니컬 앙상블",content:`미시정준 앙상블(고립계), 정준 앙상블(열저장고와 에너지 교환), 그랜드 캐노니컬 앙상블(입자 교환 가능)은 볼츠만 인자와 분배함수 Z, 대분배함수 Ξ를 유도하는 틀입니다.

분배함수의 대수적 성질(ln Z의 미분)을 통해 내부 에너지, 압력, 엔트로피, 화학 포텐셜을 통일적으로 계산할 수 있습니다.`},{title:"3장. 맥스웰-볼츠만 분포와 등분배 정리",content:`이상 기체 분자의 속도 분포인 맥스웰-볼츠만 분포는 확률밀도함수로부터 자유도당 평균 에너지가 ½k_BT라는 에너지 등분배 정리를 이끌어냅니다.

이 정리는 고전 분자의 비열을 잘 설명하지만, 저온에서의 비열 동결 현상은 양자역학적 에너지 양자화가 필수적임을 보여줍니다.`},{title:"4장. 양자 통계: 보스-아인슈타인과 페르미-디랙",content:`동일한 양자 입자들의 대칭성에 따라 파울리 배타원리를 따르는 페르미온(전자 등)은 페르미-디랙 통계를, 이를 따르지 않는 보손(광자 등)은 보스-아인슈타인 통계를 따릅니다.

저온에서 보손 기체가 최저 에너지 상태로 집단 응축하는 보스-아인슈타인 응축(BEC)과, 페르미온의 축퇴압은 각각 초유체 및 백색왜성 지탱 원리의 기초가 됩니다.`},{title:"5장. 비평형 열역학과 변동 정리",content:`열역학 평형에서 멀어진 계의 비가시적 소산 현상은 온사거 상호관계와 자발적 플럭스-력 관계로 기술됩니다.

최근의 야르진스키 방등식과 자진스키 변동 정리는 미시계에서 열역학 제2법칙을 확률적 분포 개념으로 확장하여 소형 생체분자 일 계산 등에 응용됩니다.`}]},{id:"book-chemistry-organic-mechanism",title:"유기화학 반응 메커니즘",subject:"chemistry",author:"Science Study 편집부",description:"치환, 탈리, 부가, 입체화학을 포함한 유기화학 핵심 반응 메커니즘을 전자의 이동(굽은 화살표)으로 해석합니다.",chapters:[{title:"1장. 친핵성 친전질성 반응과 굽은 화살표",content:`유기 반응 메커니즘의 핵심은 비공유 전자쌍을 가진 친핵체(Nucleophile)가 전자가 부족한 친전질체(Electrophile)를 공격하는 전자의 이동입니다.

굽은 화살표는 전자쌍의 이동 경로를 정밀하게 표현하는 약속으로, 하전 상태와 공명 구조의 안정을 이해하는 기본 언어입니다.`},{title:"2장. SN1과 SN2 친핵성 치환 반응",content:`SN2 반응은 친핵체의 뒷면 공격과 함께 단일 단계에서 이치환이 일어나며 입체 반전(Walden inversion)이 나타납니다.

반면 SN1 반응은 탄소양이온 중간체를 형성하는 2단계 반응으로, 삼각평면 중간체를 거치므로 라세미화(Racemization)가 일어납니다.`},{title:"3장. E1과 E2 탈리 반응 및 자이체프 규칙",content:`탈리 반응은 알킬 할라이드 등에서 이중결합(알켄)을 형성하는 과정입니다. E2 반응은 안티-평면(anti-periplanar) 기하 구조를 요구하는 동시 단계 반응입니다.

자이체프 규칙에 따라 더 많은 치환기를 가진 안정된 알켄이 주요 생성물로 형성되는 경향을 가집니다.`},{title:"4장. 친전질성 친구 부가 반응과 마르코프니코프 규칙",content:`알켄에 할로겐화 수소(HX)가 부가될 때, 수소는 수소가 더 많은 탄소에 결합한다는 마르코프니코프 규칙은 더 안정한 탄소양이온 중간체의 형성으로 설명됩니다.

입체 화학과 재배열(탄소양이온 이동) 가능성을 함께 고려해야 최종 생성물의 구조를 정확히 예측할 수 있습니다.`},{title:"5장. 방향족 친전질성 치환 반응(EAS)",content:`벤젠 고리는 공명 안정화로 인해 부가 반응 대신 치환 반응(EAS)을 선호합니다. 나이트로화, 할로겐화, 프라이델-크래프츠 반응 등이 포함됩니다.

기존 치환기의 전자 기여/인수 성질에 따라 오르토/파라 지향기 또는 메타 지향기로 작동하며 반응성을 조절합니다.`}]},{id:"book-math-linear-algebra-advanced",title:"고급 선형대수학: 행렬 분해와 응용",subject:"math",author:"Science Study 편집부",description:"특이값 분해(SVD), QR 분해, 긍정정치 행렬, 그리고 인공지능과 데이터 과학에서의 선형대수학 응용을 다룹니다.",chapters:[{title:"1장. 직교성과 그람-슈미트 직교화",content:`내적공간에서 서로 수직인 기저(직교기저)를 만드는 것은 계산의 안정성과 시각화에 매우 중요합니다.

그람-슈미트 과정을 이용하면 임의의 선형독립 기저를 규격화된 직교기저로 변환할 수 있으며, 이는 행렬의 QR 분해(A=QR)의 기초가 됩니다.`},{title:"2장. 대칭행렬과 스펙트럼 정리",content:`실수 대칭행렬 A=Aᵀ는 항상 실수 고유값을 가지며, 직교행렬 Q에 의해 A=QΛQᵀ 형태로 직교대각화가 가능합니다.

스펙트럼 정리는 이차형식의 최적화, 타원의 축 회전, 양자역학의 측정가능량 해석 등 다양한 분야의 핵심 정리입니다.`},{title:"3장. 특이값 분해(SVD)",content:`임의의 m×n 행렬 A는 A=UΣVᵀ 형태의 특이값 분해(SVD)가 가능합니다. 여기서 U와 V는 직교행렬이고 Σ는 특이값을 대각선에 가진 행렬입니다.

SVD는 행렬의 계수(rank), 이미지 압축, 최소제곱법 문제, 노이즈 제거 등 데이터 처리의 가장 강력한 도구입니다.`},{title:"4장. 양의 정치 행렬과 차olesky 분해",content:`모든 0이 아닌 벡터 x에 대해 xᵀAx > 0을 만족하는 대칭행렬을 양의 정치(positive definite) 행렬이라고 합니다.

양의 정치 행렬은 고유값이 모두 양수이며, A=LLᵀ 형태의 차olesky 분해로 매우 빠르고 안정적인 수치 계산이 가능합니다.`},{title:"5장. 데이터 과학과 주성분 분석(PCA)",content:`주성분 분석(PCA)은 고차원 데이터의 분산이 가장 큰 방향(주성분)을 공분산 행렬의 고유벡터로 찾아 차원을 축소하는 기법입니다.

이는 SVD와 직결되며, 머신러닝의 데이터 전처리, 특성 추출, 차원의 축소 시각화에 널리 활용됩니다.`}]},{id:"book-biology-genetics-genomics",title:"유전학에서 유전체학으로",subject:"biology",author:"Science Study 편집부",description:"멘델 유전학에서 시작해 차세대 염기서열 분석(NGS), 유전자 편집(CRISPR), 개인 맞춤 유전체학까지 생명 정보의 혁명을 추적합니다.",chapters:[{title:"1장. 멘델 유전학의 확장: 비멘델 유전 현상",content:`우열의 법칙이나 독립의 법칙에 딱 맞아떨어지지 않는 불완전 우성, 공우성(ABO 혈액형), 다인자 유전, 연쇄와 교차 현상이 관찰됩니다.

같은 염색체에 위치한 유전자들은 함께 유전되는 연쇄 현상을 보이며, 교차율을 계산해 염색체 지도(유전자 지도)를 작성할 수 있습니다.`},{title:"2장. 유전체의 구조와 염기서열 분석",content:`인간 유전체는 약 30억 개의 염기쌍으로 이루어져 있지만, 단백질을 코딩하는 비중은 약 1.5%에 불과하고 나머지는 비코딩 영역과 조절 부위입니다.

생어(Sanger) 염기서열 분석법에서 시작해 병렬 대량 분석이 가능한 차세대 염기서열 분석(NGS)으로 발전하면서 유전체 분석 비용과 시간이 대폭 감소했습니다.`},{title:"3장. 유전자 표현 조절과 후성유전학",content:`DNA 메틸화와 히스톤 변형은 염기서열을 바꾸지 않으면서 유전자 발현을 켜고 끄는 표지역할을 합니다.

이러한 후성유전학적 변경은 환경, 식습관, 스트레스 등에 의해 영향을 받으며, 일부는 세대를 건너 전파되는 경세대 후성유전 현상을 보입니다.`},{title:"4장. CRISPR-Cas9과 정밀 유전자 편집",content:`세균의 세균성 면역계에서 유래한 CRISPR-Cas9 기술은 가이드 RNA를 이용해 목표 DNA 위치를 정밀하게 절단하고 편집할 수 있습니다.

유전병의 원인 변이를 교정하거나 농작물을 개량하는 데 혁신적인 도구이지만, 오프타겟 자르기와 윤리적 이슈(배아 편집)가 함께 논의됩니다.`},{title:"5장. 개인 맞춤 의학과 유전체학의 미래",content:`전체 유전체 분석(WGS)과 정밀 유전체학은 개인의 유전적 소인(단일염기다형성 SNP)을 분석해 암 표적 치료제 선별, 약물 반응 예측, 유전 질환 예방을 가능하게 합니다.

생명정보학(Bioinformatics)과의 융합으로 빅데이터 기반의 정밀 의료 생태계가 빠르게 구축되고 있습니다.`}]},{id:"book-earth-geophysics-plate",title:"지구물리학과 판구조론의 물리",subject:"earthscience",author:"Science Study 편집부",description:"지진파 토모그래피, 중력 이상, 지자기 다이나모, 맨틀 대류의 수치 모델링을 바탕으로 한 지구 내부 물리학입니다.",chapters:[{title:"1장. 지진파 굴절과 반사: 내부 구조의 해독",content:`지진 발생 시 방출되는 P파와 S파는 성분과 속도가 다르며, 불연속면(모호면, 구텐베르크 면, 레만 면)에서 굴절하고 반사합니다.

스넬의 법칙과 주시 곡선을 역산함으로써 지구의 지각-맨틀-외핵-내핵 층상 구조와 층별 밀도·탄성율을 정밀하게 계산할 수 있습니다.`},{title:"2장. 지진파 토모그래피와 맨틀 플룸",content:`의학의 CT 촬영처럼 지구 전역의 지진파 도달 시간 오차를 컴퓨터로 합성하는 지진파 토모그래피를 통해 맨틀 내부의 3차원 온도·밀도 구조를 가시화합니다.

이를 통해 섭입하는 찬 판의 남겨진 조각과, 핵-맨틀 경계에서 솟아오르는 차가운/뜨거운 맨틀 플룸의 존재가 확인되었습니다.`},{title:"3장. 지자기 다이나모와 지자기 역전",content:`지구 외핵은 유체 상태의 철과 니켈로 이루어져 있으며, 자전과 열대류에 의해 유체 전도체가 운동하면서 자기장을 생성합니다(MHD 다이나모 이론).

고지자기 관측에 따르면 지구 자기장은 비선형 카오스적 거동으로 수십만 년마다 N극과 S극이 역전하는 역전 현상을 보입니다.`},{title:"4장. 중력 이상과 지각 평형설",content:`지표면에서 측정한 중력값은 자유공기 보정과 부게 보정을 거쳐 고도와 지형 효과를 제거한 부게 중력 이상(Bouguer anomaly)을 얻습니다.

프라트(Pratt)와 에어리(Airy)의 지각 평형설은 거대한 산맥 아래에 깊은 뿌리가 존재하여 빙하나 산맥의 중력적 균형을 유지함을 설명합니다.`},{title:"5장. 판구조 유동학: Slab Pull과 Ridge Push",content:`판구조를 움직이는 주된 역학적 원동력은 차갑고 무거운 해양 판이 맨틀 속으로 가라앉으며 당기는 힘(Slab Pull)과, 해령 부근의 높이 차에 의해 밀어내는 힘(Ridge Push)입니다.

유동학(Rheology) 관점에서 암석권은 탄성/취성 거동을, 약권은 연성/유체 거동을 보이며 이들의 상호작용이 지진과 화산 분출을 결정합니다.`}]},{id:"book-astronomy-astrophysics-cosmology",title:"현대 천체물리학과 우주론",subject:"astronomy",author:"Science Study 편집부",description:"항성 합성, 중력파 천문학, 프리드만 우주 모형, 급팽창(Inflation) 이론과 암흑 에너지를 정량적으로 다룹니다.",chapters:[{title:"1장. 항성 핵합성과 원소의 연금술",content:`빅뱅 초기에는 수소, 헬륨, 약간의 리튬만 생성되었지만, 별 중심부의 핵융합 반응을 통해 탄소, 산소, 철까지의 원소가 합성됩니다.

철보다 무거운 원소들은 초신성 폭발(r-과정)이나 중성자별 합체 과정에서 발생하는 높은 중성자 플럭스에 의해 합성되어 우주로 뿌려집니다.`},{title:"2장. 일반상대론과 블랙홀 물리",content:`아인슈타인장 방정식 G_μν = 8πG/c⁴ T_μν 은 질량-에너지가 시공간의 곡률을 결정함을 보여줍니다.

슈바르츠실트 해로 기술되는 구형 블랙홀은 사건의 지평선(r_s = 2GM/c²)과 특이점을 가지며, 회전하는 커(Kerr) 블랙홀은 작용권(Ergosphere)을 형성합니다.`},{title:"3장. 프리드만-르메트르-로버트슨-워커(FLRW) 우주 모형",content:`우주론적 원리(우주는 거시적으로 균일하고 등방적이다)에 기반한 FLRW 계량과 프리드만 방정식은 우주 척도인자 a(t)의 시간에 따른 진화를 기술합니다.

우주의 밀도 파라미터 Ω=ρ/ρ_crit 값에 따라 우주의 기하학적 구조(평탄, 닫힘, 열림)가 결정됩니다.`},{title:"4장. 우주배경복사(CMB)와 급팽창 이론",content:`빅뱅 후 38만 년 재결합 시기에 방출된 우주배경복사(CMB)의 2.73K 미세 비등방성은 우주 초기 밀도 요동의 씨앗을 보여줍니다.

초기 우주의 지평선 문제와 평탄성 문제를 해결하기 위해 대통일 시기에 우주가 가속 팽창했다는 급팽창(Inflation) 이론이 제안되었습니다.`},{title:"5장. 가속 팽창과 암흑 에너지의 정체",content:`1998년 Ia형 초신성 관측을 통해 현재 우주가 암흑 에너지에 의해 가속 팽창하고 있음이 발견되었습니다.

암흑 에너지는 상태방정식 w=p/ρ ≈ -1 을 가지는 우주상수(또는 퀸테센스 장)로 이해되며, 우주의 최종 운명을 결정짓는 열쇠입니다.`}]},{id:"book-medicine-pathophysiology-pharmacology",title:"임상의학과 병태생리학의 이해",subject:"medicine",author:"Science Study 편집부",description:"심혈관계, 분비계, 면역계 주요 질환의 발생 메커니즘과 표적 약물 치료의 임상적 원리를 연결합니다.",chapters:[{title:"1장. 죽상경화증과 심혈관 질환의 병태생리",content:`죽상경화증은 혈관 내피세포 손상 후 LDL 콜레스테롤의 침착과 대식세포의 거품세포 형성, 염증 반응으로 인해 지질 파판이 형성되는 과정입니다.

파판이 파열되면 혈전이 형성되어 관상동맥을 막아 협심증 및 심근경색을 유발하며, 스타틴계 약물과 항응고제로 예방·치료합니다.`},{title:"2장. 당뇨병의 분자 기전과 대사 장애",content:`제1형 당뇨병은 자가면역에 의한 췌장 베타세포 파괴로 인슐린이 결핍되는 질환이고, 제2형 당뇨병은 인슐린 저항성과 분비 장애가 복합 작용합니다.

만성 고혈당은 당화최종산물(AGEs) 형성과 단백질 킨나아제 C 활성화를 통해 미세혈관 합병증(신증, 망막증, 신경병증)을 유발합니다.`},{title:"3장. 자가면역질환과 면역관용의 붕괴",content:`면역계가 자기 항원과 비자기 항원을 구분하는 면역관용(Central & Peripheral Tolerance)이 붕괴하면 자가면역질환이 발생합니다.

류마티스 관절염, 루푸스 등은 자가항체와 자가반응성 T세포가 조직을 공격하는 질환으로, TNF-α 억제제 등 생물학적 제제가 임상에 사용됩니다.`},{title:"4장. 암 발생의 분자 기전과 면역항암제",content:`암은 원암유전자(Proto-oncogene)의 활성화와 종양억제유전자(p53, Rb 등)의 불활성화, 아포토시스 회피, 신생혈관 유도 등의 과정을 거쳐 발생합니다.

최근의 면역관문억제제(PD-1/PD-L1 억제제)는 암세포가 면역세포를 회피하는 신호를 차단하여 T세포가 암세포를 공격하도록 돕는 혁신적 치료법입니다.`},{title:"5장. 약물동력학 및 개인 맞춤 약물치료",content:`약물의 체내 흡수, 분포, 대사, 배설(ADME) 과정은 간의 CYP450 유전형 차이에 따라 개인별 혈중 농도가 다르게 나타납니다.

약물유전체학(Pharmacogenomics) 기반의 개인 맞춤 치료는 적정 용량 투여로 치료 효과를 극대화하고 부작용을 최소화하는 정밀의학의 중심축입니다.`}]},{id:"book-classical-mechanics",title:"고전역학의 세계",subject:"physics",author:"Science Study 편집부",description:"뉴턴의 운동법칙부터 상대성이론의 입구까지, 운동과 힘을 다루는 고전역학의 핵심을 소개합니다.",chapters:[{title:"1장. 뉴턴의 세 가지 법칙",content:`뉴턴의 운동법칙은 고전역학의 기초입니다. 제1법칙(관성의 법칙)은 외부 힘이 없으면 물체가 현재의 운동 상태를 유지한다고 말합니다. 제2법칙은 힘, 질량, 가속도의 관계를 F=ma로 정리하며, 힘이 클수록 가속도가 크고 질량이 클수록 가속도가 작아진다는 것을 보여줍니다. 제3법칙은 모든 힘에는 크기가 같고 방향이 반대인 반작용이 존재한다는 것을 말합니다.

이 세 법칙은 일상에서 관찰되는 거의 모든 운동—자동차의 가속, 공의 낙하, 로켓의 추진—을 설명할 수 있는 강력한 틀을 제공합니다. 다만 매우 빠른 속도나 매우 작은 규모에서는 상대성이론과 양자역학이 필요합니다.`},{title:"2장. 에너지와 운동량",content:`에너지는 "일을 할 수 있는 능력"으로 정의되며, 운동에너지(½mv²)와 위치에너지(mgh) 등 여러 형태로 존재합니다. 마찰이 없는 계에서는 역학적 에너지(운동+위치)가 보존되며, 이는 에너지 보존 법칙의 한 예시입니다.

운동량(p=mv)은 질량과 속도의 곱으로 정의되는 벡터량입니다. 외부 힘이 없는 계에서는 총 운동량이 보존되며, 이는 충돌 문제를 분석하는 강력한 도구가 됩니다. 당구공의 충돌, 자동차 사고 분석, 로켓 추진 원리 모두 운동량 보존을 이용해 설명할 수 있습니다.`},{title:"3장. 진동과 파동",content:`용수철에 매달린 추나 시계추처럼 평형점 주위를 반복적으로 오가는 운동을 단진동이라고 합니다. 단진동은 복원력이 변위에 비례하는 특별한 경우(훅의 법칙)에 나타나며, 그 주기는 계의 질량과 강성에만 의존하고 진폭과는 무관합니다.

여러 개의 진동이 공간을 따라 전파되면 파동이 됩니다. 파동은 매질을 통해 에너지를 전달하지만 물질 자체를 멀리 옮기지는 않습니다. 소리, 물결, 지진파는 모두 역학적 파동의 예이며, 파장과 진동수, 속력 사이에는 v=fλ의 관계가 성립합니다.`},{title:"4장. 중력과 궤도 운동",content:`뉴턴의 만유인력 법칙에 따르면 두 물체 사이의 중력은 질량의 곱에 비례하고 거리의 제곱에 반비례합니다(F=Gm₁m₂/r²). 이 법칙은 사과가 땅에 떨어지는 것과 달이 지구를 도는 것을 같은 원리로 설명합니다.

행성의 궤도 운동은 케플러의 세 법칙으로 요약됩니다: 궤도는 타원이며, 태양에 가까울수록 빨리 움직이고(면적속도 일정), 공전주기의 제곱은 궤도 긴반지름의 세제곱에 비례합니다. 이 법칙들은 뉴턴 역학으로부터 수학적으로 유도될 수 있습니다.`},{title:"5장. 상대성이론으로 가는 문",content:`고전역학은 일상적인 속도에서는 매우 정확하지만, 빛의 속도에 가까운 속도에서는 예측이 어긋나기 시작합니다. 아인슈타인의 특수상대성이론은 모든 관성계에서 빛의 속도가 동일하게 관측된다는 원리에서 출발하여, 시간 지연과 길이 수축 같은 놀라운 결과를 이끌어냅니다.

특수상대성이론에서 에너지와 질량은 E=mc²의 관계로 연결되며, 이는 원자력 발전과 핵무기의 이론적 기초가 됩니다. 일반상대성이론은 여기서 더 나아가 중력을 시공간의 곡률로 재해석하며, GPS 위성의 시간 보정 등 실생활에도 적용됩니다.`}]},{id:"book-electromagnetism",title:"전자기학 여행",subject:"physics",author:"Science Study 편집부",description:"전하와 자기장의 상호작용에서 시작해 전자기파와 회로의 기초까지 다루는 전자기학 입문서입니다.",chapters:[{title:"1장. 전하와 전기장",content:`전하는 물질이 가지는 기본적인 성질로, 양전하와 음전하 두 종류가 있습니다. 같은 종류의 전하는 서로 밀어내고 다른 종류는 끌어당기며, 그 힘의 크기는 쿨롱의 법칙 F=kq₁q₂/r²으로 주어집니다.

전기장은 전하 주위의 공간에 전기력이 미치는 영역을 나타내는 개념으로, 시험전하가 받는 힘을 전하량으로 나눈 값(E=F/q)으로 정의됩니다. 전기장을 그림으로 나타낸 전기력선은 양전하에서 나와 음전하로 들어가는 방향으로 그려집니다.`},{title:"2장. 자기장과 전류",content:`전류가 흐르는 도선 주위에는 자기장이 생깁니다. 이는 외르스테드의 실험으로 처음 발견되었으며, 전기와 자기가 서로 무관하지 않다는 것을 보여주는 중요한 발견이었습니다. 앙페르의 법칙은 전류와 그 주위에 생기는 자기장의 관계를 수학적으로 정리합니다.

반대로 변하는 자기장은 전류를 유도할 수 있는데, 이를 전자기 유도라고 하며 패러데이가 발견했습니다. 발전기, 변압기, 인덕션 레인지 모두 이 원리를 이용합니다.`},{title:"3장. 맥스웰 방정식",content:`맥스웰은 전기와 자기에 관한 네 개의 방정식을 통일적으로 정리했습니다: 전기장에 대한 가우스 법칙, 자기장에 대한 가우스 법칙(자기 홀극 없음), 패러데이의 유도 법칙, 그리고 자신이 추가한 변위전류 항을 포함한 앙페르-맥스웰 법칙입니다.

이 네 방정식을 결합하면 전기장과 자기장이 서로를 유도하며 공간을 진행하는 파동방정식이 유도되는데, 그 속도가 놀랍게도 빛의 속도와 일치했습니다. 이로부터 맥스웰은 빛이 전자기파의 일종이라는 것을 이론적으로 예측했습니다.`},{title:"4장. 전자기파의 스펙트럼",content:`전자기파는 파장에 따라 라디오파, 마이크로파, 적외선, 가시광선, 자외선, X선, 감마선으로 분류됩니다. 파장이 짧을수록 광자 하나의 에너지가 커지며(E=hc/λ), 이 때문에 X선이나 감마선은 물질을 투과하거나 화학결합을 끊는 등 더 강한 상호작용을 합니다.

전자기파는 매질 없이도 진공을 통해 전파될 수 있는데, 이는 변하는 전기장이 자기장을 유도하고 변하는 자기장이 다시 전기장을 유도하며 서로를 전파시키기 때문입니다.`},{title:"5장. 회로의 기초",content:`전기 회로는 전압, 전류, 저항이라는 세 가지 기본량으로 분석됩니다. 옴의 법칙 V=IR은 이 셋의 관계를 나타내는 가장 기본적인 식입니다. 저항을 직렬로 연결하면 저항값이 더해지고, 병렬로 연결하면 저항의 역수가 더해집니다.

키르히호프의 법칙은 더 복잡한 회로를 분석하는 도구로, 전류 법칙(한 지점으로 들어오고 나가는 전류의 합이 같다)과 전압 법칙(닫힌 회로에서 전압 변화의 합은 0이다)으로 구성됩니다.`}]},{id:"book-quantum-first-steps",title:"양자역학 첫걸음",subject:"physics",author:"Science Study 편집부",description:"빛의 이중성부터 슈뢰딩거 방정식, 양자컴퓨팅까지 양자역학의 핵심 개념을 쉽게 풀어냅니다.",chapters:[{title:"1장. 빛의 이중성",content:`19세기 말, 빛은 파동으로 여겨졌지만 광전효과 실험은 빛이 입자(광자)처럼 행동한다는 것을 보여주었습니다. 아인슈타인은 광자 하나의 에너지가 E=hf(h는 플랑크 상수, f는 진동수)라는 것을 제안해 이 현상을 설명했습니다.

이후 전자 역시 이중슬릿 실험에서 파동처럼 간섭무늬를 만든다는 것이 밝혀졌습니다. 이는 빛과 물질 모두 입자성과 파동성을 동시에 가진다는 파동-입자 이중성의 발견으로 이어졌습니다.`},{title:"2장. 슈뢰딩거 방정식",content:`슈뢰딩거 방정식은 양자계의 상태가 시간에 따라 어떻게 변하는지를 기술하는 기본 방정식입니다. 계의 상태는 파동함수 ψ로 표현되며, |ψ|²는 입자를 특정 위치에서 발견할 확률 밀도를 나타냅니다.

무한 정사각형 우물이나 조화 진동자 같은 간단한 계에 대해 이 방정식을 풀면, 에너지가 연속적이지 않고 특정 값들만 허용되는 양자화 현상을 확인할 수 있습니다.`},{title:"3장. 불확정성 원리",content:`하이젠베르크의 불확정성 원리는 입자의 위치와 운동량을 동시에 임의로 정확하게 알 수 없다는 것을 말합니다(ΔxΔp≥ℏ/2). 이는 측정 기술의 한계가 아니라 양자계가 가진 근본적인 성질입니다.

이 원리는 우리의 직관과 크게 다른데, 예를 들어 입자의 위치를 매우 정확히 측정하려 할수록 그 운동량은 점점 더 불확실해집니다. 이러한 불확정성은 원자의 안정성, 터널링 효과 등 다양한 양자 현상의 근원이 됩니다.`},{title:"4장. 스핀과 파울리 배타원리",content:`전자는 궤도 운동 외에도 스핀이라는 고유한 각운동량을 가지고 있습니다. 스핀은 고전적인 자전과는 다른 순수하게 양자역학적인 성질로, 전자의 스핀은 항상 +½ 또는 -½ 두 가지 값만 가질 수 있습니다.

파울리 배타원리는 두 개의 동일한 페르미온(전자 등)이 같은 양자상태를 동시에 차지할 수 없다고 말합니다. 이 원리 덕분에 원자 내의 전자들이 서로 다른 궤도에 채워지며, 이는 주기율표의 구조를 결정하는 근본 원리입니다.`},{title:"5장. 양자컴퓨팅 소개",content:`일반 컴퓨터의 비트는 0 또는 1의 값만 가지지만, 양자컴퓨터의 큐비트는 0과 1이 중첩된 상태를 가질 수 있습니다. 이 중첩 성질을 이용하면 특정 문제에서 기존 컴퓨터보다 훨씬 빠르게 계산할 수 있는 가능성이 열립니다.

큐비트들은 얽힘(entanglement)이라는 양자 상관관계를 가질 수도 있는데, 이는 한 큐비트의 상태를 측정하면 멀리 떨어진 다른 큐비트의 상태도 즉시 결정되는 현상입니다. 양자컴퓨팅은 아직 초기 단계이지만 암호학, 신약 개발, 최적화 문제 등에서 큰 가능성을 보이고 있습니다.`}]},{id:"book-chemistry-principles",title:"화학의 기본 원리",subject:"chemistry",author:"Science Study 편집부",description:"원자와 주기율표부터 유기화학 입문까지, 화학을 이해하는 데 필요한 핵심 원리를 정리합니다.",chapters:[{title:"1장. 원자와 주기율표",content:`모든 물질은 원자로 이루어져 있으며, 원자는 양성자와 중성자로 이루어진 원자핵과 그 주위를 도는 전자로 구성됩니다. 원자번호(양성자 수)에 따라 원소가 결정되고, 이 원소들은 화학적 성질의 유사성에 따라 주기율표에 정리되어 있습니다.

주기율표의 세로줄(족)은 원자가전자 수가 같아 화학적 성질이 비슷한 원소들을 모아놓은 것이고, 가로줄(주기)은 전자껍질의 수가 같은 원소들을 나타냅니다. 이 규칙성 덕분에 아직 발견되지 않은 원소의 성질도 예측할 수 있었습니다.`},{title:"2장. 화학결합",content:`원자들은 안정한 전자배치를 이루기 위해 서로 결합합니다. 이온결합은 전자를 완전히 주고받아 양이온과 음이온이 정전기적 힘으로 결합하는 것이고, 공유결합은 전자쌍을 공유하여 결합하는 것입니다.

금속결합은 금속 원자들이 전자를 공유된 "바다"처럼 자유롭게 움직이게 하여 결합하는 방식으로, 금속의 전기 전도성과 연성을 설명합니다. 결합의 종류에 따라 물질의 녹는점, 전기전도성, 용해도 등 성질이 크게 달라집니다.`},{title:"3장. 화학 반응과 화학 평형",content:`화학 반응은 반응물이 생성물로 바뀌는 과정이며, 화학 반응식의 계수는 반응에 참여하는 물질의 몰 비율을 나타냅니다. 반응 속도는 온도, 농도, 촉매 등에 영향을 받습니다.

많은 반응은 정반응과 역반응이 동시에 일어나며, 두 반응의 속도가 같아지면 겉보기에 변화가 없는 것처럼 보이는 화학 평형 상태에 도달합니다. 르샤틀리에의 원리는 평형계에 변화(농도, 압력, 온도 변화)가 가해지면 그 변화를 상쇄하는 방향으로 평형이 이동한다는 것을 설명합니다.`},{title:"4장. 산과 염기",content:`산은 수용액에서 수소이온(H⁺)을 내놓는 물질이고, 염기는 수산화이온(OH⁻)을 내놓거나 수소이온을 받아들이는 물질입니다. pH는 수소이온 농도를 나타내는 척도로, 7보다 작으면 산성, 7보다 크면 염기성, 7이면 중성입니다.

산과 염기가 반응하면 물과 염이 생성되는 중화 반응이 일어납니다. 중화 반응은 일상생활에서도 흔히 활용되는데, 위산과다를 제산제로 완화하거나 산성 토양을 석회로 중화하는 것이 대표적인 예입니다.`},{title:"5장. 유기화학 입문",content:`유기화학은 탄소를 중심으로 이루어진 화합물을 다루는 분야입니다. 탄소는 다른 원자와 최대 네 개의 공유결합을 형성할 수 있어 사슬, 고리, 가지 등 매우 다양한 구조의 분자를 만들 수 있습니다.

탄화수소(탄소와 수소로만 이루어진 화합물)는 단일결합만 있는 알케인, 이중결합이 있는 알켄, 삼중결합이 있는 알카인으로 나뉩니다. 여기에 산소, 질소 등이 결합한 작용기(알코올기, 카복실기 등)가 붙으면 물질의 화학적 성질이 크게 달라지며, 이것이 생명체를 이루는 복잡한 분자들의 기초가 됩니다.`}]},{id:"book-life-science",title:"생명과학 탐구",subject:"biology",author:"Science Study 편집부",description:"세포의 구조부터 진화론, 인체의 항상성까지 생명현상의 원리를 폭넓게 다룹니다.",chapters:[{title:"1장. 세포의 구조",content:`세포는 생명체를 이루는 가장 기본적인 단위입니다. 모든 세포는 세포막으로 둘러싸여 있으며, 그 안에 유전정보를 담은 핵(또는 핵양체)과 다양한 세포소기관을 가지고 있습니다.

동물세포와 식물세포는 기본 구조는 비슷하지만, 식물세포에는 광합성을 하는 엽록체와 세포 모양을 유지하는 세포벽, 물과 양분을 저장하는 큰 액포가 추가로 존재합니다. 미토콘드리아는 세포호흡을 통해 에너지를 생산하는 발전소 역할을 합니다.`},{title:"2장. 유전과 DNA",content:`DNA는 유전정보를 담고 있는 이중나선 구조의 분자로, 네 종류의 염기(A, T, G, C)의 서열로 정보를 저장합니다. 유전자는 DNA의 특정 구간으로, 특정 단백질을 만드는 정보를 담고 있습니다.

멘델은 완두콩 교배 실험을 통해 우열의 법칙, 분리의 법칙, 독립의 법칙이라는 유전의 기본 원리를 발견했습니다. 오늘날에는 DNA 염기서열 분석 기술의 발전으로 유전병 진단, 유전자 치료, 맞춤 의학 등이 가능해지고 있습니다.`},{title:"3장. 진화론",content:`다윈의 자연선택설은 환경에 더 잘 적응한 개체가 살아남아 더 많은 자손을 남기고, 그 결과 집단의 유전적 특성이 세대를 거치며 변화한다는 이론입니다. 이는 오늘날까지 관찰과 실험으로 뒷받침되는 생물학의 핵심 이론입니다.

진화는 개별 생물이 의도적으로 변화하는 것이 아니라, 집단 내에서 유리한 유전적 변이를 가진 개체의 비율이 세대를 거치며 늘어나는 과정입니다. 항생제 내성균의 출현은 오늘날에도 관찰할 수 있는 자연선택의 대표적인 예입니다.`},{title:"4장. 생태계와 에너지 흐름",content:`생태계는 생물과 그 생물을 둘러싼 환경이 서로 영향을 주고받는 하나의 체계입니다. 에너지는 태양에서 시작해 생산자(식물)를 거쳐 소비자, 분해자로 흘러가며, 각 단계를 거칠 때마다 에너지의 상당 부분이 열로 손실됩니다.

이 때문에 먹이사슬의 상위 단계로 갈수록 이용 가능한 에너지와 개체 수가 줄어드는 생태 피라미드가 형성됩니다. 물질(탄소, 질소 등)은 에너지와 달리 생태계 내에서 순환하며 반복적으로 사용됩니다.`},{title:"5장. 인체의 항상성",content:`우리 몸은 체온, 혈당, 수분과 이온 농도 등 다양한 내부 환경을 일정한 범위로 유지하려고 끊임없이 노력합니다. 이를 항상성이라고 하며, 대부분 변화를 감지하면 반대 방향으로 되돌리는 음성 되먹임 방식으로 조절됩니다.

면역계는 항상성 유지의 또 다른 중요한 축으로, 병원체의 침입에 맞서 몸을 보호합니다. 선천면역은 병원체 종류와 무관하게 신속히 작동하고, 후천면역은 특정 병원체를 기억하여 재감염 시 더 빠르고 강력하게 대응합니다.`}]},{id:"book-earth-history",title:"지구의 역사",subject:"earthscience",author:"Science Study 편집부",description:"지구의 형성부터 판구조론, 기후와 지질시대까지 지구를 이해하는 큰 그림을 제공합니다.",chapters:[{title:"1장. 지구의 형성",content:`약 46억 년 전, 태양계는 거대한 가스와 먼지 구름(성운)이 중력에 의해 수축하며 형성되었습니다. 원시 지구는 미행성체들의 충돌과 집적을 통해 점점 커졌고, 초기에는 매우 뜨거워 표면이 녹아있는 마그마의 바다 상태였습니다.

시간이 지나며 지구는 식어갔고, 무거운 철과 니켈은 가라앉아 핵을 이루었으며 가벼운 규산염 물질은 떠올라 맨틀과 지각을 형성했습니다. 이 과정을 분화(differentiation)라고 하며, 오늘날 지구 내부의 층상 구조(핵-맨틀-지각)를 만든 근본 원인입니다.`},{title:"2장. 판구조론",content:`지구의 겉면은 여러 개의 단단한 판으로 나뉘어 있으며, 이 판들은 그 아래 맨틀의 대류에 의해 매우 천천히(연간 몇 cm) 움직입니다. 판의 경계는 발산 경계(판이 갈라짐), 수렴 경계(판이 부딪힘), 보존 경계(판이 어긋남)로 나뉩니다.

판구조론은 대륙의 모양이 퍼즐처럼 맞아떨어지는 이유, 지진과 화산의 분포, 산맥의 형성 등을 통일적으로 설명하는 지구과학의 핵심 이론입니다. 고지자기 자료와 해저 지각의 나이 분포는 이 이론을 뒷받침하는 강력한 증거입니다.`},{title:"3장. 암석과 광물",content:`암석은 화성암, 퇴적암, 변성암 세 종류로 나뉩니다. 화성암은 마그마가 식어 굳어진 암석, 퇴적암은 퇴적물이 다져지고 굳어진 암석, 변성암은 열과 압력을 받아 기존 암석의 성질이 변한 암석입니다.

이 세 종류의 암석은 서로 순환하며 변할 수 있는데, 이를 암석의 순환이라고 합니다. 화성암이 풍화되어 퇴적암이 되고, 퇴적암이 깊이 묻혀 열과 압력을 받으면 변성암이 되며, 변성암이 녹으면 다시 마그마가 되어 화성암을 만드는 순환이 지속됩니다.`},{title:"4장. 기후와 대기",content:`지구의 대기는 질소와 산소를 주성분으로 하며, 온실기체(이산화탄소, 메탄, 수증기 등)는 태양복사로 데워진 지표면의 열이 우주로 빠져나가는 것을 막아 지구를 적당히 따뜻하게 유지합니다. 이를 온실효과라고 합니다.

산업혁명 이후 화석연료 사용 증가로 대기 중 이산화탄소 농도가 크게 늘어나면서 온실효과가 강화되어 지구 평균 기온이 상승하는 지구온난화가 진행되고 있습니다. 이는 빙하 감소, 해수면 상승, 이상기후 등 다양한 영향을 미치고 있습니다.`},{title:"5장. 지질시대와 화석",content:`지구의 46억 년 역사는 화석과 암석 기록을 바탕으로 누대, 대, 기, 세 등의 단위로 나뉜 지질시대로 구분됩니다. 화석은 과거 생물의 흔적이 암석 속에 보존된 것으로, 지구 생명의 역사를 재구성하는 중요한 증거입니다.

지질시대 동안 여러 차례의 대량절멸이 있었는데, 가장 유명한 것은 약 6600만 년 전 공룡을 비롯한 많은 생물이 멸종한 사건으로, 거대한 소행성 충돌이 주요 원인으로 여겨집니다. 이러한 대량절멸 이후에는 새로운 생물군이 번성하며 생태계가 재편되었습니다.`}]},{id:"book-astronomy-universe",title:"우주와 천문학",subject:"astronomy",author:"Science Study 편집부",description:"태양계에서 은하, 빅뱅이론과 외계행성 탐사까지 우주를 향한 인류의 탐구를 소개합니다.",chapters:[{title:"1장. 태양계",content:`태양계는 태양을 중심으로 8개의 행성, 수많은 위성, 소행성, 혜성 등으로 이루어져 있습니다. 태양에 가까운 수성, 금성, 지구, 화성은 암석으로 이루어진 지구형 행성이고, 목성, 토성, 천왕성, 해왕성은 기체와 얼음으로 이루어진 목성형 행성입니다.

태양계는 약 46억 년 전 거대한 성운이 중력에 의해 수축하며 형성되었습니다. 중심부는 압축되어 태양이 되었고, 주변의 원반에서는 미행성체들이 충돌과 합체를 반복하며 오늘날의 행성들을 만들었습니다.`},{title:"2장. 별의 탄생과 죽음",content:`별은 성운 속 가스와 먼지가 중력으로 뭉치면서 탄생합니다. 중심부의 온도와 압력이 충분히 높아지면 수소 핵융합이 시작되어 별이 스스로 빛나기 시작합니다. 이 단계를 주계열성이라고 하며, 별은 일생의 대부분을 이 단계에서 보냅니다.

별의 최후는 질량에 따라 달라집니다. 태양 정도의 별은 적색거성을 거쳐 백색왜성으로 조용히 생을 마치지만, 훨씬 무거운 별은 초신성으로 극적으로 폭발한 뒤 중성자별이나 블랙홀을 남깁니다.`},{title:"3장. 은하와 우주의 구조",content:`은하는 수억에서 수천억 개의 별, 가스, 먼지, 암흑물질이 중력으로 묶여있는 거대한 천체입니다. 은하는 모양에 따라 나선은하, 타원은하, 불규칙은하로 분류됩니다. 우리은하는 태양을 포함해 수천억 개의 별을 가진 나선은하입니다.

은하들은 무작위로 흩어져 있지 않고 은하단, 초은하단과 같은 거대한 구조를 이루며, 우주 전체는 이러한 구조들이 거미줄처럼 연결된 우주거대구조를 형성하고 있습니다.`},{title:"4장. 빅뱅이론",content:`빅뱅이론은 우주가 약 138억 년 전 매우 작고 뜨거운 상태에서 시작되어 계속 팽창해 왔다는 이론입니다. 허블의 관측(멀리 있는 은하일수록 빠르게 멀어짐)과 우주배경복사(빅뱅의 잔광)는 이 이론을 뒷받침하는 핵심 증거입니다.

빅뱅은 이미 존재하던 공간 속의 폭발이 아니라 공간 자체가 팽창하기 시작한 사건입니다. 오늘날에도 우주는 계속 팽창하고 있으며, 최근 관측에 따르면 그 팽창 속도가 점점 빨라지고 있어 암흑에너지라는 미지의 존재가 논의되고 있습니다.`},{title:"5장. 외계행성 탐사",content:`1995년 태양이 아닌 다른 별 주위를 도는 첫 외계행성이 발견된 이후, 지금까지 수천 개의 외계행성이 확인되었습니다. 외계행성은 별의 밝기가 주기적으로 살짝 어두워지는 것을 관측하는 통과법이나, 별의 미세한 흔들림을 측정하는 시선속도법 등으로 찾아냅니다.

과학자들은 특히 액체 상태의 물이 존재할 수 있는 온도 범위인 "생명가능지대(habitable zone)"에 위치한 지구형 외계행성을 찾는 데 큰 관심을 기울이고 있으며, 이는 외계생명체 탐사와 직결되는 중요한 연구 분야입니다.`}]},{id:"book-mathematical-thinking",title:"수학적 사고",subject:"math",author:"Science Study 편집부",description:"수와 연산의 기초에서 미적분과 확률·통계까지, 수학적으로 생각하는 방법을 안내합니다.",chapters:[{title:"1장. 수와 연산",content:`수학은 자연수에서 출발해 정수, 유리수, 실수, 복소수로 그 범위를 넓혀왔습니다. 각 확장은 이전 수 체계에서는 풀 수 없었던 문제(뺄셈, 나눗셈, 제곱근 등)를 해결하기 위해 이루어졌습니다.

연산의 성질(교환법칙, 결합법칙, 분배법칙)은 복잡한 계산을 체계적으로 다룰 수 있게 해주는 규칙입니다. 이러한 성질을 이해하면 단순 암기를 넘어 왜 특정 계산 방법이 성립하는지 논리적으로 설명할 수 있습니다.`},{title:"2장. 대수와 방정식",content:`대수학은 미지수를 문자로 나타내고 그 사이의 관계를 식으로 표현하여 다루는 수학 분야입니다. 방정식은 등식의 성질(양변에 같은 연산을 적용해도 등식이 유지됨)을 이용해 미지수의 값을 구하는 과정입니다.

일차방정식에서 이차방정식, 나아가 연립방정식으로 다루는 문제의 복잡도가 커지면서, 인수분해나 근의 공식 같은 체계적인 풀이 방법이 개발되었습니다. 이러한 대수적 사고는 물리학, 공학, 경제학 등 다양한 분야에서 현실 문제를 수식으로 모델링하는 기초가 됩니다.`},{title:"3장. 함수와 그래프",content:`함수는 하나의 입력값에 하나의 출력값을 대응시키는 규칙입니다. 함수를 그래프로 나타내면 변수 사이의 관계를 시각적으로 파악할 수 있어, 증가와 감소, 최댓값과 최솟값 등의 성질을 직관적으로 이해할 수 있습니다.

일차함수, 이차함수, 지수함수, 로그함수 등 다양한 함수는 각각 서로 다른 변화 패턴을 나타내며, 실생활의 다양한 현상(선형 성장, 포물선 운동, 인구 증가, 방사성 붕괴 등)을 모델링하는 데 사용됩니다.`},{title:"4장. 미적분 입문",content:`미분은 함수의 순간적인 변화율을 다루는 도구로, 그래프 위 한 점에서의 접선의 기울기로 해석할 수 있습니다. 적분은 미분의 역과정으로, 곡선 아래의 넓이를 구하거나 변화율로부터 전체 변화량을 복원하는 데 사용됩니다.

미적분학의 기본정리는 미분과 적분이 서로 역연산 관계에 있다는 것을 보여주며, 이는 뉴턴과 라이프니츠에 의해 독립적으로 발견된 수학사의 위대한 성취 중 하나입니다. 오늘날 미적분은 물리학, 공학, 경제학 등에서 변화를 다루는 거의 모든 분야의 기초 언어로 사용됩니다.`},{title:"5장. 확률과 통계",content:`확률은 불확실한 상황에서 특정 사건이 일어날 가능성을 수치로 나타내는 수학 분야입니다. 동전 던지기나 주사위 굴리기 같은 단순한 예에서 시작해, 복잡한 사건의 확률을 계산하는 다양한 방법이 발전해왔습니다.

통계학은 자료를 수집, 정리, 분석하여 의미 있는 정보를 이끌어내는 학문입니다. 평균과 표준편차 같은 대표값과 산포도, 표본으로부터 모집단의 성질을 추론하는 통계적 추정 등은 과학 연구, 여론 조사, 의학 실험 등 현대 사회의 의사결정에 폭넓게 활용됩니다.`}]},{id:"book-human-body-medicine",title:"인체와 의학",subject:"medicine",author:"Science Study 편집부",description:"인체 시스템의 작동 원리부터 면역, 유전질환, 공중보건까지 의학의 기초를 다룹니다.",chapters:[{title:"1장. 인체 시스템 개관",content:`인체는 신경계, 순환계, 호흡계, 소화계, 배설계, 근골격계, 내분비계 등 여러 시스템이 서로 협력하여 생명을 유지합니다. 각 시스템은 독립적으로 작동하는 것이 아니라 신경계와 내분비계의 신호를 통해 긴밀히 조율됩니다.

예를 들어 운동을 하면 근골격계가 에너지를 필요로 하고, 이에 맞춰 순환계는 심박수를 높여 더 많은 산소와 영양분을 공급하며, 호흡계는 호흡을 빠르게 하여 산소 공급을 늘립니다. 이러한 통합적 조절이 항상성 유지의 핵심입니다.`},{title:"2장. 면역과 감염",content:`면역계는 병원체(세균, 바이러스 등)로부터 몸을 보호하는 방어 시스템입니다. 선천면역은 피부, 점막, 백혈구의 식균작용처럼 병원체 종류와 무관하게 즉시 작동하는 방어이고, 후천면역은 특정 병원체를 인식하고 기억하는 항체와 기억세포를 통한 더 정교한 방어입니다.

감염병은 병원체가 몸에 침입해 증식하며 일으키는 질병으로, 백신 접종은 실제 감염 없이 면역계에 병원체를 미리 학습시켜 향후 감염 시 빠르게 대응할 수 있게 하는 예방 방법입니다.`},{title:"3장. 유전질환",content:`유전질환은 부모로부터 물려받은 유전자의 이상으로 발생하는 질병입니다. 하나의 유전자 이상으로 발생하는 단일유전자 질환(예: 낭포성 섬유증)도 있고, 여러 유전자와 환경 요인이 복합적으로 작용하는 다인성 질환(예: 당뇨병, 고혈압)도 있습니다.

최근 유전체 분석 기술의 발전으로 유전질환의 조기 진단과 맞춤형 치료(정밀의학)가 가능해지고 있으며, 유전자 편집 기술은 일부 유전질환의 근본적인 치료 가능성을 열어가고 있습니다.`},{title:"4장. 약리학 기초",content:`약물은 몸속에서 특정 수용체나 효소와 결합하여 생리적 반응을 일으키거나 억제합니다. 약물의 효과는 용량에 따라 달라지며, 너무 적으면 효과가 없고 너무 많으면 독성을 나타낼 수 있어 적절한 용량 설정이 중요합니다.

약물은 몸에 흡수, 분포, 대사, 배설되는 과정을 거치며, 이 과정을 연구하는 분야를 약동학이라고 합니다. 간과 신장은 약물 대사와 배설에 중요한 역할을 하며, 이 기관의 기능이 저하되면 약물 용량 조절이 필요할 수 있습니다.`},{title:"5장. 공중보건",content:`공중보건은 개인의 치료를 넘어 지역사회와 인구 집단 전체의 건강을 증진하고 질병을 예방하는 분야입니다. 예방접종 프로그램, 상수도 위생, 금연 정책 등은 공중보건의 대표적인 성공 사례로, 개별 치료보다 훨씬 적은 비용으로 많은 생명을 구했습니다.

감염병 유행 시에는 역학조사를 통해 전파 경로를 파악하고, 격리, 검역, 백신 접종 등의 조치를 통해 확산을 억제합니다. 이러한 공중보건 개입은 개인의 자유와 집단의 안전 사이의 균형을 고려해야 하는 사회적 논의를 동반하기도 합니다.`}]},{id:"book-scientific-method",title:"과학적 탐구 방법",subject:"general",author:"Science Study 편집부",description:"과학이 어떻게 지식을 만들어가는지, 실험 설계와 데이터 분석의 기본 원리를 소개합니다.",chapters:[{title:"1장. 과학적 방법론",content:`과학적 방법은 관찰, 가설 설정, 실험, 결과 분석, 결론 도출의 순환 과정을 통해 자연현상을 이해하는 체계적인 접근법입니다. 가설은 검증 가능해야 하며, 실험 결과가 가설과 맞지 않으면 가설을 수정하거나 폐기해야 합니다.

과학 지식은 한 번의 실험으로 확정되지 않고, 여러 독립적인 연구자들이 반복 검증하며 점차 신뢰도를 높여갑니다. 이 때문에 과학은 "절대적 진리"를 선언하기보다 현재까지의 증거로 가장 잘 설명되는 이론을 잠정적으로 받아들이는 특징을 가집니다.`},{title:"2장. 실험 설계",content:`좋은 실험은 조사하려는 변인(독립변인) 외의 다른 조건들을 동일하게 통제하여, 관찰된 결과(종속변인)의 변화가 오직 그 변인 때문이라고 확신할 수 있게 설계되어야 합니다. 이를 위해 대조군과 실험군을 비교하는 방법이 널리 사용됩니다.

무작위 배정과 이중맹검법(연구자와 참가자 모두 어떤 그룹인지 모르게 하는 것)은 연구자의 편향이나 위약효과가 결과에 영향을 미치는 것을 줄이는 중요한 기법입니다.`},{title:"3장. 데이터 분석",content:`실험에서 얻은 데이터는 표와 그래프로 정리하여 패턴을 파악합니다. 평균, 중앙값 같은 대표값과 표준편차 같은 산포도는 데이터의 특징을 요약하는 데 사용됩니다.

두 변인 사이의 관계를 파악할 때는 상관관계와 인과관계를 구분하는 것이 중요합니다. 두 변인이 함께 변화하는 상관관계가 있다고 해서 하나가 다른 하나의 원인이라고 단정할 수 없으며, 제3의 변인이 둘 다에 영향을 미치는 경우도 흔히 있습니다.`},{title:"4장. 오차와 불확실성",content:`모든 측정에는 오차가 존재합니다. 우연오차는 측정할 때마다 무작위로 발생하는 작은 편차로 여러 번 측정해 평균을 내면 줄일 수 있지만, 계통오차는 측정 기구나 방법의 문제로 항상 같은 방향으로 치우치는 오차로 평균을 내도 사라지지 않습니다.

과학자들은 측정값을 보고할 때 오차 범위(불확도)를 함께 제시하여, 그 값이 얼마나 신뢰할 수 있는지를 나타냅니다. 이는 "정확한 값을 안다"는 과장된 주장을 피하고 과학적 겸손함을 유지하는 중요한 관행입니다.`},{title:"5장. 과학과 사회",content:`과학 지식은 진공 속에서 만들어지지 않으며, 연구비 지원, 윤리적 기준, 사회적 가치 등 다양한 사회적 맥락 속에서 생산됩니다. 과학자들은 연구 결과를 동료 평가(peer review)를 거쳐 학술지에 발표함으로써 다른 전문가들의 검증을 받습니다.

이"],steps:["1. 자석을 준비합니다","2. 다양한 물체를 자석에 가까이 합니다","3. 붙는 물체와 붙지 않는 물체를 분류합니다","4. 붙는 물체의 공통점을 찾습니다"],safetyWarning:"강한 자석은 조심스럽게 다루세요"},questions:["elem-sci-01-q01","elem-sci-01-q02","elem-sci-01-q03","elem-sci-01-q04","elem-sci-01-q05","elem-sci-01-q06"]},{id:"elem-sci-02",subject:"biology",grade:5,level:"basic",unit:"생물과 환경",title:"식물의 성장",summary:"식물은 햇빛, 물, 공기, 흙에서 얻는 영양분으로 자란다.",keywords:["식물","광합성","뿌리","줄기","잎"],misconceptions:["식물은 흙에서 영양분을 흡수한다","식물은 호흡하지 않는다"],explanation:{basic:"식물은 햇빛을 받으면 자라갑니다. 뿌리는 물을 빨아들이고, 잎은 햇빛을 받습니다. 식물은 이들을 이용해 양분을 만들어 자라납니다.",curriculum:"광합성: 식물이 햇빛 에너지를 화학 에너지(포도당)로 변환. 반응식: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂. 호흡작용: 식물도 산소를 호흡한다.",university:"C3 광합성과 C4 광합성. RuBisCO 효소의 역할. 광계 I, II와 전자전달계. Calvin cycle. 엽록체의 틸라코이드와 스트로마 구조."},examples:["해바라기는 햇빛을 따라 회전한다","씨앗이 흙에 심어지면 싹이 난다","넝쿨식물은 벽을 타고 올라간다"],observationActivity:{title:"콩나물 기르기",description:"콩을 물에 불려 빛과 어둠 환경에서 기르며 성장 차이를 관찰합니다.",prediction:"빛을 받은 콩이 더 빨리 자랄 것이다",materials:["콩","물","용기","자"],steps:["1. 콩을 물에 불립니다","2. 용기 두 개에 나누어 담습니다","3. 한 개는 빛이 드는 곳에, 다른 하나는 어두운 곳에 놓습니다","4. 매일 물을 주고 자라는 높이를 측정합니다"],safetyWarning:"곰팡이가 피지 않도록 적절히 통풍시켜주세요"},questions:["elem-sci-02-q01","elem-sci-02-q02","elem-sci-02-q03","elem-sci-02-q04","elem-sci-02-q05","elem-sci-02-q06"]},{id:"elem-sci-03",subject:"earthscience",grade:6,level:"basic",unit:"지구와 우주",title:"지구의 자전과 공전",summary:"지구는 자신의 축 주위로 자전하며 태양 주위를 공전한다.",keywords:["자전","공전","시간대","계절","낮과 밤"],misconceptions:["지구 자전이 빠르면 물체가 날아간다","공전 때문에 하루가 생긴다"],explanation:{basic:"지구는 하루에 한 바퀴 도네요(자전). 이 때문에 낮과 밤이 생깁니다. 지구는 또한 1년에 태양 주위를 한 바퀴 돕니다(공전). 이 때문에 계절이 바뀝니다.",curriculum:"자전 주기: 약 24시간. 자전 방향: 서에서 동으로. 공전 주기: 약 365.25일. 자전축 기울기: 23.5도 → 계절 변화.",university:"지구의 각속도 ω = 2π/24hr. 원심 가속도 a = ωr (적도 ≈ 0.034 m/s²). 공전 궤도 반지름 ≈ 1.496×10¹¹ m (1 AU). 공전 속도 ≈ 30 km/s."},examples:["해는 동쪽에서 떠서 서쪽으로 진다","봄에는 날이 길어지고 가을에는 짧아진다","남반구에서는 계절이 반대이다"],observationActivity:{title:"그림자 길이 변화 관찰",description:"같은 위치에서 하루 동안 물체의 그림자 길이를 여러 번 측정합니다.",prediction:"정오에 그림자가 가장 짧을 것이다",materials:["막대","자","종이"],steps:["1. 막대를 수직으로 세웁니다","2. 아침, 오전, 정오, 오후, 저녁에 그림자 길이를 재봅니다","3. 시간별 그림자 길이를 기록합니다","4. 결과를 그래프로 그립니다"],safetyWarning:"햇빛이 강할 때 눈을 보호하세요"},questions:["elem-sci-03-q01","elem-sci-03-q02","elem-sci-03-q03","elem-sci-03-q04","elem-sci-03-q05","elem-sci-03-q06"]},{id:"elem-sci-04",subject:"physics",grade:4,level:"basic",unit:"물질과 에너지",title:"열의 이동",summary:"열은 뜨거운 곳에서 찬 곳으로 이동한다.",keywords:["열","온도","온난한","전도","대류"],misconceptions:["찬 것이 뜨거운 곳에 있는 것이다","열과 온도는 같다"],explanation:{basic:"뜨거운 물과 찬 물이 섞이면 따뜻한 물이 된다. 이것이 열이 이동하는 것입니다. 열은 항상 뜨거운 곳에서 찬 곳으로 움직인다.",curriculum:"열 전도: 물질을 통한 에너지 전달. 열 대류: 유체의 흐름을 통한 열 이동. 열복사: 전자기파를 통한 열 전달. Q = mcΔT.",university:"열 도도율(thermal conductivity) κ. Fourier의 열전도 방정식: q = -κ∇T. 대류 열전달 계수 h. Stefan-Boltzmann 법칙: P = σAT⁴."},examples:["금속 숟가락을 뜨거운 물에 담그면 손잡이도 뜨거워진다","라디에이터 주변 공기가 올라간다","햇빛이 검은 물체를 더 많이 데운다"],observationActivity:{title:"물의 냉각 속도 측정",description:"뜨거운 물을 다양한 용기에 담아 식는 속도를 비교합니다.",prediction:"금속 용기에 담긴 물이 가장 빨리 식을 것이다",materials:["뜨거운 물","유리잔","금속잔","종이컵","온도계"],steps:["1. 각 용기에 같은 양의 뜨거운 물을 붓습니다","2. 1분마다 온도를 측정합니다","3. 15분 동안 계속 측정합니다","4. 냉각 속도를 비교합니다"],safetyWarning:"매우 뜨거운 물입니다. 화상을 입지 않도록 주의하세요"},questions:["elem-sci-04-q01","elem-sci-04-q02","elem-sci-04-q03","elem-sci-04-q04","elem-sci-04-q05","elem-sci-04-q06"]},{id:"elem-sci-05",subject:"biology",grade:5,level:"basic",unit:"생물과 환경",title:"동물의 생식과 성장",summary:"동물은 암컷과 수컷이 만나서 새로운 생명을 만든다.",keywords:["생식","번식","태자","알","성장"],misconceptions:["모든 동물이 알을 낳는다","새끼 동물은 어른 동물의 축소판이다"],explanation:{basic:"많은 동물들은 암수가 새끼를 낳는다. 어떤 동물은 알을 낳고, 어떤 동물은 새끼를 낳는다. 새끼는 점차 자라서 어른이 된다.",curriculum:"무성생식(분열, 출아) vs 유성생식(암수 결합). 난생(알 낳음), 태생(새끼 낳음), 반태생. 변태: 완전변태(달걀-유충-번데기-성충), 불완전변태.",university:"게임 이론적 성비 결정 이론. 유성생식의 진화적 장점: 유전적 다양성. Meiosis와 유전 정보 혼합. 다양한 생식 전략의 진화적 트레이드오프."},examples:["개미는 여왕개미가 알을 낳는다","나비는 애벌레에서 나비로 변한다","사람은 어머니 뱃속에서 자란다"],observationActivity:{title:"나방 또는 나비의 변태 관찰",description:"나방이나 나비의 알에서 성충까지의 변태 과정을 관찰합니다.",prediction:"약 한 달 후 나방이 나타날 것이다",materials:["나방 애벌레(키트)","먹이","용기"],steps:["1. 나방 키트를 준비합니다","2. 매일 애벌레의 모습을 관찰하고 기록합니다","3. 번데기로 변하는 과정을 촬영합니다","4. 성충이 나타날 때까지 기록합니다"],safetyWarning:"생명체를 소중히 다루고, 실험 후 적절히 방생하세요"},questions:["elem-sci-05-q01","elem-sci-05-q02","elem-sci-05-q03","elem-sci-05-q04","elem-sci-05-q05","elem-sci-05-q06"]},{id:"elem-chem-01",subject:"chemistry",grade:4,level:"basic",unit:"물질의 성질",title:"물질의 상태 변화",summary:"물질은 고체, 액체, 기체 상태로 존재하며 온도에 따라 상태가 바뀐다.",keywords:["고체","액체","기체","녹는점","끓는점"],misconceptions:["기체는 무게가 없다","얼음이 녹으면 다른 물질이 된다"],explanation:{basic:"물은 얼면 얼음(고체)이 되고, 데우면 물(액체)에서 수증기(기체)가 됩니다. 물질의 종류는 바뀌지 않고 상태만 바뀝니다.",curriculum:"상태 변화: 융해(고체→액체), 응고(액체→고체), 기화(액체→기체), 액화(기체→액체), 승화(고체↔기체). 각 물질은 고유한 녹는점과 끓는점을 가집니다.",university:"상평형 다이어그램(phase diagram)의 P-T 곡선. 삼중점과 임계점. 상전이의 잠열(latent heat)과 Clausius-Clapeyron 방정식 dP/dT = L/(TΔV)."},deepDive:["물질의 상태는 입자 사이의 거리와 운동 에너지로 설명됩니다. 고체는 입자가 규칙적으로 배열되어 진동만 하고, 액체는 입자들이 서로 미끄러지듯 움직이며, 기체는 입자들이 자유롭게 날아다닙니다.","상태가 변할 때 온도가 잠시 멈추는 구간이 있는데, 이는 흡수하거나 방출한 열이 온도를 올리는 대신 입자 배열을 바꾸는 데(잠열) 사용되기 때문입니다."],examples:["얼음이 녹아 물이 된다","물을 끓이면 수증기가 된다","드라이아이스는 액체 없이 바로 기체가 된다(승화)"],observationActivity:{title:"얼음이 녹는 시간 측정",description:"같은 크기의 얼음을 다른 환경에서 녹이며 녹는 속도를 비교합니다.",prediction:"따뜻한 곳의 얼음이 더 빨리 녹을 것이다",materials:["얼음 조각","접시 2개","온도계","시계"],steps:["1. 같은 크기의 얼음을 두 접시에 놓습니다","2. 하나는 실온에, 하나는 따뜻한 곳에 둡니다","3. 5분마다 녹은 정도를 관찰합니다","4. 완전히 녹는 데 걸린 시간을 비교합니다"],safetyWarning:"뜨거운 물을 사용할 때는 화상에 주의하세요"},questions:["elem-chem-01-q01","elem-chem-01-q02","elem-chem-01-q03","elem-chem-01-q04","elem-chem-01-q05","elem-chem-01-q06"]},{id:"elem-math-01",subject:"math",grade:4,level:"basic",unit:"수와 연산",title:"분수와 소수의 이해",summary:"전체를 여러 부분으로 나눈 것을 분수와 소수로 나타낼 수 있다.",keywords:["분수","소수","분자","분모","자리값"],misconceptions:["분모가 클수록 분수의 크기도 크다","분수는 소수로 나타낼 수 없다"],explanation:{basic:"피자를 4조각으로 나누면 한 조각은 전체의 1/4입니다. 분수는 전체를 몇 개로 나누었는지(분모)와 그중 몇 개를 가졌는지(분자)로 나타냅니다.",curriculum:"분수 a/b는 b등분한 것 중 a개를 의미합니다. 분수는 나눗셈 a÷b와 같으며 소수로 변환할 수 있습니다(예: 1/4 = 0.25). 통분과 약분으로 크기를 비교합니다.",university:"유리수 체계 ℚ에서 분수는 정수의 순서쌍 동치류로 정의됩니다((a,b) ~ (c,d) ⟺ ad=bc). 소수 전개는 유한소수와 순환소수로 나뉘며, 분모의 소인수가 2와 5뿐이면 유한소수가 됩니다."},deepDive:["분수와 소수는 같은 수를 표현하는 두 가지 방법입니다. 분모가 2와 5의 거듭제곱으로만 이루어진 분수는 유한소수로, 그렇지 않으면 순환소수로 표현됩니다.","분수의 크기를 비교할 때는 분모가 같으면 분자가 클수록 크고, 분모가 다르면 통분(공통분모로 맞춤)해서 비교해야 정확합니다."],examples:["피자 한 판을 8조각으로 나누면 한 조각은 1/8","1/2 = 0.5, 1/4 = 0.25","거스름돈 계산에서 소수점 사용"],observationActivity:{title:"종이 접어서 분수 만들기",description:"종이를 여러 번 접어 나오는 조각 수로 분수 개념을 확인합니다.",prediction:"두 번 접으면 4등분, 세 번 접으면 8등분이 될 것이다",materials:["색종이 여러 장","가위","자"],steps:["1. 종이를 반으로 접습니다(1/2)","2. 다시 반으로 접습니다(1/4)","3. 한 번 더 접어봅니다(1/8)","4. 접힌 자국 수와 분수의 관계를 정리합니다"],safetyWarning:"가위 사용 시 손을 다치지 않도록 주의하세요"},questions:["elem-math-01-q01","elem-math-01-q02","elem-math-01-q03","elem-math-01-q04","elem-math-01-q05","elem-math-01-q06"]},{id:"elem-astro-01",subject:"astronomy",grade:5,level:"basic",unit:"태양계와 별",title:"태양계와 행성",summary:"태양계는 태양과 그 주위를 도는 8개의 행성, 위성, 소행성 등으로 이루어져 있다.",keywords:["태양계","행성","위성","공전","태양"],misconceptions:["별과 행성은 같은 것이다","태양은 지구 주위를 돈다"],explanation:{basic:"태양계에는 태양을 중심으로 수성, 금성, 지구, 화성, 목성, 토성, 천왕성, 해왕성 8개의 행성이 있습니다. 행성들은 태양 주위를 돕니다(공전).",curriculum:"태양계 행성은 지구형 행성(수성~화성, 암석)과 목성형 행성(목성~해왕성, 기체/얼음)으로 나뉩니다. 행성은 스스로 빛을 내지 않고 태양빛을 반사합니다.",university:"Kepler의 행성 운동 법칙: 타원 궤도, 면적 속도 일정, T² ∝ a³. 태양계 형성 이론(성운설): 원시 태양계 원반의 중력 수축과 미행성체 집적 과정."},deepDive:["별은 스스로 핵융합 반응을 통해 빛을 내는 천체이고, 행성은 별 주위를 돌며 스스로 빛을 내지 못하고 별빛을 반사하는 천체입니다. 태양은 별이고, 지구를 포함한 8개는 행성입니다.","케플러의 법칙에 따르면 태양에서 멀리 있는 행성일수록 공전 주기가 길어집니다. 이는 태양의 중력이 거리 제곱에 반비례해 약해지기 때문입니다."],examples:["지구는 태양으로부터 세 번째 행성이다","목성은 태양계에서 가장 큰 행성이다","토성은 뚜렷한 고리를 가지고 있다"],observationActivity:{title:"태양계 축척 모형 만들기",description:"태양과 행성들의 상대적 크기와 거리를 비율로 계산해 모형으로 표현합니다.",prediction:"실제 비율로 만들면 행성 사이 거리가 매우 멀어질 것이다",materials:["색종이 또는 점토","줄자","큰 공간(운동장 등)"],steps:["1. 태양과 각 행성의 상대적 크기 비율을 계산합니다","2. 태양으로부터의 거리 비율도 계산합니다","3. 축척에 맞게 모형을 배치합니다","4. 실제 우주가 얼마나 광활한지 토의합니다"],safetyWarning:"야외 활동 시 안전에 유의하세요"},questions:["elem-astro-01-q01","elem-astro-01-q02","elem-astro-01-q03","elem-astro-01-q04","elem-astro-01-q05","elem-astro-01-q06"]},{id:"elem-phys-02",subject:"physics",grade:6,level:"basic",unit:"물질과 에너지",title:"소리의 성질",summary:"소리는 물체의 떨림(진동)이 공기를 통해 전달되어 우리 귀에 들리는 현상이다.",keywords:["소리","진동","떨림판","음높이","음의 세기"],misconceptions:["소리는 진공에서도 전달된다","큰 소리와 높은 소리는 같은 것이다"],explanation:{basic:"소리는 물체가 떨릴 때 생깁니다. 북을 치면 북 가죽이 떨리면서 소리가 나고, 그 떨림이 공기를 타고 우리 귀까지 전달됩니다.",curriculum:"소리는 매질(공기, 물, 고체)의 진동이 전달되는 파동입니다. 진동수가 크면 높은 소리, 진폭이 크면 큰 소리가 납니다. 소리는 진공에서는 전달되지 않습니다.",university:"음파는 매질 입자의 압축과 팽창이 반복되며 전파되는 종파(longitudinal wave)입니다. 속력은 매질의 탄성과 밀도에 의존하며 공기 중에서 약 340 m/s입니다."},deepDive:["소리의 높낮이(음높이)는 진동수(주파수)로 결정되고, 소리의 크기(세기)는 진폭으로 결정됩니다. 이 둘은 서로 독립적인 성질이라 큰 소리가 항상 높은 소리는 아닙니다.","진공에서는 소리를 전달할 매질(입자)이 없기 때문에 소리가 전혀 들리지 않습니다. 영화에서 우주 폭발음이 들리는 것은 과학적으로는 틀린 연출입니다."],examples:["기타 줄을 튕기면 줄이 떨리며 소리가 난다","목소리는 성대의 떨림에서 시작된다","멀리서 천둥소리가 늦게 들리는 것은 소리의 속력이 빛보다 느리기 때문"],observationActivity:{title:"실 전화기로 소리의 전달 관찰",description:"종이컵과 실로 만든 실 전화기로 소리가 실을 통해 전달되는 것을 확인합니다.",prediction:"실이 팽팽할 때 소리가 더 잘 전달될 것이다",materials:["종이컵 2개","실 또는 낚싯줄","송곳"],steps:["1. 종이컵 바닥에 구멍을 뚫고 실을 연결합니다","2. 실을 팽팽하게 당긴 상태로 한쪽에 대고 말합니다","3. 반대쪽 컵에 귀를 대고 소리를 들어봅니다","4. 실이 느슨할 때와 팽팽할 때의 차이를 비교합니다"],safetyWarning:"실을 너무 세게 당기면 끊어질 수 있으니 주의하세요"},questions:["elem-phys-02-q01","elem-phys-02-q02","elem-phys-02-q03","elem-phys-02-q04","elem-phys-02-q05","elem-phys-02-q06"]},{id:"elem-chem-02",subject:"chemistry",grade:5,level:"basic",unit:"물질의 성질",title:"혼합물의 분리",summary:"서로 다른 물질이 섞인 혼합물은 물질의 성질 차이를 이용해 다시 분리할 수 있다.",keywords:["혼합물","거름","증발","자석 분리","순물질"],misconceptions:["한 번 섞인 물질은 절대 분리할 수 없다","혼합물은 항상 화학적으로 결합된 것이다"],explanation:{basic:"소금과 모래를 섞어도 각각의 성질은 그대로 남아있어서 물에 녹여 거르면 다시 분리할 수 있습니다.",curriculum:"혼합물의 분리 방법: 거름(입자 크기 차이), 증발(끓는점 차이), 자석 분리(자성 차이), 밀도 차이를 이용한 분리 등. 혼합물은 화학반응 없이 물리적으로 분리할 수 있습니다.",university:"분리 기술은 증류(끓는점 차이), 크로마토그래피(흡착력 차이), 원심분리(밀도 차이에 따른 침강속도)로 확장됩니다. 이는 정유공업, 의약품 정제 등에 실제로 응용됩니다."},deepDive:["혼합물의 각 성분은 섞여도 자신의 고유한 성질(녹는점, 자성, 용해도 등)을 그대로 유지합니다. 그렇기 때문에 그 성질 차이를 이용하면 원래 물질로 되돌릴 수 있습니다.","순물질(원소나 화합물)은 화학결합으로 이루어져 있어 화학반응 없이는 분리할 수 없지만, 혼합물은 성분들이 화학적으로 결합하지 않은 상태이므로 물리적 방법으로 분리가 가능합니다."],examples:["소금물을 증발시키면 소금 결정만 남는다","철가루와 모래를 자석으로 분리한다","모래와 자갈을 체로 걸러 크기별로 분리한다"],observationActivity:{title:"소금과 모래 분리하기",description:"소금과 모래를 섞은 뒤 물에 녹이고 거름종이로 걸러 다시 분리해봅니다.",prediction:"거름종이를 통과한 물을 증발시키면 소금 결정이 남을 것이다",materials:["소금","모래","물","거름종이","깔때기","비커"],steps:["1. 소금과 모래를 섞습니다","2. 물을 부어 잘 저어 소금을 녹입니다","3. 거름종이로 걸러 모래를 분리합니다","4. 거른 소금물을 증발시켜 소금을 회수합니다"],safetyWarning:"증발시킬 때 뜨거운 그릇에 데지 않도록 주의하세요"},questions:["elem-chem-02-q01","elem-chem-02-q02","elem-chem-02-q03","elem-chem-02-q04","elem-chem-02-q05","elem-chem-02-q06"]},{id:"elem-chem-03",subject:"chemistry",grade:6,level:"basic",unit:"물질의 성질",title:"생활 속 산성과 염기성",summary:"식초처럼 신맛이 나는 물질은 산성, 비누처럼 미끈거리는 물질은 염기성을 띤다.",keywords:["산성","염기성","지시약","pH","중화"],misconceptions:["신맛이 나면 모두 위험한 물질이다","산성과 염기성은 항상 서로 반대되는 위험한 물질이다"],explanation:{basic:"식초나 레몬처럼 신맛이 나는 것은 산성이고, 비눗물처럼 미끈거리는 것은 염기성입니다. 리트머스 종이로 산성은 파란색을 빨갛게, 염기성은 빨간색을 파랗게 바꿀 수 있습니다.",curriculum:"지시약(리트머스, 페놀프탈레인, BTB용액)으로 산성과 염기성을 판별합니다. pH는 산성-중성-염기성 정도를 나타내는 척도로 7보다 작으면 산성, 크면 염기성입니다.",university:"산은 수용액에서 H⁺를 내놓고 염기는 OH⁻를 내놓거나 H⁺를 받아들입니다. 산과 염기가 만나면 중화 반응이 일어나 물과 염이 생성됩니다."},deepDive:['산성과 염기성은 그 자체로 "위험함"을 의미하지 않습니다. 식초(약한 산성)와 비누(약한 염기성)는 일상에서 안전하게 사용되지만, 강한 산이나 강한 염기는 위험할 수 있어 농도와 종류가 중요합니다.',"중화 반응은 산과 염기가 서로의 성질을 상쇄하는 반응으로, 위산과다를 제산제로 완화하거나 산성 토양을 석회로 개선하는 등 실생활에 널리 활용됩니다."],examples:["식초, 레몬즙, 탄산음료는 산성","비누, 베이킹소다 용액은 염기성","자주색 양배추 물은 천연 지시약으로 쓸 수 있다"],observationActivity:{title:"천연 지시약으로 산성·염기성 구별하기",description:"자주색 양배추를 삶은 물을 지시약으로 사용해 여러 생활 속 물질의 성질을 확인합니다.",prediction:"식초에서는 지시약이 붉은색으로, 비눗물에서는 푸른색이나 초록색으로 변할 것이다",materials:["자주색 양배추 삶은 물","식초","비눗물","탄산음료","투명한 컵 여러 개"],steps:["1. 여러 컵에 다른 액체(식초, 비눗물, 탄산음료 등)를 담습니다","2. 각 컵에 양배추 지시약을 몇 방울 떨어뜨립니다","3. 색 변화를 관찰하고 기록합니다","4. 색 변화에 따라 산성/염기성을 분류합니다"],safetyWarning:"실험 후 용액은 마시지 말고, 눈에 튀지 않도록 주의하세요"},questions:["elem-chem-03-q01","elem-chem-03-q02","elem-chem-03-q03","elem-chem-03-q04","elem-chem-03-q05","elem-chem-03-q06"]},{id:"elem-math-02",subject:"math",grade:5,level:"basic",unit:"도형",title:"도형의 넓이와 둘레",summary:"직사각형, 삼각형 등 여러 도형의 둘레와 넓이를 구하는 방법을 익힌다.",keywords:["둘레","넓이","직사각형","삼각형","단위넓이"],misconceptions:["둘레가 크면 넓이도 항상 크다","넓이의 단위와 둘레의 단위는 같다"],explanation:{basic:"둘레는 도형의 테두리를 한 바퀴 돈 길이이고, 넓이는 도형이 차지하는 면의 크기입니다. 직사각형의 넓이는 가로×세로로 구합니다.",curriculum:"직사각형 넓이 = 가로×세로, 삼각형 넓이 = 밑변×높이÷2, 평행사변형 넓이 = 밑변×높이. 넓이의 단위는 cm², m² 등 제곱 단위를 사용합니다.",university:"적분학의 관점에서 넓이는 도형을 무수히 작은 조각으로 나누어 합한 것으로 일반화됩니다. 임의의 곡선으로 둘러싸인 영역의 넓이는 정적분 ∫f(x)dx로 계산됩니다."},deepDive:["둘레가 같아도 모양에 따라 넓이는 크게 달라질 수 있습니다. 예를 들어 둘레가 20cm인 직사각형이라도 가로세로 비율에 따라 넓이가 다르며, 정사각형에 가까울수록 넓이가 최대가 됩니다.",'넓이의 단위(cm², m²)는 둘레의 단위(cm, m)와 차원이 다릅니다. 넓이는 "길이×길이"이므로 단위에도 제곱이 붙는다는 것을 이해하는 것이 중요합니다.'],examples:["가로 5cm, 세로 3cm 직사각형의 넓이는 15cm²","밑변 6cm, 높이 4cm 삼각형의 넓이는 12cm²","운동장의 넓이를 재어 필요한 잔디의 양을 계산"],observationActivity:{title:"같은 둘레, 다른 넓이 탐구",description:"길이가 같은 끈으로 여러 모양을 만들어 넓이를 비교합니다.",prediction:"정사각형에 가까운 모양일수록 넓이가 클 것이다",materials:["길이 24cm 끈 또는 종이띠","모눈종이","자"],steps:["1. 끈으로 가로세로 비율이 다른 직사각형을 여러 개 만듭니다","2. 각 직사각형의 둘레가 같은지 확인합니다(24cm)","3. 모눈종이 위에 그려 넓이를 세어봅니다","4. 어떤 모양의 넓이가 가장 큰지 비교합니다"],safetyWarning:"가위 사용 시 손을 다치지 않도록 주의하세요"},questions:["elem-math-02-q01","elem-math-02-q02","elem-math-02-q03","elem-math-02-q04","elem-math-02-q05","elem-math-02-q06"]},{id:"elem-math-03",subject:"math",grade:6,level:"basic",unit:"규칙성",title:"규칙과 대응",summary:"두 양 사이에 일정한 규칙이 있으면 하나의 값으로 다른 값을 예측할 수 있다.",keywords:["규칙","대응","비례","표","식"],misconceptions:["모든 두 양의 관계는 비례한다","규칙은 항상 덧셈으로만 표현된다"],explanation:{basic:"세발자전거 1대에는 바퀴가 3개, 2대에는 6개처럼 한 양이 변하면 다른 양도 일정한 규칙으로 변합니다. 이런 관계를 표와 식으로 나타낼 수 있습니다.",curriculum:"두 양 x, y 사이의 대응 관계를 표로 정리하고 y=ax(정비례) 또는 y=a/x(반비례) 같은 식으로 나타냅니다. 정비례는 x가 2배 되면 y도 2배가 되는 관계입니다.",university:"이는 함수 개념의 초기 형태로, 두 변수 사이의 대응 규칙을 일반화하면 f: X→Y 형태의 함수로 확장됩니다. 정비례와 반비례는 각각 f(x)=ax, f(x)=a/x 형태의 특수한 함수입니다."},deepDive:["모든 관계가 정비례인 것은 아닙니다. 예를 들어 직사각형의 가로를 늘리면서 넓이를 일정하게 유지하려면 세로는 반비례로 줄어들어야 합니다. 관계의 종류를 표로 확인하는 습관이 중요합니다.","규칙을 식으로 나타내면 특정 값을 대입해 바로 계산할 수 있어 매우 편리합니다. 이것이 문자를 사용하는 대수식의 출발점이 됩니다."],examples:["세발자전거 수와 바퀴 수의 관계(바퀴 수 = 자전거 수×3)","정사각형의 한 변의 길이와 둘레의 관계(둘레 = 한 변×4)","시간과 이동 거리의 관계(일정한 속력일 때)"],observationActivity:{title:"성냥개비로 정삼각형 잇기 규칙 찾기",description:"정삼각형을 이어 붙일 때 필요한 성냥개비 수의 규칙을 찾아봅니다.",prediction:"정삼각형 수가 늘어날수록 필요한 성냥개비 수는 일정하게 늘어날 것이다",materials:["성냥개비 또는 이쑤시개","기록지"],steps:["1. 정삼각형 1개를 만들고 필요한 개수를 셉니다(3개)","2. 정삼각형을 2개, 3개로 늘려가며 개수를 셉니다","3. 표로 정리하여 규칙을 찾습니다","4. 규칙을 식으로 나타내봅니다"],safetyWarning:"뾰족한 이쑤시개에 찔리지 않도록 주의하세요"},questions:["elem-math-03-q01","elem-math-03-q02","elem-math-03-q03","elem-math-03-q04","elem-math-03-q05","elem-math-03-q06"]},{id:"elem-bio-03",subject:"biology",grade:6,level:"basic",unit:"우리 몸",title:"우리 몸의 구조와 기능",summary:"우리 몸은 뼈와 근육, 소화기관, 순환기관 등이 서로 협력하며 생명활동을 유지한다.",keywords:["뼈","근육","소화","심장","순환"],misconceptions:["뼈는 살아있지 않고 딱딱하기만 하다","심장은 왼쪽 가슴에 있다는 것 외에는 특별한 기능이 없다"],explanation:{basic:"뼈와 근육은 우리 몸을 지탱하고 움직이게 합니다. 먹은 음식은 소화기관을 거치며 몸에 필요한 영양분으로 바뀌고, 심장은 온몸에 피를 보내는 펌프 역할을 합니다.",curriculum:"골격계(뼈)는 몸을 지지하고 내부 장기를 보호하며, 근육계는 뼈에 붙어 수축·이완하며 움직임을 만듭니다. 소화계는 입-식도-위-소장-대장을 거치며 음식을 분해·흡수합니다. 순환계는 심장의 박동으로 혈액을 온몸에 순환시킵니다.",university:"골격근의 수축은 액틴과 미오신 필라멘트의 미끄럼 운동으로 설명됩니다(활주설). 소화효소(아밀레이스, 펩신 등)는 특정 온도와 pH에서 최적으로 작용하며, 심장의 박동은 동방결절의 전기 신호로 조율됩니다."},deepDive:["뼈는 겉보기와 달리 살아있는 조직으로, 혈관과 신경이 분포하며 끊임없이 새로운 뼈세포를 만들고 낡은 부분을 재흡수하는 활동을 합니다. 골절 후 뼈가 붙는 것도 이런 살아있는 조직이기 때문입니다.","심장은 몸 전체에 혈액을 보내는 펌프일 뿐 아니라, 그 리듬을 스스로 만들어내는 특수한 전기 신호 시스템(동방결절)을 가지고 있어 뇌의 명령 없이도 규칙적으로 뜁니다."],examples:["팔을 굽힐 때 이두근이 수축한다","밥을 씹으면 침 속 효소가 소화를 돕는다","운동을 하면 심장박동이 빨라져 근육에 더 많은 산소를 공급한다"],observationActivity:{title:"운동 전후 맥박수 변화 관찰",description:"가벼운 운동 전후의 맥박수를 측정해 순환계의 반응을 확인합니다.",prediction:"운동 후 맥박수가 증가했다가 시간이 지나면 다시 안정될 것이다",materials:["시계 또는 스톱워치","기록지"],steps:["1. 편안히 앉아 1분간 손목 맥박수를 측정합니다","2. 제자리 뛰기를 1분간 한 후 다시 맥박수를 측정합니다","3. 5분 후 맥박수를 다시 측정합니다","4. 세 결과를 비교해 그래프로 나타냅니다"],safetyWarning:"무리한 운동은 피하고 몸 상태를 살피며 진행하세요"},questions:["elem-bio-03-q01","elem-bio-03-q02","elem-bio-03-q03","elem-bio-03-q04","elem-bio-03-q05","elem-bio-03-q06"]},{id:"elem-earth-02",subject:"earthscience",grade:4,level:"basic",unit:"날씨와 기후",title:"날씨와 기후의 변화",summary:"날씨는 짧은 기간의 대기 상태이고, 기후는 오랜 기간 나타나는 평균적인 대기 상태이다.",keywords:["날씨","기후","기온","습도","강수량"],misconceptions:["날씨와 기후는 같은 뜻이다","오늘 눈이 왔으니 지구온난화는 사실이 아니다"],explanation:{basic:'오늘 비가 오는지 맑은지는 "날씨"이고, 어떤 지역이 일 년 내내 어떤 특징을 보이는지는 "기후"입니다. 우리나라는 사계절이 뚜렷한 기후를 가지고 있습니다.',curriculum:"날씨는 기온, 습도, 바람, 강수량 등이 짧은 시간에 변하는 대기 상태이고, 기후는 특정 지역에서 수십 년간 평균적으로 나타나는 대기 패턴입니다. 기후는 위도, 고도, 바다와의 거리 등에 영향을 받습니다.",university:"기후는 대기-해양-지표면 사이의 에너지 및 물질 교환으로 형성되는 장기적 통계적 평균 상태로 정의됩니다. 엘니뇨, 라니냐 같은 해양-대기 상호작용은 지역 기후에 수년 주기의 변동을 일으킵니다."},deepDive:['하루하루의 날씨가 춥거나 눈이 온다고 해서 "지구온난화가 사실이 아니다"라고 결론짓는 것은 날씨와 기후를 혼동한 오류입니다. 기후 변화는 수십 년 단위의 평균적 경향을 다루는 개념입니다.',"기후는 위도(적도에 가까울수록 따뜻함), 고도(높을수록 서늘함), 바다와의 거리(해양성 기후는 온화함) 등 여러 요인이 복합적으로 작용해 결정됩니다."],examples:["오늘 서울의 날씨는 맑음, 기온 25도","우리나라의 기후는 사계절이 뚜렷한 온대 기후","사막 지역은 강수량이 매우 적은 건조 기후"],observationActivity:{title:"일주일간 날씨 기록하고 패턴 찾기",description:"매일 기온, 하늘 상태, 강수 여부를 기록해 날씨의 변화를 관찰합니다.",prediction:"하루하루의 날씨는 다르게 변할 것이다",materials:["온도계","기록지","달력"],steps:["1. 매일 같은 시간에 기온을 측정합니다","2. 하늘 상태(맑음/흐림/비/눈)를 기록합니다","3. 일주일간의 자료를 표로 정리합니다","4. 날씨가 어떻게 변했는지 그래프로 나타냅니다"],safetyWarning:"온도계 사용 시 깨지지 않도록 조심하세요"},questions:["elem-earth-02-q01","elem-earth-02-q02","elem-earth-02-q03","elem-earth-02-q04","elem-earth-02-q05","elem-earth-02-q06"]},{id:"elem-earth-03",subject:"earthscience",grade:5,level:"basic",unit:"지구의 변화",title:"화산과 지진",summary:"지구 내부의 활동으로 화산이 폭발하거나 지진이 일어나 땅의 모습이 변한다.",keywords:["화산","지진","마그마","진도","용암"],misconceptions:["화산은 항상 위험하고 아무 쓸모가 없다","지진은 우리나라에서는 절대 일어나지 않는다"],explanation:{basic:"땅속 깊은 곳의 뜨거운 마그마가 솟아오르면 화산이 폭발하고, 땅이 갑자기 흔들리면 지진이 일어납니다. 둘 다 지구 내부의 활동으로 생기는 현상입니다.",curriculum:"화산은 마그마가 지표로 분출하는 현상으로 용암, 화산재, 가스를 내뿜습니다. 지진은 지각에 쌓인 힘이 갑자기 방출되며 땅이 흔들리는 현상으로, 진원과 진앙, 규모(리히터 규모)로 나타냅니다.",university:"화산 활동은 판의 경계(섭입대, 열점 등)에서 주로 발생하며 마그마의 점성과 가스 함량에 따라 폭발성이 달라집니다. 지진의 규모는 방출된 에너지의 로그 척도이며, 지진파(P파, S파)의 도달 시간차로 진원 거리를 계산합니다."},deepDive:["화산은 위험하기도 하지만 온천, 비옥한 화산토양, 지열발전 등 인간에게 유용한 자원을 제공하기도 합니다. 화산 자체를 무조건 나쁜 것으로만 볼 필요는 없습니다.",'우리나라는 판의 경계에서 다소 떨어져 있어 강한 지진 빈도는 낮지만, 실제로 크고 작은 지진이 관측되고 있어 "절대 일어나지 않는다"는 생각은 정확하지 않습니다. 내진 설계 등 대비가 필요합니다.'],examples:["백두산은 한반도의 대표적인 화산","경주 지진(2016)은 우리나라에서 관측된 강한 지진 중 하나","용암이 식어 굳으면 화성암이 된다"],observationActivity:{title:"베이킹소다 화산 모형 만들기",description:"베이킹소다와 식초 반응으로 화산 분출을 흉내 내는 모형실험을 합니다.",prediction:"식초를 부으면 거품이 화산처럼 분출될 것이다",materials:["베이킹소다","식초","점토 또는 찰흙","작은 병","쟁반"],steps:["1. 점토로 병 주위를 화산 모양으로 감쌉니다","2. 병 속에 베이킹소다를 넣습니다","3. 식초를 부어 반응을 관찰합니다","4. 실제 화산 분출과 비교해 공통점과 차이점을 정리합니다"],safetyWarning:"반응물이 눈에 튀지 않도록 주의하고 쟁반 위에서 실험하세요"},questions:["elem-earth-03-q01","elem-earth-03-q02","elem-earth-03-q03","elem-earth-03-q04","elem-earth-03-q05","elem-earth-03-q06"]},{id:"elem-astro-02",subject:"astronomy",grade:4,level:"basic",unit:"태양계와 별",title:"달의 위상 변화",summary:"달은 지구 주위를 돌면서 태양빛을 받는 부분이 달라져 모양이 달라 보인다.",keywords:["달","위상","보름달","초승달","공전"],misconceptions:["달의 모양이 실제로 변한다","달이 지구 그림자에 가려져서 모양이 바뀐다(월식과 혼동)"],explanation:{basic:"달은 스스로 빛나지 않고 태양빛을 반사합니다. 달이 지구 주위를 돌면서 우리가 보는 밝은 부분의 모양이 초승달, 반달, 보름달 순서로 바뀝니다.",curriculum:"달의 위상은 태양-지구-달의 상대적 위치에 따라 달라집니다. 삭(신월)-초승달-상현달-보름달-하현달-그믐달 순으로 약 29.5일 주기로 반복됩니다.",university:"달의 위상 주기(삭망월, 29.5일)는 달의 공전주기(항성월, 27.3일)와 다른데, 이는 지구도 태양 주위를 공전하고 있어 태양-지구-달이 다시 같은 배열이 되려면 더 긴 시간이 걸리기 때문입니다."},deepDive:["달의 모양이 실제로 변하는 것이 아니라, 태양빛을 받는 달의 표면 중 지구에서 보이는 부분이 달라지는 것뿐입니다. 달은 항상 같은 반구를 지구로 향하고 있습니다.","월식(달이 지구 그림자에 가려짐)은 보름달일 때 가끔 일어나는 특별한 현상이고, 매일 밤 달의 모양이 바뀌는 위상 변화와는 다른 현상입니다. 이 둘을 혼동하지 않는 것이 중요합니다."],examples:["초승달은 저녁 서쪽 하늘에서 얇게 보인다","보름달은 밤새 둥글고 밝게 보인다","그믐달은 새벽에 얇게 보인다"],observationActivity:{title:"한 달간 달 모양 관찰 일지 쓰기",description:"매일 밤 달의 모양을 그림으로 기록하며 위상 변화의 순서를 확인합니다.",prediction:"초승달에서 보름달로, 다시 그믐달로 순서대로 변할 것이다",materials:["관찰 일지","색연필"],steps:["1. 매일 같은 시간에 달을 관찰합니다","2. 보이는 달의 모양을 그림으로 그립니다","3. 날짜별로 모양 변화를 정리합니다","4. 위상 변화의 순서와 주기를 정리합니다"],safetyWarning:"밤에 관찰할 때 보호자와 함께 안전한 장소에서 하세요"},questions:["elem-astro-02-q01","elem-astro-02-q02","elem-astro-02-q03","elem-astro-02-q04","elem-astro-02-q05","elem-astro-02-q06"]},{id:"elem-astro-03",subject:"astronomy",grade:6,level:"basic",unit:"태양계와 별",title:"별자리와 계절",summary:"지구가 태양 주위를 공전하기 때문에 계절에 따라 밤하늘에 보이는 별자리가 달라진다.",keywords:["별자리","계절별 별자리","공전","오리온자리","북두칠성"],misconceptions:["별자리는 일 년 내내 같은 자리에서 똑같이 보인다","별자리는 실제로 별들이 가까이 모여있는 그림이다"],explanation:{basic:"겨울에는 오리온자리를, 여름에는 다른 별자리를 볼 수 있습니다. 이는 지구가 태양 주위를 돌면서 밤에 보는 하늘의 방향이 계절마다 달라지기 때문입니다.",curriculum:"별자리는 지구에서 본 별들의 겉보기 배열을 연결한 것으로, 계절별 대표 별자리(봄: 사자자리, 여름: 백조자리, 가을: 페가수스자리, 겨울: 오리온자리)가 있습니다. 지구 공전에 따라 밤에 보이는 하늘의 영역이 바뀝니다.",university:"별자리를 이루는 별들은 실제로는 지구로부터 거리가 서로 크게 다른 경우가 많아, 3차원적으로는 전혀 가깝지 않습니다. 별자리는 인간이 하늘을 항해나 계절 파악에 이용하기 위해 편의상 그린 겉보기 패턴입니다."},deepDive:["지구가 태양을 한 바퀴 공전하는 동안, 밤에 태양 반대편 하늘을 보게 되는 방향이 계절마다 바뀌기 때문에 계절별로 보이는 별자리가 달라집니다. 별자리 자체가 움직이는 것이 아닙니다.","같은 별자리 안의 별들은 하늘에서 가까워 보이지만 실제 우주 공간에서의 거리는 서로 매우 다른 경우가 많습니다. 별자리는 실제 물리적 집단이 아니라 지구에서 본 2차원적 겉보기 배열입니다."],examples:["겨울철 밤하늘의 오리온자리","여름철 밤하늘의 백조자리와 견우직녀 별","북극성을 찾는 데 이용되는 북두칠성"],observationActivity:{title:"계절별 별자리 지도 만들기",description:"각 계절의 대표 별자리를 조사하고 밤하늘에서 찾아 지도를 완성합니다.",prediction:"계절이 바뀌면 보이는 별자리도 달라질 것이다",materials:["별자리 지도 또는 앱","나침반","기록지"],steps:["1. 이번 계절의 대표 별자리를 조사합니다","2. 맑은 밤 실제 하늘에서 별자리를 찾아봅니다","3. 관찰한 위치와 모양을 기록합니다","4. 다음 계절에 같은 방향의 하늘을 관찰해 변화를 비교합니다"],safetyWarning:"밤에 야외 관찰 시 보호자와 동행하고 안전한 장소를 선택하세요"},questions:["elem-astro-03-q01","elem-astro-03-q02","elem-astro-03-q03","elem-astro-03-q04","elem-astro-03-q05","elem-astro-03-q06"]},{id:"elem-med-01",subject:"medicine",grade:4,level:"basic",unit:"건강한 생활",title:"건강한 생활 습관",summary:"균형 잡힌 식사, 충분한 수면, 꾸준한 운동은 건강을 지키는 세 가지 기본 습관이다.",keywords:["영양소","수면","운동","위생","건강"],misconceptions:["좋아하는 음식만 먹어도 건강에 문제가 없다","잠은 적게 잘수록 시간을 아낄 수 있어 좋다"],explanation:{basic:"우리 몸이 튼튼하게 자라려면 여러 종류의 음식을 골고루 먹고, 충분히 자고, 몸을 움직여 운동을 해야 합니다.",curriculum:"영양소는 탄수화물, 단백질, 지방, 비타민, 무기질로 나뉘며 각각 몸에서 하는 역할이 다릅니다. 성장기에는 하루 8~10시간의 수면이 필요하며, 규칙적인 운동은 근육과 뼈, 심폐 기능을 튼튼하게 합니다.",university:"수면은 성장호르몬 분비, 기억 강화, 면역 기능 회복 등 여러 생리적 과정과 관련되며, 만성적 수면 부족은 대사질환과 면역력 저하의 위험을 높입니다. 규칙적 운동은 심혈관계와 골격근의 적응(미토콘드리아 증가 등)을 유도합니다."},deepDive:["좋아하는 음식만 먹으면 특정 영양소는 넘치고 다른 영양소는 부족해지는 불균형이 생길 수 있습니다. 여러 색깔과 종류의 음식을 골고루 먹는 것이 균형 잡힌 영양 섭취의 핵심입니다.","수면은 단순히 쉬는 시간이 아니라 몸이 자라고 회복하는 중요한 시간입니다. 특히 성장기에는 깊은 잠을 자는 동안 성장호르몬이 많이 분비되므로 수면 시간을 줄이는 것은 성장에 불리할 수 있습니다."],examples:["아침을 거르지 않고 골고루 먹기","매일 30분 이상 몸을 움직이는 놀이나 운동하기","자기 전 스마트폰을 멀리하고 일찍 잠자리에 들기"],observationActivity:{title:"일주일 생활 습관 기록표 만들기",description:"식사, 수면 시간, 운동량을 일주일간 기록해 자신의 생활 습관을 점검합니다.",prediction:"규칙적으로 자고 먹은 날에 몸 상태가 더 좋다고 느낄 것이다",materials:["기록표","연필"],steps:["1. 매일 식사, 수면 시간, 운동 여부를 기록합니다","2. 일주일 후 자료를 정리합니다","3. 잘 지킨 날과 그렇지 못한 날의 컨디션을 비교합니다","4. 개선할 점을 스스로 정리해봅니다"],safetyWarning:"무리한 운동이나 다이어트를 시도하지 않도록 주의하세요"},questions:["elem-med-01-q01","elem-med-01-q02","elem-med-01-q03","elem-med-01-q04","elem-med-01-q05","elem-med-01-q06"]},{id:"elem-med-02",subject:"medicine",grade:5,level:"basic",unit:"건강한 생활",title:"몸을 지키는 청결과 예방",summary:"손 씻기와 청결한 습관은 병을 일으키는 세균이나 바이러스로부터 몸을 지키는 중요한 방법이다.",keywords:["위생","세균","바이러스","감염","예방접종"],misconceptions:["눈에 보이지 않으면 세균이나 바이러스는 없는 것이다","한 번 손을 씻으면 하루종일 깨끗하다"],explanation:{basic:"손에는 눈에 보이지 않는 세균이 많이 붙어 있을 수 있습니다. 비누로 손을 잘 씻으면 병을 옮기는 세균이나 바이러스를 없앨 수 있습니다.",curriculum:"세균과 바이러스 같은 병원체는 기침, 접촉, 오염된 음식 등을 통해 몸에 들어와 감염을 일으킬 수 있습니다. 손 씻기, 기침 예절, 예방접종은 감염병을 예방하는 대표적인 방법입니다.",university:"병원체는 눈, 코, 입의 점막이나 상처를 통해 몸에 침입하며, 손을 통한 간접 접촉 전파가 흔한 경로입니다. 비누는 병원체를 둘러싼 지질막을 파괴하여 씻어낼 수 있게 하며, 예방접종은 후천면역을 미리 형성시키는 방법입니다."},deepDive:['세균과 바이러스는 매우 작아 눈에 보이지 않지만 실제로 우리 주변 어디에나 존재합니다. "보이지 않으니 없다"는 생각은 위험할 수 있으며, 손 씻기 같은 예방 습관이 중요한 이유입니다.',"손은 여러 물건을 만지고 얼굴을 만지는 과정에서 다시 오염될 수 있으므로, 한 번 씻었다고 하루 종일 깨끗한 것이 아니라 자주, 특히 식사 전과 화장실 사용 후에 씻는 습관이 필요합니다."],examples:["30초 이상 비누로 손 씻기","기침할 때 소매로 입과 코를 가리기","예방접종으로 홍역이나 독감 예방하기"],observationActivity:{title:"손 씻기 전후 비교 실험(간이 관찰)",description:"손을 씻기 전과 후에 손으로 만진 빵 조각의 변화를 며칠간 관찰합니다(교사 지도 하에 진행).",prediction:"씻지 않은 손으로 만진 빵에서 곰팡이가 더 빨리 생길 것이다",materials:["식빵 조각 2개","비닐백 2개","비누"],steps:["1. 손을 씻지 않은 상태로 빵 조각 하나를 만집니다","2. 비누로 손을 깨끗이 씻은 후 다른 빵 조각을 만집니다","3. 각각 비닐백에 밀봉해 며칠간 관찰합니다","4. 곰팡이가 생기는 정도를 비교합니다(먹지 않습니다)"],safetyWarning:"실험한 빵은 절대 먹지 말고, 관찰 후 즉시 폐기하세요"},questions:["elem-med-02-q01","elem-med-02-q02","elem-med-02-q03","elem-med-02-q04","elem-med-02-q05","elem-med-02-q06"]},{id:"elem-med-03",subject:"medicine",grade:6,level:"basic",unit:"건강한 생활",title:"응급처치의 기초",summary:"작은 상처나 갑작스러운 사고 상황에서 침착하게 대처하는 기본적인 응급처치 방법을 익힌다.",keywords:["응급처치","상처","지혈","119","심폐소생술"],misconceptions:["작은 상처는 그냥 두어도 저절로 낫는다","응급 상황에서는 무조건 빨리 움직이는 것이 최선이다"],explanation:{basic:"다치면 상처를 깨끗한 물로 씻고 소독한 뒤 밴드를 붙입니다. 크게 다치거나 위급한 상황에서는 어른에게 알리거나 119에 신고해야 합니다.",curriculum:"상처 처리의 기본 순서는 지혈-세척-소독-보호입니다. 심각한 출혈은 깨끗한 천으로 압박하며 지혈합니다. 의식이 없는 사람을 발견하면 즉시 119에 신고하고, 숨을 쉬지 않으면 심폐소생술이 필요할 수 있습니다.",university:"응급처치의 기본 원칙은 현장 안전 확인, 반응 확인, 도움 요청, 기본 처치(기도 확보, 순환 유지) 순서로 이루어집니다. 심정지 시 흉부압박은 뇌와 주요 장기로의 최소한의 혈류를 유지시켜 골든타임을 확보하는 데 핵심적입니다."},deepDive:["작은 상처라도 방치하면 세균 감염으로 이어져 상처가 덧날 수 있습니다. 상처를 깨끗이 씻고 소독하는 습관은 작아 보여도 중요한 예방 조치입니다.","응급 상황에서 무조건 서두르기보다는, 먼저 상황이 안전한지 확인하고 침착하게 도움을 요청하는 것이 우선입니다. 성급하게 행동하다가 구조자 자신이 위험해지는 경우도 있기 때문입니다."],examples:["넘어져 무릎이 까지면 물로 씻고 밴드를 붙인다","코피가 나면 고개를 약간 숙이고 콧등을 지그시 눌러준다","주변에 쓰러진 사람을 보면 즉시 119에 신고한다"],observationActivity:{title:"119 신고 상황극 연습하기",description:"가상의 응급 상황을 설정해 침착하게 119에 신고하는 연습을 합니다.",prediction:"침착하게 위치와 상황을 설명하면 더 빠른 도움을 받을 수 있을 것이다",materials:["상황 카드","장난감 전화기(또는 역할극)"],steps:["1. 응급 상황 카드를 하나 뽑습니다(예: 친구가 넘어져 다침)","2. 119에 신고하는 대화를 역할극으로 연습합니다","3. 정확한 위치와 상황을 설명하는 연습을 합니다","4. 친구들과 서로 피드백을 주고받습니다"],safetyWarning:"실제 119 번호로 장난 전화를 걸지 않도록 주의하세요"},questions:["elem-med-03-q01","elem-med-03-q02","elem-med-03-q03","elem-med-03-q04","elem-med-03-q05","elem-med-03-q06"]}],Ey=[{id:"high-phys-01",subject:"physics",grade:10,level:"advanced",unit:"역학",title:"미적분을 이용한 운동 분석",summary:"위치, 속도, 가속도의 관계를 미적분으로 표현하고 분석한다.",keywords:["미분","적분","운동 방정식","속도","위치"],misconceptions:["속도와 속력이 같다","가속도는 속도가 증가하는 것만 의미한다"],explanation:{basic:"물체의 위치가 시간에 따라 어떻게 바뀌는지 함수로 나타낼 수 있습니다. 그 함수를 미분하면 속도를 얻고, 다시 미분하면 가속도를 얻습니다.",curriculum:"x(t) 함수에서 v(t) = dx/dt, a(t) = dv/dt = d²x/dt². 역으로 a(t)를 적분하면 v(t), v(t)를 적분하면 x(t). 초기 조건(x₀, v₀)이 필요.",university:"Newtonian mechanics의 완전한 수학적 형식화. Lagrangian L = T - V, Hamilton의 정준 방정식 q̇ = ∂H/∂p, ṗ = -∂H/∂q. Phase space 분석. 보존량과 Noether 정리의 연결."},examples:["x(t) = 5t² - 2t + 3에서 t=2초일 때의 속도와 가속도","자유 낙하: x = ½gt², v = gt","포물선 운동의 궤적 분석"],observationActivity:{title:"비디오 분석을 통한 실제 운동 측정",description:"공을 던진 영상을 프레임 단위로 분석하여 실제 x(t), v(t), a(t)를 구합니다.",prediction:"실제 측정값이 이론값과 일치할 것이다",materials:["스마트폰(카메라)","공","자"],steps:["1. 공을 던지는 영상을 고속 촬영합니다 (120fps 이상)","2. 각 프레임에서 공의 위치를 측정합니다","3. 시간차에 따른 위치 변화를 계산합니다","4. v(t)와 a(t)를 구하고 그래프로 그립니다"],safetyWarning:"실내에서 물건이 부서지지 않도록 주의하세요"},questions:["high-phys-01-q01","high-phys-01-q02","high-phys-01-q03","high-phys-01-q04","high-phys-01-q05","high-phys-01-q06"]},{id:"high-phys-02",subject:"physics",grade:11,level:"advanced",unit:"전자기",title:"Maxwell 방정식과 전자기파",summary:"Maxwell 방정식으로부터 전자기파의 존재를 유도하고 빛의 본질을 이해한다.",keywords:["Maxwell","전자기파","빛","EM wave","파동"],misconceptions:["빛은 입자인가 파동인가","전자기파는 매질이 필요하다"],explanation:{basic:"변하는 전기장은 자기장을 만들고, 변하는 자기장은 전기장을 만듭니다. 이 둘이 함께 진동하면서 공간을 통해 퍼져나가는 것이 빛입니다.",curriculum:"Gauss 법칙, Ampère-Maxwell 법칙으로부터 파동 방정식 도출. 빛의 속도 c = 1/√(ε₀μ₀). Poynting vector S = E × H로 에너지 흐름. 편광, 간섭, 회절.",university:"특수상대론과의 연결: Maxwell 방정식은 Lorentz 불변. 4-벡터 formalism. Lagrangian 밀도. 양자 전자기역학 (QED)으로의 확장. Dirac 방정식과 반입자 예측."},examples:["라디오파, 마이크로파, 가시광선, 자외선, X선 모두 EM파","빛의 속도는 c = 3×10⁸ m/s (상수)","전자기파는 진공에서도 전파된다"],observationActivity:{title:"전파의 성질 실험",description:"AM/FM 라디오의 수신 성능을 다양한 조건에서 측정합니다.",prediction:"금속 차폐에 의해 신호가 감소할 것이다",materials:["라디오","금속 상자","알루미늄 호일"],steps:["1. 라디오를 특정 주파수로 맞춥니다","2. 신호 강도를 측정합니다","3. 금속으로 일부를 차폐합니다","4. 신호 강도 변화를 기록합니다"],safetyWarning:"안전한 환경에서 진행하세요"},questions:["high-phys-02-q01","high-phys-02-q02","high-phys-02-q03","high-phys-02-q04","high-phys-02-q05","high-phys-02-q06"]},{id:"high-chem-01",subject:"chemistry",grade:10,level:"advanced",unit:"화학량론",title:"몰과 화학량론",summary:"몰(mol) 개념을 이용해 화학 반응에서 물질의 양적 관계를 계산한다.",keywords:["몰","아보가드로수","몰질량","화학량론","화학 반응식"],misconceptions:["몰은 질량의 단위이다","반응식의 계수는 질량 비율이다"],explanation:{basic:'몰은 입자 6.02×10²³개를 세는 단위입니다. 마치 "한 다스"가 12개를 뜻하듯, "1몰"은 특정 개수의 입자 묶음을 의미합니다.',curriculum:"아보가드로수 N_A = 6.02×10²³ /mol. 몰질량(g/mol)은 원소의 원자량과 같은 값. 화학 반응식의 계수는 몰 비율을 나타내며 질량 비율이 아닙니다.",university:"이상기체 몰부피 22.4 L/mol(STP). 몰 농도 M = mol/L. 한계 반응물(limiting reagent) 계산과 수율(yield) 개념. 화학량론적 비율을 이용한 정량 분석."},deepDive:['몰은 화학에서 매우 작은 입자(원자, 분자)를 다루기 위한 "숫자를 세는 단위"입니다. 실생활의 "한 타"(12개), "한 묶음" 개념과 비슷하지만, 아보가드로수는 상상하기 힘들 정도로 큰 숫자입니다.',"화학 반응식의 계수비는 항상 몰 수의 비율입니다. 질량으로 비교하려면 각 물질의 몰질량을 곱해 변환해야 하며, 이 과정을 놓치는 것이 가장 흔한 오개념입니다."],examples:["물 18g은 정확히 1몰(H₂O의 몰질량 18 g/mol)","2H₂ + O₂ → 2H₂O에서 수소 2몰과 산소 1몰이 반응","STP에서 기체 1몰의 부피는 22.4L"],observationActivity:{title:"베이킹소다와 식초 반응의 화학량론 확인",description:"베이킹소다(NaHCO₃)와 식초(아세트산)의 비율을 바꿔가며 생성되는 이산화탄소의 양을 비교합니다.",prediction:"한계 반응물이 소진되면 더 이상 기체가 발생하지 않을 것이다",materials:["베이킹소다","식초","풍선","삼각플라스크","저울"],steps:["1. 베이킹소다의 양을 고정하고 식초의 양을 다르게 준비합니다","2. 플라스크에 베이킹소다를 넣고 풍선을 입구에 씌웁니다","3. 식초를 부어 반응시키고 풍선이 부푸는 정도를 관찰합니다","4. 식초 양에 따른 풍선 크기 변화를 기록하고 한계 반응물을 추론합니다"],safetyWarning:"반응이 격렬할 수 있으니 실험 후 환기하세요"},questions:["high-chem-01-q01","high-chem-01-q02","high-chem-01-q03","high-chem-01-q04","high-chem-01-q05","high-chem-01-q06"]},{id:"high-math-01",subject:"math",grade:10,level:"advanced",unit:"미적분",title:"함수의 극한과 미분",summary:"함수가 특정 값에 가까워질 때의 극한과, 순간 변화율을 나타내는 미분을 배운다.",keywords:["극한","미분","순간변화율","접선","연속함수"],misconceptions:["극한값은 그 점에서의 함수값과 항상 같다","미분은 그래프를 그리는 기술일 뿐이다"],explanation:{basic:'자동차의 속도계는 매 순간의 속도를 보여줍니다. 미분은 이렇게 "그 순간"의 변화율을 계산하는 방법입니다.',curriculum:"lim(x→a) f(x)는 x가 a에 한없이 가까워질 때 f(x)가 가까워지는 값. 미분계수 f'(a) = lim(h→0) [f(a+h)-f(a)]/h는 그 점에서의 순간변화율(접선의 기울기)입니다.",university:"ε-δ 논법에 의한 극한의 엄밀한 정의. 미분가능성과 연속성의 관계(미분가능이면 연속이지만 역은 성립하지 않음). 평균값 정리와 Taylor 급수 전개."},deepDive:['극한은 "그 값에 도달하는가"가 아니라 "그 값에 한없이 가까워지는가"를 다룹니다. 함수가 그 점에서 정의되지 않아도 극한은 존재할 수 있습니다.',"미분은 기하학적으로 접선의 기울기, 물리학적으로 순간변화율(속도, 가속도 등)을 의미합니다. 두 관점이 같은 수학적 대상을 다르게 해석한 것임을 이해하는 것이 중요합니다."],examples:["f(x) = x²에서 x=3일 때 순간변화율은 f'(3) = 6","자유낙하하는 물체의 순간 속도","그래프의 특정 점에서 접선 그리기"],observationActivity:{title:"평균변화율로 순간변화율 근사하기",description:"아주 작은 구간의 평균변화율을 계산해 미분계수에 근사시킵니다.",prediction:"구간을 좁힐수록 평균변화율이 특정 값에 수렴할 것이다",materials:["그래프 용지","계산기"],steps:["1. f(x) = x²에서 x=2와 x=2+h 사이의 평균변화율을 계산합니다","2. h를 1, 0.1, 0.01로 줄여가며 값을 기록합니다","3. 값이 어떤 수에 가까워지는지 관찰합니다","4. 실제 미분계수 f'(2)=4와 비교합니다"],safetyWarning:"계산 과정의 반올림 오차에 유의하세요"},questions:["high-math-01-q01","high-math-01-q02","high-math-01-q03","high-math-01-q04","high-math-01-q05","high-math-01-q06"]},{id:"high-bio-01",subject:"biology",grade:11,level:"advanced",unit:"유전",title:"유전의 법칙과 DNA",summary:"멘델의 유전 법칙과 DNA의 구조를 통해 형질이 자손에게 전달되는 원리를 이해한다.",keywords:["DNA","유전자","멘델","우열의 법칙","염색체"],misconceptions:["우성 형질이 열성보다 더 흔하거나 더 좋은 형질이다","DNA와 유전자는 같은 것이다"],explanation:{basic:"부모의 특징은 DNA라는 설계도를 통해 자식에게 전달됩니다. 눈 색깔, 혈액형 같은 형질은 부모에게서 물려받은 유전자의 조합으로 결정됩니다.",curriculum:"멘델의 법칙: 우열의 법칙, 분리의 법칙, 독립의 법칙. 유전자형(Rr)과 표현형(둥근콩)의 구분. DNA는 이중나선 구조로 염기서열(A-T, G-C)에 유전정보가 저장됩니다.",university:"감수분열에서의 교차(crossing over)와 유전적 재조합. Hardy-Weinberg 평형. 유전자 발현: 전사(transcription)와 번역(translation), 중심원리(central dogma). 돌연변이의 종류와 진화적 의미."},deepDive:['우성과 열성은 "좋고 나쁨"이 아니라 단지 이형접합(Rr)일 때 어느 형질이 표현형으로 드러나는지를 나타내는 개념입니다. 열성 형질도 집단에서 흔하게 나타날 수 있습니다.',"DNA는 유전 정보 전체를 담은 화학적 분자(이중나선)이고, 유전자는 그 DNA 중 특정 단백질을 만드는 정보를 담은 부분 구간입니다. 즉 유전자는 DNA의 일부입니다."],examples:["완두콩의 둥근 모양(R)과 주름진 모양(r) 교배 실험","ABO식 혈액형의 유전","적록색맹의 반성유전"],observationActivity:{title:"가상의 교배 실험으로 유전 비율 확인",description:"동전 던지기로 대립유전자의 무작위 조합을 시뮬레이션하여 3:1 분리비를 확인합니다.",prediction:"이형접합끼리 교배하면 표현형이 대략 3:1 비율로 나올 것이다",materials:["동전 2개","기록지"],steps:["1. 동전 앞면을 R(우성), 뒷면을 r(열성)로 정합니다","2. 두 동전을 동시에 던져 유전자형(RR, Rr, rr)을 기록합니다","3. 40회 반복하여 표현형 비율을 계산합니다","4. 이론적 비율(3:1)과 비교합니다"],safetyWarning:"없음 (시뮬레이션 활동)"},questions:["high-bio-01-q01","high-bio-01-q02","high-bio-01-q03","high-bio-01-q04","high-bio-01-q05","high-bio-01-q06"]},{id:"high-astro-01",subject:"astronomy",grade:11,level:"advanced",unit:"우주론",title:"우주의 팽창과 빅뱅 이론",summary:"우주는 빅뱅으로부터 시작되어 계속 팽창하고 있으며, 이는 여러 관측 증거로 뒷받침된다.",keywords:["빅뱅","허블의 법칙","적색편이","우주배경복사","우주팽창"],misconceptions:["빅뱅은 공간 속에서 일어난 폭발이다","은하들은 우주 공간 속을 이동해서 멀어진다"],explanation:{basic:"우주는 약 138억 년 전 아주 작고 뜨거운 상태에서 시작해 계속 팽창해 왔습니다. 멀리 있는 은하일수록 우리에게서 더 빨리 멀어지고 있습니다.",curriculum:"허블의 법칙: v = H₀d (은하의 후퇴속도는 거리에 비례). 적색편이(redshift)로 후퇴속도 측정. 우주배경복사(CMB)는 빅뱅의 잔광으로 빅뱅 이론의 강력한 증거입니다.",university:"Friedmann 방정식으로 기술되는 우주의 팽창. 스케일 인자 a(t)와 곡률, 암흑에너지 Λ의 역할. 급팽창 이론(inflation)이 설명하는 우주의 평탄성과 지평선 문제."},deepDive:["빅뱅은 이미 존재하던 빈 공간 속에서 물질이 폭발한 사건이 아니라, 공간 자체가 팽창하기 시작한 사건입니다. 은하들은 공간 속을 움직이는 것이 아니라 공간 자체가 늘어나면서 서로 멀어집니다.","우주배경복사는 빅뱅 후 약 38만 년이 지나 우주가 투명해지면서 방출된 빛의 흔적으로, 오늘날 절대온도 약 2.7K의 마이크로파로 우주 전역에서 매우 균일하게 관측됩니다."],examples:["허블 우주망원경의 은하 후퇴속도 관측","우주배경복사(CMB) 지도","가장 오래된 빛으로 추정되는 우주 초기 은하 관측"],observationActivity:{title:"풍선 모형으로 우주 팽창 이해하기",description:"풍선 표면에 점을 찍고 부풀리며 은하 사이의 거리 변화를 시뮬레이션합니다.",prediction:"풍선을 불수록 모든 점 사이의 거리가 서로 멀어질 것이다",materials:["풍선","유성펜"],steps:["1. 풍선을 약간만 불고 표면에 점을 여러 개 찍습니다","2. 점 사이의 거리를 측정합니다","3. 풍선을 더 불면서 거리를 다시 측정합니다","4. 모든 점 사이의 거리가 고르게 늘어나는 것을 확인합니다"],safetyWarning:"풍선이 터질 수 있으니 눈 가까이에서 불지 마세요"},questions:["high-astro-01-q01","high-astro-01-q02","high-astro-01-q03","high-astro-01-q04","high-astro-01-q05","high-astro-01-q06"]},{id:"high-med-01",subject:"medicine",grade:12,level:"advanced",unit:"인체와 건강",title:"인체의 항상성과 면역",summary:"우리 몸은 다양한 조절 시스템으로 내부 환경을 일정하게 유지하고 병원체로부터 스스로를 보호한다.",keywords:["항상성","면역","백혈구","항체","자율신경계"],misconceptions:["체온이 항상 정확히 36.5도로 고정되어 있다","한 번 걸린 병에는 절대 다시 걸리지 않는다"],explanation:{basic:"우리 몸은 체온, 혈당, 수분량 등을 일정하게 유지하려고 끊임없이 조절합니다. 이를 항상성이라고 하며, 세균이나 바이러스가 침입하면 면역 시스템이 맞서 싸웁니다.",curriculum:"항상성 조절: 되먹임 조절(feedback control), 특히 음성 되먹임이 대부분. 선천면역(피부, 백혈구의 식균작용)과 후천면역(항체, 기억세포)의 차이. 예방접종의 원리.",university:"체액성 면역(B세포-항체)과 세포성 면역(T세포)의 상호작용. 사이토카인 신호전달. 자가면역질환과 면역관용의 붕괴. 백신의 종류(약독화, 불활성화, mRNA)와 작용 기전."},deepDive:['체온이나 혈당 같은 값은 정확히 고정되는 것이 아니라 좁은 범위 안에서 오르내리며 조절됩니다. 이 조절은 대부분 "변화를 감지하면 반대 방향으로 되돌리는" 음성 되먹임 방식으로 이루어집니다.',"면역계는 한 번 만난 병원체를 기억하는 기억세포를 만들어 재감염 시 더 빠르고 강하게 반응합니다. 예방접종은 실제 감염 없이 이 기억을 미리 만들어 두는 방법입니다."],examples:["더우면 땀을 흘려 체온을 낮춘다","상처가 나면 백혈구가 몰려들어 세균과 싸운다","홍역 예방접종 후 항체가 생겨 재감염을 막는다"],observationActivity:{title:"운동 전후 심박수 변화로 항상성 조절 관찰",description:"운동 전후의 심박수 변화와 회복 시간을 측정하여 항상성 조절을 확인합니다.",prediction:"운동 직후 심박수가 크게 증가했다가 시간이 지나면 안정 시 수준으로 돌아올 것이다",materials:["시계 또는 스톱워치","기록지"],steps:["1. 안정 시 1분간 맥박수를 측정합니다","2. 제자리에서 1분간 가볍게 뛴 후 맥박수를 측정합니다","3. 이후 1분마다 맥박수를 측정하며 회복 과정을 기록합니다","4. 심박수가 안정 시 수준으로 돌아오는 데 걸린 시간을 분석합니다"],safetyWarning:"무리한 운동은 피하고 몸 상태에 따라 조절하세요"},questions:["high-med-01-q01","high-med-01-q02","high-med-01-q03","high-med-01-q04","high-med-01-q05","high-med-01-q06"]},{id:"high-phys-03",subject:"physics",grade:12,level:"advanced",unit:"열역학",title:"열역학 법칙과 엔트로피",summary:"열역학 법칙은 에너지 보존과 열의 흐름 방향, 무질서도의 증가를 설명한다.",keywords:["열역학 제1법칙","열역학 제2법칙","엔트로피","열기관","효율"],misconceptions:["에너지 효율은 100%를 넘길 수 없을 뿐 100%는 가능하다","엔트로피는 항상 어디서나 감소할 수 없다"],explanation:{basic:"열역학 제1법칙은 에너지가 새로 생기거나 없어지지 않고 형태만 바뀐다는 것이고, 제2법칙은 열이 저절로 뜨거운 곳에서 찬 곳으로만 흐른다는 것입니다.",curriculum:"제1법칙: ΔU=Q-W (내부에너지 변화=열-일). 제2법칙: 고립계의 엔트로피는 자발적 과정에서 항상 증가하거나 유지됩니다. 열기관의 효율은 결코 100%가 될 수 없습니다(카르노 효율의 한계).",university:"카르노 효율 η=1-Tc/Th는 두 열저장고 사이에서 작동하는 열기관의 이론적 최대 효율입니다. 통계역학적으로 엔트로피는 S=k_B ln Ω(미시상태 수)로 정의되며, 제2법칙은 확률적으로 무질서한 상태가 더 많다는 사실을 반영합니다."},deepDive:["고립계 전체의 엔트로피는 자발적으로 감소하지 않지만, 부분계(예: 냉장고 내부)는 외부에서 에너지를 투입하면 엔트로피가 감소할 수 있습니다. 다만 이 경우 냉장고+주변 전체의 엔트로피는 여전히 증가합니다.","열기관은 아무리 이상적으로 설계해도 두 열저장고의 온도차가 유한한 한 100% 효율을 낼 수 없습니다. 이는 특정 기술의 한계가 아니라 자연법칙 자체의 한계입니다."],examples:["자동차 엔진은 연료의 화학에너지 일부만 운동에너지로 전환한다","냉장고는 전기에너지를 이용해 내부를 차갑게 유지한다","방에 놓인 뜨거운 커피는 시간이 지나며 식어 주변과 같은 온도가 된다"],observationActivity:{title:"고무줄로 엔트로피 변화 체감하기",description:"고무줄을 늘렸다 놓으며 온도 변화를 느껴 에너지와 무질서도의 관계를 체험합니다.",prediction:"고무줄을 급격히 늘리면 입술에 대었을 때 약간 따뜻하게 느껴질 것이다",materials:["두꺼운 고무줄"],steps:["1. 고무줄을 입술이나 이마에 살짝 대어 온도를 느낍니다","2. 고무줄을 빠르게 최대한 늘린 후 다시 대어 온도를 비교합니다","3. 늘린 상태를 유지하다 빠르게 놓은 후 온도를 다시 비교합니다","4. 분자 배열의 무질서도 변화와 온도 변화를 연결지어 설명합니다"],safetyWarning:"고무줄이 끊어지거나 튕기지 않도록 조심하세요"},questions:["high-phys-03-q01","high-phys-03-q02","high-phys-03-q03","high-phys-03-q04","high-phys-03-q05","high-phys-03-q06"]},{id:"high-chem-02",subject:"chemistry",grade:11,level:"advanced",unit:"반응과 에너지",title:"산화·환원 반응",summary:"전자를 잃는 산화와 전자를 얻는 환원은 항상 동시에 일어나며, 이는 전지와 부식의 기초 원리이다.",keywords:["산화","환원","산화수","전지","부식"],misconceptions:["산화는 항상 산소와 결합하는 것만을 의미한다","산화와 환원은 따로 일어날 수 있다"],explanation:{basic:"철이 녹스는 것처럼 물질이 전자를 잃는 것을 산화, 전자를 얻는 것을 환원이라고 합니다. 이 둘은 항상 함께 일어납니다.",curriculum:"산화수의 변화로 산화·환원을 판단합니다. 산화수가 증가하면 산화, 감소하면 환원입니다. 산화-환원 반응은 전자의 이동을 이용해 전기를 만드는 전지의 원리가 됩니다.",university:"표준환원전위(E°)를 이용해 반응의 자발성을 예측하며, 전지의 기전력은 ΔE°=E°(환원전극)-E°(산화전극)로 계산됩니다. 깁스 자유에너지 ΔG=-nFE°로 반응의 자발성과 전기화학을 연결합니다."},deepDive:["산화는 반드시 산소와 결합하는 것만을 의미하지 않습니다. 산소가 관여하지 않아도 전자를 잃으면 산화이며, 예를 들어 금속이 전자를 잃고 양이온이 되는 것도 산화입니다.","산화와 환원은 반드시 짝을 이루어 동시에 일어납니다. 한 물질이 전자를 잃으면(산화) 반드시 다른 물질이 그 전자를 얻어야(환원) 하기 때문에, 이 둘은 항상 함께 일어나는 하나의 반응(산화환원반응)입니다."],examples:["철못이 녹스는 것은 철이 산화되는 반응","건전지 속에서 산화·환원 반응으로 전류가 흐른다","과일이 갈변하는 것도 일종의 산화 반응"],observationActivity:{title:"레몬 전지 만들기",description:"레몬과 서로 다른 금속(구리, 아연)으로 간단한 전지를 만들어 산화환원 반응이 전기를 만드는 것을 확인합니다.",prediction:"두 금속과 레몬즙 사이에서 산화환원 반응이 일어나 미세한 전류가 발생할 것이다",materials:["레몬","구리판(또는 동전)","아연판(또는 못)","전류계 또는 LED"],steps:["1. 레몬에 구리판과 아연판을 꽂습니다","2. 두 금속판을 전류계나 저전력 LED에 연결합니다","3. 전류가 흐르는지(LED가 켜지는지) 확인합니다","4. 두 금속의 산화·환원 반응과 연결지어 설명합니다"],safetyWarning:"금속판의 날카로운 부분에 다치지 않도록 주의하세요"},questions:["high-chem-02-q01","high-chem-02-q02","high-chem-02-q03","high-chem-02-q04","high-chem-02-q05","high-chem-02-q06"]},{id:"high-chem-03",subject:"chemistry",grade:12,level:"advanced",unit:"화학 평형",title:"화학 평형과 르샤틀리에 원리",summary:"가역 반응은 정반응과 역반응의 속도가 같아지는 평형 상태에 도달하며, 조건 변화에 따라 평형이 이동한다.",keywords:["화학 평형","평형상수","르샤틀리에 원리","가역반응","반응 지수"],misconceptions:["평형에 도달하면 반응이 완전히 멈춘다","평형 이동은 반응물이나 생성물의 양이 모두 바뀌는 것을 의미하지 않는다"],explanation:{basic:"어떤 반응은 한쪽으로만 끝까지 가지 않고, 반응물과 생성물이 서로 오가며 일정한 비율에서 멈춘 것처럼 보이는 평형 상태에 도달합니다.",curriculum:"평형상수 K는 평형 상태에서 생성물과 반응물의 농도비로 정의됩니다. 르샤틀리에 원리는 평형계에 변화(농도, 압력, 온도)가 가해지면 그 변화를 상쇄하는 방향으로 평형이 이동한다는 것입니다.",university:"반응지수 Q와 평형상수 K를 비교해 반응이 진행될 방향을 예측합니다(Q<K이면 정반응, Q>K이면 역반응). 온도 변화에 따른 평형상수의 변화는 반트호프 식으로 정량적으로 기술됩니다."},deepDive:['화학 평형에 도달해도 반응이 완전히 멈춘 것은 아닙니다. 정반응과 역반응이 똑같은 속도로 계속 일어나고 있어서 겉보기에는 변화가 없어 보이는 "동적 평형" 상태입니다.','평형 이동이 일어나도 평형상수 K 자체는 온도가 일정하면 변하지 않습니다. 농도나 압력 변화는 반응물과 생성물의 "양"을 재조정할 뿐, K 값 자체를 바꾸는 것은 온도 변화뿐입니다.'],examples:["헤모글로빈과 산소의 결합·해리 평형","탄산음료의 이산화탄소 용해 평형(압력에 따라 이동)","하버법에 의한 암모니아 합성에서의 평형 이동 활용"],observationActivity:{title:"코발트 착이온 평형 이동 관찰(또는 대체 실험)",description:"온도 변화에 따라 색이 변하는 평형 반응을 관찰해 르샤틀리에 원리를 확인합니다.",prediction:"온도를 높이거나 낮추면 평형이 이동해 색이 변할 것이다",materials:["색 변화 지시약 용액(교사 준비)","뜨거운 물","얼음물","시험관"],steps:["1. 평형 반응 용액을 시험관에 나눠 담습니다","2. 한쪽은 뜨거운 물에, 다른 쪽은 얼음물에 담급니다","3. 색 변화를 관찰하고 기록합니다","4. 르샤틀리에 원리로 관찰 결과를 설명합니다"],safetyWarning:"화학 약품은 교사의 지도 하에 다루고 피부에 닿지 않도록 주의하세요"},questions:["high-chem-03-q01","high-chem-03-q02","high-chem-03-q03","high-chem-03-q04","high-chem-03-q05","high-chem-03-q06"]},{id:"high-math-02",subject:"math",grade:11,level:"advanced",unit:"수열",title:"수열과 급수",summary:"일정한 규칙으로 나열된 수의 열(수열)과 그 합(급수)의 성질을 탐구한다.",keywords:["등차수열","등비수열","급수","수렴","발산"],misconceptions:["무한히 더하면 항상 무한대가 된다","등비수열의 합은 항상 발산한다"],explanation:{basic:"1, 3, 5, 7처럼 일정하게 더해지는 수열을 등차수열, 2, 4, 8, 16처럼 일정하게 곱해지는 수열을 등비수열이라고 합니다.",curriculum:"등차수열의 합 Sₙ=n(a₁+aₙ)/2, 등비수열의 합 Sₙ=a₁(1-rⁿ)/(1-r)(r≠1). 공비 |r|<1인 무한등비급수는 특정 값으로 수렴하며 S=a₁/(1-r)로 계산됩니다.",university:"급수의 수렴·발산은 여러 판정법(비율판정법, 근판정법, 적분판정법 등)으로 엄밀하게 분석됩니다. 테일러 급수는 함수를 무한 다항식으로 근사하는 강력한 도구로, 삼각함수·지수함수 등의 계산과 해석에 활용됩니다."},deepDive:['무한히 많은 수를 더한다고 항상 무한대가 되는 것은 아닙니다. 공비의 절댓값이 1보다 작은 무한등비급수처럼, 더하는 항이 충분히 빠르게 작아지면 합이 유한한 값으로 "수렴"할 수 있습니다.',"등비수열의 합은 공비 r의 절댓값에 따라 다릅니다. |r|<1이면 특정 값으로 수렴하지만, |r|≥1이면 발산합니다. 이 조건을 확인하지 않고 무조건 발산한다고 생각하는 것은 오개념입니다."],examples:["1+1/2+1/4+1/8+... 은 2로 수렴하는 무한등비급수","복리 이자 계산은 등비수열의 원리를 이용","분열하는 세포 수는 등비수열로 모델링 가능"],observationActivity:{title:"종이 반으로 접어 무한급수 체감하기",description:"종이를 반씩 계속 잘라가며 남은 부분의 합이 항상 1을 넘지 않음을 확인합니다.",prediction:"아무리 반씩 잘라 더해도 전체 넓이(1)를 넘지 않을 것이다",materials:["정사각형 종이","가위","자"],steps:["1. 정사각형 종이의 절반을 잘라 따로 둡니다(1/2)","2. 남은 절반을 다시 반으로 잘라 따로 둡니다(1/4)","3. 이 과정을 여러 번 반복하며 자른 조각의 합을 계산합니다","4. 합이 1에 가까워지지만 넘지 않음을 확인하고 무한급수와 연결합니다"],safetyWarning:"가위 사용 시 손을 다치지 않도록 주의하세요"},questions:["high-math-02-q01","high-math-02-q02","high-math-02-q03","high-math-02-q04","high-math-02-q05","high-math-02-q06"]},{id:"high-math-03",subject:"math",grade:12,level:"advanced",unit:"벡터와 행렬",title:"벡터와 행렬의 기초",summary:"크기와 방향을 함께 가지는 벡터와, 여러 수를 표 형태로 다루는 행렬의 기본 연산을 배운다.",keywords:["벡터","행렬","내적","연립방정식","변환"],misconceptions:["벡터는 크기만 있는 양이다","행렬의 곱셈은 숫자의 곱셈처럼 순서를 바꿔도 결과가 같다"],explanation:{basic:'벡터는 화살표처럼 크기와 방향을 함께 나타내는 양입니다. 예를 들어 "북쪽으로 5km"는 벡터로 나타낼 수 있습니다.',curriculum:"벡터의 덧셈·뺄셈은 성분별로 계산하며, 내적(스칼라곱)은 두 벡터의 방향 관계(각도)를 알려줍니다. 행렬은 숫자를 행과 열로 배열한 것으로, 연립방정식을 간결하게 표현하고 도형의 변환(회전, 확대)을 나타내는 데 사용됩니다.",university:"벡터공간과 선형변환의 관점에서 행렬은 선형사상을 나타내는 도구이며, 행렬의 곱셈은 일반적으로 교환법칙이 성립하지 않습니다(AB≠BA). 고유값과 고유벡터는 선형변환의 본질적인 성질(신축 방향과 비율)을 나타냅니다."},deepDive:['벡터는 크기(스칼라)와 달리 방향 정보를 함께 가집니다. "속력 5m/s"는 스칼라이지만 "북쪽으로 5m/s"는 벡터입니다. 이 차이를 구분하는 것이 벡터를 이해하는 핵심입니다.',"행렬의 곱셈은 숫자의 곱셈과 달리 일반적으로 순서를 바꾸면 다른 결과가 나옵니다(AB≠BA). 이는 행렬이 나타내는 변환을 적용하는 순서가 결과에 영향을 미치기 때문입니다."],examples:["비행기의 속도는 방향과 크기를 모두 가지는 벡터","이미지 회전, 확대는 행렬 변환으로 구현","연립방정식을 행렬로 표현해 컴퓨터로 빠르게 계산"],observationActivity:{title:"좌표평면에서 벡터의 합 그려보기",description:"두 벡터를 화살표로 그려 평행사변형법으로 합을 구하고 계산 결과와 비교합니다.",prediction:"평행사변형법으로 구한 합과 성분별 계산 결과가 일치할 것이다",materials:["모눈종이","자","색연필"],steps:["1. 좌표평면에 벡터 a=(2,1), b=(1,3)을 화살표로 그립니다","2. 평행사변형법으로 a+b를 그림으로 구합니다","3. 성분별 덧셈으로 a+b=(3,4)를 계산합니다","4. 그림과 계산 결과가 일치하는지 확인합니다"],safetyWarning:"자와 색연필 사용 시 손을 다치지 않도록 주의하세요"},questions:["high-math-03-q01","high-math-03-q02","high-math-03-q03","high-math-03-q04","high-math-03-q05","high-math-03-q06"]},{id:"high-bio-02",subject:"biology",grade:10,level:"advanced",unit:"생태계",title:"생태계와 개체군",summary:"생물은 개체군, 군집, 생태계 수준에서 상호작용하며 에너지와 물질이 순환한다.",keywords:["개체군","군집","먹이사슬","생태 피라미드","개체군 밀도"],misconceptions:["한 생태계 안의 자원은 무한하다","먹이사슬의 상위 단계일수록 개체 수가 더 많다"],explanation:{basic:"같은 종의 생물 무리를 개체군, 여러 개체군이 모인 것을 군집이라 합니다. 생태계는 이런 생물들과 그 주변 환경이 상호작용하는 전체를 말합니다.",curriculum:"개체군은 출생, 사망, 이입, 이출로 크기가 변하며 환경 저항으로 성장이 제한됩니다(로지스틱 성장). 먹이사슬을 따라 에너지가 이동할 때마다 약 90%가 열로 손실되어 상위 영양단계로 갈수록 이용 가능한 에너지와 개체 수가 줄어듭니다.",university:"개체군 성장은 dN/dt=rN(1-N/K) 로지스틱 방정식으로 모델링되며, K는 환경수용력을 나타냅니다. 군집 생태학에서는 종간 경쟁, 포식, 공생 등의 상호작용이 종 다양성과 군집 구조를 결정하는 핵심 요인입니다."},deepDive:['생태계의 자원(먹이, 공간, 물 등)은 유한하며, 개체군이 계속 증가하면 결국 환경수용력에 도달해 성장이 둔화되는 로지스틱 성장 패턴을 보입니다. "자원은 무한하다"는 가정은 초기 지수 성장 단계에서만 근사적으로 성립합니다.',"먹이사슬에서 에너지는 각 단계를 거칠 때마다 대부분 열로 손실되므로, 상위 단계로 갈수록 이용 가능한 에너지가 줄어 개체 수도 대체로 줄어드는 피라미드 구조가 나타납니다."],examples:["초원의 사자 개체군은 먹이(초식동물) 양에 의해 제한된다","생태 피라미드에서 최상위 포식자의 개체 수가 가장 적다","외래종의 유입이 기존 생태계 균형을 깨뜨릴 수 있다"],observationActivity:{title:"학교 화단의 개체군 밀도 조사",description:"일정 면적 안의 특정 식물이나 곤충의 개체 수를 세어 개체군 밀도를 계산합니다.",prediction:"장소에 따라 개체군 밀도가 다르게 나타날 것이다",materials:["줄자","기록지","돋보기"],steps:["1. 1㎡ 크기의 조사 구역을 정합니다","2. 구역 안의 특정 생물(예: 민들레)의 개체 수를 셉니다","3. 다른 장소에서도 같은 방법으로 조사합니다","4. 장소별 개체군 밀도를 비교하고 이유를 추론합니다"],safetyWarning:"야외 조사 시 벌레에 물리지 않도록 주의하세요"},questions:["high-bio-02-q01","high-bio-02-q02","high-bio-02-q03","high-bio-02-q04","high-bio-02-q05","high-bio-02-q06"]},{id:"high-bio-03",subject:"biology",grade:12,level:"advanced",unit:"신경과 호르몬",title:"신경계와 호르몬의 조절",summary:"신경계는 빠르고 정밀한 신호로, 호르몬은 느리지만 지속적인 신호로 우리 몸을 조절한다.",keywords:["뉴런","시냅스","호르몬","항상성","되먹임 조절"],misconceptions:["신경 신호와 호르몬 신호는 속도와 지속시간이 같다","호르몬은 특정 기관에만 영향을 준다"],explanation:{basic:"신경계는 전기 신호로 매우 빠르게 정보를 전달하고, 호르몬은 혈액을 타고 이동하며 서서히, 오래 작용합니다.",curriculum:"뉴런은 활동전위(전기 신호)로 정보를 전달하며 시냅스에서 신경전달물질을 통해 다음 뉴런에 신호를 넘깁니다. 호르몬은 내분비샘에서 분비되어 혈액을 통해 표적기관으로 이동하며, 대부분 음성 되먹임으로 조절됩니다.",university:"활동전위는 Na⁺/K⁺ 이온 채널의 개폐로 발생하는 막전위 변화이며, 전도 속도는 축삭의 직경과 말이집(수초) 유무에 따라 달라집니다. 호르몬은 표적세포의 수용체(막수용체 또는 핵내수용체)에 결합해 신호전달경로를 활성화하며, 시상하부-뇌하수체 축을 통한 되먹임 조절이 대표적입니다."},deepDive:["신경 신호는 밀리초 단위로 빠르게 전달되고 효과가 짧게 지속되지만, 호르몬 신호는 분~시간 단위로 전달되며 효과가 오래 지속됩니다. 이 둘은 서로 다른 시간 규모에서 우리 몸을 조절하는 상호보완적인 시스템입니다.","하나의 호르몬이 여러 기관에 서로 다른 영향을 미치는 경우가 많습니다. 예를 들어 아드레날린은 심장, 혈관, 간, 폐 등 여러 기관에 동시에 영향을 주어 신체를 긴급 상황에 대비시킵니다."],examples:["뜨거운 것에 닿으면 즉시 손을 떼는 반사 작용(신경계)","인슐린은 혈당을 낮추는 호르몬","스트레스 상황에서 아드레날린이 분비되어 심장이 빨리 뛴다"],observationActivity:{title:"반응 시간 측정으로 신경 전달 속도 체감하기",description:"자를 이용한 간단한 반응 시간 측정 실험으로 신경 신호 전달을 체감합니다.",prediction:"연습할수록 반응 시간이 짧아질 것이다",materials:["30cm 자"],steps:["1. 한 사람이 자의 위쪽 끝을 잡고 다른 사람은 자의 0cm 지점 근처에서 손가락을 벌리고 기다립니다","2. 예고 없이 자를 떨어뜨리고 상대방은 최대한 빨리 자를 잡습니다","3. 잡은 위치의 눈금으로 반응 거리를 기록합니다","4. 5회 반복해 평균 반응 거리(반응 시간)의 변화를 비교합니다"],safetyWarning:"자가 떨어질 때 다른 사람이 다치지 않도록 주의하세요"},questions:["high-bio-03-q01","high-bio-03-q02","high-bio-03-q03","high-bio-03-q04","high-bio-03-q05","high-bio-03-q06"]},{id:"high-earth-01",subject:"earthscience",grade:10,level:"advanced",unit:"대기와 해양",title:"대기 대순환과 기후 변화",summary:"지구 대기의 대순환 구조와 온실효과의 심화 이해를 통해 기후 변화의 원인을 탐구한다.",keywords:["해들리 순환","온실효과","기후변화","이산화탄소","되먹임"],misconceptions:["온실효과 자체가 나쁜 것이다","기후변화는 자연적 변동일 뿐 인간 활동과 무관하다"],explanation:{basic:"온실효과는 대기가 지구의 열을 붙잡아 생명이 살 수 있는 온도를 유지해주는 자연스러운 현상입니다. 문제는 그 효과가 인간 활동으로 지나치게 강해지는 것입니다.",curriculum:"해들리, 페렐, 극순환의 세 순환 세포가 위도별 에너지 불균형을 재분배합니다. 온실기체(CO₂, 메탄 등)의 증가는 지구 평균기온을 상승시키며, 빙하 감소로 인한 반사율 감소 같은 양의 되먹임이 온난화를 가속할 수 있습니다.",university:"복사강제력(radiative forcing) 개념으로 온실기체 증가가 지구 에너지 수지에 미치는 영향을 정량화합니다. 기후 모델은 대기-해양-빙권-생물권 간 복잡한 상호작용과 되먹임을 결합해 미래 기후를 예측합니다."},deepDive:["온실효과 자체는 지구를 생명이 살 수 있는 온도로 유지해주는 필수적인 자연 현상입니다. 문제가 되는 것은 화석연료 사용 등으로 온실기체 농도가 비정상적으로 빠르게 증가해 온실효과가 과도하게 강화되는 것입니다.","기후변화에는 자연적 요인(화산활동, 태양활동 변화 등)도 있지만, 현재 관측되는 급격한 온난화 추세는 대기 중 이산화탄소 농도 증가와 매우 밀접하게 연관되어 있으며 다수의 과학적 증거가 인간 활동의 영향을 뒷받침합니다."],examples:["북극 빙하 감소로 인한 해수면 상승","대기 중 CO₂ 농도의 산업화 이후 급격한 증가","이상기후로 인한 폭염과 폭우 빈도 증가"],observationActivity:{title:"온실효과 모형실험",description:"투명한 병과 일반 공기를 비교해 온실기체 농도에 따른 온도 변화를 관찰합니다.",prediction:"이산화탄소 농도가 높은 병 안의 온도가 더 높게 올라갈 것이다",materials:["투명한 병 2개","온도계 2개","탄산음료(이산화탄소 공급용) 또는 드라이아이스","전등"],steps:["1. 한 병은 일반 공기, 다른 병은 이산화탄소를 채웁니다","2. 각 병에 온도계를 넣고 전등을 같은 거리에서 비춥니다","3. 일정 시간마다 온도를 측정합니다","4. 두 병의 온도 상승 속도를 비교합니다"],safetyWarning:"드라이아이스 사용 시 맨손으로 만지지 말고 환기하세요"},questions:["high-earth-01-q01","high-earth-01-q02","high-earth-01-q03","high-earth-01-q04","high-earth-01-q05","high-earth-01-q06"]},{id:"high-earth-02",subject:"earthscience",grade:11,level:"advanced",unit:"해양",title:"해양의 물리적 성질과 순환",summary:"해수의 온도와 염분 차이는 밀도차를 만들어 전 지구적인 심층 해류 순환을 일으킨다.",keywords:["염분","수온약층","심층 순환","표층 해류","엘니뇨"],misconceptions:["바다는 표면부터 바닥까지 온도가 거의 같다","해류는 표층에서만 존재한다"],explanation:{basic:"바다는 표층은 따뜻하고 깊은 곳은 차갑습니다. 바닷물은 바람이나 온도·염분 차이에 의해 전 세계를 순환합니다.",curriculum:"수온약층은 깊이에 따라 수온이 급격히 변하는 층입니다. 표층 해류는 주로 바람에 의해, 심층 해류는 온도와 염분에 따른 밀도차(열염순환)에 의해 형성됩니다.",university:"전 지구 열염순환(컨베이어 벨트)은 북대서양에서 침강한 차갑고 짠 해수가 심층을 따라 전 대양을 순환하며 수백~수천 년에 걸쳐 열과 물질을 재분배하는 과정으로, 기후 시스템의 핵심 조절자 역할을 합니다."},deepDive:["바다는 깊이에 따라 온도가 크게 다릅니다. 표층은 태양열로 따뜻하지만, 수온약층 아래 심해는 항상 매우 차갑고 어둡습니다. 이 온도 구조는 해양 생태계와 순환에 큰 영향을 미칩니다.","해류는 표층뿐 아니라 심해에서도 존재합니다. 표층 해류는 바람에 의해, 심층 해류는 밀도차에 의해 움직이며, 이 둘이 합쳐져 전 지구적인 해양 컨베이어 벨트를 형성합니다."],examples:["멕시코 만류(표층 난류)는 유럽의 기후를 온화하게 한다","북대서양의 차갑고 짠 해수가 가라앉아 심층 순환을 시작한다","엘니뇨는 태평양 표층 수온의 이상 변화로 발생"],observationActivity:{title:"온도와 염분에 따른 물의 밀도 차이 실험",description:"따뜻한 물과 찬물, 소금물과 민물을 섞어 밀도차에 의한 층 형성을 관찰합니다.",prediction:"차갑고 짠 물이 따뜻하고 싱거운 물보다 아래로 가라앉을 것이다",materials:["따뜻한 물","차가운 물","소금","식용색소","투명한 컵"],steps:["1. 따뜻한 물과 찬 소금물을 각각 다른 색으로 물들입니다","2. 투명한 컵에 조심스럽게 층을 이루도록 부어봅니다","3. 두 액체가 섞이는지 층을 이루는지 관찰합니다","4. 밀도 차이와 해양 순환의 원리를 연결지어 설명합니다"],safetyWarning:"뜨거운 물 사용 시 화상에 주의하세요"},questions:["high-earth-02-q01","high-earth-02-q02","high-earth-02-q03","high-earth-02-q04","high-earth-02-q05","high-earth-02-q06"]},{id:"high-earth-03",subject:"earthscience",grade:12,level:"advanced",unit:"지구의 자기장",title:"지구의 자기장과 오로라",summary:"지구 내부의 액체 외핵 운동이 만드는 자기장은 태양풍으로부터 지구를 보호하고 오로라를 만든다.",keywords:["지구 자기장","외핵","다이나모 이론","태양풍","오로라"],misconceptions:["지구 자기장은 막대자석이 지구 속에 박혀있어서 생긴다","자기장은 항상 일정하며 절대 변하지 않는다"],explanation:{basic:"지구는 거대한 자석처럼 작동해 나침반이 북쪽을 가리키게 합니다. 이 자기장은 태양에서 오는 위험한 입자들을 막아주는 보호막 역할도 합니다.",curriculum:"지구 자기장은 액체 상태인 외핵의 대류 운동과 지구 자전이 결합해 생성됩니다(다이나모 이론). 태양풍이 자기장과 상호작용하며 극지방으로 유입될 때 대기 입자와 충돌해 오로라가 발생합니다.",university:"지구 자기장은 고지자기 기록을 통해 과거 여러 차례 역전(N극과 S극이 뒤바뀜)되었음이 밝혀졌으며, 이는 해저 확장과 판구조론의 중요한 증거가 되었습니다. 자기권은 태양풍의 하전 입자를 가두거나 편향시켜 지구 대기와 생명체를 우주방사선으로부터 보호합니다."},deepDive:["지구 자기장은 실제 막대자석이 아니라, 액체 상태인 외핵의 철·니켈이 대류하며 전기전도체가 움직여 만드는 전자기 유도 효과(다이나모 효과)로 생성됩니다.","지구 자기장은 고정되어 있지 않고 서서히 변화하며, 지질학적 기록에 따르면 수십만 년에 한 번씩 N극과 S극이 뒤바뀌는 지자기 역전이 여러 차례 일어났습니다."],examples:["나침반이 북쪽을 가리키는 것은 지구 자기장 때문","북극과 남극 부근에서 관측되는 오로라","고지자기 줄무늬는 해저 확장의 증거로 사용됨"],observationActivity:{title:"막대자석과 나침반으로 자기장 모양 관찰",description:"막대자석 주위에 나침반이나 철가루를 놓아 자기력선의 모양을 확인합니다.",prediction:"자석의 양 끝(극) 근처에서 자기력선이 가장 조밀하게 나타날 것이다",materials:["막대자석","나침반 여러 개 또는 철가루","종이"],steps:["1. 막대자석 위에 종이를 놓습니다","2. 종이 위에 철가루를 뿌리거나 나침반을 여러 위치에 놓습니다","3. 자기력선의 모양(패턴)을 관찰하고 그립니다","4. 지구 자기장의 모양과 비교해 설명합니다"],safetyWarning:"철가루가 눈에 들어가지 않도록 주의하세요"},questions:["high-earth-03-q01","high-earth-03-q02","high-earth-03-q03","high-earth-03-q04","high-earth-03-q05","high-earth-03-q06"]},{id:"high-astro-02",subject:"astronomy",grade:10,level:"advanced",unit:"항성",title:"별의 스펙트럼과 분류",summary:"별빛의 스펙트럼을 분석하면 별의 온도, 화학 성분, 운동 상태를 알아낼 수 있다.",keywords:["스펙트럼","흡수선","H-R도","분광형","도플러 효과"],misconceptions:["모든 별은 흰색으로만 보인다","별빛만으로는 별의 성분을 알 수 없다"],explanation:{basic:"별빛을 프리즘으로 분산시키면 무지개색 띠(스펙트럼)가 나타나고, 그 안에 특정 색이 빠진 어두운 선(흡수선)이 보입니다. 이를 분석하면 별에 대해 많은
