학",title:"대수적 위상수학: 공간을 대수로 분류하기",summary:"대수적 위상수학은 위상공간의 구조를 군, 호몰로지 같은 대수적 대상으로 바꾸어 분류하는 강력한 도구를 제공한다.",keywords:["기본군","호몰로지","오일러 지표","공변자","분류공간"],misconceptions:["두 공간의 오일러 지표가 같으면 두 공간은 반드시 위상동형이다","기본군은 항상 계산하기 쉬운 간단한 대상이다"],explanation:{basic:'대수적 위상수학은 도형의 "구멍이 몇 개인지, 어떻게 연결되어 있는지" 같은 복잡한 기하학적 정보를 숫자나 대수적 구조(군)로 바꾸어 다루기 쉽게 만듭니다.',curriculum:'기본군은 공간 위의 폐곡선(고리)들을 서로 연속적으로 변형 가능한지에 따라 분류한 군으로, 공간의 "구멍"과 관련된 정보를 담습니다. 오일러 지표(V-E+F)는 다면체나 곡면의 위상적 불변량입니다.',university:"호몰로지군은 기본군보다 계산하기 쉬우면서도 공간의 위상적 정보를 담는 대수적 불변량으로, 특이 호몰로지·단체 호몰로지 등 여러 이론으로 구성됩니다. 이러한 도구들은 매듭이론, 데이터의 위상적 분석(위상 데이터 분석) 등 현대적인 응용으로 확장되고 있습니다."},deepDive:["오일러 지표가 같다고 해서 두 공간이 반드시 위상동형인 것은 아닙니다. 오일러 지표는 하나의 불변량일 뿐이며, 완전한 분류를 위해서는 기본군, 호몰로지군 등 여러 불변량을 함께 고려해야 합니다.","기본군은 간단한 공간(원, 구면 등)에서는 비교적 쉽게 계산되지만, 복잡한 공간에서는 계산이 매우 어려워질 수 있습니다. 이 때문에 호몰로지군처럼 계산이 더 용이한 대안적 불변량들이 함께 발전해왔습니다."],examples:["원의 기본군은 정수의 덧셈군(ℤ)과 같다(고리가 원을 몇 바퀴 감았는지로 분류)","구의 기본군은 자명군(모든 고리가 한 점으로 수축 가능)","위상 데이터 분석(TDA)은 호몰로지를 이용해 복잡한 데이터의 형태적 특징을 추출"],observationActivity:{title:"뫼비우스 띠로 위상적 성질 탐구하기",description:"종이띠로 뫼비우스 띠를 만들어 일반 고리와의 위상적 차이를 직접 체험합니다.",prediction:"뫼비우스 띠는 중앙을 따라 자르면 하나의 더 긴 고리가 될 것이다(일반 고리와 다른 결과)",materials:["종이띠","가위","테이프"],steps:["1. 종이띠를 한 번 꼬아 뫼비우스 띠를 만듭니다","2. 일반 고리(꼬지 않은 띠)도 함께 만듭니다","3. 각각을 중앙선을 따라 잘라 결과를 비교합니다","4. 두 결과의 차이를 위상적 성질(경계, 방향성)로 설명합니다"],safetyWarning:"가위 사용 시 손을 다치지 않도록 주의하세요"},questions:["phd-math-03-q01","phd-math-03-q02","phd-math-03-q03","phd-math-03-q04","phd-math-03-q05","phd-math-03-q06"]},{id:"phd-bio-01",subject:"biology",grade:20,level:"research",unit:"후성유전학",title:"후성유전학: DNA 서열 너머의 유전",summary:"DNA 서열의 변화 없이도 화학적 표지가 유전자 발현 패턴을 바꾸고, 이는 세대를 거쳐 전달될 수도 있다.",keywords:["DNA 메틸화","히스톤 변형","후성유전","게놈 각인","환경과 유전자 발현"],misconceptions:["생물의 형질은 오직 DNA 염기서열만으로 완전히 결정된다","후천적으로 얻은 형질은 절대 자손에게 전달될 수 없다"],explanation:{basic:'똑같은 DNA를 가진 일란성 쌍둥이도 시간이 지나며 서로 다른 모습을 보일 수 있는데, 이는 DNA 위에 붙는 "화학적 표지"가 유전자의 켜짐과 꺼짐을 다르게 조절하기 때문입니다.',curriculum:"DNA 메틸화(시토신에 메틸기 부착)와 히스톤 변형(아세틸화, 메틸화 등)은 DNA 서열을 바꾸지 않으면서도 유전자 발현을 억제하거나 촉진하는 후성유전학적 조절입니다. 이러한 표지는 세포 분열 시 딸세포에 전달될 수 있습니다.",university:"게놈 각인(genomic imprinting)은 부모 중 한쪽에서 유래한 대립유전자만 발현되도록 후성유전학적으로 표지되는 현상입니다. 최근 연구는 특정 환경 스트레스에 의한 후성유전학적 변화가 제한적으로나마 다음 세대로 전달될 수 있음을 시사하는 증거(경세대 후성유전)를 제시하고 있어 활발히 연구되고 있습니다."},deepDive:["생물의 형질은 DNA 서열만으로 완전히 결정되지 않습니다. 같은 유전자를 가지고 있어도 후성유전학적 표지(메틸화 패턴 등)에 따라 그 유전자가 발현되는 정도와 시기가 크게 달라질 수 있습니다.","후천적으로 얻은 형질이 자손에게 전혀 전달되지 않는다는 전통적 견해는 최근 후성유전학 연구로 일부 재검토되고 있습니다. 다만 이러한 경세대 전달은 제한적이고 복잡한 현상이며, 라마르크의 용불용설과 동일시하는 것은 지나친 단순화입니다."],examples:["일란성 쌍둥이도 나이가 들수록 메틸화 패턴이 달라져 표현형 차이가 생길 수 있음","프래더-윌리 증후군과 안젤만 증후군은 같은 부위의 결실이라도 부모의 유래에 따라 다른 질환을 일으킴(각인 효과)","암세포에서는 종양억제유전자의 비정상적 메틸화가 흔히 관찰됨"],observationActivity:{title:"후성유전학 관련 쌍둥이 연구 자료 분석",description:"일란성 쌍둥이의 후성유전학적 차이에 대한 공개 연구 자료를 조사하고 분석합니다.",prediction:"나이 차이가 클수록, 서로 다른 환경에서 자랐을수록 메틸화 패턴의 차이가 클 것이다",materials:["관련 연구 논문 또는 요약자료","정리 노트"],steps:["1. 일란성 쌍둥이의 후성유전체 비교 연구를 조사합니다","2. 나이, 생활환경에 따른 후성유전학적 차이의 정도를 정리합니다","3. 이 차이가 표현형에 미치는 영향을 논의합니다","4. 후성유전학의 의학적 응용 가능성을 조사합니다"],safetyWarning:"해당 없음(문헌 조사 활동)"},questions:["phd-bio-01-q01","phd-bio-01-q02","phd-bio-01-q03","phd-bio-01-q04","phd-bio-01-q05","phd-bio-01-q06"]},{id:"phd-bio-02",subject:"biology",grade:19,level:"research",unit:"계통발생학",title:"계통발생학: 생명의 계통수 재구성",summary:"계통발생학은 유전자와 형태 정보를 이용해 생물종 사이의 진화적 관계를 계통수로 재구성하는 학문이다.",keywords:["계통수","분자시계","공통조상","수렴진화","계통발생학적 분석"],misconceptions:["진화는 하등생물에서 고등생물로 일직선으로 발전하는 사다리 같은 과정이다","겉모습이 비슷하면 반드시 가까운 친척 관계이다"],explanation:{basic:"계통수는 생물들이 공통 조상으로부터 어떻게 갈라져 나왔는지를 나뭇가지 모양으로 나타낸 그림입니다.",curriculum:"계통수는 형태적 특징뿐 아니라 DNA·단백질 서열의 유사성을 비교해 만듭니다. 분자시계 가설은 특정 유전자의 돌연변이가 비교적 일정한 속도로 축적된다고 가정해 종분화 시기를 추정하는 데 사용됩니다.",university:"최대절약법, 최대우도법, 베이지안 방법 등 다양한 계통발생학적 추론 방법이 사용되며, 각각 서로 다른 가정과 통계적 접근을 취합니다. 수렴진화(예: 물고기와 돌고래의 유선형 몸)는 비슷한 환경 압력에 대한 독립적인 적응의 결과로, 계통학적으로는 먼 관계일 수 있어 형태적 유사성만으로 계통 관계를 판단하면 오류가 생길 수 있습니다."},deepDive:['진화는 하등생물에서 고등생물로 일직선으로 발전하는 "사다리"가 아니라, 하나의 공통조상에서 여러 방향으로 가지를 뻗어나가는 "나무"에 가깝습니다. 오늘날 존재하는 모든 생물은 각자의 환경에 적응해온 동등하게 진화한 결과물입니다.',"겉모습이 비슷하다고 반드시 가까운 친척은 아닙니다. 돌고래(포유류)와 상어(어류)는 비슷한 유선형 몸을 가지지만 계통적으로는 매우 먼 관계이며, 이는 비슷한 환경에 독립적으로 적응한 수렴진화의 결과입니다."],examples:["고래는 형태는 물고기와 비슷하지만 유전적으로는 육상 포유류에 가깝다","분자시계를 이용해 인간과 침팬지의 공통조상 시기를 추정","박쥐의 날개와 새의 날개는 독립적으로 진화한 수렴진화의 예"],observationActivity:{title:"간단한 서열 비교로 계통수 만들어보기",description:"몇 가지 가상 생물의 짧은 DNA 서열을 비교해 간단한 계통수를 직접 그려봅니다.",prediction:"서열이 더 비슷한 생물끼리 계통수에서 더 가까운 가지로 묶일 것이다",materials:["가상의 짧은 DNA 서열 자료(교사 제공)","색연필"],steps:["1. 여러 생물의 짧은 DNA 서열을 나열합니다","2. 서열 간 차이(치환된 염기 수)를 세어 비교합니다","3. 차이가 적은 생물끼리 가까운 가지로 묶어 계통수를 그립니다","4. 완성한 계통수를 실제 생물 분류와 비교해봅니다"],safetyWarning:"해당 없음(자료 분석 활동)"},questions:["phd-bio-02-q01","phd-bio-02-q02","phd-bio-02-q03","phd-bio-02-q04","phd-bio-02-q05","phd-bio-02-q06"]},{id:"phd-bio-03",subject:"biology",grade:20,level:"research",unit:"합성생물학",title:"합성생물학: 생명 시스템의 설계와 재구성",summary:"합성생물학은 공학적 원리를 생물학에 적용해 유전 회로를 설계하고 새로운 생물학적 기능을 만들어낸다.",keywords:["유전 회로","바이오브릭","CRISPR","유전자 편집","생물학적 표준부품"],misconceptions:["합성생물학은 유전공학과 완전히 동일한 것이다","CRISPR는 어떤 유전자든 완벽하게 오류 없이 편집할 수 있다"],explanation:{basic:"합성생물학은 마치 전자회로를 설계하듯 유전자를 조합해 세포가 원하는 기능(빛을 내거나 특정 물질을 만드는 등)을 하도록 설계하는 분야입니다.",curriculum:"표준화된 유전 부품(프로모터, 리보솜결합부위 등)을 조합해 유전 회로를 설계하며, 이는 스위치, 진동자, 논리 게이트 같은 전자공학적 개념을 세포 안에 구현합니다. CRISPR-Cas9은 특정 DNA 서열을 정밀하게 자르고 편집할 수 있는 강력한 유전자 편집 도구입니다.",university:"합성생물학은 전통적인 유전공학(하나의 유전자를 도입하거나 제거하는 것)을 넘어, 여러 유전 부품을 표준화하고 모듈화하여 복잡한 생물학적 시스템을 예측 가능하게 설계하는 공학적 접근을 지향합니다. CRISPR-Cas9의 표적 특이성에는 한계가 있어 의도하지 않은 부위를 편집하는 오프타겟 효과가 여전히 중요한 연구 과제입니다."},deepDive:["합성생물학은 유전공학의 도구(유전자 삽입, CRISPR 등)를 사용하지만, 단일 유전자 조작을 넘어 여러 부품을 표준화하고 조합해 예측 가능한 복잡한 시스템을 설계하려는 공학적 철학을 가진다는 점에서 전통적 유전공학과 강조점이 다릅니다.","CRISPR-Cas9은 매우 강력하고 정밀한 도구이지만 완벽하지는 않습니다. 의도한 위치가 아닌 다른 유사한 서열을 잘못 편집하는 오프타겟 효과가 발생할 수 있어, 이를 최소화하는 것이 임상 적용을 위한 중요한 연구 과제입니다."],examples:["대장균에 유전 회로를 삽입해 특정 화학물질에 반응해 빛을 내게 함","CRISPR-Cas9으로 유전질환의 원인 돌연변이를 교정하려는 시도","합성생물학으로 인슐린을 대량 생산하는 미생물 균주 개발"],observationActivity:{title:"유전 회로를 논리 게이트로 표현해보기",description:"전자공학의 AND, OR 게이트 개념을 이용해 가상의 유전 회로를 논리적으로 설계해봅니다.",prediction:"두 조건(신호)이 모두 있을 때만 유전자가 발현되는 AND 게이트형 회로를 설계할 수 있을 것이다",materials:["논리 게이트 참고자료","설계 워크시트"],steps:["1. AND, OR, NOT 논리 게이트의 개념을 복습합니다","2. 두 가지 신호(예: 온도, 특정 화학물질)에 반응하는 가상의 유전자 발현 시스템을 설계합니다","3. 원하는 논리 조건에 맞게 회로도를 그립니다","4. 실제 합성생물학 연구 사례와 비교해봅니다"],safetyWarning:"해당 없음(설계 활동)"},questions:["phd-bio-03-q01","phd-bio-03-q02","phd-bio-03-q03","phd-bio-03-q04","phd-bio-03-q05","phd-bio-03-q06"]},{id:"phd-earth-01",subject:"earthscience",grade:19,level:"research",unit:"지구시스템과학",title:"지구시스템과학: 상호 연결된 지구",summary:"지구는 대기권, 수권, 암석권, 생물권이 서로 밀접하게 상호작용하는 하나의 거대한 시스템으로 이해된다.",keywords:["지구시스템","되먹임 고리","탄소순환","생지화학적 순환","지구시스템 모델링"],misconceptions:["지구의 각 권역(대기, 바다, 육지)은 서로 독립적으로 작동한다","기후 시스템의 되먹임은 항상 변화를 증폭시키는 방향으로만 작동한다"],explanation:{basic:"지구는 공기, 바다, 땅, 생물이 서로 영향을 주고받는 하나의 커다란 시스템입니다. 한 부분의 변화가 다른 부분에도 연쇄적으로 영향을 미칩니다.",curriculum:"지구시스템과학은 기존에 개별적으로 연구되던 대기과학, 해양학, 지질학, 생태학을 통합적으로 다루며, 탄소·질소 같은 원소의 생지화학적 순환을 여러 권역에 걸쳐 추적합니다. 되먹임 고리는 양의 되먹임(변화를 증폭)과 음의 되먹임(변화를 완화)으로 나뉩니다.",university:"지구시스템 모델(Earth System Model)은 대기-해양-빙권-생물권의 상호작용을 수치적으로 결합해 시뮬레이션하며, 여러 되먹임 고리(수증기 되먹임, 빙하-알베도 되먹임, 구름 되먹임 등)의 복잡한 상호작용을 통해 미래 기후를 예측하는 데 사용됩니다."},deepDive:["대기, 바다, 육지, 생물권은 결코 독립적으로 작동하지 않습니다. 예를 들어 해양은 대기 중 이산화탄소를 흡수해 기후에 영향을 미치고, 식물의 증산작용은 대기의 수분과 강수 패턴에 영향을 줍니다. 지구시스템과학은 이런 상호연결성을 통합적으로 다룹니다.","되먹임 고리가 항상 변화를 증폭시키는 것은 아닙니다. 예를 들어 온도가 높아지면 식물의 광합성이 증가해 대기 중 CO₂를 더 흡수하는 것은 온난화를 완화하는 음의 되먹임의 예이며, 반대로 빙하가 녹아 반사율이 줄어드는 것은 온난화를 가속하는 양의 되먹임입니다."],examples:["해양은 인위적으로 배출된 CO₂의 상당 부분을 흡수한다","아마존 열대우림의 파괴는 지역 강수 패턴과 전 지구적 탄소 순환에 영향을 준다","빙하-알베도 되먹임은 극지방의 온난화를 가속시킨다"],observationActivity:{title:"지구시스템 되먹임 고리 다이어그램 그리기",description:"특정 기후 현상(예: 빙하 감소)을 중심으로 관련된 되먹임 고리를 다이어그램으로 그려봅니다.",prediction:"하나의 변화가 여러 권역을 거쳐 원래 변화를 증폭하거나 완화하는 고리를 형성할 것이다",materials:["큰 종이","색이 다른 펜","화살표 스티커(선택)"],steps:["1. 중심 현상(예: 극지방 온도 상승)을 종이 중앙에 씁니다","2. 이로 인해 영향을 받는 요소(빙하, 알베도, 흡수되는 태양복사 등)를 연결합니다","3. 화살표로 인과관계를 표시하며 고리를 완성합니다","4. 이 고리가 양의 되먹임인지 음의 되먹임인지 판단합니다"],safetyWarning:"해당 없음(다이어그램 작성 활동)"},questions:["phd-earth-01-q01","phd-earth-01-q02","phd-earth-01-q03","phd-earth-01-q04","phd-earth-01-q05","phd-earth-01-q06"]},{id:"phd-earth-02",subject:"earthscience",grade:20,level:"research",unit:"행성지질학",title:"행성지질학: 다른 행성의 표면 읽기",summary:"행성지질학은 탐사선과 원격탐사 자료를 이용해 지구 밖 행성과 위성의 지질학적 역사를 연구한다.",keywords:["크레이터 연대측정","화성 지질","행성 표면 지형","원격탐사","충돌구"],misconceptions:["모든 행성의 지질학적 원리는 지구와 완전히 다르다","충돌구가 많으면 그 표면은 항상 매우 젊다"],explanation:{basic:"화성이나 달 같은 다른 천체의 표면을 사진과 탐사 자료로 분석하면, 지구와 비슷하거나 다른 지질학적 역사를 알아낼 수 있습니다.",curriculum:"크레이터(충돌구) 계수법은 단위 면적당 충돌구의 개수를 세어 표면의 상대적인 나이를 추정하는 방법입니다. 충돌구가 많을수록 오랫동안 지질활동 없이 침식되지 않은 오래된 표면임을 시사합니다.",university:"행성지질학은 스펙트럼 원격탐사로 표면 광물 조성을 추정하고, 중력장·자기장 측정으로 내부 구조를 유추하며, 착륙선의 직접 시료 분석으로 이를 검증합니다. 화성의 건조한 하천 지형, 목성 위성 유로파의 얼음 지각 아래 액체 바다 추정 등은 이런 통합적 분석의 성과입니다."},deepDive:["다른 행성의 지질학적 원리는 지구와 완전히 다르지 않습니다. 판구조론처럼 지구에 특화된 현상도 있지만, 화산활동, 침식, 충돌구 형성 같은 기본적인 지질 과정은 여러 천체에 공통적으로 적용되는 물리·화학 법칙을 따릅니다.","충돌구가 많다고 항상 표면이 오래된 것은 절대적으로 확실한 것은 아니며, 국소적인 지질활동(화산, 침식)이 최근에 있었다면 충돌구가 지워져 적게 보일 수 있습니다. 따라서 크레이터 계수법은 다른 지질학적 증거와 함께 종합적으로 해석해야 합니다."],examples:["화성 표면의 마른 하천 지형은 과거 액체 물이 흘렀음을 시사","달의 충돌구 밀도는 지구보다 훨씬 높아 표면이 매우 오래되었음을 보여줌","유로파(목성의 위성)의 얼음 지각 아래 액체 바다가 있을 것으로 추정됨"],observationActivity:{title:"충돌구 사진으로 상대 연령 추정하기",description:"공개된 행성 표면 사진 두 장을 비교해 충돌구 밀도로 상대적인 표면 나이를 추정합니다.",prediction:"충돌구가 더 많은 지역이 더 오래된 표면일 것이다",materials:["행성 표면 사진 자료(달, 화성 등)","투명 격자 용지"],steps:["1. 두 지역의 사진에 같은 크기의 격자를 겹쳐놓습니다","2. 각 격자 안의 충돌구 개수를 셉니다","3. 단위 면적당 충돌구 개수를 비교합니다","4. 크레이터 계수법의 원리로 상대적 표면 나이를 추정합니다"],safetyWarning:"해당 없음(사진 분석 활동)"},questions:["phd-earth-02-q01","phd-earth-02-q02","phd-earth-02-q03","phd-earth-02-q04","phd-earth-02-q05","phd-earth-02-q06"]},{id:"phd-earth-03",subject:"earthscience",grade:19,level:"research",unit:"고지자기학",title:"고지자기학: 암석에 새겨진 자기장의 역사",summary:"암석이 형성될 때 기록된 과거 지구 자기장의 방향과 세기는 판의 이동과 자기장 역전의 역사를 알려준다.",keywords:["잔류자기","지자기 역전","겉보기 극이동","해양저 확장","고지자기 줄무늬"],misconceptions:["암석의 자기 기록은 시간이 지나면 계속 변한다","지자기 역전은 매우 규칙적인 주기로 일어난다"],explanation:{basic:'용암이 식어 암석이 될 때, 그 안의 자성 광물이 당시 지구 자기장의 방향을 따라 정렬되어 그대로 "얼어붙습니다". 이를 분석하면 과거 자기장을 알 수 있습니다.',curriculum:"잔류자기는 암석이 형성될 때 기록된 당시의 지구 자기장 방향과 세기입니다. 해양저의 고지자기 줄무늬(정상 자화와 역전 자화가 교대로 나타나는 띠 모양)는 해저 확장과 지자기 역전을 함께 뒷받침하는 결정적 증거였습니다.",university:"겉보기 극이동 곡선은 특정 대륙에서 측정한 고지자기 자료를 시간 순으로 이어 만든 궤적으로, 실제로는 지자기극이 이동한 것이 아니라 대륙 자체가 이동했음을 반영합니다. 지자기 역전의 시기는 불규칙적이며, 이는 외핵의 다이나모 작용이 비선형적이고 카오스적인 특성을 가지기 때문으로 이해됩니다."},deepDive:['암석에 기록된 잔류자기는 암석이 형성될 때(용암이 식어 굳을 때)의 자기장을 그대로 "동결"한 것으로, 이후 암석이 크게 재가열되지 않는 한 거의 변하지 않습니다. 이 안정성 덕분에 수백만 년 전의 자기장 기록을 오늘날에도 읽어낼 수 있습니다.',"지자기 역전은 일정한 주기로 규칙적으로 일어나지 않습니다. 어떤 시기에는 수십만 년마다, 어떤 시기에는 수백만 년 넘게 역전이 일어나지 않는 등 매우 불규칙한 패턴을 보이며, 이는 외핵의 복잡한 유체 운동과 관련이 있습니다."],examples:["대서양 중앙해령 양쪽의 대칭적인 고지자기 줄무늬는 해저확장의 결정적 증거","가장 최근의 지자기 역전(브런즈-마츠야마 역전)은 약 78만 년 전에 일어남","겉보기 극이동 곡선의 차이로 대륙이 이동했음을 확인"],observationActivity:{title:"고지자기 줄무늬 패턴 분석 자료 활동",description:"해양저 고지자기 줄무늬 자료(공개 이미지)를 분석해 대칭성과 확장 속도를 추정합니다.",prediction:"해령을 중심으로 양쪽에 대칭적인 줄무늬 패턴이 나타날 것이다",materials:["해양저 고지자기 줄무늬 이미지 자료","자"],steps:["1. 해령을 중심으로 양쪽의 줄무늬 폭을 측정합니다","2. 대칭성이 있는지 확인합니다","3. 줄무늬의 나이 자료(있는 경우)로 확장 속도를 계산합니다","4. 결과를 판구조론의 해저확장설과 연결지어 설명합니다"],safetyWarning:"해당 없음(자료 분석 활동)"},questions:["phd-earth-03-q01","phd-earth-03-q02","phd-earth-03-q03","phd-earth-03-q04","phd-earth-03-q05","phd-earth-03-q06"]},{id:"phd-astro-01",subject:"astronomy",grade:20,level:"research",unit:"우주론",title:"우주론 특강: 암흑에너지와 우주의 미래",summary:"암흑에너지는 우주의 가속 팽창을 일으키는 정체불명의 에너지로, 우주의 궁극적인 운명을 결정하는 핵심 변수이다.",keywords:["암흑에너지","가속 팽창","우주상수","Ia형 초신성","우주의 운명"],misconceptions:["우주의 팽창은 시간이 지나며 항상 느려지고 있다","암흑에너지와 암흑물질은 같은 것이다"],explanation:{basic:"1998년 과학자들은 우주가 팽창 속도를 늦추기는커녕 오히려 점점 더 빠르게 팽창하고 있다는 것을 발견했습니다. 이 가속을 일으키는 원인을 암흑에너지라고 부릅니다.",curriculum:'Ia형 초신성은 항상 비슷한 밝기를 가지는 "표준촛불"로 사용되어, 먼 거리의 초신성 관측을 통해 우주 팽창의 가속을 발견하는 데 결정적인 역할을 했습니다. 암흑에너지는 우주 전체 에너지의 약 68%를 차지하는 것으로 추정됩니다.',university:"가장 단순한 암흑에너지 모델은 아인슈타인의 우주상수 Λ로, 상태방정식 w=-1(압력/밀도 비)을 가정합니다. 암흑에너지의 정확한 성질(우주상수인지, 시간에 따라 변하는 동적 장(quintessence)인지)은 아직 미해결 문제이며, 우주의 최종 운명(대동결, 대붕괴, 대파열 등)은 암흑에너지의 정확한 성질에 따라 달라집니다."},deepDive:['우주의 팽창은 과거에는 물질의 중력에 의해 감속되었지만, 약 50억 년 전부터는 암흑에너지의 영향으로 오히려 가속되고 있는 것으로 관측됩니다. "팽창은 항상 느려진다"는 직관은 최근의 우주에는 적용되지 않습니다.',"암흑물질과 암흑에너지는 이름은 비슷하지만 전혀 다른 개념입니다. 암흑물질은 중력을 통해 물질을 끌어당기는(구조 형성을 돕는) 보이지 않는 질량이고, 암흑에너지는 오히려 공간을 밀어내며 우주를 가속 팽창시키는 반발력에 가까운 존재입니다."],examples:["1998년 두 개의 초신성 관측팀이 독립적으로 우주 가속 팽창을 발견(2011년 노벨물리학상)","우주의 에너지 구성은 약 68% 암흑에너지, 27% 암흑물질, 5% 일반물질로 추정","암흑에너지의 성질에 따라 우주는 영원히 팽창하거나(대동결) 다시 수축할 수도 있음(대붕괴)"],observationActivity:{title:"Ia형 초신성 자료로 우주 가속 팽창 확인하기",description:"공개된 Ia형 초신성의 거리-적색편이 자료를 분석해 우주 팽창의 가속 여부를 확인합니다.",prediction:"먼 거리(과거)의 초신성일수록 단순 등속 팽창 예측보다 더 어둡게(더 멀리) 관측될 것이다",materials:["공개 초신성 관측 자료","그래프 용지 또는 스프레드시트"],steps:["1. 여러 Ia형 초신성의 거리와 적색편이 자료를 수집합니다","2. 등속 팽창을 가정한 이론적 곡선을 그립니다","3. 실제 관측 자료를 겹쳐 그립니다","4. 두 곡선의 차이를 가속 팽창과 암흑에너지 개념으로 설명합니다"],safetyWarning:"해당 없음(자료 분석 활동)"},questions:["phd-astro-01-q01","phd-astro-01-q02","phd-astro-01-q03","phd-astro-01-q04","phd-astro-01-q05","phd-astro-01-q06"]},{id:"phd-astro-02",subject:"astronomy",grade:19,level:"research",unit:"외계행성학",title:"외계행성 대기 분석: 생명의 흔적을 찾아서",summary:"외계행성이 항성 앞을 지날 때 통과하는 별빛의 스펙트럼을 분석하면 그 행성의 대기 성분을 알아낼 수 있다.",keywords:["통과 분광법","바이오시그니처","생명가능지대","대기 조성","제임스웹우주망원경"],misconceptions:["외계행성의 대기를 직접 가지 않고는 절대 알 수 없다","산소가 발견되면 그 자체로 생명체의 확실한 증거이다"],explanation:{basic:"외계행성이 자신의 항성 앞을 지나갈 때, 별빛의 일부가 행성의 대기를 통과합니다. 이때 빛에 남은 흔적을 분석하면 대기 성분을 알 수 있습니다.",curriculum:"통과 분광법은 행성이 항성 앞을 지날 때(통과, transit) 별빛 스펙트럼의 미세한 변화를 측정해 대기 중의 특정 분자(물, 메탄, 이산화탄소 등)에 의한 흡수선을 찾아내는 방법입니다.",university:"바이오시그니처(생명체 존재를 암시할 수 있는 대기 성분 조합, 예: 산소와 메탄의 동시 존재)는 비생물학적 과정으로도 만들어질 수 있어 신중한 해석이 필요합니다. 제임스웹우주망원경 같은 최신 관측 장비는 이전보다 훨씬 정밀한 외계행성 대기 스펙트럼을 제공해 생명가능지대에 위치한 암석형 행성의 대기 분석을 가능하게 하고 있습니다."},deepDive:["외계행성까지 직접 가지 않고도, 별빛이 행성 대기를 통과할 때 남기는 미세한 스펙트럼 흔적을 정밀하게 분석함으로써 대기의 화학적 조성을 원격으로 알아낼 수 있습니다. 이는 현대 천문학의 놀라운 성과 중 하나입니다.","산소가 대기에서 발견되었다고 해서 곧바로 생명체의 존재를 확신할 수는 없습니다. 산소는 일부 비생물학적 광화학 반응으로도 생성될 수 있어, 진짜 생명체의 흔적인지 판단하려면 다른 분자와의 조합, 행성의 전반적인 환경을 함께 종합적으로 고려해야 합니다."],examples:["TRAPPIST-1 행성계는 여러 개의 지구형 행성을 가진 대표적 연구 대상","제임스웹우주망원경은 외계행성 대기에서 이산화탄소 흡수선을 검출","산소와 메탄이 함께 존재하면 생물학적 과정의 가능성이 높아짐(비평형 조합)"],observationActivity:{title:"통과 분광법의 원리를 광원 실험으로 이해하기",description:"색이 있는 필터를 통과한 손전등 빛의 스펙트럼 변화를 관찰해 통과 분광법의 원리를 체험합니다.",prediction:"필터의 색에 따라 특정 파장의 빛이 차단되어 스펙트럼에서 그 부분이 사라질 것이다",materials:["흰색 손전등","색이 다른 셀로판지(필터)","간이 분광기(CD 이용)"],steps:["1. 손전등 빛을 필터 없이 분광기로 관찰합니다","2. 여러 색의 셀로판지를 손전등 앞에 대고 다시 관찰합니다","3. 필터를 통과한 스펙트럼에서 사라진 부분을 확인합니다","4. 이 원리를 외계행성 대기의 통과 분광법과 연결지어 설명합니다"],safetyWarning:"눈부신 빛을 눈에 직접 비추지 않도록 주의하세요"},questions:["phd-astro-02-q01","phd-astro-02-q02","phd-astro-02-q03","phd-astro-02-q04","phd-astro-02-q05","phd-astro-02-q06"]},{id:"phd-astro-03",subject:"astronomy",grade:20,level:"research",unit:"중력파천문학",title:"중력파 천문학: 새로운 우주 관측의 창",summary:"중력파는 블랙홀이나 중성자별의 병합 같은 극단적 사건이 만드는 시공간의 잔물결로, 빛과는 다른 방식으로 우주를 관측하게 해준다.",keywords:["중력파","LIGO","블랙홀 병합","다중신호천문학","시공간의 요동"],misconceptions:["중력파는 이론적으로만 존재하며 직접 관측된 적이 없다","중력파와 전자기파는 본질적으로 같은 것이다"],explanation:{basic:"두 블랙홀이 충돌하면 시공간 자체가 미세하게 출렁이는 물결(중력파)이 생겨 우주 전체로 퍼져나갑니다.",curriculum:"중력파는 일반상대성이론이 예측한 현상으로, 가속하는 질량(특히 비대칭적으로 가속하는 거대 질량)에 의해 발생하는 시공간의 잔물결입니다. 2015년 LIGO가 두 블랙홀의 병합에서 발생한 중력파를 최초로 직접 검출했습니다.",university:"중력파는 레이저 간섭계를 이용해 팔 길이의 극도로 미세한 변화(원자핵 크기보다 작은 수준)를 측정해 검출됩니다. 다중신호천문학은 중력파와 전자기파(감마선, 가시광선 등)를 함께 관측해 하나의 천체 사건을 다각도로 분석하는 새로운 관측 패러다임으로, 중성자별 병합 관측(GW170817)에서 그 위력이 입증되었습니다."},deepDive:["중력파는 더 이상 이론적 예측에 머물지 않습니다. 2015년 LIGO가 두 블랙홀 병합에서 발생한 중력파를 최초로 직접 검출했고, 이는 2017년 노벨물리학상으로 이어졌습니다. 이후에도 여러 차례의 블랙홀·중성자별 병합 사건이 관측되고 있습니다.","중력파는 전자기파(빛)와 근본적으로 다른 현상입니다. 전자기파는 전하를 가진 입자의 가속으로 발생하는 전자기장의 파동이지만, 중력파는 질량의 비대칭적 가속으로 발생하는 시공간 자체의 기하학적 요동입니다. 매질이나 전하 없이도 전파되며, 물질과 거의 상호작용하지 않아 매우 감지하기 어렵습니다."],examples:["2015년 LIGO의 첫 중력파 검출(GW150914)은 두 블랙홀의 병합에서 발생","2017년 중성자별 병합(GW170817)은 중력파와 감마선 폭발이 동시에 관측된 사례","차세대 중력파 관측소(우주 기반 LISA 등)가 계획되고 있음"],observationActivity:{title:"중력파 검출 원리를 물결 비유로 이해하기",description:"물이 담긴 대야에 물체를 떨어뜨려 생기는 물결의 전파를 관찰하며 중력파의 전파 개념을 유추합니다.",prediction:"물체가 무겁고 빠르게 떨어질수록 물결(파동)이 더 크고 멀리 퍼질 것이다",materials:["넓은 대야","물","다양한 크기의 돌 또는 구슬"],steps:["1. 대야에 물을 채우고 잔잔하게 만듭니다","2. 작은 돌을 떨어뜨려 물결의 크기와 전파를 관찰합니다","3. 더 큰 돌이나 두 개를 동시에 떨어뜨려 비교합니다","4. 물결의 전파 방식을 시공간을 통해 퍼지는 중력파와 비유해 설명합니다(한계점도 함께 논의)"],safetyWarning:"물이 주변에 튀지 않도록 주의하고 바닥이 미끄러워지지 않게 하세요"},questions:["phd-astro-03-q01","phd-astro-03-q02","phd-astro-03-q03","phd-astro-03-q04","phd-astro-03-q05","phd-astro-03-q06"]},{id:"phd-med-01",subject:"medicine",grade:19,level:"research",unit:"중개연구",title:"중개연구방법론: 실험실에서 병상까지",summary:"중개연구는 기초과학의 발견을 실제 환자 치료로 연결하는 과정으로, 여러 단계의 검증을 거쳐야 한다.",keywords:["중개연구","전임상시험","임상시험 단계","바이오마커","중개의학"],misconceptions:["실험실에서 효과가 있으면 곧바로 환자에게 사용해도 된다","임상시험의 모든 단계는 같은 목적을 가진다"],explanation:{basic:"실험실에서 발견한 새로운 치료 아이디어가 실제 환자에게 사용되기까지는 여러 단계의 신중한 검증 과정을 거쳐야 합니다.",curriculum:"전임상시험은 세포·동물실험으로 안전성과 효능의 기초 자료를 얻는 단계입니다. 임상시험은 1상(안전성·용량), 2상(효능과 부작용 탐색), 3상(대규모 검증), 4상(시판 후 감시)의 단계를 거칩니다.",university:'중개연구(translational research)는 "기초연구에서 임상으로(T1)"뿐 아니라 "임상에서 실제 진료 현장으로(T2)"의 양방향 다리 역할을 강조하는 개념으로 확장되고 있습니다. 바이오마커의 발굴과 검증은 신약 개발의 성공률을 높이고 환자를 효율적으로 층화하는 데 핵심적인 역할을 합니다.'},deepDive:["세포실험이나 동물실험에서 효과가 있었다고 해서 곧바로 사람에게 안전하고 효과적이라고 할 수 없습니다. 종간 차이, 용량 차이, 예상치 못한 부작용 등의 이유로 전임상 결과가 임상시험에서 재현되지 않는 경우가 매우 흔하며, 이 때문에 단계적 검증이 필수적입니다.","임상시험의 각 단계는 서로 다른 목적을 가집니다. 1상은 주로 안전성과 적정 용량을, 2상은 효능의 신호를, 3상은 기존 치료법과의 비교를 통한 대규모 검증을, 4상은 시판 후 장기적 안전성 감시를 목적으로 합니다."],examples:["탈리도마이드 사건은 동물실험과 인간 사이의 종간 차이를 보여준 역사적 사례","표적항암제 개발에는 바이오마커 기반 환자 선별이 중요한 역할을 함","코로나19 백신은 이례적으로 빠르게 여러 임상시험 단계를 거쳐 승인됨"],observationActivity:{title:"가상의 신약 개발 단계 로드맵 만들기",description:"가상의 신약 후보물질이 시장 출시까지 거치는 단계를 로드맵으로 정리합니다.",prediction:"각 단계를 통과할 때마다 후보물질의 수가 크게 줄어들 것이다(깔때기 모양)",materials:["로드맵 워크시트","필기도구"],steps:["1. 전임상시험부터 4상 임상시험까지의 단계를 나열합니다","2. 각 단계의 목적과 대략적인 소요 기간을 조사합니다","3. 각 단계를 통과하는 후보물질의 비율(성공률) 자료를 찾아봅니다","4. 전체 과정을 깔때기 모양의 다이어그램으로 표현합니다"],safetyWarning:"해당 없음(자료 조사 및 정리 활동)"},questions:["phd-med-01-q01","phd-med-01-q02","phd-med-01-q03","phd-med-01-q04","phd-med-01-q05","phd-med-01-q06"]},{id:"phd-med-02",subject:"medicine",grade:20,level:"research",unit:"정밀의학",title:"정밀의학: 개인 맞춤형 치료의 시대",summary:"정밀의학은 개인의 유전정보, 환경, 생활습관 데이터를 종합해 가장 적합한 맞춤형 치료를 제공하고자 한다.",keywords:["정밀의학","유전체 분석","약물유전체학","동반진단","빅데이터"],misconceptions:["정밀의학은 모든 사람에게 완전히 다른 치료법을 새로 만드는 것이다","유전체 정보만 있으면 모든 질병을 완벽하게 예측할 수 있다"],explanation:{basic:'정밀의학은 사람마다 다른 유전자, 환경, 생활습관을 고려해 "이 환자에게 가장 잘 맞는" 치료법을 찾으려는 새로운 의학 접근입니다.',curriculum:"유전체 분석을 통해 특정 약물에 잘 반응할 환자군을 미리 예측하는 동반진단이 개발되고 있습니다. 예를 들어 특정 유전자 변이가 있는 암 환자에게만 효과적인 표적항암제가 처방됩니다.",university:"정밀의학은 유전체, 단백체, 대사체 등 다양한 오믹스(omics) 데이터와 전자의무기록, 웨어러블 기기의 생활습관 데이터를 통합 분석하는 빅데이터 접근을 필요로 합니다. 그러나 유전자는 질병 위험의 한 요인일 뿐이며, 환경적·생활습관적 요인과의 복잡한 상호작용을 함께 고려해야 정확한 예측이 가능합니다."},deepDive:["정밀의학은 모든 환자마다 완전히 새로운 치료법을 발명하는 것이 아니라, 이미 존재하는 치료법과 약물 중에서 개별 환자의 특성에 가장 적합한 것을 선택하고 용량을 최적화하는 접근에 가깝습니다.","유전체 정보는 질병 위험을 예측하는 데 매우 유용하지만 완벽하지 않습니다. 대부분의 질병은 유전적 소인과 환경적 요인(식습관, 흡연, 스트레스 등)이 복잡하게 상호작용한 결과이므로, 유전체 정보만으로 모든 것을 확실하게 예측할 수는 없습니다."],examples:["HER2 양성 유방암 환자에게는 표적치료제 트라스투주맙이 효과적","약물유전체 검사로 특정 항응고제의 적정 용량을 미리 예측","웨어러블 기기의 데이터를 이용한 개인 맞춤형 건강 관리"],observationActivity:{title:"가상의 유전자 검사 결과 해석 연습",description:"가상의 약물유전체 검사 결과를 보고 적절한 약물 용량 조정을 추론해봅니다.",prediction:"특정 대사효소 유전형에 따라 표준 용량보다 적거나 많은 용량이 필요할 수 있다",materials:["가상의 유전자 검사 결과 자료(교사 제공)","약물 용량 가이드라인 참고자료"],steps:["1. 가상의 CYP450 유전형 검사 결과를 확인합니다","2. 해당 유전형이 빠른 대사자인지 느린 대사자인지 판단합니다","3. 이에 따라 표준 용량을 어떻게 조정해야 할지 추론합니다","4. 정밀의학이 환자 안전에 기여하는 방식을 정리합니다"],safetyWarning:"실제 약물 복용 결정에 이 활동 결과를 사용하지 않도록 유의합니다"},questions:["phd-med-02-q01","phd-med-02-q02","phd-med-02-q03","phd-med-02-q04","phd-med-02-q05","phd-med-02-q06"]},{id:"phd-med-03",subject:"medicine",grade:19,level:"research",unit:"의생명통계학",title:"의생명통계학: 의학 연구의 통계적 사고",summary:"의생명통계학은 임상 자료를 올바르게 분석하고 해석하여 신뢰할 수 있는 의학적 결론을 이끌어내는 방법을 다룬다.",keywords:["p값","신뢰구간","생존분석","다중비교","통계적 검정력"],misconceptions:["p값이 0.05보다 작으면 그 결과는 의학적으로도 매우 중요한 ildren:[r.jsx("button",{className:"btn btn-secondary",onClick:()=>s(u=>Math.max(0,u-1)),disabled:a,style:{width:"100%",opacity:a?.5:1},children:"← 이전 장"}),r.jsx("button",{className:"btn btn-primary",onClick:()=>s(u=>Math.min(n.chapters.length-1,u+1)),disabled:c,style:{width:"100%",opacity:c?.5:1},children:"다음 장 →"})]}),r.jsx("button",{className:"btn btn-secondary",onClick:()=>t("/library"),style:{width:"100%",marginTop:"1rem"},children:"📚 도서관으로 돌아가기"})]})]})}const Wy=[{subject:"programming",category:"Python",ko:"변수",en:"Variable",definition:"값을 이름으로 가리키는 프로그램의 저장 공간.",detail:"변수는 데이터를 이름에 연결해 두고 프로그램 실행 중 다른 값으로 바꿀 수 있습니다. Python에서는 타입을 미리 선언하지 않고 값에 따라 타입이 정해집니다.",formula:"예: score = 95"},{subject:"programming",category:"Python",ko:"함수",en:"Function",definition:"입력을 받아 정해진 작업을 수행하고 결과를 반환하는 코드 묶음.",detail:"함수는 중복 코드를 줄이고 책임을 작은 단위로 나눕니다. 매개변수와 반환값을 명확히 정하면 테스트하기 쉬운 프로그램이 됩니다.",formula:"예: def add(a, b): return a + b"},{subject:"programming",category:"C 언어",ko:"포인터",en:"Pointer",definition:"다른 변수의 메모리 주소를 저장하는 변수.",detail:"포인터는 배열, 문자열, 동적 메모리, 시스템 프로그래밍에서 중요합니다. 잘못된 주소 접근은 치명적 오류를 만들 수 있어 초기화와 범위 확인이 필요합니다.",formula:"예: int *p = &value;"},{subject:"programming",category:"웹",ko:"DOM",en:"Document Object Model",definition:"HTML 문서를 JavaScript가 조작할 수 있도록 객체 트리로 표현한 구조.",detail:"브라우저는 HTML을 DOM 트리로 만들고 JavaScript는 querySelector, textContent, classList 등을 통해 화면을 바꿉니다.",formula:'예: document.querySelector("h1")'},{subject:"programming",category:"Java",ko:"클래스",en:"Class",definition:"객체의 속성과 동작을 정의하는 설계도.",detail:"Java의 클래스는 필드와 메서드를 묶고 접근 제어자로 캡슐화를 구현합니다. 객체는 클래스의 인스턴스입니다.",formula:"예: class Student { String name; }"},{subject:"programming",category:"알고리즘",ko:"시간복잡도",en:"Time Complexity",definition:"입력 크기가 증가할 때 알고리즘 실행 시간이 증가하는 양상.",detail:"Big-O 표기법은 최악의 증가율을 표현합니다. O(1), O(log n), O(n), O(n log n), O(n²) 순서로 대체로 효율이 낮아집니다.",formula:"예: 반복문 하나는 보통 O(n)"},{subject:"programming",category:"소프트웨어",ko:"예외 처리",en:"Exception Handling",definition:"실행 중 발생한 오류를 감지하고 복구 경로를 실행하는 방법.",detail:"입력 오류, 파일 부재, 네트워크 실패를 정상 흐름과 분리해 처리합니다. 오류를 숨기기보다 원인과 복구 방법을 기록해야 합니다.",formula:"Python: try / except / finally"},{subject:"programming",category:"웹",ko:"HTTP",en:"HyperText Transfer Protocol",definition:"웹 브라우저와 서버가 요청과 응답을 주고받는 규칙.",detail:"GET은 조회, POST는 생성, PUT/PATCH는 수정, DELETE는 삭제에 주로 사용합니다. 상태 코드 2xx는 성공, 4xx는 요청 오류, 5xx는 서버 오류입니다.",formula:"예: GET /lessons → 200 OK"},{subject:"computer",category:"컴퓨터구조",ko:"CPU",en:"Central Processing Unit",definition:"명령어를 해석하고 산술·논리 연산을 수행하는 중앙처리장치.",detail:"CPU는 명령어 인출, 해석, 실행 사이클을 반복합니다. 레지스터, 캐시, 파이프라인은 데이터 접근과 실행 속도를 높입니다.",formula:"성능의 핵심: 명령어 수 × CPI × 클록 주기"},{subject:"computer",category:"운영체제",ko:"프로세스",en:"Process",definition:"실행 중인 프로그램과 그 상태를 운영체제가 관리하는 단위.",detail:"프로세스는 독립 주소 공간을 가지며 운영체제는 스케줄링, 메모리, 파일 자원을 배분합니다. 스레드는 프로세스 안의 실행 흐름입니다.",formula:"상태: 생성 → 준비 → 실행 → 대기 → 종료"},{subject:"computer",category:"데이터베이스",ko:"인덱스",en:"Database Index",definition:"검색 조건에 맞는 행을 빠르게 찾도록 만든 보조 자료구조.",detail:"B-트리 인덱스는 정렬·범위 검색을 빠르게 하지만 쓰기와 저장 공간 비용이 추가됩니다. 자주 검색하는 열을 기준으로 설계합니다.",formula:"예: CREATE INDEX idx_user_email ON users(email);"},{subject:"computer",category:"인공지능",ko:"과적합",en:"Overfitting",definition:"모델이 학습 데이터의 잡음까지 외워 새 데이터에서 성능이 떨어지는 현상.",detail:"훈련 정확도는 높지만 검증 정확도가 낮으면 과적합을 의심합니다. 정규화, 드롭아웃, 데이터 증강, 조기 종료로 완화할 수 있습니다.",formula:"검증 오차가 훈련 오차보다 크게 증가하면 경고"},{subject:"computer",category:"보안",ko:"해시",en:"Hash Function",definition:"임의 길이 입력을 고정 길이의 문자열로 변환하는 함수.",detail:"좋은 암호학적 해시는 역산이 어렵고 작은 입력 변화가 큰 출력 변화를 만듭니다. 비밀번호는 salt와 느린 해시를 사용해야 합니다.",formula:"예: H = SHA-256(message)"},{subject:"computer",category:"분산시스템",ko:"캐시",en:"Cache",definition:"자주 사용하는 데이터를 가까운 저장소에 임시 보관해 응답을 빠르게 하는 구조.",detail:"캐시는 속도를 높이지만 오래된 값이 남는 일관성 문제가 생깁니다. 만료 시간과 무효화 전략을 함께 설계해야 합니다.",formula:"응답시간 ≈ cache hit면 짧음, miss면 원본 조회"},{subject:"networking",category:"인터넷",ko:"IP 주소",en:"IP Address",definition:"네트워크에서 장치를 식별하고 패킷을 전달하기 위한 논리 주소.",detail:"IPv4는 32비트, IPv6는 128비트 주소를 사용합니다. 사설 주소는 NAT를 통해 공인 인터넷과 연결될 수 있습니다.",formula:"IPv4 예: 192.168.0.10/24"},{subject:"networking",category:"TCP/IP",ko:"서브넷 마스크",en:"Subnet Mask",definition:"IP 주소에서 네트워크 부분과 호스트 부분을 구분하는 값.",detail:"/24는 앞 24비트를 네트워크로 사용한다는 뜻입니다. 같은 서브넷의 장치는 라우터 없이 직접 통신할 수 있습니다.",formula:"/24 → 255.255.255.0, 사용 가능한 호스트 254개"},{subject:"networking",category:"무선통신",ko:"SSID",en:"Service Set Identifier",definition:"Wi-Fi 무선 네트워크를 구분하는 네트워크 이름.",detail:"공유기와 접속 장치가 광고하는 무선 네트워크 이름입니다. SSID 숨김은 암호화를 대신하지 않으므로 WPA2 또는 WPA3를 함께 사용해야 합니다.",formula:"안전한 Wi-Fi = WPA2/WPA3 + 강한 비밀번호"},{subject:"networking",category:"무선통신",ko:"Wi-Fi 채널",en:"Wi-Fi Channel",definition:"무선 주파수 대역을 나누어 통신하는 논리적인 통로.",detail:"주변 네트워크가 같은 채널을 사용하면 간섭과 재전송이 증가합니다. 2.4GHz에서는 겹침이 적은 채널을 선택하고 5GHz·6GHz도 환경에 맞게 사용합니다.",formula:"간섭 감소 → 재전송 감소 → 실제 처리량 증가"},{subject:"networking",category:"라우팅",ko:"라우터",en:"Router",definition:"서로 다른 네트워크 사이에서 패킷의 다음 경로를 결정하는 장비.",detail:"라우터는 목적지 IP와 라우팅 테이블을 비교해 다음 홉으로 패킷을 보냅니다. 기본 게이트웨이는 외부 네트워크로 나가는 출구입니다.",formula:"Longest Prefix Match로 가장 구체적인 경로 선택"},{subject:"networking",category:"이름해석",ko:"DNS",en:"Domain Name System",definition:"도메인 이름을 IP 주소로 변환하는 분산 시스템.",detail:"브라우저는 DNS 질의를 통해 example.com의 주소를 찾습니다. 캐시 TTL은 빠른 응답과 변경 반영 속도 사이의 절충입니다.",formula:"도메인 → DNS 조회 → IP → TCP/HTTPS 연결"},{subject:"electronics",category:"회로이론",ko:"옴의 법칙",en:"Ohm's Law",definition:"저항 양단의 전압, 흐르는 전류, 저항 사이의 관계.",detail:"선형 저항에서 전압은 전류와 저항의 곱입니다. 회로 계산의 가장 기본적인 관계지만 LED처럼 비선형 소자에는 단순 적용하면 안 됩니다.",formula:"V = IR, I = V/R, R = V/I"},{subject:"electronics",category:"반도체",ko:"다이오드",en:"Diode",definition:"전류를 주로 한 방향으로 흐르게 하는 반도체 소자.",detail:"순방향 전압이 충분하면 전류가 흐르고 역방향에서는 거의 흐르지 않습니다. 정류, 보호, 발광(LED)에 활용됩니다.",formula:"실리콘 다이오드 순방향 전압 ≈ 0.7V"},{subject:"electronics",category:"반도체",ko:"트랜지스터",en:"Transistor",definition:"전류나 전압을 제어해 증폭 또는 스위칭을 수행하는 반도체 소자.",detail:"BJT와 MOSFET이 대표적입니다. 컴퓨터의 논리 게이트와 증폭기, 전원 회로의 핵심 부품입니다.",formula:"스위치 상태: 차단(OFF) / 포화(ON)"},{subject:"electronics",category:"디지털논리",ko:"논리 게이트",en:"Logic Gate",definition:"0과 1의 논리 입력을 정해진 규칙으로 출력하는 디지털 회로.",detail:"AND, OR, NOT, NAND, NOR, XOR 게이트를 조합해 덧셈기와 CPU의 논리 회로를 만듭니다.",formula:"AND: Y = A · B, OR: Y = A + B"},{subject:"electronics",category:"센서",ko:"ADC",en:"Analog-to-Digital Converter",definition:"연속적인 아날로그 전압을 디지털 숫자로 변환하는 회로.",detail:"해상도가 n비트면 이론적으로 2ⁿ개의 단계로 측정값을 나눕니다. 샘플링 속도와 기준 전압이 측정 품질을 결정합니다.",formula:"단계 수 = 2ⁿ, 양자화 간격 ≈ Vref / 2ⁿ"},{subject:"datascience",category:"통계",ko:"평균과 중앙값",en:"Mean and Median",definition:"자료의 중심 경향을 나타내는 대표값.",detail:"평균은 모든 값을 더해 개수로 나누고, 중앙값은 정렬된 자료의 가운데 값입니다. 이상치가 많으면 중앙값이 더 안정적일 수 있습니다.",formula:"평균 = Σxᵢ/n"},{subject:"datascience",category:"머신러닝",ko:"훈련·검증·테스트 분할",en:"Train Validation Test Split",definition:"모델 학습, 튜닝, 최종 평가를 서로 다른 데이터로 나누는 방법.",detail:"같은 데이터를 반복해서 보면 평가 점수가 부풀 수 있습니다. 테스트 세트는 최종 선택 전까지 보지 않아야 일반화 성능을 공정하게 측정할 수 있습니다.",formula:"예: train 70% / validation 15% / test 15%"},{subject:"datascience",category:"회귀",ko:"선형회귀",en:"Linear Regression",definition:"입력 변수와 연속적인 출력 사이의 선형 관계를 추정하는 방법.",detail:"관측값과 예측 직선 사이의 제곱 오차 합을 최소화하는 계수를 찾습니다. 잔차와 결정계수를 함께 확인해야 합니다.",formula:"y = β₀ + β₁x + ε"},{subject:"datascience",category:"평가지표",ko:"정밀도와 재현율",en:"Precision and Recall",definition:"분류 모델의 양성 예측 품질과 양성 검출 범위를 나타내는 지표.",detail:"정밀도는 양성이라고 한 것 중 실제 양성 비율, 재현율은 실제 양성 중 찾아낸 비율입니다. 의료 선별처럼 놓치면 안 되는 문제는 재현율을 중시할 수 있습니다.",formula:"Precision = TP/(TP+FP), Recall = TP/(TP+FN)"},{subject:"datascience",category:"시각화",ko:"상관관계",en:"Correlation",definition:"두 변수가 함께 변하는 방향과 정도를 나타내는 통계적 관계.",detail:"상관관계는 인과관계를 뜻하지 않습니다. 숨은 변수와 선택 편향을 검토하고 산점도와 함께 해석해야 합니다.",formula:"피어슨 r의 범위: -1 ≤ r ≤ 1"},{subject:"engineering",category:"설계",ko:"요구사항",en:"Requirement",definition:"제품이나 시스템이 만족해야 하는 기능·성능·제약 조건.",detail:"좋은 요구사항은 측정 가능하고 검증 가능합니다. 사용자 요구와 안전·법규·비용 제약을 기능 요구와 비기능 요구로 구분합니다.",formula:"요구사항 → 설계 → 구현 → 검증 추적성"},{subject:"engineering",category:"제어",ko:"PID 제어",en:"PID Control",definition:"오차의 현재값·누적값·변화율을 이용해 시스템 출력을 조절하는 피드백 제어.",detail:"P는 즉각 반응, I는 지속되는 오차 제거, D는 급격한 변화를 완화합니다. 게인 조정이 불안정하면 진동이 생길 수 있습니다.",formula:"u(t)=Kp e(t)+Ki∫e(t)dt+Kd de/dt"},{subject:"engineering",category:"재료",ko:"응력과 변형률",en:"Stress and Strain",definition:"재료에 작용하는 단위 면적당 힘과 길이 변화 비율.",detail:"탄성 영역에서는 하중을 제거하면 원래 모양으로 돌아갑니다. 항복점 이후에는 소성 변형이 남을 수 있습니다.",formula:"응력 σ=F/A, 변형률 ε=ΔL/L"}],Hy=Wy.map((e,t)=>({id:`expanded-term-${t+1}`,...e,detailedExplanation:e.detail,formulaOrExample:e.formula})),Bc=[{id:"term-magnet",subject:"physics",ko:"자석",en:"Magnet",category:"전자기학",definition:"철, 강철 등의 물질을 끌어당기는 자기장을 만드는 물체.",detailedExplanation:"자석은 자성 물질의 원자 자기 모멘트가 같은 방향으로 정렬되어 자기장을 형성하는 물체입니다. 항상 N극과 S극이 쌍으로 존재하며, 잘라도 각각 새로운 N극과 S극을 가집니다.",formulaOrExample:"예: 냉장고 자석, 나침반 바늘, 모터의 영구자석"},{id:"term-magnetic-field",subject:"physics",ko:"자기장",en:"Magnetic Field",category:"전자기학",definition:"자석이나 전류 주변에 자기력이 작용하는 공간.",detailedExplanation:"자기장은 N극에서 나와 S극으로 들어가는 자기력선으로 가시화할 수 있는 벡터장(B)입니다. 운동하는 전하에 롤렌츠 힘 F = q(v × B)을 가합니다.",formulaOrExample:"수식: F = q(v × B), 테슬라(T) 단위"},{id:"term-gravity",subject:"physics",ko:"중력",en:"Gravity",category:"역학",definition:"질량을 가진 모든 물체 사이에 서로 끌어당기는 상호작용 힘.",detailedExplanation:"뉴턴의 만유인력 법칙에 따르면 두 질량 m1, m2 사이에는 거리의 제곱에 반비례하고 질량의 곱에 비례하는 중력이 작용합니다. 아인슈타인의 일반상대성이론에서는 질량에 의한 시공간의 휘어짐으로 설명됩니다.",formulaOrExample:"수식: F = G(m1·m2)/r², 지구 표면 가속도 g ≈ 9.8 m/s²"},{id:"term-velocity",subject:"physics",ko:"속도",en:"Velocity",category:"역학",definition:"물체의 위치가 시간에 따라 변하는 정도를 나타내는 벡터량 (크기와 방향 포함).",detailedExplanation:"속력(크기만 있는 스칼라)과 달리 방향 정보를 포함합니다. 위치 x(t)의 시간에 대한 1차 미분 v = dx/dt로 정의됩니다.",formulaOrExample:"수식: v = dx/dt [m/s]"},{id:"term-acceleration",subject:"physics",ko:"가속도",en:"Acceleration",category:"역학",definition:"속도가 시간에 따라 변화하는 비율을 나타내는 벡터량.",detailedExplanation:"속도 v(t)의 시간에 대한 미분 a = dv/dt = d²x/dt²입니다. 알짜힘 F가 작용하면 뉴턴 제2법칙 F=ma에 따라 가속도가 발생합니다.",formulaOrExample:"수식: a = dv/dt = F/m [m/s²]"},{id:"term-work",subject:"physics",ko:"일",en:"Work",category:"역학",definition:"물체에 힘을 가하여 그 힘의 방향으로 물체를 이동시켰을 때 가해진 에너지.",detailedExplanation:"힘 F와 이동거리 d의 내적으로 정의되는 스칼라량(W = F · d = F d cosθ)입니다. 단위는 줄(J)을 사용합니다.",formulaOrExample:"수식: W = ∫ F · dr [J = N·m]"},{id:"term-kinetic-energy",subject:"physics",ko:"운동에너지",en:"Kinetic Energy",category:"역학",definition:"운동하고 있는 물체가 가지고 있는 에너지.",detailedExplanation:"질량이 m이고 속도가 v인 물체가 가지는 운동에너지는 KE = ½mv²입니다. 일-에너지 정리에 의해 알짜힘이 한 일은 운동에너지의 변화량과 같습니다.",formulaOrExample:"수식: KE = ½mv² [J]"},{id:"term-potential-energy",subject:"physics",ko:"위치에너지 (퍼텐셜 에너지)",en:"Potential Energy",category:"역학",definition:"물체의 위치나 상태에 따라 계 안에 저장되어 있는 에너지.",detailedExplanation:"중력장이나 탄성력 같은 보존력에 의해 정의됩니다. 기준점 대비 높이 h에 있을 때 중력 위치에너지는 PE = mgh입니다.",formulaOrExample:"수식: PE = mgh (중력), PE = ½kx² (용수철)"},{id:"term-schrodinger",subject:"physics",ko:"슈뢰딩거 방정식",en:"Schrödinger Equation",category:"양자역학",definition:"양자 상태 파동함수의 시간적 변화와 고유값을 기술하는 양자역학의 기본 방정식.",detailedExplanation:"1926년 에르빈 슈뢰딩거가 제안한 방정식으로, 입자의 위치와 상태를 파동함수 ψ(r,t)로 표현하고 해밀토니안 연산자를 이용해 시간에 따른 상태 진화를 다룹니다.",formulaOrExample:"수식: iℏ (∂ψ/∂t) = Ĥψ"},{id:"term-entropy-phys",subject:"physics",ko:"엔트로피",en:"Entropy",category:"열역학",definition:"계의 무질서도 또는 가능한 미시 상태의 수를 나타내는 열역학적 상태량.",detailedExplanation:"열역학 제2법칙에 따라 고립계의 엔트로피는 자발적 과정에서 항상 증가하거나 유지됩니다. 통계역학에서는 S = k_B ln Ω 로 미시상태의 수 Ω와 연결됩니다.",formulaOrExample:"수식: dS = dQ_rev / T, S = k_B ln Ω"},{id:"term-element",subject:"chemistry",ko:"원소",en:"Element",category:"물질의 구성",definition:"더 이상 다른 화학적 방법으로 분해되지 않는 한 종류의 원자로 이루어진 순물질.",detailedExplanation:"원소는 원자핵의 양성자 수(원자번호)로 구별되며, 수소(H), 산소(O), 철(Fe) 등이 있습니다. 주기율표에 118개의 원소가 정리되어 있습니다.",formulaOrExample:"예: 수소(H, 1번), 산소(O, 8번), 금(Au, 79번)"},{id:"term-atom",subject:"chemistry",ko:"원자",en:"Atom",category:"물질의 구성",definition:"화학적 성질을 유지하는 물질의 가장 작은 기본 입자.",detailedExplanation:"원자는 중심으로 양성자와 중성자로 이루어진 원자핵이 있고, 그 주위에 전자가 오비탈(전자구름)을 이루며 존재합니다.",formulaOrExample:"구성: 원자핵(양성자+중성자) + 전자"},{id:"term-mole",subject:"chemistry",ko:"몰",en:"Mole",category:"화학량론",definition:"원자, 분자, 이온 등의 입자 6.022×10²³개를 나타내는 화학의 물질량 단위.",detailedExplanation:"아보가드로수(Na = 6.022×10²³)를 기준으로 입자의 개수를 세는 단위입니다. 탄소-12 12g에 들어있는 원자 수가 정확히 1몰입니다.",formulaOrExample:"수식: 1 mol = 6.022 × 10²³ 개, 몰수 n = m / M"},{id:"term-ph",subject:"chemistry",ko:"pH (수소 이온 농도 지수)",en:"pH Value",category:"산과 염기",definition:"수용액의 산성이나 염기성의 정도를 나타내는 수소이온 농도의 음의 로그값.",detailedExplanation:"pH = -log10[H⁺]로 정의됩니다. 25°C 기준 pH 7은 중성, 7 미만은 산성, 7 초과는 염기성입니다.",formulaOrExample:"수식: pH = -log10[H⁺]"},{id:"term-catalyst",subject:"chemistry",ko:"촉매",en:"Catalyst",category:"반응속도론",definition:"자신은 소모되지 않으면서 화학 반응의 활성화 에너지를 낮추어 반응 속도를 변화시키는 물질.",detailedExplanation:"촉매는 더 낮거나 다른 경로의 반응 경로를 제공하여 활성화 에너지(Ea)를 낮춥니다. 반응 속도를 높이지만 화학 평형 위치나 평형상수 K는 바꾸지 않습니다.",formulaOrExample:"예: 차량 촉매변환기(백금), 생체 촉매(효소)"},{id:"term-oxidation",subject:"chemistry",ko:"산화·환원",en:"Oxidation-Reduction (Redox)",category:"전기화학",definition:"전자를 잃는 산화 반응과 전자를 얻는 환원 반응이 동시 일어나는 화학 반응.",detailedExplanation:"산화는 전자를 잃거나 산소를 얻거나 산화수가 증가하는 과정이고, 환원은 전자를 얻거나 산소를 잃거나 산화수가 감소하는 과정입니다. 두 반응은 항상 함께 일어납니다.",formulaOrExample:"예: Zn + Cu²⁺ → Zn²⁺ + Cu"},{id:"term-derivative",subject:"math",ko:"미분",en:"Derivative",category:"미적분학",definition:"함수의 특정 점에서의 순간 변화율 및 접선의 기울기를 구하는 수학적 연산.",detailedExplanation:"함수 f(x)의 미분계수 f'(a) = lim(h→0) [f(a+h) - f(a)]/h 입니다. 속도, 가속도, 경사하강법 등 물리학과 인공지능에 핵심적으로 사용됩니다.",formulaOrExample:"수식: f'(x) = lim(Δx→0) Δy/Δx"},{id:"term-integral",subject:"math",ko:"적분",en:"Integral",category:"미적분학",definition:"미분의 역연산이자, 곡선으로 둘러싸인 도형의 넓이나 누적량을 구하는 연산.",detailedExplanation:"정적분 ∫[a,b] f(x)dx는 f(x) 그래프와 x축 사이의 면적을 나타냅니다. 미적분학의 기본정리에 의해 부정적분과 정적분이 서로 연결됩니다.",formulaOrExample:"수식: ∫ xⁿ dx = (1/(n+1)) xⁿ⁺¹ + C"},{id:"term-matrix",subject:"math",ko:"행렬",en:"Matrix",category:"선형대수학",definition:"수의 집합을 사각형 모양의 행(row)과 열(column)로 배열한 것.",detailedExplanation:"행렬은 연립방정식을 간결하게 표현하고 다차원 공간에서의 선형변환(회전, 이동, 투영)을 계산하는 핵심 구조입니다.",formulaOrExample:"예: 2×2 행렬 [[a, b], [c, d]]"},{id:"term-eigenvalue",subject:"math",ko:"고유값과 고유벡터",en:"Eigenvalue and Eigenvector",category:"선형대수학",definition:"선형변환 A를 가해도 방향이 변하지 않고 크기만 배율 λ만큼 변하는 벡터 v.",detailedExplanation:"관계식 A v = λ v 에서 λ를 고유값, v를 고유벡터라 합니다. 주성분분석(PCA), 퀀텀 계산, 구글 페이지랭크 알고리즘에 응용됩니다.",formulaOrExample:"수식: A v = λ v, det(A - λI) = 0"},{id:"term-cell",subject:"biology",ko:"세포",en:"Cell",category:"세포생물학",definition:"모든 생명체의 구조적, 기능적 기본 단위.",detailedExplanation:"세포는 세포막으로 싸여 유전물질(DNA)과 세포질을 가지며, 핵의 유무에 따라 원핵세포와 진핵세포로 구분됩니다.",formulaOrExample:"예: 동물세포, 식물세포, 대장균(원핵)"},{id:"term-dna",subject:"biology",ko:"DNA (디옥시리보핵산)",en:"Deoxyribonucleic Acid",category:"분자생물학",definition:"모든 생명체의 유전 정보를 담고 있는 이중나선 구조의 핵산.",detailedExplanation:"뉴클레오타이드(당, 인산, 염기)가 사슬을 이룬 이중나선 구조입니다. 염기 A-T, G-C 상보적 수소결합으로 유전정보를 안정적으로 보존합니다.",formulaOrExample:"염기쌍: A(아데닌)-T(티민), G(구아닌)-C(시토신)"},{id:"term-photosynthesis",subject:"biology",ko:"광합성",en:"Photosynthesis",category:"식물생리",definition:"식물이 햇빛 에너지를 이용해 이산화탄소와 물로부터 포도당과 산소를 만드는 과정.",detailedExplanation:"식물 엽록체에서 일어나는 반응으로, 6CO₂ + 6H₂O + 빛에너지 → C₆H₁₂O₆ + 6O₂ 화학식을 가집니다. 지구 생태계 에너지 공급의 근원입니다.",formulaOrExample:"수식: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂"},{id:"term-crispr",subject:"biology",ko:"크리스퍼 (CRISPR-Cas9)",en:"CRISPR-Cas9",category:"유전공학",definition:"특정 DNA 염기서열을 정밀하게 표적하여 절단 및 편집하는 유전자 교정 기술.",detailedExplanation:"가이드 RNA가 표적 DNA 서열을 인식하고 Cas9 효소가 해당 부위를 자르는 유전자 자르개 도구입니다. 유전병 치료와 품종 개량에 혁신을 가져왔습니다.",formulaOrExample:"구성: 가이드 RNA + Cas9 절단 효소"},{id:"term-plate-tectonics",subject:"earthscience",ko:"판구조론",en:"Plate Tectonics",category:"지질학",definition:"지구 겉면이 여러 개의 단단한 판(암석권)으로 나뉘어 맨틀 대류에 의해 이동한다는 이론.",detailedExplanation:"판의 경계에서 발산(갈라짐), 수렴(충돌/섭입), 보존(어긋남) 운동이 일어나며 지진, 화산, 산맥 형성 등 지각 변동의 원인을 통합적으로 설명합니다.",formulaOrExample:"예: 히말라야 산맥(수렴), 대서양 중앙해령(발산), 산안드레아스 단층(보존)"},{id:"term-climate-change",subject:"earthscience",ko:"기후변화와 온실효과",en:"Climate Change & Greenhouse Effect",category:"대기과학",definition:"온실기체가 지구에서 방출되는 적외선 복사에너지를 흡수하여 지표 온도를 높이는 현상.",detailedExplanation:"CO₂, CH₄ 등 온실기체 농도 증가로 지구 평균 기온이 상승하는 지구온난화가 진행되며, 극단적 기후, 해수면 상승을 초래합니다.",formulaOrExample:"주요 온실기체: 이산화탄소(CO₂), 메탄(CH₄), 수증기(H₂O)"},{id:"term-big-bang",subject:"astronomy",ko:"빅뱅 이론",en:"Big Bang Theory",category:"우주론",definition:"우주가 약 138억 년 전 초고온·초고밀도 한 점에서 시작되어 지금까지 팽창해왔다는 이론.",detailedExplanation:"허블의 은하 후퇴속도 관측(적색편이)과 우주배경복사(CMB, 2.7K), 수소/헬륨 질량비(3:1)가 3대 핵심 관측 증거입니다.",formulaOrExample:"증거: 허블의 법칙 v = H₀d, 2.7K 우주배경복사"},{id:"term-black-hole",subject:"astronomy",ko:"블랙홀",en:"Black Hole",category:"천체물리학",definition:"중력이 극도로 강하여 빛조차 빠져나올 수 없는 시공간 영역.",detailedExplanation:"거대한 별의 초신성 폭발 후 중력붕괴로 형성됩니다. 탈출속도가 빛의 속도를 넘어서는 경계를 사건의 지평선(Event Horizon)이라 부릅니다.",formulaOrExample:"슈바르츠실트 반지름: rs = 2GM/c²"},{id:"term-homeostasis",subject:"medicine",ko:"항상성",en:"Homeostasis",category:"생리학",definition:"체온, 혈당, 수분, pH 등 신체 내부 환경을 일정한 범위로 유지하려는 성질.",detailedExplanation:"자율신경계와 내분비계(호르몬)의 음성 되먹임(Negative Feedback) 조절을 통해 내부 환경의 안정을 유지합니다.",formulaOrExample:"예: 체온 36.5°C 조절, 인슐린/글루카곤에 의한 혈당 조절"},{id:"term-precision-medicine",subject:"medicine",ko:"정밀의학 (맞춤의학)",en:"Precision Medicine",category:"임상의학",definition:"개인의 유전체 정보, 환경, 생활습관을 종합 분석하여 최적의 맞춤 치료를 제공하는 의학.",detailedExplanation:"단일 표준 치료에서 벗어나, 환자의 유전자 변이(바이오마커)를 검사하여 표적항암제 등 가장 효과적인 약물과 용량을 선별하는 현대 의학 접근법입니다.",formulaOrExample:"예: HER2 양성 유방암 표적치료제 트라스투주맙 처방"},...Hy];function Fy(e){return e==="all"?Bc:Bc.filter(t=>t.subject===e)}function ml(e,t="all"){const n=e.trim().toLowerCase();let i=Fy(t);return n?i.filter(s=>s.ko.toLowerCase().includes(n)||s.en.toLowerCase().includes(n)||s.definition.toLowerCase().includes(n)||s.category.toLowerCase().includes(n)||s.detailedExplanation.toLowerCase().includes(n)):i}function By(){var c,u;const[e,t]=x.useState("all"),[n,i]=x.useState(""),[s,o]=x.useState(null),l=ml(n,e),a=[{id:"all",label:"전체 분야",icon:"🌐"},...mt,os];return r.jsxs("div",{className:"app",children:[r.jsx("header",{className:"header",children:r.jsxs("div",{className:"container",children:[r.jsx("h1",{children:"📖 과학 용어 사전"}),r.jsx("p",{children:"모든 과학 분야의 핵심 용어와 개념을 탐색하고 깊이 있게 이해하세요"})]})}),r.jsxs("main",{className:"container",children:[r.jsxs("div",{className:"card",children:[r.jsxs("div",{className:"form-group",style:{marginBottom:"1rem"},ch planation:"지구는 자기장을 가지고 있어서 나침반의 자석이 지구 자기장의 방향을 따라 북쪽을 가리킵니다.",difficulty:"medium"},{id:"elem-sci-02-q01",type:"multiple_choice",question:"식물이 자라기 위해 필요한 것은?",options:["햇빛과 물","물과 공기","햇빛, 물, 공기","햇빛과 비료만"],answer:"햇빛, 물, 공기",explanation:"식물은 햇빛에서 에너지를 얻고, 뿌리로 물을 흡수하며, 잎으로 공기 중의 이산화탄소를 흡수하여 양분을 만듭니다.",difficulty:"easy"},{id:"elem-sci-02-q02",type:"short_answer",question:"식물의 잎이 초록색인 이유는?",options:[],answer:"엽록소 때문",explanation:"식물의 잎에 있는 엽록소가 햇빛을 흡수하여 광합성을 하기 때문입니다.",difficulty:"medium"},{id:"elem-sci-02-q03",type:"multiple_choice",question:"식물이 만드는 산소는 어디서 나오는가?",options:["흙에서","공기에서","광합성 과정에서","물의 분해에서"],answer:"광합성 과정에서",explanation:"식물은 광합성 과정에서 물과 이산화탄소를 이용해 포도당과 산소를 만듭니다.",difficulty:"medium"},{id:"elem-sci-02-q04",type:"short_answer",question:"어둠 속에서 자란 식물이 노란색인 이유는?",options:[],answer:"엽록소를 만들지 못했기 때문",explanation:"엽록소는 햇빛이 필요하므로, 어둠 속에서는 엽록소가 생성되지 않아 식물이 노란색(또는 흰색)이 됩니다.",difficulty:"medium"},{id:"elem-sci-01-q05",type:"short_answer",question:"자석을 두 조각으로 자르면 어떻게 되는가?",options:[],answer:"각각 새로운 N극과 S극을 가진 자석이 된다",explanation:"자석을 아무리 작게 잘라도 항상 N극과 S극이 함께 있는 새로운 자석이 만들어집니다. 홀로 존재하는 자기 홀극은 발견되지 않았습니다.",difficulty:"medium"},{id:"elem-sci-01-q06",type:"multiple_choice",question:"전자석의 특징으로 옳은 것은?",options:["전류를 흘려야만 자석의 성질이 생긴다","항상 자석의 성질을 가진다","금속이 아니어도 작동한다","온도에 영향을 받지 않는다"],answer:"전류를 흘려야만 자석의 성질이 생긴다",explanation:"전자석은 코일에 전류가 흐를 때만 자기장이 생기며, 전류를 끊으면 자석의 성질이 사라집니다.",difficulty:"medium"},{id:"elem-sci-02-q05",type:"multiple_choice",question:"뿌리의 주된 역할이 아닌 것은?",options:["물 흡수","양분 저장","광합성","식물 고정"],answer:"광합성",explanation:"광합성은 주로 엽록소가 있는 잎에서 일어납니다. 뿌리는 물과 무기양분 흡수, 저장, 지지 역할을 합니다.",difficulty:"easy"},{id:"elem-sci-02-q06",type:"short_answer",question:"증산작용이란 무엇인가?",options:[],answer:"잎의 기공을 통해 물이 수증기로 빠져나가는 현상",explanation:"증산작용은 식물이 뿌리에서 흡수한 물을 잎의 기공을 통해 수증기 형태로 내보내는 현상으로, 물 순환과 온도 조절에 중요합니다.",difficulty:"medium"},{id:"elem-sci-03-q01",type:"multiple_choice",question:"낮과 밤이 생기는 이유는?",options:["지구의 공전","지구의 자전","달의 공전","태양의 이동"],answer:"지구의 자전",explanation:"지구가 자전축을 중심으로 하루에 한 바퀴 돌기 때문에 태양을 향한 쪽은 낮, 반대쪽은 밤이 됩니다.",difficulty:"easy"},{id:"elem-sci-03-q02",type:"short_answer",question:"계절이 바뀌는 주된 이유는?",options:[],answer:"지구 자전축이 기울어진 채 공전하기 때문",explanation:"지구 자전축이 23.5도 기울어진 채로 태양 주위를 공전하기 때문에 지역별로 받는 태양 에너지의 양이 달라져 계절이 생깁니다.",difficulty:"medium"},{id:"elem-sci-03-q03",type:"multiple_choice",question:"지구의 자전 주기는 약 얼마인가?",options:["1시간","24시간","30일","365일"],answer:"24시간",explanation:"지구는 약 24시간(정확히는 23시간 56분)에 한 번 자전합니다.",difficulty:"easy"},{id:"elem-sci-03-q04",type:"short_answer",question:"지구의 공전 주기는 약 얼마인가?",options:[],answer:"365일 (1년)",explanation:"지구가 태양 주위를 한 바퀴 도는 데 약 365.25일이 걸리며, 이것이 1년의 기준이 됩니다.",difficulty:"easy"},{id:"elem-sci-03-q05",type:"multiple_choice",question:"남반구의 계절이 북반구와 반대인 이유는?",options:["지구가 거꾸로 돌기 때문","자전축 기울기 방향 때문에 태양 에너지를 받는 정도가 반대이기 때문","남반구가 더 뜨겁기 때문","실제로는 반대가 아니다"],answer:"자전축 기울기 방향 때문에 태양 에너지를 받는 정도가 반대이기 때문",explanation:"지구 공전 중 북반구가 태양쪽으로 기울어지면 북반구는 여름, 남반구는 겨울이 되고 그 반대의 경우도 마찬가지입니다.",difficulty:"medium"},{id:"elem-sci-03-q06",type:"short_answer",question:"그림자가 하루 중 가장 짧아지는 시간은 언제인가?",options:[],answer:"정오(태양이 가장 높이 떴을 때)",explanation:"태양이 하늘에서 가장 높이 위치하는 정오 무렵에 그림자의 길이가 가장 짧아집니다.",difficulty:"easy"},{id:"elem-sci-04-q01",type:"multiple_choice",question:"열은 어느 방향으로 이동하는가?",options:["찬 곳에서 뜨거운 곳으로","뜨거운 곳에서 찬 곳으로","이동하지 않는다","무작위로 이동한다"],answer:"뜨거운 곳에서 찬 곳으로",explanation:"열은 항상 온도가 높은 곳에서 낮은 곳으로 이동하며, 두 물체의 온도가 같아지면(열평형) 이동이 멈춥니다.",difficulty:"easy"},{id:"elem-sci-04-q02",type:"short_answer",question:"고체를 통한 열의 이동 방식을 무엇이라 하는가?",options:[],answer:"전도",explanation:"전도는 물질을 구성하는 입자의 진동이 이웃 입자에 전달되며 열이 이동하는 방식으로, 고체에서 잘 일어납니다.",difficulty:"medium"},{id:"elem-sci-04-q03",type:"multiple_choice",question:"액체나 기체에서 열이 이동하는 주된 방식은?",options:["전도","대류","복사","증발"],answer:"대류",explanation:"대류는 데워진 유체가 위로 올라가고 차가운 유체가 아래로 내려오며 순환하는 열 이동 방식입니다.",difficulty:"medium"},{id:"elem-sci-04-q04",type:"short_answer",question:"태양열이 진공인 우주 공간을 지나 지구에 도달하는 열 이동 방식은?",options:[],answer:"복사",explanation:"복사는 매질 없이 전자기파 형태로 열이 전달되는 방식으로, 태양열이 진공을 통과해 지구에 도달하는 방식입니다.",difficulty:"medium"},{id:"elem-sci-04-q05",type:"multiple_choice",question:"금속 손잡이와 나무 손잡이 냄비 중 어느 것이 손에 덜 뜨겁게 느껴지는가?",options:["금속 손잡이","나무 손잡이","둘 다 같다","알 수 없다"],answer:"나무 손잡이",explanation:"나무는 금속보다 열전도율이 낮아 열을 천천히 전달하므로 손에 덜 뜨겁게 느껴집니다.",difficulty:"easy"},{id:"elem-sci-04-q06",type:"short_answer",question:"검은색 옷이 흰색 옷보다 여름에 더 덥게 느껴지는 이유는?",options:[],answer:"검은색이 빛(복사 에너지)을 더 많이 흡수하기 때문",explanation:"검은색 물체는 다양한 파장의 빛을 흡수하는 비율이 높아 복사 에너지를 더 많이 흡수하여 온도가 더 많이 올라갑니다.",difficulty:"medium"},{id:"elem-sci-05-q01",type:"multiple_choice",question:"암수가 결합하여 새끼를 만드는 생식 방법은?",options:["무성생식","유성생식","분열생식","출아생식"],answer:"유성생식",explanation:"유성생식은 암컷과 수컷의 생식세포가 결합하여 새로운 개체를 만드는 방법으로, 유전적 다양성을 높입니다.",difficulty:"easy"},{id:"elem-sci-05-q02",type:"short_answer",question:"알을 낳아 번식하는 방법을 무엇이라 하는가?",options:[],answer:"난생",explanation:"난생은 어미가 알을 낳고 알 속에서 배아가 발생하여 부화하는 번식 방법으로, 새와 대부분의 곤충, 파충류가 해당합니다.",difficulty:"medium"},{id:"elem-sci-05-q03",type:"multiple_choice",question:"나비의 완전변태 순서로 옳은 것은?",options:["알 → 애벌레 → 번데기 → 성충","알 → 번데기 → 애벌레 → 성충","애벌레 → 알 → 번데기 → 성충","알 → 애벌레 → 성충 → 번데기"],answer:"알 → 애벌레 → 번데기 → 성충",explanation:"나비, 딱정벌레 등은 알-애벌레-번데기-성충의 네 단계를 거치는 완전변태를 합니다.",difficulty:"medium"},{id:"elem-sci-05-q04",type:"short_answer",question:"새끼를 낳아 젖을 먹여 기르는 동물의 무리를 무엇이라 하는가?",options:[],answer:"포유류",explanation:"포유류는 태생으로 새끼를 낳고 어미의 젖으로 새끼를 기르는 동물 무리입니다.",difficulty:"easy"},{id:"elem-sci-05-q05",type:"multiple_choice",question:"메뚜기와 같이 번데기 단계 없이 자라는 변태를 무엇이라 하는가?",options:["완전변태","불완전변태","무변태","역변태"],answer:"불완전변태",explanation:"불완전변태는 알-약충(어린벌레)-성충 단계를 거치며 번데기 단계가 없는 변태로, 메뚜기, 잠자리 등이 해당합니다.",difficulty:"medium"},{id:"elem-sci-05-q06",type:"short_answer",question:"동물이 성장하며 몸의 크기와 형태가 바뀌는 과정을 무엇이라 하는가?",options:[],answer:"변태(성장 발달)",explanation:"변태는 동물이 발생 과정에서 몸의 형태와 구조가 뚜렷하게 변화하는 현상입니다.",difficulty:"easy"},{id:"high-phys-01-q01",type:"calculation",question:"위치 함수 x(t) = 3t² - 2t + 5에서 t = 2s일 때의 속도는?",options:[],answer:"10 m/s",explanation:"v(t) = dx/dt = 6t - 2. t=2에서 v(2) = 6(2) - 2 = 10 m/s",difficulty:"medium"},{id:"high-phys-01-q02",type:"calculation",question:"위의 함수에서 t = 2s일 때의 가속도는?",options:[],answer:"6 m/s²",explanation:"a(t) = dv/dt = 6. 가속도는 상수이므로 항상 6 m/s²",difficulty:"medium"},{id:"high-phys-01-q03",type:"short_answer",question:"자유 낙하에서 속도 함수는?",options:[],answer:"v(t) = gt 또는 v(t) = 9.8t",explanation:"자유 낙하는 상수 가속도 g를 가지므로 v = ∫g dt = gt + C. 초기 속도가 0이면 v(t) = gt",difficulty:"easy"},{id:"high-phys-01-q04",type:"calculation",question:"속도 v(t) = 5t로부터 이동 거리(0초부터 3초까지)는?",options:[],answer:"22.5 m",explanation:"x = ∫₀³ 5t dt = [5t²/2]₀³ = 5(9)/2 = 22.5 m",difficulty:"hard"},{id:"high-phys-01-q05",type:"short_answer",question:"가속도가 시간에 따라 변할 때 a(t) = 2t²에서 v(t)는?",options:[],answer:"v(t) = (2/3)t³ + C",explanation:"v(t) = ∫ a(t) dt = ∫ 2t² dt = (2t³/3) + C",difficulty:"hard"},{id:"high-phys-01-q06",type:"multiple_choice",question:"등가속도 운동에서 v² = v₀² + 2as 식이 유도되는 근거는?",options:["v = v₀ + at와 s = v₀t + ½at²를 연립하여 t를 소거","뉴턴의 제3법칙","에너지 보존 법칙만으로 유도","단순 암기 공식"],answer:"v = v₀ + at와 s = v₀t + ½at²를 연립하여 t를 소거",explanation:"두 운동 방정식에서 시간 t를 소거하면 v² = v₀² + 2as를 얻을 수 있으며, 시간 정보 없이 속도와 변위를 연결할 수 있습니다.",difficulty:"medium"},{id:"high-phys-02-q01",type:"multiple_choice",question:"전자기파를 이루는 두 장(field)은?",options:["전기장과 자기장","중력장과 전기장","자기장과 온도장","전기장과 압력장"],answer:"전기장과 자기장",explanation:"전자기파는 서로 수직으로 진동하는 전기장과 자기장이 함께 공간을 진행하는 파동입니다.",difficulty:"easy"},{id:"high-phys-02-q02",type:"calculation",question:"진공에서 전자기파의 속도 c는 ε₀와 μ₀로 어떻게 표현되는가?",options:[],answer:"c = 1/√(ε₀μ₀)",explanation:"Maxwell 방정식으로부터 유도되는 파동방정식에서 전자기파의 속도는 c = 1/√(ε₀μ₀) ≈ 3×10⁸ m/s입니다.",difficulty:"hard"},{id:"high-phys-02-q03",type:"short_answer",question:"전자기파가 매질 없이 진공에서도 전파될 수 있는 이유는?",options:[],answer:"변하는 전기장이 자기장을, 변하는 자기장이 전기장을 유도하며 서로를 전파시키기 때문",explanation:"역학파와 달리 전자기파는 전기장과 자기장이 서로를 유도하며 전파되므로 매질이 필요 없습니다.",difficulty:"medium"},{id:"high-phys-02-q04",type:"multiple_choice",question:"다음 중 전자기파가 아닌 것은?",options:["가시광선","음파","X선","라디오파"],answer:"음파",explanation:"음파는 매질(공기, 물 등)의 압력 진동으로 전파되는 역학적 파동이며, 전자기파가 아닙니다.",difficulty:"easy"},{id:"high-phys-02-q05",type:"short_answer",question:"전자기파 스펙트럼에서 파장이 짧을수록 광자의 에너지는 어떻게 되는가?",options:[],answer:"에너지가 커진다",explanation:"광자 에너지 E = hc/λ이므로 파장 λ가 짧을수록(주파수가 높을수록) 에너지가 커집니다.",difficulty:"medium"},{id:"high-phys-02-q06",type:"multiple_choice",question:"금속 그물망(패러데이 케이지)이 전자기파를 차단할 수 있는 이유는?",options:["금속 내부에서 전자기파가 유도전류를 만들어 상쇄시키기 때문","금속이 빛을 흡수하지 않기 때문","금속의 온도가 낮기 때문","금속에는 전자가 없기 때문"],answer:"금속 내부에서 전자기파가 유도전류를 만들어 상쇄시키기 때문",explanation:"도체 표면에 유도된 전류가 만드는 역방향 전자기장이 외부 전자기파를 상쇄시켜 내부를 차폐합니다.",difficulty:"hard"},{id:"master-phys-01-q01",type:"short_answer",question:"Schrödinger 방정식에서 |ψ(r,t)|²의 물리적 의미는?",options:[],answer:"위치 확률 밀도",explanation:"|ψ|²는 입자를 위치 r에서 발견할 확률 밀도입니다. 공간적분하면 총 확률이 1입니다(정규화).",difficulty:"medium"},{id:"master-phys-01-q02",type:"multiple_choice",question:"불확정성 원리 ΔxΔp ≥ ℏ/2의 의미는?",options:["측정 오차로 인한 불확실성이다","위치와 운동량을 동시에 정확히 알 수 없다는 것이다","기계 계통의 실수이다","상대론적 효과이다"],answer:"위치와 운동량을 동시에 정확히 알 수 없다는 것이다",explanation:"이것은 측정 오차가 아니라 양자계의 근본적인 성질입니다. 위치를 정확히 측정하면 운동량 불확정성이 커집니다.",difficulty:"medium"},{id:"master-phys-01-q03",type:"calculation",question:"무한 정사각형 우물(0 < x < a)에서 기저 상태의 에너지는?",options:[],answer:"E₁ = π²ℏ²/(2ma²)",explanation:"n=1 상태에서 E_n = n²π²ℏ²/(2ma²). 기저 상태는 n=1이므로 E₁ = π²ℏ²/(2ma²)",difficulty:"hard"},{id:"master-phys-01-q04",type:"short_answer",question:"Hermitian 연산자의 고유값이 실수인 이유는?",options:[],answer:"관측가능한 물리량은 반드시 실수여야 하기 때문",explanation:"에너지, 운동량, 위치 등 모든 관측가능한 물리량은 실수값을 가져야 하므로 대응하는 연산자는 Hermitian이어야 합니다.",difficulty:"hard"},{id:"master-phys-01-q05",type:"multiple_choice",question:"조화 진동자의 에너지 준위는?",options:["E_n = nℏω","E_n = (n + 1/2)ℏω","E_n = n²ℏω","E_n = (n² + 1)ℏω"],answer:"E_n = (n + 1/2)ℏω",explanation:"양자 조화 진동자는 에너지 E_n = (n + 1/2)ℏω를 가지며, n=0 상태에서도 0이 아닌 영점 에너지 E₀ = ℏω/2를 가집니다.",difficulty:"hard"},{id:"master-phys-01-q06",type:"short_answer",question:"수소 원자의 Bohr 모델에서 제1 Bohr 반지름(a₀)은?",options:[],answer:"a₀ = ℏ²/(mₑke²) ≈ 0.53 Å",explanation:"전자가 원자핵 주위를 도는 가장 작은 허용 궤도의 반지름입니다. 약 0.53 옹스트롱 또는 53 피코미터입니다.",difficulty:"hard"},{id:"master-phys-02-q01",type:"short_answer",question:"정준 앙상블에서 분배함수 Z의 정의는?",options:[],answer:"Z = Σ_n exp(-E_n/k_B T)",explanation:"분배함수는 계가 취할 수 있는 모든 미시상태에 대해 볼츠만 인자를 합한 것으로, 모든 열역학량을 유도하는 출발점입니다.",difficulty:"medium"},{id:"master-phys-02-q02",type:"multiple_choice",question:"자유 에너지 F와 분배함수 Z의 관계는?",options:["F = k_B T ln Z","F = -k_B T ln Z","F = Z/k_B T","F = -k_B T / Z"],answer:"F = -k_B T ln Z",explanation:"헬름홀츠 자유 에너지는 F = -k_B T ln Z로 정의되며, 여기서 내부 에너지와 엔트로피를 모두 유도할 수 있습니다.",difficulty:"hard"},{id:"master-phys-02-q03",type:"short_answer",question:"온도가 평균 운동 에너지와 같다는 설명이 오개념인 이유는?",options:[],answer:"온도는 통계적 개념으로 에너지 분포와 관련되며 단순 평균 운동에너지만으로 정의되지 않기 때문",explanation:"온도는 계의 미시상태에 대한 통계적 분포(볼츠만 분포)를 결정하는 매개변수이며, 특정 자유도의 평균 에너지로 항상 정확히 설명되지는 않습니다.",difficulty:"hard"},{id:"master-phys-02-q04",type:"calculation",question:"이상기체의 상태방정식 PV = Nk_BT는 어떤 앙상블에서 유도되는가?",options:[],answer:"정준 앙상블(또는 그랜드 캐노니컬 앙상블)",explanation:"입자 사이 상호작용이 없는 이상기체 모델에 정준 앙상블의 분배함수를 적용하면 PV = Nk_BT가 자연스럽게 유도됩니다.",difficulty:"hard"},{id:"master-phys-02-q05",type:"short_answer",question:"엔트로피가 항상 증가한다는 설명이 정확하지 않은 이유는?",options:[],answer:"열역학 제2법칙은 고립계의 총 엔트로피에 대해서만 성립하며, 부분계는 감소할 수 있기 때문",explanation:"냉장고처럼 부분계의 엔트로피는 외부에서 일을 가하면 감소할 수 있습니다. 단, 계+주변을 합한 전체 엔트로피는 항상 증가하거나 유지됩니다.",difficulty:"hard"},{id:"master-phys-02-q06",type:"multiple_choice",question:"2차 상전이의 특징은?",options:["잠열이 존재하고 부피가 불연속적으로 변한다","잠열이 없고 비열 등 2차 미분량이 불연속적이다","온도가 무한대가 된다","항상 기체에서만 일어난다"],answer:"잠열이 없고 비열 등 2차 미분량이 불연속적이다",explanation:"2차 상전이(연속 상전이)는 자유에너지의 2차 미분(비열, 압축률 등)이 불연속이거나 발산하지만 잠열은 없습니다.",difficulty:"hard"},{id:"phd-phys-01-q01",type:"short_answer",question:"양자장론에서 입자는 무엇인가?",options:[],answer:"양자장의 여기(excitation)",explanation:"QFT에서 입자는 기저 상태(진공) 위의 장의 양자화된 여기 모드입니다.",difficulty:"medium"},{id:"phd-phys-01-q02",type:"multiple_choice",question:"Dirac 바다의 개념에서 정공(hole)은?",options:["불안정한 상태이다","음의 에너지를 가진 전자이다","반입자(반전자/양전자)로 해석된다","측정 오차이다"],answer:"반입자(반전자/양전자)로 해석된다",explanation:"Dirac 바다에서 음의 에너지 상태의 정공은 양의 에너지를 가진 반입자로 재해석됩니다. 이것이 양전자입니다.",difficulty:"hard"},{id:"phd-phys-01-q03",type:"calculation",question:"λφ⁴ 이론에서 coupling constant λ의 차원은?",options:[],answer:"무차원(dimensionless)",explanation:"d=4 시공간에서 φ⁴ 항의 차원은 4이고, Lagrangian 밀도는 차원 4를 가져야 하므로 λ는 무차원입니다.",difficulty:"hard"},{id:"phd-phys-01-q04",type:"short_answer",question:"게이지 불변성(gauge invariance)의 의미는?",options:[],answer:"국소적 위상 변환에 대한 불변성",explanation:"φ(x) → exp(iα(x))φ(x) 국소 위상 변환 하에서 물리량이 불변이어야 하며, 이를 보존하려면 게이지 장(광자, W, Z, 글루온)이 필요합니다.",difficulty:"hard"},{id:"phd-phys-01-q05",type:"multiple_choice",question:"Renormalization group 방정식에서 β 함수는?",options:["커플링 상수의 에너지 스케일 의존성을 나타낸다","입자의 질량이다","파동함수 재규격화 인수이다","상호작용 강도이다"],answer:"커플링 상수의 에너지 스케일 의존성을 나타낸다",explanation:"β(g) = μ dg/dμ는 에너지 스케일 μ에 따라 커플링 상수 g가 어떻게 변하는지 나타냅니다.",difficulty:"hard"},{id:"phd-phys-01-q06",type:"short_answer",question:"강한 상호작용의 컬러 전하(color charge)는?",options:[],answer:"빨강(R), 초록(G), 파랑(B) 또는 그 항-색깔",explanation:"강한 상호작용(QCD)에서는 쿼크와 글루온이 3가지 컬러 전하와 3가지 항-컬러 전하를 가집니다.",difficulty:"hard"},{id:"elem-chem-01-q01",type:"multiple_choice",question:"물이 얼음이 되는 상태 변화를 무엇이라 하는가?",options:["융해","응고","기화","액화"],answer:"응고",explanation:"응고는 액체가 고체로 변하는 상태 변화입니다. 물이 얼음이 되는 것이 대표적인 예입니다.",difficulty:"easy"},{id:"elem-chem-01-q02",type:"short_answer",question:"고체가 액체로 변하는 상태 변화를 무엇이라 하는가?",options:[],answer:"융해",explanation:"융해는 고체가 액체로 변하는 현상으로, 얼음이 녹아 물이 되는 것이 대표적인 예입니다.",difficulty:"easy"},{id:"elem-chem-01-q03",type:"multiple_choice",question:"드라이아이스가 액체 없이 바로 기체가 되는 현상은?",options:["융해","기화","승화","액화"],answer:"승화",explanation:"승화는 고체가 액체를 거치지 않고 바로 기체로 변하는(또는 그 반대) 현상입니다.",difficulty:"medium"},{id:"elem-chem-01-q04",type:"short_answer",question:"물질의 상태가 변할 때 변하지 않는 것은?",options:[],answer:"물질의 종류(성분)",explanation:"상태 변화는 물질의 생김새(상태)만 바뀔 뿐, 물질을 이루는 성분 자체는 바뀌지 않습니다.",difficulty:"medium"},{id:"elem-chem-01-q05",type:"multiple_choice",question:"물이 끓어 수증기로 변하는 상태 변화는?",options:["기화","액화","응고","승화"],answer:"기화",explanation:"기화는 액체가 기체로 변하는 현상으로, 끓음과 증발 두 가지 방식이 있습니다.",difficulty:"easy"},{id:"elem-chem-01-q06",type:"short_answer",question:"물질이 상태변화하는 동안 온도가 잠시 멈추는 이유는?",options:[],answer:"흡수하거나 방출한 열이 입자 배열을 바꾸는 데 사용되기 때문",explanation:"상태변화 구간에서는 열에너지가 온도를 올리는 대신 잠열의 형태로 입자 배열 변화에 쓰이므로 온도가 일정하게 유지됩니다.",difficulty:"hard"},{id:"elem-math-01-q01",type:"short_answer",question:"피자 한 판을 8조각으로 나누었을 때 한 조각을 분수로 나타내면?",options:[],answer:"1/8",explanation:"전체를 8등분한 것 중 1개이므로 1/8로 나타냅니다.",difficulty:"easy"},{id:"elem-math-01-q02",type:"calculation",question:"1/4을 소수로 나타내면?",options:[],answer:"0.25",explanation:"1/4은 1÷4=0.25로 계산됩니다.",difficulty:"easy"},{id:"elem-math-01-q03",type:"multiple_choice",question:"1/2과 1/3 중 더 큰 분수는?",options:["1/2","1/3","둘은 같다","비교할 수 없다"],answer:"1/2",explanation:"분자가 같을 때(여기선 1) 분모가 작을수록 분수의 크기는 큽니다. 전체를 2등분한 것이 3등분한 것보다 한 조각이 더 큽니다.",difficulty:"medium"},{id:"elem-math-01-q04",type:"short_answer",question:"분모가 2와 5의 거듭제곱으로만 이루어진 분수를 소수로 나타내면 어떤 소수가 되는가?",options:[],answer:"유한소수",explanation:"분모가 2와 5의 거듭제곱만으로 이루어지면 나눗셈이 끝나는 유한소수가 됩니다. 그 외에는 순환소수가 됩니다.",difficulty:"hard"},{id:"elem-math-01-q05",type:"calculation",question:"3/4 + 1/4 은 얼마인가?",options:[],answer:"1",explanation:"분모가 같으므로 분자끼리 더합니다: 3/4+1/4 = 4/4 = 1",difficulty:"easy"},{id:"elem-math-01-q06",type:"short_answer",question:"분수를 통분해야 하는 경우는 언제인가?",options:[],answer:"분모가 다른 분수끼리 크기를 비교하거나 더하고 뺄 때",explanation:"분모가 다른 분수는 직접 비교하거나 계산할 수 없으므로, 공통분모로 맞추는 통분 과정이 필요합니다.",difficulty:"medium"},{id:"elem-astro-01-q01",type:"short_answer",question:"태양계에서 태양으로부터 세 번째 행성은?",options:[],answer:"지구",explanation:"태양에서 가까운 순서로 수성, 금성, 지구, 화성 순이며 지구는 세 번째 행성입니다.",difficulty:"easy"},{id:"elem-astro-01-q02",type:"multiple_choice",question:"태양계에서 가장 큰 행성은?",options:["지구","토성","목성","해왕성"],answer:"목성",explanation:"목성은 태양계에서 가장 큰 행성으로, 지구 지름의 약 11배에 달합니다.",difficulty:"easy"},{id:"elem-astro-01-q03",type:"short_answer",question:"별과 행성의 가장 큰 차이는 무엇인가?",options:[],answer:"별은 스스로 빛을 내고 행성은 빛을 반사한다",explanation:"별은 핵융합 반응으로 스스로 빛을 내는 천체이고, 행성은 스스로 빛을 내지 못하고 별빛을 반사합니다.",difficulty:"medium"},{id:"elem-astro-01-q04",type:"multiple_choice",question:"뚜렷한 고리를 가진 것으로 유명한 행성은?",options:["화성","토성","수성","금성"],answer:"토성",explanation:"토성은 얼음과 암석 조각으로 이루어진 뚜렷한 고리를 가진 것으로 유명합니다.",difficulty:"easy"},{id:"elem-astro-01-q05",type:"short_answer",question:"태양에서 멀리 있는 행성일수록 공전 주기가 긴 이유는?",options:[],answer:"태양의 중력이 거리 제곱에 반비례해 약해지기 때문",explanation:"케플러의 법칙에 따르면 태양에서 멀수록 중력의 영향이 약해져 더 느리고 큰 궤도를 돌게 되어 공전 주기가 길어집니다.",difficulty:"hard"},{id:"elem-astro-01-q06",type:"multiple_choice",question:"지구형 행성에 속하지 않는 것은?",options:["수성","금성","화성","목성"],answer:"목성",explanation:"지구형 행성(수성, 금성, 지구, 화성)은 암석으로 이루어져 있고, 목성형 행성(목성, 토성, 천왕성, 해왕성)은 기체나 얼음으로 이루어져 있습니다.",difficulty:"medium"},{id:"high-chem-01-q01",type:"short_answer",question:"1몰에 해당하는 입자의 개수(아보가드로수)는?",options:[],answer:"6.02×10^23",explanation:"아보가드로수 N_A = 6.02×10²³ /mol은 1몰에 들어있는 입자의 개수를 나타냅니다.",difficulty:"medium"},{id:"high-chem-01-q02",type:"calculation",question:"물(H₂O)의 몰질량이 18 g/mol일 때, 물 36g은 몇 몰인가?",options:[],answer:"2몰",explanation:"몰수 = 질량 ÷ 몰질량 = 36g ÷ 18g/mol = 2몰",difficulty:"medium"},{id:"high-chem-01-q03",type:"multiple_choice",question:"화학 반응식 2H₂ + O₂ → 2H₂O에서 계수의 의미는?",options:["질량 비율","몰 비율","부피 비율(항상)","농도 비율"],answer:"몰 비율",explanation:"화학 반응식의 계수는 반응물과 생성물의 몰수 비율을 나타내며, 질량 비율이 아닙니다.",difficulty:"medium"},{id:"high-chem-01-q04",type:"short_answer",question:"표준상태(STP)에서 기체 1몰의 부피는?",options:[],answer:"22.4 L",explanation:"표준상태(0°C, 1기압)에서 이상기체 1몰은 약 22.4L의 부피를 차지합니다.",difficulty:"medium"},{id:"high-chem-01-q05",type:"calculation",question:"수소 4몰과 산소 1몰을 반응시키면 어느 반응물이 한계 반응물인가? (2H₂ + O₂ → 2H₂O)",options:[],answer:"산소",explanation:"수소 4몰과 반응하려면 산소 2몰이 필요한데 1몰만 있으므로 산소가 먼저 소진되는 한계 반응물입니다.",difficulty:"hard"},{id:"high-chem-01-q06",type:"short_answer",question:"몰 농도(M)의 정의는?",options:[],answer:"용액 1리터에 녹아있는 용질의 몰수",explanation:"몰 농도 M = 용질의 몰수 / 용액의 부피(L)로 정의되며, 용액의 진하기를 나타내는 표준적인 단위입니다.",difficulty:"medium"},{id:"high-math-01-q01",type:"calculation",question:"f(x) = x²에서 미분계수 f'(3)의 값은?",options:[],answer:"6",explanation:"f'(x) = 2x 이므로 f'(3) = 2×3 = 6",difficulty:"medium"},{id:"high-math-01-q02",type:"short_answer",question:"극한 lim(x→2) (x²-4)/(x-2) 의 값은?",options:[],answer:"4",explanation:"인수분해하면 (x-2)(x+2)/(x-2) = x+2 이고, x→2일 때 값은 4입니다. 이는 x=2에서 정의되지 않아도 극한이 존재하는 예입니다.",difficulty:"hard"},{id:"high-math-01-q03",type:"multiple_choice",question:"미분계수의 기하학적 의미는?",options:["그 점에서의 함수값","그 점에서의 접선의 기울기","함수의 최댓값","x절편"],answer:"그 점에서의 접선의 기울기",explanation:"미분계수 f'(a)는 함수 그래프 위의 점 (a, f(a))에서 그은 접선의 기울기를 의미합니다.",difficulty:"medium"},{id:"high-math-01-q04",type:"short_answer",question:"함수가 미분가능하면 반드시 연속인가? 그 역은 성립하는가?",options:[],answer:"미분가능하면 연속이지만, 연속이라고 항상 미분가능한 것은 아니다",explanation:"예를 들어 f(x)=|x|는 x=0에서 연속이지만 그 점에서 미분가능하지 않습니다(뾰족한 점).",difficulty:"hard"},{id:"high-math-01-q05",type:"calculation",question:"f(x) = 3x² - 2x + 1의 도함수 f'(x)는?",options:[],answer:"f'(x) = 6x - 2",explanation:"항별로 미분하면 3x²의 미분은 6x, -2x의 미분은 -2, 상수 1의 미분은 0이므로 f'(x)=6x-2입니다.",difficulty:"medium"},{id:"high-math-01-q06",type:"short_answer",question:"평균변화율과 순간변화율(미분계수)의 차이는?",options:[],answer:"평균변화율은 구간 전체의 변화율이고, 순간변화율은 구간을 한없이 좁혔을 때의 극한값이다",explanation:"평균변화율은 [f(b)-f(a)]/(b-a)이고, 순간변화율은 이 구간을 0으로 좁혔을 때의 극한, 즉 미분계수입니다.",difficulty:"medium"},{id:"high-bio-01-q01",type:"multiple_choice",question:"우성과 열성에 대한 설명으로 옳은 것은?",options:["우성 형질이 더 좋은 형질이다","이형접합일 때 표현형으로 드러나는 형질이 우성이다","열성 형질은 집단에서 매우 드물다","우성은 항상 더 흔한 형질이다"],answer:"이형접합일 때 표현형으로 드러나는 형질이 우성이다",explanation:"우성과 열성은 좋고 나쁨이 아니라, 이형접합(Rr)일 때 어느 형질이 표현형으로 나타나는지를 나타내는 개념일 뿐입니다.",difficulty:"medium"},{id:"high-bio-01-q02",type:"short_answer",question:"DNA와 유전자의 관계를 한 문장으로 설명하면?",options:[],answer:"유전자는 DNA 중 특정 단백질을 만드는 정보를 담은 부분이다",explanation:"DNA는 유전 정보 전체를 담은 화학 분자이고, 유전자는 그중 특정 형질(단백질)을 결정하는 부분 구간입니다.",difficulty:"medium"},{id:"high-bio-01-q03",type:"calculation",question:"이형접합(Rr)끼리 교배했을 때 표현형 비율은 대략 얼마인가?",options:[],answer:"우성:열성 = 3:1",explanation:"Rr × Rr 교배에서 유전자형은 RR:Rr:rr = 1:2:1이 나오며, R이 우성이면 표현형은 우성(RR+Rr):열성(rr) = 3:1이 됩니다.",difficulty:"hard"},{id:"high-bio-01-q04",type:"multiple_choice",question:"DNA의 구조를 가장 잘 설명한 것은?",options:["단일 가닥의 나선","이중나선 구조","삼중나선 구조","고리 모양의 단일 가닥"],answer:"이중나선 구조",explanation:"DNA는 두 가닥이 서로 꼬여있는 이중나선 구조이며, A-T, G-C의 염기쌍 결합으로 정보가 저장됩니다.",difficulty:"easy"},{id:"high-bio-01-q05",type:"short_answer",question:"멘델의 분리의 법칙이란?",options:[],answer:"생식세포가 형성될 때 대립유전자 쌍이 분리되어 각각 다른 생식세포로 들어간다",explanation:"분리의 법칙은 감수분열 과정에서 한 쌍의 대립유전자가 서로 분리되어 서로 다른 생식세포로 전달된다는 원리입니다.",difficulty:"medium"},{id:"high-bio-01-q06",type:"short_answer",question:"염색체, DNA, 유전자를 크기 순서(큰 것부터)로 나열하면?",options:[],answer:"염색체 > DNA > 유전자",explanation:"염색체는 DNA가 히스톤 단백질에 응축된 구조이며, 하나의 DNA 분자 안에 여러 개의 유전자가 존재합니다.",difficulty:"hard"},{id:"high-astro-01-q01",type:"multiple_choice",question:"허블의 법칙 v = H₀d가 의미하는 것은?",options:["멀리 있는 은하일수록 후퇴속도가 크다","모든 은하는 같은 속도로 움직인다","가까운 은하일수록 빨리 멀어진다","은하의 속도는 거리와 무관하다"],answer:"멀리 있는 은하일수록 후퇴속도가 크다",explanation:"허블의 법칙은 은하의 후퇴속도가 거리에 비례한다는 것을 보여주며, 이는 우주 팽창의 강력한 증거입니다.",difficulty:"medium"},{id:"high-astro-01-q02",type:"short_answer",question:"우주배경복사(CMB)란 무엇인가?",options:[],answer:"빅뱅 후 우주가 투명해지며 방출된 빛의 흔적(잔광)",explanation:"우주배경복사는 빅뱅 후 약 38만 년 뒤 우주가 식으며 투명해질 때 방출된 빛이 오늘날까지 남아있는 것으로, 절대온도 약 2.7K의 마이크로파로 관측됩니다.",difficulty:"hard"},{id:"high-astro-01-q03",type:"multiple_choice",question:"빅뱅에 대한 올바른 설명은?",options:["기존의 빈 공간 속에서 일어난 폭발이다","공간 자체가 팽창하기 시작한 사건이다","태양계가 형성된 사건이다","은하가 서로 충돌한 사건이다"],answer:"공간 자체가 팽창하기 시작한 사건이다",explanation:"빅뱅은 이미 존재하던 공간 속의 폭발이 아니라, 공간 자체가 팽창하기 시작한 사건입니다.",difficulty:"hard"},{id:"high-astro-01-q04",type:"short_answer",question:"적색편이(redshift)는 무엇을 알려주는가?",options:[],answer:"천체가 관측자로부터 멀어지고 있다는 것(후퇴속도)",explanation:"빛의 파장이 늘어나 붉은 쪽으로 치우치는 적색편이는 천체가 우리로부터 멀어지고 있음을 나타내며, 도플러 효과와 유사한 원리입니다.",difficulty:"medium"},{id:"high-astro-01-q05",type:"multiple_choice",question:"우주의 나이는 약 얼마로 추정되는가?",options:["약 138억 년","약 46억 년","약 1억 년","약 1000만 년"],answer:"약 138억 년",explanation:"허블 상수와 우주배경복사 관측 등을 종합하여 우주의 나이는 약 138억 년으로 추정됩니다.",difficulty:"easy"},{id:"high-astro-01-q06",type:"short_answer",question:"풍선 표면의 점 비유가 우주 팽창을 설명하는 방식은?",options:[],answer:"풍선을 불면 표면의 모든 점 사이 거리가 고르게 멀어지듯, 공간 자체가 팽창하며 모든 은하가 서로 멀어진다",explanation:"풍선 표면에 찍힌 점들은 스스로 움직이지 않아도 풍선(공간)이 팽창하면 서로 멀어집니다. 이는 은하가 공간 속을 이동하는 것이 아니라 공간 자체가 늘어난다는 것을 보여주는 비유입니다.",difficulty:"medium"},{id:"high-med-01-q01",type:"short_answer",question:"항상성이란 무엇인가?",options:[],answer:"체온, 혈당 등 몸속 환경을 일정한 범위로 유지하려는 성질",explanation:"항상성은 외부 환경이 변해도 체온, 혈당, 수분량 등 내부 환경을 일정한 범위로 유지하려는 생물의 조절 능력입니다.",difficulty:"easy"},{id:"high-med-01-q02",type:"multiple_choice",question:"체온이나 혈당 조절에서 흔히 나타나는 조절 방식은?",options:["양성 되먹임","음성 되먹임","무작위 조절","조절되지 않음"],answer:"음성 되먹임",explanation:"음성 되먹임은 변화를 감지하면 그 반대 방향으로 되돌리는 조절 방식으로, 체온과 혈당 조절의 기본 원리입니다.",difficulty:"medium"},{id:"high-med-01-q03",type:"short_answer",question:"선천면역과 후천면역의 차이는?",options:[],answer:"선천면역은 태어날 때부터 있는 비특이적 방어이고, 후천면역은 특정 병원체를 기억하는 특이적 방어이다",explanation:"선천면역(피부, 백혈구의 식균작용)은 병원체 종류와 무관하게 작동하고, 후천면역(항체, 기억세포)은 특정 병원체를 인식하고 기억합니다.",difficulty:"medium"},{id:"high-med-01-q04",type:"multiple_choice",question:"예방접종의 원리로 옳은 것은?",options:["실제 감염 없이 면역계에 병원체를 미리 기억시킨다","체온을 영구적으로 높인다","병원체를 완전히 제거해 다시는 생기지 않게 한다","항상 완치를 보장한다"],answer:"실제 감염 없이 면역계에 병원체를 미리 기억시킨다",explanation:"예방접종은 약독화되거나 불활성화된 병원체(또는 그 일부)를 이용해 실제 감염 없이 기억세포를 만들어 두는 방법입니다.",difficulty:"medium"},{id:"high-med-01-q05",type:"short_answer",question:"한 번 걸린 감염병에 대해 재감염 시 더 빠르게 대응할 수 있는 이유는?",options:[],answer:"면역계가 그 병원체를 기억하는 기억세포를 만들어두기 때문",explanation:"1차 면역반응 후 만들어진 기억세포는 같은 병원체가 다시 침입하면 더 빠르고 강한 2차 면역반응을 일으킵니다.",difficulty:"medium"},{id:"high-med-01-q06",type:"multiple_choice",question:"체온이 항상 정확히 고정되어 있다는 설명이 오개념인 이유는?",options:["체온은 하루 중, 활동에 따라 좁은 범위 안에서 변동하기 때문","체온은 사실 존재하지 않는 개념이기 때문","체온은 나이와 무관하게 항상 똑같기 때문","체온은 측정할 수 없기 때문"],answer:"체온은 하루 중, 활동에 따라 좁은 범위 안에서 변동하기 때문",explanation:"체온은 정확히 고정된 값이 아니라 하루 중 시간대, 활동량, 환경에 따라 좁은 범위 내에서 오르내리며 조절됩니다.",difficulty:"medium"},{id:"middle-phys-01-q01",type:"multiple_choice",question:"뉴턴의 제1법칙(관성의 법칙)이 설명하는 것은?",options:["힘이 없으면 물체는 반드시 정지한다","외부 힘이 없으면 물체는 현재의 운동 상태를 유지한다","무거운 물체는 항상 빨리 떨어진다","힘은 항상 쌍으로 존재하지 않는다"],answer:"외부 힘이 없으면 물체는 현재의 운동 상태를 유지한다",explanation:"관성의 법칙은 외부 힘이 작용하지 않으면 물체가 정지 또는 등속 직선 운동 상태를 유지한다는 것을 말합니다.",difficulty:"medium"},{id:"middle-phys-01-q02",type:"calculation",question:"질량 2kg인 물체에 10N의 힘을 가하면 가속도는?",options:[],answer:"5 m/s²",explanation:"F=ma에서 a=F/m=10/2=5 m/s²",difficulty:"medium"},{id:"middle-phys-01-q03",type:"short_answer",question:"버스가 갑자기 출발할 때 몸이 뒤로 쏠리는 현상을 설명하는 법칙은?",options:[],answer:"관성의 법칙(뉴턴 제1법칙)",explanation:"몸은 원래 정지 상태를 유지하려 하지만 버스만 앞으로 움직이므로 상대적으로 몸이 뒤로 쏠리는 것처럼 느껴집니다.",difficulty:"medium"},{id:"middle-phys-01-q04",type:"multiple_choice",question:"같은 힘으로 밀 때 질량이 더 큰 물체는 어떻게 되는가?",options:["가속도가 더 크다","가속도가 더 작다","가속도는 질량과 무관하다","즉시 멈춘다"],answer:"가속도가 더 작다",explanation:"a=F/m 관계에 따라 힘이 같을 때 질량이 클수록 가속도는 작아집니다.",difficulty:"medium"},{id:"middle-phys-01-q05",type:"short_answer",question:"로켓이 가스를 뒤로 분출하며 앞으로 나아가는 원리를 설명하는 법칙은?",options:[],answer:"작용-반작용의 법칙(뉴턴 제3법칙)",explanation:"로켓이 가스를 뒤로 미는 힘(작용)에 대해 가스가 로켓을 앞으로 미는 반작용의 힘이 작용해 로켓이 나아갑니다.",difficulty:"medium"},{id:"middle-phys-01-q06",type:"calculation",question:"무게가 없는 마찰이 없는 얼음판 위에서 힘을 가하지 않은 물체는 어떻게 움직이는가?",options:[],answer:"등속 직선 운동을 계속한다",explanation:"외부 힘(마찰 포함)이 없으므로 관성의 법칙에 따라 물체는 속도를 바꾸지 않고 등속 직선 운동을 계속합니다.",difficulty:"hard"},{id:"middle-phys-02-q01",type:"calculation",question:"질량 2kg인 물체를 5m 들어올렸을 때 위치에너지는? (g=10m/s²)",options:[],answer:"100 J",explanation:"PE = mgh = 2×10×5 = 100 J",difficulty:"medium"},{id:"middle-phys-02-q02",type:"calculation",question:"질량 1kg 물체가 4m/s로 움직일 때 운동에너지는?",options:[],answer:"8 J",explanation:"KE = ½mv² = ½×1×4² = 8 J",difficulty:"medium"},{id:"middle-phys-02-q03",type:"multiple_choice",question:"마찰이 없는 상황에서 롤러코스터가 내려갈 때 일어나는 일은?",options:["위치에너지가 운동에너지로 전환된다","에너지가 사라진다","운동에너지가 위치에너지로 전환된다","에너지가 새로 생긴다"],answer:"위치에너지가 운동에너지로 전환된다",explanation:"높이가 낮아지면서 위치에너지가 줄고, 그만큼 운동에너지가 늘어나며 역학적 에너지 총량은 보존됩니다.",difficulty:"medium"},{id:"middle-phys-02-q04",type:"short_answer",question:'마찰이 있는 계에서 에너지가 "사라지는 것처럼" 보이는 이유는?',options:[],answer:"역학적 에너지가 열이나 소리 등 다른 형태로 전환되기 때문",explanation:"에너지는 실제로 사라지지 않고 마찰로 인해 열 에너지나 소리 에너지 등 다른 형태로 전환된 것입니다.",difficulty:"medium"},{id:"middle-phys-02-q05",type:"multiple_choice",question:"위치에너지의 크기를 결정하는 요인이 아닌 것은?",options:["질량","높이","중력가속도","물체의 색깔"],answer:"물체의 색깔",explanation:"위치에너지 PE=mgh는 질량, 높이, 중력가속도로 결정되며 물체의 색깔과는 무관합니다.",difficulty:"easy"},{id:"middle-phys-02-q06",type:"calculation",question:"높이 10m에서 정지 상태로 떨어뜨린 물체가 지면에 닿기 직전 속력은? (마찰 무시, g=10m/s²)",options:[],answer:"약 14.1 m/s",explanation:"에너지 보존: mgh=½mv² → v=√(2gh)=√(2×10×10)=√200≈14.1 m/s",difficulty:"hard"},{id:"middle-chem-01-q01",type:"short_answer",question:"원자를 구성하는 세 가지 기본 입자는?",options:[],answer:"양성자, 중성자, 전자",explanation:"원자는 원자핵을 이루는 양성자와 중성자, 그 주위를 도는 전자로 구성됩니다.",difficulty:"easy"},{id:"middle-chem-01-q02",type:"multiple_choice",question:"원소와 화합물의 차이로 옳은 것은?",options:["원소는 두 종류 이상의 원자로 이루어진 물질이다","화합물은 한 종류의 원자로만 이루어진 물질이다","원소는 한 종류의 원자로, 화합물은 여러 원소가 결합해 이루어진다","둘은 같은 개념이다"],answer:"원소는 한 종류의 원자로, 화합물은 여러 원소가 결합해 이루어진다",explanation:"원소(예: 산소 O₂)는 한 종류의 원자로만 이루어지고, 화합물(예: 물 H₂O)은 서로 다른 원소가 결합하여 만들어집니다.",difficulty:"medium"},{id:"middle-chem-01-q03",type:"short_answer",question:"원자번호는 무엇을 의미하는가?",options:[],answer:"원자핵 속 양성자의 개수",explanation:"원자번호는 원자핵에 들어있는 양성자의 개수를 나타내며, 원소를 구별하는 기준이 됩니다.",difficulty:"medium"},{id:"middle-chem-01-q04",type:"multiple_choice",question:"주기율표에서 같은 세로줄(족)에 있는 원소들의 공통점은?",options:["원자번호가 같다","화학적 성질이 비슷하다","항상 색깔이 같다","전자가 없다"],answer:"화학적 성질이 비슷하다",explanation:"같은 족 원소는 가장 바깥 전자껍질의 전자 수(원자가전자 수)가 같아 화학적 성질이 비슷합니다.",difficulty:"medium"},{id:"middle-chem-01-q05",type:"short_answer",question:"원자를 눈으로 직접 볼 수 없다고 해서 존재하지 않는다고 말할 수 없는 이유는?",options:[],answer:"전자현미경 등으로 실제로 관찰되고 조작할 수 있기 때문",explanation:"원자는 일반 광학현미경으로는 볼 수 없지만, 전자현미경이나 원자간력현미경(AFM) 등으로 실제 관측 및 조작이 가능합니다.",difficulty:"medium"},{id:"middle-chem-01-q06",type:"multiple_choice",question:"전자를 잃거나 얻어 전하를 띠게 된 원자를 무엇이라 하는가?",options:["동위원소","이온","분자","화합물"],answer:"이온",explanation:"원자가 전자를 잃으면 양이온, 전자를 얻으면 음이온이 됩니다.",difficulty:"medium"},{id:"middle-math-01-q01",type:"calculation",question:"방정식 x + 5 = 12의 해는?",options:[],answer:"x = 7",explanation:"양변에서 5를 빼면 x = 12 - 5 = 7",difficulty:"easy"},{id:"middle-math-01-q02",type:"calculation",question:"방정식 3x - 2 = 10의 해는?",options:[],answer:"x = 4",explanation:"양변에 2를 더하면 3x=12, 양변을 3으로 나누면 x=4",difficulty:"medium"},{id:"middle-math-01-q03",type:"multiple_choice",question:"등식의 성질로 옳지 않은 것은?",options:["양변에 같은 수를 더해도 등식은 성립한다","양변에 같은 수를 곱해도 등식은 성립한다","양변을 0으로 나누어도 등식은 성립한다","양변에서 같은 수를 빼도 등식은 성립한다"],answer:"양변을 0으로 나누어도 등식은 성립한다",explanation:"0으로 나누는 연산은 정의되지 않으므로 등식의 성질에서 제외됩니다.",difficulty:"medium"},{id:"middle-math-01-q04",type:"short_answer",question:"어떤 수의 2배에서 3을 뺀 값이 15일 때, 그 수를 구하는 방정식은?",options:[],answer:"2x - 3 = 15",explanation:'어떤 수를 x라 하면 "2배에서 3을 뺀 값"은 2x-3이고, 이것이 15와 같으므로 2x-3=15로 세울 수 있습니다.',difficulty:"medium"},{id:"middle-math-01-q05",type:"calculation",question:"위 방정식 2x - 3 = 15를 풀면 x는?",options:[],answer:"x = 9",explanation:"양변에 3을 더하면 2x=18, 양변을 2로 나누면 x=9",difficulty:"medium"},{id:"middle-math-01-q06",type:"short_answer",question:"일차방정식이 해가 무수히 많아지는 경우는 언제인가?",options:[],answer:"정리했을 때 양변이 항등식(항상 참)이 되는 경우",explanation:"예를 들어 2x+4=2(x+2)처럼 정리하면 양변이 같아지는 항등식이 되는 경우, x에 어떤 값을 넣어도 성립하므로 해가 무수히 많습니다.",difficulty:"hard"},{id:"middle-bio-01-q01",type:"multiple_choice",question:"동물세포에는 없고 식물세포에만 있는 구조는?",options:["핵","세포막","세포벽과 엽록체","미토콘드리아"],answer:"세포벽과 엽록체",explanation:"식물세포는 세포벽, 엽록체, 큰 액포를 가지지만 동물세포는 이러한 구조가 없습니다.",difficulty:"medium"},{id:"middle-bio-01-q02",type:"short_answer",question:"세포호흡을 통해 에너지를 생산하는 세포소기관은?",options:[],answer:"미토콘드리아",explanation:'미토콘드리아는 포도당과 산소를 이용해 세포호흡을 하며 에너지(ATP)를 생산하는 "세포의 발전소" 역할을 합니다.',difficulty:"easy"},{id:"middle-bio-01-q03",type:"multiple_choice",question:"세포호흡의 반응물과 생성물로 옳은 것은?",options:["포도당+산소 → 이산화탄소+물+에너지","이산화탄소+물 → 포도당+산소","단백질+지방 → 포도당","물+에너지 → 포도당+산소"],answer:"포도당+산소 → 이산화탄소+물+에너지",explanation:"세포호흡은 광합성과 반대로 포도당과 산소를 이용해 이산화탄소, 물, 에너지(ATP)를 생성합니다.",difficulty:"medium"},{id:"middle-bio-01-q04",type:"short_answer",question:"코끼리가 생쥐보다 큰 주된 이유는 세포 크기 때문인가, 세포 수 때문인가?",options:[],answer:"세포의 수가 훨씬 많기 때문(세포 크기는 비슷함)",explanation:"대부분의 생물 세포 크기는 종에 관계없이 비슷하며, 몸집의 차이는 세포의 개수 차이에서 주로 비롯됩니다.",difficulty:"hard"},{id:"middle-bio-01-q05",type:"multiple_choice",question:"식물세포의 세포벽에 대한 설명으로 옳은 것은?",options:["세포벽이 있으면 세포막은 없다","세포벽은 세포막 바깥을 감싸는 구조이며 세포막도 함께 존재한다","세포벽은 물질 출입을 조절한다","세포벽은 동물세포에도 있다"],answer:"세포벽은 세포막 바깥을 감싸는 구조이며 세포막도 함께 존재한다",explanation:"식물세포는 세포막 바깥에 단단한 세포벽을 추가로 가지고 있으며, 물질 출입 조절은 여전히 세포막이 담당합니다.",difficulty:"medium"},{id:"middle-bio-01-q06",type:"short_answer",question:"산소가 없을 때 효모가 에너지를 얻는 방법은?",options:[],answer:"발효",explanation:"효모는 산소가 부족한 환경에서 발효(무산소 호흡)를 통해 포도당을 분해하여 에너지를 얻고 알코올과 이산화탄소를 만듭니다.",difficulty:"medium"},{id:"middle-earth-01-q01",type:"multiple_choice",question:"판의 경계 중 판이 서로 멀어지는 경계는?",options:["수렴 경계","발산 경계","보존 경계","고정 경계"],answer:"발산 경계",explanation:"발산 경계에서는 판이 서로 멀어지며 새로운 해양지각이 생성됩니다(예: 대서양 중앙 해령).",difficulty:"medium"},{id:"middle-earth-01-q02",type:"short_answer",question:"지층누중의 법칙이란?",options:[],answer:"지층이 교란되지 않았다면 아래쪽 지층이 위쪽 지층보다 먼저 쌓인 것(더 오래된 것)이다",explanation:"퇴적물은 아래에서부터 순서대로 쌓이므로, 특별한 지각변동이 없다면 아래층이 더 오래된 지층입니다.",difficulty:"medium"},{id:"middle-earth-01-q03",type:"multiple_choice",question:"히말라야 산맥이 형성된 원인은?",options:["화산 폭발","인도판과 유라시아판의 충돌(수렴 경계)","판의 어긋남(보존 경계)","해저 화산 활동"],answer:"인도판과 유라시아판의 충돌(수렴 경계)",explanation:"인도판이 유라시아판과 충돌하며 두 대륙 사이의 지각이 솟아올라 히말라야 산맥이 만들어졌습니다.",difficulty:"medium"},{id:"middle-earth-01-q04",type:"short_answer",question:"지진이 아무 이유 없이 무작위로 발생한다는 설명이 오개념인 이유는?",options:[],answer:"지진은 판 경계에 축적된 변형 에너지가 갑자기 방출되는 물리적 원인에 의해 발생하기 때문",explanation:"지진은 무작위 현상이 아니라 판의 상대적 움직임으로 오랫동안 쌓인 응력이 한계를 넘으면서 갑자기 방출되는 현상입니다.",difficulty:"hard"},{id:"middle-earth-01-q05",type:"multiple_choice",question:"태평양 주변에 화산과 지진이 집중된 지역을 무엇이라 부르는가?",options:["불의 고리(Ring of Fire)","대서양 중앙 해령","그랜드 캐니언","판게아"],answer:"불의 고리(Ring of Fire)",explanation:'태평양 주변은 여러 판이 만나는 수렴 경계가 많아 화산과 지진 활동이 활발한 "불의 고리"로 불립니다.',difficulty:"easy"},{id:"middle-earth-01-q06",type:"short_answer",question:"대륙이동설이 처음에 받아들여지지 않았던 이유는?",options:[],answer:"대륙을 이동시키는 힘(원동력)을 설명하지 못했기 때문",explanation:"베게너의 대륙이동설은 대륙 이동의 증거는 제시했지만 그 원동력을 설명하지 못해 초기에는 받아들여지지 않았고, 이후 맨틀대류 개념으로 보완되었습니다.",difficulty:"hard"},{id:"middle-astro-01-q01",type:"short_answer",question:"별이 태어나는 가스와 먼지의 집합체를 무엇이라 하는가?",options:[],answer:"성운",explanation:"성운은 가스와 먼지가 모여있는 성간 물질의 집합체로, 중력 수축을 통해 별이 탄생하는 공간입니다.",difficulty:"easy"},{id:"middle-astro-01-q02",type:"multiple_choice",question:"태양과 비슷한 질량의 별이 생을 마치는 순서로 옳은 것은?",options:["주계열성 → 적색거성 → 백색왜성","주계열성 → 초신성 → 블랙홀","적색거성 → 주계열성 → 중성자별","백색왜성 → 초신성 → 주계열성"],answer:"주계열성 → 적색거성 → 백색왜성",explanation:"태양 정도 질량의 별은 주계열성으로 오래 빛나다가 적색거성을 거쳐 백색왜성으로 생을 마칩니다.",difficulty:"medium"},{id:"middle-astro-01-q03",type:"short_answer",question:"아주 무거운 별이 폭발하며 생을 마치는 현상을 무엇이라 하는가?",options:[],answer:"초신성 폭발",explanation:"무거운 별은 핵융합 연료가 소진되면 초신성으로 폭발하며 중성자별이나 블랙홀을 남깁니다.",difficulty:"medium"},{id:"middle-astro-01-q04",type:"multiple_choice",question:"우리은하에 대한 설명으로 옳은 것은?",options:["태양계 전체가 우주의 중심이다","수천억 개의 별로 이루어진 나선은하이다","별이 하나만 존재한다","우주에 존재하는 유일한 은하이다"],answer:"수천억 개의 별로 이루어진 나선은하이다",explanation:"우리은하는 태양을 포함해 수천억 개의 별로 이루어진 나선은하이며, 우주에는 수천억 개의 다른 은하가 더 존재합니다.",difficulty:"medium"},{id:"middle-astro-01-q05",type:"short_answer",question:"별빛의 밝기는 거리와 어떤 관계가 있는가?",options:[],answer:"거리의 제곱에 반비례한다(역제곱 법칙)",explanation:"별의 겉보기 밝기는 거리가 멀어질수록 거리의 제곱에 반비례해 어두워집니다.",difficulty:"hard"},{id:"middle-astro-01-q06",type:"multiple_choice",question:"우리은하에서 가장 가까운 대형 은하는?",options:["안드로메다 은하","오리온 대성운","게성운","유클리드 은하"],answer:"안드로메다 은하",explanation:"안드로메다 은하는 우리은하에서 가장 가까운 대형 나선은하로, 약 250만 광년 떨어져 있습니다.",difficulty:"easy"},{id:"elem-phys-02-q01",type:"multiple_choice",question:"소리가 생기는 근본 원인은?",options:["물체의 온도 변화","물체의 떨림(진동)","물체의 색깔","물체의 무게"],answer:"물체의 떨림(진동)",explanation:"소리는 물체가 떨릴 때(진동할 때) 발생하며, 이 떨림이 공기 등의 매질을 통해 전달됩니다.",difficulty:"easy"},{id:"elem-phys-02-q02",type:"short_answer",question:"소리의 높낮이를 결정하는 것은 무엇인가?",options:[],answer:"진동수(주파수)",explanation:"진동수가 클수록 높은 소리, 작을수록 낮은 소리가 납니다.",difficulty:"medium"},{id:"elem-phys-02-q03",type:"multiple_choice",question:"소리의 크기(세기)를 결정하는 것은?",options:["진동수","진폭","파장","색깔"],answer:"진폭",explanation:"진폭이 클수록 큰 소리, 작을수록 작은 소리가 납니다.",difficulty:"medium"},{id:"elem-phys-02-q04",type:"short_answer",question:"진공에서 소리가 전달되지 않는 이유는?",options:[],answer:"소리를 전달할 매질(입자)이 없기 때문",explanation:"소리는 입자의 진동으로 전달되는 파동이므로 입자가 없는 진공에서는 전달될 수 없습니다.",difficulty:"medium"},{id:"elem-phys-02-q05",type:"multiple_choice",question:"실 전화기에서 실이 팽팽할 때와 느슨할 때의 차이는?",options:["팽팽할 때 소리가 더 잘 전달된다","느슨할 때 소리가 더 잘 전달된다","차이가 없다","팽팽하면 소리가 아예 전달되지 않는다"],answer:"팽팽할 때 소리가 더 잘 전달된다",explanation:"실이 팽팽해야 떨림이 잘 전달되어 소리가 더 명확하게 들립니다.",difficulty:"medium"},{id:"elem-phys-02-q06",type:"short_answer",question:"천둥소리가 번개보다 늦게 들리는 이유는?",options:[],answer:"소리의 속력이 빛의 속력보다 훨씬 느리기 때문",explanation:"빛은 거의 순간적으로 도달하지만 소리는 초당 약 340m로 훨씬 느리게 이동해 늦게 들립니다.",difficulty:"medium"},{id:"elem-chem-02-q01",type:"multiple_choice",question:"소금물에서 소금을 다시 얻는 방법은?",options:["거름","증발","자석 이용","체로 거르기"],answer:"증발",explanation:"물을 증발시키면 소금 결정만 남아 소금을 회수할 수 있습니다.",difficulty:"easy"},{id:"elem-chem-02-q02",type:"short_answer",question:"철가루와 모래의 혼합물을 분리하는 가장 쉬운 방법은?",options:[],answer:"자석을 이용한다",explanation:"철가루는 자성을 띠므로 자석을 가까이 하면 철가루만 붙어 분리할 수 있습니다.",difficulty:"easy"},{id:"elem-chem-02-q03",type:"multiple_choice",question:"모래와 자갈처럼 크기가 다른 고체를 분리하는 방법은?",options:["체로 거르기","증발","자석 이용","거름종이 사용"],answer:"체로 거르기",explanation:"입자 크기 차이를 이용해 체로 거르면 크기별로 분리할 수 있습니다.",difficulty:"easy"},{id:"elem-chem-02-q04",type:"short_answer",question:"혼합물을 물리적 방법으로 분리할 수 있는 이유는?",options:[],answer:"혼합된 성분들이 화학적으로 결합하지 않고 각자의 성질을 유지하기 때문",explanation:"혼합물의 각 성분은 화학반응 없이 섞여 있을 뿐이라 원래의 성질(녹는점, 자성 등)을 그대로 유지합니다.",difficulty:"medium"},{id:"elem-chem-02-q05",type:"multiple_choice",question:"소금과 모래의 혼합물에서 모래만 걸러내는 데 사용하는 도구는?",options:["거름종이와 깔때기","자석","온도계","저울"],answer:"거름종이와 깔때기",explanation:"소금물을 거름종이에 부으면 물에 녹지 않는 모래만 걸러집니다.",difficulty:"medium"},{id:"elem-chem-02-q06",type:"short_answer",question:"순물질과 달리 혼합물이 화학반응 없이 분리 가능한 근본적 이유는?",options:[],answer:"혼합물의 성분들이 화학결합을 이루지 않은 상태이기 때문",explanation:"순물질(화합물)은 화학결합으로 이루어져 화학반응이 필요하지만, 혼합물은 단순히 섞여있을 뿐이라 물리적 방법으로 분리가 가능합니다.",difficulty:"hard"},{id:"elem-chem-03-q01",type:"multiple_choice",question:"다음 중 산성 물질은?",options:["식초","비눗물","베이킹소다 용액","수산화나트륨 용액"],answer:"식초",explanation:"식초는 아세트산을 포함한 대표적인 약산성 물질입니다.",difficulty:"easy"},{id:"elem-chem-03-q02",type:"short_answer",question:"파란 리트머스 종이를 빨갛게 만드는 물질의 성질은?",options:[],answer:"산성",explanation:"산성 물질은 파란 리트머스 종이를 붉게 변화시킵니다.",difficulty:"easy"},{id:"elem-chem-03-q03",type:"multiple_choice",question:"산과 염기가 만나 일어나는 반응은?",options:["중화 반응","연소 반응","광합성","증발"],answer:"중화 반응",explanation:"산과 염기가 만나면 서로의 성질을 상쇄하는 중화 반응이 일어나 물과 염이 생성됩니다.",difficulty:"medium"},{id:"elem-chem-03-q04",type:"short_answer",question:"위산과다일 때 제산제(염기성)를 먹는 이유는?",options:[],answer:"중화 반응으로 위산의 산성을 낮추기 위해서",explanation:"제산제는 염기성 물질로 위산(산성)과 중화 반응을 일으켜 속쓰림을 줄여줍니다.",difficulty:"medium"},{id:"elem-chem-03-q05",type:"multiple_choice",question:"식초(약한 산성)에 대한 설명으로 옳은 것은?",options:["항상 위험하다","일상에서 안전하게 사용된다","pH가 14에 가깝다","염기성 물질이다"],answer:"일상에서 안전하게 사용된다",explanation:"식초는 약한 산성으로 일상 요리 등에서 안전하게 사용됩니다. 산성 자체가 항상 위험한 것은 아닙니다.",difficulty:"medium"},{id:"elem-chem-03-q06",type:"short_answer",question:"자주색 양배추 물이 천연 지시약으로 사용될 수 있는 이유는?",options:[],answer:"산성·염기성에 따라 색이 다르게 변하는 색소를 포함하고 있기 때문",explanation:"양배추의 안토시아닌 색소는 pH에 따라 색이 변해 산성·염기성을 구별하는 지시약으로 쓸 수 있습니다.",difficulty:"medium"},{id:"elem-math-02-q01",type:"calculation",question:"가로 5cm, 세로 3cm인 직사각형의 넓이는?",options:[],answer:"15cm²",explanation:"직사각형의 넓이 = 가로×세로 = 5×3 = 15cm²",difficulty:"easy"},{id:"elem-math-02-q02",type:"calculation",question:"밑변 6cm, 높이 4cm인 삼각형의 넓이는?",options:[],answer:"12cm²",explanation:"삼각형의 넓이 = 밑변×높이÷2 = 6×4÷2 = 12cm²",difficulty:"medium"},{id:"elem-math-02-q03",type:"short_answer",question:"직사각형의 둘레를 구하는 식은?",options:[],answer:"(가로+세로)×2",explanation:"둘레는 네 변의 길이를 모두 더한 것으로, (가로+세로)×2로 계산합니다.",difficulty:"easy"},{id:"elem-math-02-q04",type:"multiple_choice",question:"둘레가 같은 직사각형 중 넓이가 가장 큰 것은?",options:["가로세로 비율이 매우 다른 경우","정사각형에 가까운 경우","넓이는 항상 같다","둘레와 넓이는 무관하다"],answer:"정사각형에 가까운 경우",explanation:"둘레가 같을 때 가로세로 비율이 1:1(정사각형)에 가까울수록 넓이가 최대가 됩니다.",difficulty:"hard"},{id:"elem-math-02-q05",type:"short_answer",question:"넓이의 단위에 제곱(²)이 붙는 이유는?",options:[],answer:"넓이는 길이×길이로 계산되는 양이기 때문",explanation:'넓이는 "길이×길이"의 차원을 가지므로 cm², m²처럼 제곱 단위를 사용합니다.',difficulty:"medium"},{id:"elem-math-02-q06",type:"calculation",question:"밑변 8cm, 높이 5cm인 평행사변형의 넓이는?",options:[],answer:"40cm²",explanation:"평행사변형의 넓이 = 밑변×높이 = 8×5 = 40cm²",difficulty:"medium"},{id:"elem-math-03-q01",type:"calculation",question:"세발자전거 4대의 바퀴 수는?",options:[],answer:"12개",explanation:"바퀴 수 = 자전거 수×3 = 4×3 = 12개",difficulty:"easy"},{id:"elem-math-03-q02",type:"short_answer",question:"한 변의 길이가 x인 정사각형의 둘레를 식으로 나타내면?",options:[],answer:"4×x (또는 4x)",explanation:"정사각형은 네 변의 길이가 모두 같으므로 둘레는 한 변의 길이의 4배입니다.",difficulty:"medium"},{id:"elem-math-03-q03",type:"multiple_choice",question:"정비례 관계의 특징으로 옳은 것은?",options:["x가 2배가 되면 y도 2배가 된다","x가 2배가 되면 y는 절반이 된다","x와 y는 항상 같은 값이다","x가 늘어도 y는 변하지 않는다"],answer:"x가 2배가 되면 y도 2배가 된다",explanation:"정비례 관계 y=ax에서는 x가 커지는 비율만큼 y도 커집니다.",difficulty:"medium"},{id:"elem-math-03-q04",type:"short_answer",question:"모든 두 양의 관계가 정비례라고 할 수 없는 이유는?",options:[],answer:"반비례 관계 등 다른 종류의 대응 관계도 존재하기 때문",explanation:"어떤 관계는 한쪽이 커지면 다른 쪽이 작아지는 반비례 관계를 가질 수 있어, 표를 통해 확인하는 것이 중요합니다.",difficulty:"hard"},{id:"elem-math-03-q05",type:"calculation",question:'정삼각형을 한 개씩 이어 붙일 때 필요한 성냥개비 수의 규칙이 "2n+1"(n=삼각형 개수)이라면 삼각형 5개에 필요한 성냥개비 수는?',options:[],answer:"11개",explanation:"2×5+1 = 11개",difficulty:"medium"},{id:"elem-math-03-q06",type:"short_answer",question:"표를 만들어 규칙을 찾는 것이 중요한 이유는?",options:[],answer:"규칙을 정확히 파악해 잘못된 관계(예: 무조건 정비례라고 착각)를 피할 수 있기 때문",explanation:"표로 실제 값의 변화를 확인하면 정비례, 반비례 등 정확한 관계를 파악할 수 있습니다.",difficulty:"medium"},{id:"elem-bio-03-q01",type:"multiple_choice",question:"우리 몸을 지탱하고 내부 장기를 보호하는 것은?",options:["뼈(골격계)","혈액","소화액","신경"],answer:"뼈(골격계)",explanation:"골격계는 몸을 지지하고 뇌, 심장 같은 내부 장기를 보호하는 역할을 합니다.",difficulty:"easy"},{id:"elem-bio-03-q02",type:"short_answer",question:"온몸에 피를 보내는 펌프 역할을 하는 기관은?",options:[],answer:"심장",explanation:"심장은 규칙적인 수축과 이완으로 혈액을 온몸에 순환시킵니다.",difficulty:"easy"},{id:"elem-bio-03-q03",type:"multiple_choice",question:"뼈에 대한 설명으로 옳은 것은?",options:["뼈는 죽은 조직이라 변화가 없다","뼈는 살아있는 조직으로 계속 재생된다","뼈에는 혈관이 없다","뼈는 한 번 부러지면 절대 붙지 않는다"],answer:"뼈는 살아있는 조직으로 계속 재생된다",explanation:"뼈는 혈관과 신경이 분포한 살아있는 조직으로, 끊임없이 재생되며 골절 후에도 붙을 수 있습니다.",difficulty:"medium"},{id:"elem-bio-03-q04",type:"short_answer",question:"팔을 굽힐 때 수축하는 근육의 이름은?",options:[],answer:"이두근",explanation:"팔을 굽힐 때는 팔 앞쪽의 이두근이 수축합니다.",difficulty:"medium"},{id:"elem-bio-03-q05",type:"multiple_choice",question:"운동을 하면 심장박동이 빨라지는 이유는?",options:["근육에 더 많은 산소와 영양분을 공급하기 위해","심장이 지쳐서","체온을 낮추기 위해서만","아무 이유 없이 무작위로"],answer:"근육에 더 많은 산소와 영양분을 공급하기 위해",explanation:"운동 중에는 근육의 에너지 요구가 늘어나 심장이 더 빨리 뛰어 혈액 공급을 늘립니다.",difficulty:"medium"},{id:"elem-bio-03-q06",type:"short_answer",question:"심장이 뇌의 명령 없이도 스스로 규칙적으로 뛸 수 있는 이유는?",options:[],answer:"심장 자체에 리듬을 만드는 특수한 전기 신호 시스템(동방결절)이 있기 때문",explanation:"심장에는 동방결절이라는 자체적인 전기 신호 발생 장치가 있어 스스로 규칙적인 박동을 만듭니다.",difficulty:"hard"},{id:"elem-earth-02-q01",type:"multiple_choice",question:"날씨와 기후의 차이로 옳은 것은?",options:["날씨는 짧은 기간, 기후는 오랜 기간의 대기 상태이다","둘은 완전히 같은 뜻이다","기후는 하루 단위로 바뀐다","날씨는 수십 년 단위의 평균이다"],answer:"날씨는 짧은 기간, 기후는 오랜 기간의 대기 상태이다",explanation:"날씨는 오늘·이번 주의 대기 상태이고, 기후는 한 지역의 수십 년간 평균적인 대기 패턴입니다.",difficulty:"easy"},{id:"elem-earth-02-q02",type:"sho
